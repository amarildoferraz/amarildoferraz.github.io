norar a Palavra de Deus pois foi Ele quem inspirou os autores das Escrituras Sagrada, é Ele quem nos revela, nos dá discernimento da Palavra, jamais devemos tratar com desprezo a Palavra de Deus. Ter um novo habito quando utilizarmos da Bíblia, fazer com temor, ao abri-la e ao fechá-la e beijar a Bíblia, sim estamos dialogando com O Espirito Santo a terceira Pessoa da Trindade e realizar isso com amor porque muitos de nós já beijamos nosso cachorrinho de estimação mas a Palavra viva não pode! Tudo vai mudar em sua vida, quando mudar algumas atitudes, muitas vezes irmãos me contavam ( fofocavam, picuinhas ) sobre a vida e outros irmãos que aviam caídos, e depois que aprendi com o Espirito Santo. Respondia a eles; não, eu não sei não! só estou sabendo de pessoas que se levantaram depois da queda, e o cair é do homem e o levantar é de Deus. E digas para quando alguém se aproximar de você com picuinhas; se nós ficarmos falando da vida de outrem, não haverá tempo para nós falarmos de coisas boas que o Senhor fez e faz em nossas vidas. É isto que já comentamos sobre a atmosfera de paz que muitas pessoas tem outras não. E é isto que o inimigo é expert em fazer conflitos, repito, a paz é ausência de conflito em nossa mente. E os conflitos são armadilhas de destruição. O diabo utiliza de armadilhas para nos enganar, para tirar nosso foco da verdade em nossa tarefa espiritual. Talvez você já se perguntou, depois de ter uma discursão com alguém por coisa tão banais, algo insignificante você se rebaixou a um nível muito inferior daquele que Deus te capacitou para respeitar o próximo. Ai vem o arrependimento pois isso não fazia sentido algum eu agora estar de mal, minha consciência me julga, por que eu falei isso ou aquilo, na verdade até teria razão! Mas acabei comprometendo, uma amizade de vinte anos com meu melhor amigo, até mesmo com o cônjuge, e muitas separações e divórcios o estopim a causa de uma palavra impropria proferida inadequadamente. Ai, pensamos..! fui infeliz nessa abordagem e a minha expressão foi desnecessária, eu tinha a oportunidade de ter me cavalado. Muitas vezes nós devemos fazer o papel de Psicólogo, no primeiro momento somente ouvir! Porque o propósito de destruição é do inimigo, e o espirito maligno que esta sendo usado pela pessoa que tenta nos agredir é de tirar nosso foco espiritual de tudo que é bom.</p>\n<blockquote>Quando aquele moça sendo escrava de satanás e sendo usada como feiticeira para enganar as pessoas e com os olhos vendados impedindo sua visão ela grita; lá vão os homens de Deus! Paulo e Silas. Não foi para Exaltar o nome de Deus! Mas sim, para enganar e mostrar as pessoas que o que ela estava fazendo através de satanás seria algo correto e poderoso. Mas havendo homens de Deus que conhecia a Mente de Deus, desmascarou a feiticeira e o inimigo foi envergonhado novamente. O capeta é astuto e usa de suas estratégias, devemos estar sempre espertos e ligados em Deus. Este mesmo Paulo, que é um exemplo a ser seguido, ele disse sejam meus imitadores como sou de Cristo! Mas digo mais de Paulo quando ele fala para Igreja em Felipos; &quot; E a paz de Deus que excede todo acontecimento, guardará o coração e amente de vocês em Cristo Jesus. Finalmente, irmãos, tudo oque for verdadeiro, tudo o que for nobre, tudo o que for correto, tudo o que for puro, tudo o que for amável, tudo que for de boa fama, se houver algo de excelente ou digno de louvor, pensem nessas coisas&quot;. ( Filipenses) 4. 7-8. Que maravilha irmãos, o que o Apostolo Paulo vem nos presentear com este texto esclarecedor, falando que é a Paz de Deus que excede todo acontecimento e guardará nossa mente e coração em Cristo. E nos dá uma lista de escolha para nos darmos bem na vida. Tudo isso e todas as cartas de Paulo foi o Espirito Santo quem soprou em seu ouvido, porque Paulo depois de seu arrependimento e conversão teve uma entrega total com Deus, verdadeiramente compromissado, aliançado, focado na obra, com temor a Deus. Sendo assim O Senhor permitiu que Paulo conhecesse a Mente de Deus! para dizer essas palavras que Paulo disse, convenhamos amados, isso \\`a mais de dois mil anos atrás, Isso só pode vir da Mente de Deus. E você está disposto a pagar um preço de rejeitando as coisas do mundo, e para isso acontecer quebrar o desejo da carne para que o Espirito Santo governe sua vida, sim! Que bom, porque somos nós que determinamos nosso foco espiritual ninguém pode fazer isso por nós! é uma escolha individual, será a opção de vida mais acertada, caso contrário diante das adversidades, podemos colocar culpa em outros, entretanto somos responsáveis por aquilo a que dedicamos nossa atenção. Então nosso foco é que dá origem a tudo o que sentimos em fim em nossos sentimentos. Aquilo que nossa mente processa, os sentimentos são produtos de nosso foco espiritual, importante que saibamos que nós mesmos somos responsáveis na filtragem das informações que chegam numa velocidade incrível onde nossa mente é bombardeada, isso é de nossa própria escolha. O inimigo anda ao nosso derredor rugindo como leão, mas não é leão e eu repito, quem é o Leão da tribo de Judá é nosso Senhor Jesus Cristo. Mas o inimigo esta a todo instante lançando dardos inflamados em nossa mente. Então devemos parar e empregar o tempo necessário para mudar o nosso foco. E o nosso foco é Jesus Cristo.\n\nVamos orar\\...! Deus e Pai, Eterno Tu És Grande e Poderoso, eu te agradeço pela vida, pela sabedoria e unção que me destes, permitia que Seu Espirito Santo habite em mim, posso conectar minha mente com a Sua Mente. Peço-lhe a Sua misericórdia nos dando livramentos, pois o mundo está em guerra, a mídia só retrata a triste realidade, noticiários constantemente anunciam o terror a violência, mortes, corrupção e fome. Minha mente já esteve conflitante e a cada dia ocorrem batalhas emocionais, mas eu creio em Seu Poder pelo sangue derramado na cruz do Cristo Redentor. Que eu não mude o foco, e Tua Palavra é lâmpada para meus pés e luz para meu caminho. Espirito Santo Tu És a fonte de paz genuína, a Tua Palavra me alimenta, me protege e me salva, Ela espanta as trevas e leva-me a um local de descanso, confirma Senhor essas bênçãos em o nome de Jesus, amém! Agora vamos a luta, seguiremos em frente, focado no Reino de Deus em busca de nossa coroa. Sabemos que os campeões são coroados depois de derrotar seus adversários! E nós cobramos a coroa antes de se quer enfrentar o inimigo! O será que isso acontece somente comigo? Saibamos que os campeões não são coroados somente pelo seu desejo de vencer! Como poderíamos ter direito de vitória se pela qual não lutamos! Mas Pr. Amarildo Cristo já não lutou contra o inimigo por nós? É verdade, sim lutou e venceu o inimigo! Mas deixou ensinamentos para nós seguirmos, e Disse; &quot;Nesse mundo há aflição, mas tenha um bom animo, porque Eu venci!&quot; Jesus enfatiza &quot;Eu venci&quot;, e em meu nome vocês também vencerão, mas não é fácil, tenham bom animo! ou seja; aplicam todas as forças, estejam focados no alvo, não olhem para direita nem par esquerda, não se desviam, sigam ao alvo. É necessariamente sim que enfrentamos a batalha para obtermos a vitória e tendo a certeza que nosso General é Jesus estaremos certo da vitória. Sendo assim a vitória nos qualifica para a recompensa. Somente os vencedores que serão recompensados para eternidade pelo Espirito Santo. A onde está escrito na Bíblia esta afirmação que acabo de fazer? É o Espirito Santo quem revelou para quem tinha sua mente conectada com Deus, aquele amigo de Jesus, sentava ao Seu lado e fala muito de amor! Sei, já sacou que é o Apostolo João, ( Apocalipse) 3.5 &quot; O vencedor será igualmente vestido de branco, jamais apagarei o seu nome do livro da vida, mas o conhecerei diante do meu Pai e dos meus anjos! &quot; imaginamos que lindo este dialogo de Jesus com Seu amigo João no céu, onde Jesus falava tanto do Reino dos Céus ainda aqui na terra e era difícil até mesmo para os discípulos entenderem, porque estavam focados nas coisa da terra. E agora se tornava uma realidade e todo Apocalipse estava sendo narrado para João escrever. E depois foi ordenado a comer as anotações para posteriormente aqui na terra escrever tudo assim como Jesus falou mas com a Inspiração do Espirito Santo. Você quer saber se tem mais direitos para o vencedor? &quot;Ao vencedor darei o direito de assentar-se comigo em meu trono, assim como eu também venci e sentei-me com meu Pai em Seu trono&quot; (Apocalipse)3.21 Acontece que todos desejam, sentar no trono ao lado de Jesus, mas não aceitam Jesus como Senhor e Salvador! Ele veio ao mundo mas o mundo o rejeitou! Mas para aquele crer no nome de Jesus Cristo tem recompensas; ( Apocalipse) 3.12 &quot; Farei do vencedor uma coluna no Santuário do meu Deus, e dali ele jamais sairá. Escreverei nele o nome de meu Deus e o nome da cidade do meu Deus, a Nova Jerusalém, que desce dos céus da parte de Deus; e também escreverei nele o meu novo nome&quot;. Quem for justo, fiel até o fim, as promessas são infinitas e grandiosas, imperdíveis que somente Deus poderá conceder aos Seus vencedores. Ao longo deste livro venho questionando constantemente, tens desejo de conhecer a Mente de Deus? e a Palavra foi sendo revelada através do Espirito Santo e mergulhei em pesquisas de fontes confiáveis e principalmente na Bíblia Sagrada que nos orientou. Confesso uma verdade, todo entendimento deste livro, mas isso a cada detalhe que está escrito, Deus primeiramente tratou comigo! Muitas vezes fui interrompido para digitar banhado em lagrimas os meus olhos, de unção da presença gloriosa do Espirito Santo! e até mesmo de arrependimento daquele velho homem que no passado entristecia e envergonhava ao Senhor. O Espirito Santo me escovando, passando o jato de areia e deixa brilhando mas o processo é dolorido nas áreas onde devo melhorar. E Deus é Maravilhoso e misericordioso, sabe; Ele soprava, como agora está soprando no meu ouvido; e diz; escreva isso, agora aquilo, fale com a sua maneira simples de falar, assim como Eu te ensinei filho! você está conectado comigo! e eu, fraco, pecador, muitas vezes quase desistindo por não poder ver com nitidez e quando utilizamos por muito tempo o computador nos olhos ficam embaçados, e se, só tenho 40 a 50% de visão do melhor olho imagine só a situação, e os conflitos diários tentando impedir que a obra seja realizada, sabe os dardos do inimigo! Mui amigos dando uma força moral. Mas você esta escrevendo um Livro? Mas vai dar certo? E Deus me fortalecendo e dizendo vamos em frente focado no alvo e o propósito vai ser realizado! Milhares de pessoas conhecerão a Mente de Deus através da Palavra de Deus inspirada pelo Espirito Santo que está inserida neste livro. Eu estou a serviço do Rei! E este livro não vai para o cemitério acabando em esquecimento onde há a maior riqueza enterrada porque não foi concretizado os sonhos, projetos de muitos fracassados que não ouviram ao Senhor. Vejo você nesse instante mentalizando o conteúdo desse livro e se pudesse diria assim; Amarildo, estou sentindo agora, aquilo que você sentiu da parte de Deus. Nesse momento em que esta devorando este livro, com lágrimas nos olhos e está brotando dentro de mim algo que estava adormecido, sabe um desejo de fazer mais pela obra do Senhor! Vou gravar um CD, pensava não gravar mais e agora eu sinto vontade de chorar eu vou escrever também um livro são tantos anos, tantas mensagens Deus me usando! Saber que a cada culto se eu gravasse daria um livro de oitenta a cem paginas. Sim, é bem verdade e é o sinal da Presença do Espirito Santo agindo em seu Ministério. É Ele que nos instiga depois de nos capacitar e ungir para realizar a obra. Temos liberdade de escolha, ser um aliançado com Deus! ou não servir a Deus! vivendo como ateus práticos, e agindo como se Deus não existisse. Em qual classe de pessoas que eu pertenço, estou entre os justos, ou entre os ímpios? Comentamos também; por que há tantos crimes? Tanta violência? Se torcermos o aparelho de TV, escorre sangue, a mídia é só noticia ruim! Nesses dias esta uma onda de presidiários em conflitos nas penitenciárias de todo Brasil, é fugas, entre facções chegam no ponto de decapitação de seus rivais. O mundo está em conflito. E muitas vezes temos a sensação que o justo sofre e ao que não teme a Deus parece prosperar! Este questionamento é constante a você amigo pastor! Os ímpios não irão perpetuar e serão condenados! A vitória para o justo já esta garantida em Cristo, glórias a Deus por isso! Eu creio que este livro vem para acrescentar, somar , reforçar aquilo que você já havia buscado de Deus e compreenderá melhor ainda que suas escolhas acertadas, como andar diante de Deus, e conectado com a Mente de Deus. Essa confiança em Deus mostrará realmente quem você é, e determinarão a sua história.</blockquote>\n<p>Meu amigo, Pr. Carlo Ribas diz em sua reflexão; &quot;Para Deus não importa quem você é, o que você tem ou o que você sabe. Não importa o quanto de conhecimento bíblico, teológico, eclesiástico ou religioso você tem! Para Deus o que importa é a distância que você está Dele! Muitos doutores, ricos, teólogos estão longe do Senhor!&quot; Sabem tudo, conhecem muito, viveram experiências mas hoje vivem distante de Deus. Muitos pregaram, outros louvaram e tem ainda aqueles que ganharam almas mas que agora estão tão longe de Deus que nem suas próprias almas conseguem salvar. Existe porém um grupo de analfabetos, ignorantes, iletrados, pobres. Um grupo de pessoas que decidiram não se misturar com esse mundo. Não quiseram ser pregadores conhecidos e também não subiram em palcos abarrotados de dinheiro para destilar sensualidade ao invés de unção; arrogância ao invés de graça; pecado ao invés de salvação. Um grupo que não quis \\&quot;ter\\&quot;, mas que preferiu \\&quot;ser\\&quot;. Não quiseram ter o Reino, mas passaram a SER O REINO. Não quiseram ter igrejas mas passaram a SER A IGREJA. Eles passaram a andar juntinho de Deus. Se tornaram filhos! Começaram a viver a paternidade espiritual e viram que, o que muda tudo, o que faz a diferença, é estar PERTO DO PAI. Preste bastante atenção a isso! Vejamos esta ilustração de um garoto perguntou ao pai: \\&quot;Qual o tamanho de Deus?\\&quot; Então ao olhar para o céu o pai avistou um avião e perguntou ao filho: \\&quot;Que tamanho tem aquele avião?\\&quot; O menino disse: \\&quot;Pequeno, quase não dá para ver.\\&quot; Então o pai o levou a um aeroporto e ao chegar próximo de um avião perguntou: \\&quot;E agora, qual o tamanho desse?\\&quot; O menino respondeu: \\&quot;Nossa pai, esse é enorme!\\&quot; O pai então disse: \\&quot;Assim é Deus: o tamanho vai depender da distância que você estiver dele. Quanto mais perto você está dele, maior ele será na sua vida!\\&quot; Para Deus, não importa quem você é! ou o que você tem! Mas importa qual distância você está Dele! &quot;</p>\n<p>Nunca poderemos esquecer, temos a obrigação de ensinar a nossos irmãos esses princípios básicos e essenciais;&quot; e, o quem eu sou? determinará a minha história! E o meu livro de vida aqui na terra sou eu quem devo escrever e um dia vai ser lido por mim diante de Deus! as minhas escolhas, atitudes e decisões determinarão o meu futuro. Acertadamente foi quando eu escolhi, então a ser fiel e obediente a Deus, para que mais tarde possa colher as bênçãos da justiça divina. Em (João) 3.16 . Fala do amor Ágape de Deus pelos seus filhos. &quot; Porque Deus amou o mundo de tal maneira, que Deu o Seu Filho unigênito, para que todo aquele que nEle crê não pereça, mas tenha avida eterna.&quot; Essa prova de amor e promessa é para os justos, vencedores, fieis. Mas no versículo 17, vejamos como Deus é amor e ao mesmo tempo é justo; &quot; Contudo, muitos preferem fazer a escolha errada, rejeitando o sacrifício de Jesus e trazendo a condenação de Deus para si próprios. É forte, mas é real, nós somos e seremos o resultado de nossas escolhas. Deus nunca rejeita um coração aquebrantado, mas respeita nossas escolhas, o pecado, o distanciamento de Deus acontece quando o homem de livre escolha rejeita, ignora, nega o sacrifício de Jesus na cruz. E Deus se entristece porque é criatura de Deus que deixou-se enganar pelo inimigo. Por você fazer sua escolha certa e usando de sua liberdade de escolha, Deus se alegra, mas conhece antecipadamente as livres decisões humanas, e o mais interessante, ao conhece-las de ante mão, e Ele usa esse conhecimento para o nosso próprio bem. &quot; E sabemos que todas as coisas contribuem juntamente para o bem daquelas que amam a Deus, daquele que foi chamado pelo Seu decreto. Você e eu somos escolhidos, chamados pelo decreto, você tem a nomeação é autoridade, cargo de confiança, és o Senador, embaixador, és boca de Deus, em sua boca há verdade! As pessoas vão dizer ali esta passando um homem de Deus! uma mulher de Deus! eu vou pedir para orar por mim, porque Deus ouve e responde a este servo do Senhor. Porque está separado das coisa corruptíveis e as pessoas vão te ver com outra ótica, haverá mudanças drásticas em suas atitudes, verão o brilho da presença gloriosa do Espirito Santo! Verão a Mente de Cristo que está inserida nesse servo de Deus. Esta é só pra quem é vencedor, justo, aliançado, compromissado; &quot; O justo florecerá como a palmeira; crescerá como o cedro no Líbano. Os que estão plantados na Casa do Senhor florescerão nos átrios do nosso Deus. Na velhice ainda darão frutos; serão viçosos e florescentes, para anunciarem que o Senhor É Reto; Ele é a minha rocha, e nEle não há injustiça&quot;(Salmo) 92.12-15. É decisiva nossa escolha em andar nos caminhos de Deus, ser reto, justo, fiel e viver segundo o propósito de Deus. Ao finalizar este livro, sinto que vem da parte de Deus registrar nesse momento dois hinos que fala muito ao meu coração e o Espirito Santo usou e vem usando tremendamente o Cantor e Compositor Wagner Roberto! São hinos conhecidos e próprios para esse momento em que estamos refletindo sobre fidelidade, sobre esta entrega total a obra do Senhor, a este momento de busca de sabedoria divina, essa sede de ser íntimo do Pai, esse desejo de conhecer a Mente de Deus, e proclamar o Reino de Deus com fervor, aqui na terra e florescer como a palmeira para ter um futuro de vitórias, o tempo todo sendo produtivo, frutífero, a fim de ser benção para outras pessoas. Crescer como cedro do Líbano; fazer a diferença, ser forte, seguro, um crescimento espiritual constante, plantado aos átrios do Senhor, sendo assim; na velhice produzirá muitos frutos e proclamará que o Senhor é justo e influenciará gerações e gerações, e haverá restauração libertação para você e através de você! o Senhor o sustentará, o abençoará e o guardará. Eu profetizo e concordo toda sorte de benção para sua vida.</p>\n<p>Reflita e adquira esse CD, louve ao Senhor com este Hino; &quot;Fidelidade&quot; Autor: Wagner Roberto</p>\n<p>Eu quero ser fiel Senhor, fiel até o fim. Eu quero ser fiel Senhor, Como és fiel a mim. Eu quero ser fiel Senhor, fazer Sua vontade, Não quero mais fingir, mas quero te servir com mais fidelidade. Fiel ao meu pensar Senhor, fiel no meu agir fiel no meu falar Senhor, fiel no meu ouvir, Fiel no meu olhar Senhor, Quando eu contribuir, fiel no meu andar Senhor, fiel no meu sentir. Aonde eu estiver, em tudo que eu fizer, serei fiel a Ti.</p>\n<p>Honre a Deus em tudo que você faz! E faça sua meditação neste hino, ou melhor, ambos os hinos são declarações, propósitos sendo feitos, Aquele que vive para sempre e Se alegra com esse seu novo trilhar numa estrada cheia de sabedoria e pavimentada com a glória do Soberana Deus Pai, Filho e Espirito Santo.</p>\n<p>Hino; Eu quero Te Honrar. Autor; Wagner Roberto</p>\n<p>Eu quero te honrar, por onde quer que eu vá, Senhor quero fazer a diferença, Um vaso quero ser, o azeite eu quero ter, que o mundo veja em mim Tua presença. Que quando eu chorar, não seja de emoção, pois Tu Senhor exalta a quem se humilha, E quando eu cantar, que seja na unção, pra que o Senhor opere em maravilhas. Senhor que meu agir, bem mais que meu falar, transmita o amor à paz e a esperança. Que eu saiba dividir, eu possa perdoar, que o ame como ama uma criança. Que quando eu chorar, não seja de emoção, pois tu Senhor exalta a quem se humilha, E quando eu cantar, que seja na unção, pra que o Senhor opere em maravilhas. Que atrás da sua cruz, eu possa me esconder, me guarde do orgulho e da vaidade. Que só pra ti Jesus, que eu possa aqui viver, me ajude ser um servo de verdade. Que quando eu chorar, não seja de emoção, pois Tu Senhor exalta a quem se humilha, E quando eu cantar, que seja na unção, pra que o Senhor opere em maravilhas.</p>\n<p>É um propósito que assumimos com Deus, ao ler, meditar, e louvar a Deus com esses dois hinos maravilhosos. Antes de nos conhecer a Mente de Deus tornava-se difícil de entender quem é Deus? como Ele pensa? Nós não conseguíamos ter respostas das coisas mais básicas da vida! Quando não conseguimos respostas com as coisas mais básicas, muitas vezes decepcionamos com Deus. é a Mente de Cristo que deve ser implantada na Igreja, Ele é o Governo. Não dá a impressão muitas vezes que o Espirito Santo sofreu um impeachment na Igreja, foi afastado do governo e amente de um líder ou sistema está em Seu lugar. A importância de conhecer a Mente de Deus! fará toda a diferença, por que há nos dias de hoje uma grande multidão que fala em nome de Cristo, mas está surda espiritualmente, não esta conseguindo discernir o que é espiritual do natural e o desejo de Deus é se comunicar, se relacionar com Seus filhos isso é projeto de Deus, esta em Sua Mente. E só O Espirito de Deus discerne a Mente de Deus, o cristão autentico tem a Mente de Cristo. Precisamos ouvir a vós de Deus! Eu creio em milagres! Deus está transformando mentalidades, mudando uma cultura e praticas reprovadas Pelo Senhor. Eu comecei e finalizo este livro afirmando que &quot;necessitamos mais do Provedor do que da provisão! &quot; é muito importante conhecermos a Mente de Deus! para vermos o agir d a Mão de Deus ao nosso favor. Tudo é maravilhoso e necessitamos sermos tocados por Deus, ver e sentir o agir da mão de Deus, estou falando de milagres, do sobrenatural. Importante que agora sabemos que podemos carregar dentro de nós aquele que produz milagres, é Mente de Deus, o Espirito da Deus. Devemos buscar incessantemente o Reino de Deus, o Governo de Deus através da Mente de Deus. lembras! Você e eu, somos a &quot;Eclésia&quot; , uma equipe de governo montada pelo Rei! Não se esqueças! Somos boca de Deus, atalaias, servos aliançados e compromissados com a proclamação do Reino de Deus. Oramos; Senhor, Deus e Pai, estou disposto e disponível a ir proclamar o Seu Reino por onde me enviar, aqui e agora, seja no trabalho, no restaurante, no colégio, em passeios, em férias, eu orarei pelos doentes e determinarei cura em nome de Jesus. Peço que Teu Espirito, venha sobre mim e fortaleça-me neste momento para que eu possa realizar as obras do Reino e os que ainda não receberam a salvação, ou o batismo do Espirito Santo receberão pelo Teu Poder! Entrego-te meu coração e minha vontade agora, Senhor. Em nome de Jesus Cristo! Amém. A graça do Senhor Jesus Cristo, o amor de Deus e a comunhão do Espírito Santo sejam com todos vós! Amém.</p>"}]}</script>
<script>
const data = JSON.parse(document.getElementById('book-data').textContent);

const tocList = document.getElementById('tocList');
const chaptersRoot = document.getElementById('chaptersRoot');
document.getElementById('introBody').innerHTML = data.intro_html;

// Build TOC
const introLi = document.createElement('li');
introLi.innerHTML = '<a href="#intro">Apresentação</a>';
tocList.appendChild(introLi);

data.chapters.forEach((c, idx) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${c.id}">${c.title}</a>`;
  tocList.appendChild(li);
});

// Build chapters with ad slots every 2 chapters
data.chapters.forEach((c, idx) => {
  const art = document.createElement('article');
  art.className = 'chapter';
  art.id = c.id;
  art.innerHTML = `
    <span class="chap-eyebrow">Capítulo ${idx + 1} de ${data.chapters.length}</span>
    <h2 class="chap-title">${c.title}</h2>
    <div>${c.html}</div>
  `;
  chaptersRoot.appendChild(art);

  const prev = idx === 0 ? {id:'intro', title:'Apresentação'} : {id: data.chapters[idx-1].id, title: data.chapters[idx-1].title};
  const next = idx === data.chapters.length - 1 ? null : {id: data.chapters[idx+1].id, title: data.chapters[idx+1].title};
  const chNav = document.createElement('div');
  chNav.className = 'chapter-nav';
  chNav.innerHTML = `
    <a class="prev" href="#${prev.id}">← ${prev.title}</a>
    ${next ? `<a class="next" href="#${next.id}">${next.title} →</a>` : `<a class="next" href="#cover">Voltar ao início ↑</a>`}
  `;
  chaptersRoot.appendChild(chNav);

  if ((idx + 1) % 2 === 0 && idx !== data.chapters.length - 1) {
    const ad = document.createElement('div');
    ad.className = 'ad-slot';
    ad.setAttribute('data-ad-slot', `mid-${idx}`);
    ad.innerHTML = 'Espaço reservado para anúncio';
    chaptersRoot.appendChild(ad);
  }
});

// Anúncio final
const adEnd = document.createElement('div');
adEnd.className = 'ad-slot';
adEnd.setAttribute('data-ad-slot', 'bottom');
adEnd.innerHTML = 'Espaço reservado para anúncio';
chaptersRoot.appendChild(adEnd);

// --- Theme toggle ---
const themes = ['light','sepia','dark'];
const themeToggle = document.getElementById('themeToggle');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('book-theme', t);
}
let savedTheme = localStorage.getItem('book-theme') || 'light';
applyTheme(savedTheme);
themeToggle.addEventListener('click', () => {
  let idx = themes.indexOf(document.documentElement.getAttribute('data-theme'));
  const next = themes[(idx + 1) % themes.length];
  applyTheme(next);
});

// --- Font size controls ---
let fontSize = parseFloat(localStorage.getItem('book-font-size')) || 1.125;
function applyFontSize(){
  document.documentElement.style.setProperty('--reader-size', fontSize + 'rem');
  localStorage.setItem('book-font-size', fontSize);
}
applyFontSize();
document.getElementById('fontPlus').addEventListener('click', () => {
  fontSize = Math.min(1.6, fontSize + 0.075);
  applyFontSize();
});
document.getElementById('fontMinus').addEventListener('click', () => {
  fontSize = Math.max(0.9, fontSize - 0.075);
  applyFontSize();
});

// --- Mobile TOC toggle ---
const tocNav = document.getElementById('tocNav');
const overlay = document.getElementById('overlay');
const tocToggle = document.getElementById('tocToggle');
function closeToc(){ tocNav.classList.remove('open'); overlay.classList.remove('show'); }
tocToggle.addEventListener('click', () => {
  tocNav.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', closeToc);
tocList.querySelectorAll('a').forEach(a => a.addEventListener('click', closeToc));

// --- Progress bar ---
const progress = document.getElementById('progress');
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
  progress.style.width = scrolled + '%';
});

// --- Active TOC highlight via IntersectionObserver ---
const sections = [document.getElementById('intro'), ...data.chapters.map(c => document.getElementById(c.id))];
const linkMap = {};
tocList.querySelectorAll('a').forEach(a => { linkMap[a.getAttribute('href').slice(1)] = a; });
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      Object.values(linkMap).forEach(a => a.classList.remove('active'));
      const link = linkMap[entry.target.id];
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-40% 0px -55% 0px' });
sections.forEach(s => s && observer.observe(s));
</script>
</body>
</html>
