<script id="book-data" type="application/json">{"intro_html": "<p>Conhecendo mente de Deus de Amarildo Adão Ferraz é uma compilação de porções de conhecimento extraído da Bíblia Sagrada e profunda pesquisa de fontes confiáveis e a inspiração o autor recebeu do Espirito Santo ao longo do tempo em que está aliançado, comprometido e servindo ao Senhor. Nas próximas páginas serão apresentadas reflexões sabias e pessoais de fortalecimento e renovação para capacitá-lo a enfrentar os desafios do dia a dia, a mergulhar em si mesmo e examinar assuntos em geral, problemas, pessoas, situações e as coisas simples com as quais precisa lidar para prosseguir em direção ao objetivo que Deus estabeleceu para você! Alegrá-lo nas promessas cumpridas de Deus e declarar vitória sobre o inimigo. Que este livro que você vai ler ilumine o seu caminho e contribua para sua maior aproximação de Deus! O titulo fala por si &quot; Conhecendo a Mente de Deus&quot;! Este devocional diário interativo fará com que você se sinta em um ambiente onde se manifestará a gloriosa presença de Deus e envolverá de uma maneira completamente nova. Sua maneira de ver o mundo será diferente, em seu trabalho ao seu redor as pessoas desejam se aproximar haverá uma atmosfera de paz, o seu Ministério nunca mais será o mesmo! Você será fortalecido para resolver problemas, mudar as situações e aprender tomar decisões sábias. Conhecendo a Mente de Deus! Este tesouro inspirado pelo Espírito Santo abrirá em sua vida uma estrada repleta de conhecimento e sabedoria divina e pavimentada com a gloriosa presença de Deus.</p>", "chapters": [{"id": "parte-1", "num": "I", "title": "Parte I", "html": "<p>Em algum momento você ouviu alguém dizer, sou fruto de um milagre! Eu vi, o agir da mão de Deus com milagres extraordinários! Mas com esta pessoa, mesmo buscando ser intima de Deus, compromissada, aliançada com propósito de Deus. Talvez ainda não houve uma transformação total e sendo assim, não tem tido milagres extraordinários em sua vida. Que é o sobrenatural para nós, e natural para Deus. Poucos homens de Deus no passado conheceram a mente do Criador. E por mais fiéis e íntimos de Deus que foram esses servos e mesmo contemplando o agir da mão de Deus, foram poucos que tiveram o privilégio de ver a <strong>Mente de Deus</strong>.</p>\n<p>O propósito específico deste Livro existir, é de termos a revelação através do Espirito Santo, como podemos conhecer a Mente de Deus. maravilhoso é, ver, sentir o agir da mão de Deus em nossas vidas; são milagres, sinais e maravilhas. Através da Palavra de Deus que é a luz da verdade com a orientação e discernimento espiritual da pessoa do Espirito Santo que te remos o entendimento a compreensão de qual é, o propósito de Deus para nossas vidas. E Seu Santo Nome será glorificado em tudo que fizemos.</p>\n<p>Sabemos que foi o Espirito Santo que esquadrinhou a Mente de Deus e revelou por meio dos profetas e Apóstolos, em fim, homens e mulheres de Deus tudo o que deveríamos saber sobre o maravilhoso Plano de Redenção do Senhor e através deste Projeto Divino, é, que podemos ser salvos já e agora, quanto para sempre, para eternidade e isto não é maravilhoso amigo (a) leitor. Nossos irmãos, familiares, amigos podem saberem muito de nossa intimidade, conhecerem com profundidade o lado sentimental, emocional de uma pessoa. Mas ninguém saberia tanto quanto o espirito desta pessoa, o próprio espirito de cada pessoa é o conhecedor nato e perfeito, ele sabe de tudo, o que se passa na mente no coração, na alma de cada ser. Onde está temporariamente alojado em seu corpo, então eu começo a entender a Mente de Deus através do Espírito Santo de Deus.</p>\n<p>Vejamos não é de qualquer espírito, que estou falando! é sobre o glorioso Espírito Santo, é Aquele que tem poder de convencer o homem do pecado, que nos orienta todos os dias, que devemos viver na dependência divina e é tudo pela misericórdia de Deus. Este Espírito que estou falando, já está te tocando neste instante, e quer com sua permissão, restituir, tudo aquilo que o inimigo tenha te roubado, destruído. Este, Espirito Santo, É o Espírito da verdade que o mundo não pode ter e nem ver. Ele nos dá sabedoria divina, nos dá livramentos e provisão, Ele libera, para aqueles que desejarem algo que não se ensina em sala de aula nas escolas; a percepção; você vai perceber, sentir, ver o sobre natural e vai fazer a diferença por onde andar. Faro; nos negócios, no trabalho, acontecerá algo sobre natural inovado, por suas mãos será criado algo novo e importante, e será rendoso para ti. Seu nome será honrado e O Nome Deus será exaltado pela sua sabedoria, que, alhas, não será sua, mas é do Espirito S anto e que lhes dará, e usará através de você. A sensibilidade, é uma das qualidades importantes do ser humano, Jesus Cristo Filho do Deus vivo, foi muito sensível Ele sempre era movido de fortes compaixões pela sensibilidade e percepção, quando se tratava do próximo. Ele se colocava no lugar do oprimido e realiza grandes milagres, alhas ainda hoje realiza através de seus servos que tenham uma vida pautada no altar, dedicada ao Reino de Deus. O Espírito Santo, liberará infinitas qualidades, virtudes, dons para aqueles que desejarem! e, se comprometerem com o Projeto do Reino Deus.</p>\n<p>O Espirito de Deus, nos revelará mistérios do Pai. Ele abrirá nossos ouvidos espirituais, nossos olhos espirituais e nossa mente será a Mente de Cristo. A Palavra diz; que muitos são os convidados, mas poucos os escolhidos. Vejamos, não foi você, nem eu, que escolhemos servir a Deus¹ Mas Ele quem nos escolheu. E nos separou. A palavra &quot; separado&quot;, significa no hebraico; afastado das coisas impuras, separados das imundícias, do pecado. Neste mundo em que vivemos jaz no pecado. Deus quer que buscamos e vivemos na &quot;Santidade&quot;. Deus nos orienta dizendo sejas santo! porque, Eu Sou Santo.</p>\n<p>Neste livro, por mais simples que seja meu linguajar, o importante é, que você entenda que a essência o teor do conteúdo do Livro, procede do Espirito Santo. E é direcionado a um grupo seleto, os escolhidos e separados para a vida eterna, pessoas que tem um alvo a atingir. Pessoas que sabem o que querem na vida, portadoras de excelentes virtudes e atitudes, é um povo aliançado, comprometido com o projeto de Deus. A estes, Deus quer revelar Os Seus pensamentos, Suas ideias, compartilhar conosco o Seu melhor, que esta por vir. E talvez seja este o momento para quem está distante da proteção de Deus, e lendo, meditando, o Espirito Santo lhes convida para arrepender-se dos momentos de deslizes , fraqueza, de escolhas erradas, que nos leva ao afastamento da presença gloriosa de Deus. O pecado deixa nosso Pai muito triste! Ele se decepciona com aquele que rejeita, nega à Cristo! O Pai inclina Seu rosto para terra e observa certas atitudes humanas e chora, diz a Seu Filho amado; fizemos toda criatura humana a nossa imagem e semelhança, e não foi isso que Eu ensinei! Exclama, Jesus ao Senhor. Papai do céu está te esperando de braços abertos! Ele quer passar a mão em seus cabelos, te pegar no colo, te abraçar. Você sabia, que Deus sabe tudo de tua vida até mesmo quantos fios de cabelos tens ou tinha, mesmo Deus sabendo de tudo de nossa vida, Ele nos dá o livre arbítrio ( liberdade de escolha) então permita, que Deus esteja no controle de sua vida, e a melhor coisa que poderia acontecer é colocarmos nossa vida no centro da vontade de Deus!</p>\n<p>Quando estamos na dependência de Deus, na obediência, trilhando no caminho da verdade, o amor de Deus é recíproco e brota a cada dia mais este prazer em nosso interior para adorar ao Senhor!, é Nas orações, ouvindo a Palavra nos cultos que a nossa fé é fortalecida e aumentada, e nos aproximamos mais e mais de Deus. Das bênçãos, dos milagres, é a cada atitude colocada em prática no mundo secular, que agradamos ao Pai. E nos tornamos mais íntimos de Deus. Aprendi que o nosso Pai é um Eterno Apaixonado pelos Seus filhos! Aqueles que se arrependeram de seus pecados, que possuem coração aquebrantado. Porque, Deus amou o mundo de tal maneira, que Deu Seu Filho amado para morte de cruz, para nos salvar.</p>\n<p>Uma pergunta que não me cala; Você, teria coragem de dar seu filho, não pra morrer por corruptos, mas para ser trocado num resgate em um suposto sequestro, por uma pessoa de bem. Que estaria sobre controle de marginais? Não daria, não é! Pois, eu também não! Mas, Deus fez isto para que através da morte e ressurreição de Cristo, pela graça, (favor imerecido) poderemos todos, por maior que seja nosso pecado, novamente ser chamados de filhos e filhas de Deus e o domínio que foi dado um dia a Adão no Jardim do Éden, e com a queda espiritual, a desobediência, ele se apartou de Deus, e foi perdido o &quot;domínio&quot;, o pecado nos afasta da presença de Deus. Adão foi o primeiro homem que conheceu <strong>a Mente de Deus</strong>. Convivia com Deus, mas com a entrada do pecado foi <strong>destituído o domínio.</strong> A noticia boa, é que através do segundo Homem, enviado por Deus, vem do Reino do céus, e agora Ele se desfaz de toda Sua glória, e poder, vem e nasce humilde em uma manjedoura. Esse Rei não nasce na terra em palácios, mesmo tendo direito de ser honrado Em Sua Majestade O Rei dos reis. O milagre é concebido pelo Espirito Santo e a aproximadamente. A Dois Mil anos atrás, é gerado no ventre de uma virgem, moça de um coração puro chamada Maria. Jesus nasce e cresce aos 30 assume Ministério Proclamando o Reino de Deus. Aos trinta e três morre na cruz, conclui Sua tarefa aqui na terra, morre para cumprir-se as profecias, mas ao ressuscitar restitui o &quot;domínio&quot; ( este domínio retornarei a falar ) e devolve ao homem novamente. Mas para isso! há pedidos e ordens de Jesus; (Mc16;15) &quot; Todo aquele que crer e for batizado será salvo, quem não crer será condenado.&quot; (João) 12 e 14 Aquele que crer em mim, fará obras maiores que as minhas. Eu Sou o caminho a verdade a vida, ninguém vai ao Pai se não por Mim. Se andarmos na luz! e luz! no grego, significa: a &quot;verdade &quot;, trilhando no caminho da verdade, é andar no caminho da salvação. Mas, se optarmos por andar nas trevas a escolha é frustrante, porque é da mentira, do engano, da perdição eterna, e única paternidade do capeta é a mentira. A Bíblia diz; que ele o diabo, é o pai da mentira.</p>\n<p>O sangue carmesim, derramado no calvário por nosso Senhor Jesus Cristo! somente Ele tem o poder de purificar pecados. E menos o Apostolo Paulo, outros apóstolos, conheceram e andaram com Cristo. Apesar de Paulo, ouvir a vós de Jesus e ver uma luz muito forte que acaba caindo do cavalo, torna-se totalmente cego e depois de seu arrependimento e renuncia, Paulo, de um perseguidor se tornos o mais fervoroso seguidor fiel de Cristo, e conheceu a Mente de Deus. Escrevendo 14 cartas, que hoje é possível ler e conjecturar nos dando uma expressão de ser escrita nos dias em que vivemos, que alhas, se parecem muito com os dias de Paulo. Uma sensação e muitas vezes é real situações em que há frieza de coração, neste mundo corruptível, pecaminoso, carregado de conflitos, a ganancia, a intolerância e a disputa pelo poder predominam.</p>\n<p>Mas havendo poucos profetas, homens tementes a Deus no Antigo e Novo testamento que conheceram a Mente de Deus. Porque o caminho é estreito, e na caminhada nem sempre agradamos a Deus, Ou teríamos motivos de atrair o olhar de Deus. Mesmo quando pensamos fazer algo que agrade a Deus e ainda estando em pecado, Deus não recebe! Antes devemos nos purificar. No decorrer do livro vou citando alguns dos homens e mulheres que tiveram uma intimidade muito grande com o Criador. Então haverá momentos nessa edição em que irei mencionar o nome dos Heróis da fé, e a repetição será necessária, relembrando seus feitos, suas atitudes que levaram a se aproximar mais de Deus. Onde o sobre natural aconteceu, e poderá acontecer com nós! Se seguirmos as orientações do Espirito Santo. A fidelidade desses heróis da fé foi tanta, que alegrou aos olhos de Deus, algo que chamou a atenção do mundo espiritual! ao ponto da Unção do Pai, a Presença Gloriosa do todo Poderoso, ser derramada sem medidas. Essa manifestação real da presença de Deus é para quem estiver preparado e desejar! E você deseja essa unção para seu Ministério? para sua vida? Quando houve esse derramar das bênçãos de Deus sem medias e eu me refiro de &quot;Pentecostes&quot;, vejamos, não foi somente o derramar do Espírito de Deus que falavam em línguas, descia sobre suas cabeças como língua de fogo, dando-lhes sabedoria e intrepidez para evangelizar. É maravilhoso todas essas manifestação de Deus, mas os discípulos tiveram uma atitude ainda melhor após o &quot;Pentecostes&quot;, o desejo de realizar a obra de Deus, a Palavra diz; que em tudo eles prosperavam, não foi somente o abrir das janelas do céus, mas as portas do céu foram escancaradas com provisão e unção , quando é realizado um clamor puro a Deus, alinhados na obediência e comprimento de uma ordem do Mestre Jesus, sendo levantado ao Pai! A! sim! Ele responde imediatamente, convoca Seu exercito e da ordens , as hostes celestiais que venham a serviço de Seus filhos. O Pai respondendo os clamores, as petições e rendições de graças sendo uma adoração fiel, pura, com certeza chegará como perfume suave em suas narinas!</p>\n<p>Esta relação mais intima com o Criador foi alcançado pelos poucos homens e mulheres tementes ao Senhor. E nota-se, o temor e a obediência demonstrada em cada um destes santos, mesmo sendo pecadores, porque a Palavra nos diz; (Rm) 3:23 Todos pecaram e destituídos da glória estão. Isto quer dizer que você e eu, temos chances ainda! de sermos usados por Deus com sobrenatural. Siga, meu modesto raciocínio, o quanto poderá mudar a nossa vida, quando observarmos e colocarmos em prática, apenas duas letras, ou uma silaba; &quot;se&quot;; este &quot;se&quot; é adverbio de condição, &quot;se&quot; realizar boas escolhas, &quot; se&quot; estiver arrependido dos seus pecados, &quot; se&quot; andar compromissado e aliançado com o Plano de Salvação, e quando falo Plano de Salvação é um pacote completo de benção. É comer do melhor Desta terra. (Profeta Isaias) 19 nos deixa essas promessas inspirado pelo Espirito santo. Mas vem antes das bênçãos, das promessas à obediência, o, ouvir a Palavra de Deus. Amados, quem não quer ser abençoado em todas as áreas! mas também nossas obrigações e deveres estão incluídos no pacote! Fé, fidelidade, obediência, compromisso, trabalho ou serviço na obra, em fim atitudes de um autentico cristão, ser verdadeiramente imitador de Cristo! em tudo que fizer, que o nome do Senhor sejas glorificado! porque tudo vem dEle é por meio dEle é para Ele. Glorias a Deus por isso!</p>\n<p>Vejamos o belo exemplo de Noé. Deus que vê todas as coisas e observando as atitudes do velho Noé. E sendo agradáveis aos olhos de Deus, o Pai resolve manter um diálogo com Noé! E na fala ordena a Noé construir uma Arca, algo gigantesco a ser construído em um lugar de sequidão, o material difícil conseguir e a manipulação onde sabemos que não havia nada de tecnologia como nos dias atuais para fabricar uma arca ou um barco gigante para abrigar e transportar um casal de cada espécie de animais existente na terra. Então resume-se em uma palavra; &quot;obediência&quot;. A obediência por parte de Noé nos ensina que foi o principio do milagre extraordinário, do evento notável sobre o Plano de Salvação do Reino de Deus, onde já era anunciado a vinda do Messias! Isso no Antigo Testamento o &quot;Dilúvio&quot;. Onde Noé e seus familiares obedeceram a Deus, construíram o projeto de Deus se realizou os animais obedeceram! Mas, o povo da época assim como nos dias de hoje mergulhado no pecado rejeitaram o pedido de Noé inspirado por Deus e depois que foi fechada as portas da arca, não teve choro, a desobediência leva ao julgamento e condenação. Se obedecermos, teremos benção mas se desobedecermos virá a maldição. Já foi citado o ato da primeira desobediência na terra, aconteceu com o primeiro homem; Adão, e com a queda veio o pecado, ( o preço do pecado é a morte!) todo mal entrou neste mundo, a natureza humana se tornou pecaminosa. O DNA de todo ser humano herdou o genes do pecado, há uma tendência para o mal desde bebe o ser humano carrega essa carga genética do mal. Hoje, tudo o que podemos ver e sentir relacionado ao mal, é resultado, fruto do pecado original. Ou como então surgiria o ódio, a ganancia, violência, doenças incuráveis, vícios; todo tipo de drogas o homicídio, suicídio, roubo, contendas tudo entrou através do portal que foi aberto na desobediência lá no Éden, onde o homem era tudo perfeito, homem perfeito sem pecados, genuinamente falando, e está tudo escrito no manual do fabricante ( Bíblia Sagrada) mas Adão não instruindo a Eva e tendo autoridade, domínio podendo dizer um não podemos comer dessa fruta proibida! preferiu romper com Deus e não ser mais dependente do Criador. É por isso que nos dias de hoje, tentam imitar a Deus, na ciência (clonagens humana) as tecnologias a cada dia mais destrói a natureza ao invés de conservá-la. Somente com a vinda de Jesus, o segundo homem perfeito( possuidor da natureza humana e Divina) que não foi encontrado pecado algum o cordeiro perfeito pata tirar o pecado do mundo! A morte de cruz e a poderosa ressurreição de Jesus Cristo a través dEle que sim, foi e é restituído o domínio a autoridade ao homem. Mas por incrível que pareça mais de 5 bilhões de almas acreditam em tudo que veem, menos em Cristo. Você se assustou com essa quantidade de pessoas que não conhecem ou não acreditam em Cristo! Se eu te falar que o número ainda é maior de almas viventes que não foram alcançados pelo Evangelho, não foi inserido na mente de bilhões de almas sobre o Reino de Deus e é possível ver e viver somente através de Jesus Cristo!</p>\n<p>Hoje, a população mundial ultrapassa o número 7.2 Bilhões de pessoas. O &quot;Ide&quot;, a Ordem dada por Jesus é um chamado que continua ativo! pois uma pesquisa recente concluiu que aproximadamente 3,1 bilhões de pessoas nos dias atuais ainda não ouviram falar de Jesus Cristo.</p>\n<p>O levantamento foi feito pela organização cristã Joshua Project, que se dedica a identificar e mapear os grupos étnicos que mais precisam de atenção das agências missionárias. Em termos de percentual, esse número é quase metade da população atual do planeta: 42,3%. E o pior cenário de difusão da mensagem do Evangelho é a Ásia, onde cerca de 60% dos habitantes nunca ouviram falar de Jesus. E a África soma também muitos povos ainda não alcançados pelo Evangelho. Entendamos; são duas situações distintas, vistas por Deus com tristeza. A primeira, pessoas ainda não alcançadas pelo Evangelho da Salvação e a segunda, que significa muitas almas! Que rejeitam a Cristo. Acreditam em tudo menos a Jesus, que é o caminho, a verdade e a vida.</p>\n<p>Somente na denominada Janela 10\\\\40. Que Localiza-se nos Continentes Asiático e Africano, 65 países com uma população muito grande e a miséria predomina, onde não foi alcançado pelo Plano de Salvação. E Jesus ao acabar o tempo de Seu Ministério aqui na Terra deixou a Ordem: &quot; Idem por toda terra e proclamai o Plano do Reino dos Céus&quot;. E ao digitar este capitulo do livro; &quot;Conhecendo a Mente de Deus,&quot; numa tarde chuvosa de verão, mês dezembro 2016 na cidade de Chapecó, SC Brasil . E abro um parêntese para fazer um registro; estando ainda chocado, triste com uma tragédia recente, onde houve a queda de um avião matando 71 pessoas, entre elas quase que todo o time de Futebol da Associação Chapecoense de Futebol. Da Série A, e seus dirigentes, médicos, jornalistas que davam assistência e cobertura jornalística do evento futebolístico que estava prestes a acontecer na Colômbia. Já em próximos do aeroporto, há 5 minutos do poso da aeronave, praticamente na cabeceira da pista do aeroporto da cidade de Medelín Colômbia. Ali também, o mundo viu o agir da mão de Deus milagres, porque há sobreviventes numa queda de avião, onde a aeronave se espatifa em pedaços? Porque Deus tem propósitos, e quando ainda esta por se cumprir, Deus entra em ação e nos dá livramentos. Diante deste acontecido o mundo parou! Foi um momento de reflexão! Os olhos do mundo estavam conectados as lentes das câmeras da mídia que focavam e passavam informações sem aquele sensacionalismo, mas sim, relatavam a triste perda de uma equipe que estava em ascensão no futebol nacional e internacionalmente falando. E a paixão pelo futebol que é algo saudável quando é praticado e vivenciado sem violência, sem idolatria, e é admirado por um povo que passa por adversidades, crises etc. Observei algo digno de registro quando a Colômbia por sua vez, deu maior exemplo de solidariedade. Com gestos de amor ao próximo, eu confesso que chorei, assistindo toda mídia mostrando maiores times do mundo demonstrando carinho, dividindo a dor da perda, e nesse instante Deus fala comigo ! foi no domingo a noite, um dia após ter sido o velório e o sepultamento da maioria dos corpos, então estou saindo para o culto e tirando o carro da garagem, observei que um balão de cor branca, possivelmente daqueles que haviam sidos, jogados no estádio, em homenagem da despedida aos guerreiros. O balão estava um pouco sujo, bem murcho e vinha saltitando empurrado por algumas peadas de vento era algo assim, meio diferente. Aquilo me chamou atenção! E onde moro, uma rua calma, não havia ninguém naquele momento na &quot;Rua Carlos Chagas &quot; Centro de Chapecó. A não ser minha esposa e eu, não havia mais ninguém e criou-se uma atmosfera de paz, mas ao mesmo tempo o sentimentos de dor dos familiares que ficaram mexeu profundamente comigo e dava a impressão que este balão queria me dizer algo, como assim por exemplo! Você vai ao culto e eu também quando não estava em serviço ia adorar Deus nesse horário, eu ia com alegria e minha esposa participava no louvor junto com seu filho o tecladista que tem o mesmo nome meu &quot;Bruno&quot;! Veio na minha mente como se fosse um filme. Foi quando então, eu saltei do carro e entendi, que este balão branco murcho me dava um recado, há uma quadra da minha casa está uma Igreja do Evangelho quadrangular ( mesma denominação onde meu filho Bruno membra, sendo que minha família toda, servimos ao Senhor na IEQ ), mas especificamente nessa Igreja IEQ Bairro Itália, muitos dos jogadores da Chape eram e outros ainda permanecem membros. Pr. Serginho ex; jogador e é pastor titular. Falo mais do misterioso balão, que escapou das minhas mãos e subia na rua que tem uma certa inclinação e veio na minha mente; &quot; eu sei, que eles estão descansando aos cuidados de Deus.&quot; Mas eu via perfeitamente o jogador Bruno Rangel no qual eu tinha tido algumas falas e comprimentos coisa de irmandade na igreja e então eu via naquele balão esta inserido a vontade de Bruno Rangel ir a igreja, mas não poderia mais ir, e sim adorar a Deus no céu, é obvio que eu larguei aquele balão e fiz uma oração. Mas até nos dias de hoje, me arrepia quando lembro. E Deus falou comigo depois de alguns minutos na igreja e você esta sendo árvore frutífera? O que você está fazendo para o Reino ser proclamado? Estes seus amigos, irmãos, heróis tiveram seu tempo. E você, se Eu te chamasse hoje! o que tens para me apresentar? qual o seu legado que você vai deixar ai na terra? Qual é a sua obra? Amados podemos escrever nosso livro, a nossa história a partir de hoje e Deus se alegrará quando, não se envergonhamos de proclamar Seu Plano de Salvação, amar o próximo, e adorar a Deus sobre todas as coisas!</p>\n<p>É um momento de reflexão, parar e rever minhas atitudes, será que meu propósito está alinhado ao propósito de Deus? Para eu retomar ao tema inicial como posso Conhecer a Mente de Deus? Digo mais, para concluir o registro sobre a tragédia da queda do avião com o time de futebol da Chape. E no dia de hoje eu tenho assistido testemunhos, entrevistas dos sobreviventes deste desastre, inclusive estão ainda em recuperação enquanto escrevo este livro no Hospital da UNIMED a uma quadra de casa, e ao sair de casa passo em frente ao hospital, mas na fala dos sobreviventes é de praxe se ouvir; &quot;os médicos me disseram; foi milagre de Deus campeão&quot;, é a medicina se rendendo aos pés do Médico dos médicos Jeová Rafá. Sobreviventes da queda de avião afirmam; &quot;sou milagre de Deus eu nasci de novo&quot; e com lágrimas nos olhos, abraçados ao seus familiares com alegria e apegados em suas mãos, apertando-as como se estivessem retornando de um passeio do exterior em uma missão por muitos anos. Sabe, quando falam, e sua voz fica tremula! é um sentimento de profunda gratidão a Deus! e dizem mais; a partir de agora, vou valorizar mais o próximo, as coisas pequenas antes eram insignificantes a partir de agora em tudo vejo o toque de Deus. É outra concepção de vida.</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-2", "num": "II", "title": "Parte II", "html": "<p>Foram seis os sobreviventes; o goleiro, Jackson Follmann, o lateral Alan Ruschel e o zagueiro Hélio Neto - além do jornalista Rafael Henzel e da comissária de bordo boliviana Ximena Suárez e o sexto sobrevivente, o tripulante boliviano Erwin Tumiri , O Jornalista Rafael em lágrimas ao dar alta do Hospital ainda dentro do carro com sua família, aponta com sua mão para o céu diz;&quot; é milagre de Deus sou grato a Ele , Tudo é possível para Ele&quot;. E o zagueiro Neto, antes desta tragédia teve uma experiência com Deus. Teve uma cura física, com problemas na coluna estando impedido de jogar, mas Deus pela Sua infinita misericórdia e poder permitiu que jogasse, dando-lhe a cura. E Neto, sendo conhecedor da Palavra, evangelizava os colegas e dizia; Deus me curou e vou jogar, mas há um propósito de Deus para minha vida; que é proclamar o Reino de Deus! e Deus livrou mais uma vez ao zagueiro Neto na queda do avião. Porque tem propósito a ser cumprido aqui na terra. É forte o que vou dizer mas é verdadeiro &quot;<strong>quem tem propósito de Deus não pode morrer</strong>, <strong>antes que sejas cumprido&quot;</strong>; pode ser jogado de uma embarcação em alto mar e vem um enorme peixe e protege em sua barriga por três dias para depois cumprir o propósito de Deus ( Jonas ) e prega apenas um dia, a cidade era grande e precisaria ao menos três dias. Jonas queria ver toda cidade de Nínive sendo devorada pelo fogo da justiça do juízo divino. Pois aquele exercito, muitas vezes destruíram sua cidade e seus familiares. Mas o propósito seria de evangelizar o povo de Nínive com 120 mil almas se rendendo a Deus ). Pode ter até morrido e já ter sido colocado no túmulo por quatro dias, se tem propósitos de Deus a ser cumprido! Lá vem Jesus, que é vida e da ordem a morte. E seu amigo Lazaro, ressuscita e posterior mente foi pastor em uma sinagoga na Ilha de Chipre, e que belo testemunho teria este pastor a relatar as suas ovelhas!</p>\n<p>Pode ser perseguidor do cristianismo e cair do cavalo e ficar cego. Quando tem propósito de Deus para ser cumprido é restaurado sua visão, vem o Espirito Santo e realiza a obra, capacita-o e usa-o grandemente eu falo do Apostolo Paulo escrevendo 14 cartas para aquele povo. Importante, o mesmo conteúdo linguístico das cartas daquela época, e tratando com a vida espiritual dos fiéis, por onde ele fazia missões. Muitas vezes, Paulo escrevia mesmo encarcerado demostrando-se alegre e podemos conjecturar para os dias atuais! É uma Palavra de muita sabedoria, vinda de um homem que era fiel a sua religião, ao o seu trabalho, e totalmente equivocado com o Plano do Reino de Deus. Sabemos que anteriormente era perseguidor da Igreja, prendia, inclusive assistiu apedrejamento e morte do Diácono Estevão da Igreja primitiva. Mas quando o Agir de Deus em Seu tempo determinado, começa operar os propósitos vão se cumprir sim. E posteriormente, Paulo, passa a ser um seguidor de Cristo um homem usado nas mãos de Deus, ainda Paulo em suas andanças missionárias, ao recolher lenha, para fazer fogo e realizar sua comida ( Paulo construía tendas, ele tirava seu sustento botando a mão na massa; trabalho ) e foi picado por uma serpente venenosa, mas nada aconteceu e sabe por que? Quem tem promessas e propósito de Deus a serem cumpridas não pode morrer! Eu poderia citar tantos outros homens tementes a Deus que conheceram a Mente de Deus ex: Abraão, Isaque, Jacó, Moises, José, Isaias, Jeremias, o Homem de fogo Elias, Eliseu e cada um deles teria muito do sobrenatural para relatar, porém para o momento cito apenas alguns que Deus está a me orientando. Apostolo Pedro numa prisão com quatro guarnições de elite com quatro soldados cada guarnição. Isto aconteceu, depois da morte de Cristo e alguns seguidores de Cristo fugiram, se esconderam, mas havia um grupo de homens e mulheres de fé na igreja que orava sem sessar! E Deus Ouve o clamor e responde enviando um anjo ao cárcere onde estava Pedro. O anjo abre os portões sem que os guardas percebam e quando Deus tem propósito a ser cumprido você não pode morrer! Cito mais um, entre os heróis de Deus que a Bíblia nos mostra; é de Daniel, e sendo fiel ao Deus vivo, não negando a adoração ao Criador Eterno e desafiando o interdito do o Rei Dario. Esse reino que suplanta o império da Babilônia é a Medo <strong>Pérsia</strong>  (<strong>Daniel)</strong> 6:9: Em seu interdito, que por trinta dias não poderiam adorar nem um outro rei, a não ser Dario! e Daniel escolheu certo em adorar a Deus por três vezes ao dia. E sabemos da história, foi jogado na cova de leões, e Leões ficaram sem lanche, Deus decretou jejum para os Leões. Foi lá, que Deus não livrou Daniel da cova, mas livrou, na cova, e da boca dos leões. Quando Deus tem propósitos para você! você não pode morrer!</p>\n<p>E os três que tiveram livramento na fornalha, também subordinados de Daniel e ao rei Nabucodonosor. (Daniel) 3.22 falo dos conhecidos de nós pregadores! Quem nunca pregou Estes três homens? Sadraque, Mesaque e Abede-Nego!. E foi a mão de Deus livrando do fogo. E nesta manifestação o Próprio Jesus no Antigo Testamento vem e participa do milagre, era o quarto homem com vestes brancas que o rei viu Na fornalha ardente! Deus não os livrou da fornalha! Mas, sim, livrou-os na fornalha! O rei manda aquecer sete vezes mais! a fornalha! O que o rei não sabia! Que o número sete, simboliza o número da perfeição de Deus. E nada aconteceu de mal para Sadraque, Mesaque e Abede-nego. Então, mesmo jogando os irmãos na fogueira, é dentro do óleo fervescente, é cova de leões famintos, é prisão de segurança máxima, Pode cair avião, aconteça oque for! Pra quem tem promessas de Deus e propósitos! o que vai prevalecer, é a vontade Soberana e o propósito de Deus. (Proverbio) 19.21 Quando Deus tem propósito a cumprir na sua vida não pode morrer!</p>\n<p>Algo muito importante e que todos devemos saber! O Plano de Deus, foi elaborado pelo Espirito do Senhor! Aquele que esquadrinhou a Mente de Deus. Este plano de Salvação. Brotou dentro de Deus! Raciocine, juntamente comigo! quando se tratando de propósito de Deus, sempre vai prevalecer a vontade dEle. Então, sendo o maior propósito de Deus, o Plano de Salvação! e Ele o Pai, nos dá a maior prova de amor, doando Seu Filho primogênito para morte de cruz para salvar nós perdidos, caídos e somente pela Sua misericórdia que somos resgatados das unhas do enganador pai da mentira satanás. Jesus vem, nos deixa ensinamentos apresentando o &quot;Plano do Novo Reino&quot;, e morre para cumprir o &quot;Plano de Salvação&quot;, mas o Deus que servimos faz cumprir Sua Palavra e Suas Promessas Ele ressuscita Jesus! Jesus está vivo para sempre e todo poder foi lhe dado no céu e na terra! Sabes por que Jesus também vive e para sempre¹ <strong>porque quando Deus tem propósito a ser cumprido na sua vida você não pode morrer.</strong> Que tal você dar um &quot;gloria a Deus&quot;, agora! em sinal de gratidão ao nosso Deus vivo\\.... a Fonte inesgotável de amor, misericórdia, de promessas, de propósitos para sua vida! Mas mundo de hoje em que vivemos é uma inversão de valores, se perdeu o respeito a ética a moral os bons costumes, os princípios bíblicos, de honra de gratidão e as pessoas veem você , pelo que você tem! e não, pelo o que, você é! E, é assim, que devemos ver e servir ao nosso Criador! pelo que Ele É! e não, pelo que Ele tem e pode fazer por nós! Ele, O nosso Deus, é Onipotente, Onisciente, Onipresente. É apaixonado pelos seus filhos.</p>\n<p>As pessoas preferem trilhar pelo caminho largo e espaçoso ao invés de ouvir e obedecer o que Cristo nos deixou narrado nos Evangelhos. Então, esta guerra constante entre o espírito e a carne se não houver esforço, atitude individual, e as escolhas erradas nos trarão grandes prejuízos, muitas perdas e a principal delas é a salvação! Somos sabedores, de que nossa prestação de conta no juízo final será individual! E o nosso nome deverá constar no Livro da vida. Também quero falar de algo muito importante que impede a realização de muitas promessas para nossa vida, e nos afasta da presença de Deus, cega a visão e o entendimento das coisas de Deus, não havendo discernimento da Palavra, são mínimas chances de conhecer a <strong>Mente de Deus;</strong> É dar ouvido ao inimigo, abrir brechas, são portais dando permissão, legalidade para satanás agir e destruir sonhos, planos, projetos construídos e nunca serão realizados, ou concretizados! Pergunto! Você conhece alguém que iniciou um curso superior e desistiu? Ideias e projetos para construir uma nova igreja e não construiu? Algo mais fácil agora! Você conhece alguém que começou a ler um livro e desistiu no terceiro capítulo? Ou pouco pega a Bíblia para meditar? Se você conhece, diga a esta mente que ela terá vitórias em nome de Jesus e todos os sonhos serão sonhos de Deus! E a pergunta que não se cala é; por que não dá certo comigo? Eu estudei tanto! me forme, mas não consigo trabalhar em um lugar digno! E as coisas não dão certas para mim! ou seja, está dando tudo errado na minha vida. E eu até frequento a igreja, sou fiel e percebo que outras pessoas infiéis estão melhor do que eu? Vejamos, como Deus trabalha em nossa vida! Na verdade o caminho é estreito o propósito de Deus prevalecerá no tempo certo acontecerá! e se for fiel até a morte o seu galardão será garantido! e para quem escolher o caminho do mal! Aqui na terra tudo passa numa velocidade incrível, e oque semeamos vamos colher! A colheita é obrigatória e no tempo certo da maturação ocorrerá! E para aqueles que plantam o mal! estará colhendo, infelizmente a perdição eterna. Infelizmente, há muita gente agora neste instante em que estou escrevendo este Livro. E também neste exato instante em que você está lendo e meditando, pessoas desobedecendo a Deus! e quando há desobediência a Deus, é naturalmente que a pessoa obedeça ou esta servindo a outro deus. A Bíblia, é enfática em dizer que não podemos adorar, ou obedecer a dois senhores, ou da mesma vertente; não pode jorrar água doce e água salada! Também diz; sejas quente ou frio! porque o morno vomitarei fora! É forte, o crente meia boca, com um pé na igreja outro no mundo! Um dia está no céu outro dia no inferno, está inseguro, fala uma coisa e vive outra. Só pela misericórdia de Deus, uma conversão verdadeira para mudar a situação. O que o Espírito Santo me manda falar agora, mas entenda que primeiramente numa mensagem pregada no culto ou nos aconselhamentos e mesmo agora neste Livro de reflexão e o orientação! Deus trata primeiramente com o Mensageiro, com o conselheiro e com o escritor! É o Espirito de Deus quem cobra sim! E quando trata comigo, Quer que eu fale a verdade e que eu viva, pratique o que estou escrevendo nessas entrelinhas, e como sou pequeno, reconheço minha fraqueza, minhas falhas, minhas limitações! E, em muitos, dos exemplos citados acima e o que, ainda irei relatar, infelizmente eu vivi. É o pecado, a desobediência, a omissão que nos afasta da presença de Deus! Talvez, você está lendo muito atento, e ligeiramente faz uma reflexão sobre si mesmo! e analisando profundamente após numa busca interior, não encontra nada que lhe condene ou esteja impedindo de ser um herdeiro das promessas de Deus! Estando confiante que conhecerá a <strong>Mente de Deus,</strong> como poucos homens conheceram! e mais, a sua brilhosa e fantástica, mente de uma complexidade gigantesca está processando agora neste instante numa velocidade incrível que nem tudo é pecado! e nem tudo que agente faz seria desobediência a Deus! Vejamos, depois do homem perder o domínio! na queda espiritual, desobedecendo a Deus no Jardim do Éden! (repito; foi Jesus que nos restituiu posteriormente ) ainda hoje muitos, e não são poucos não! Que obedecem a Deus superficialmente falando! Porque é a carne que ainda se sujeita as plantas? Sim, a uva, a cana a cevada, folha da coca, tudo que citei e muito mais, são industrializadas e destiladas se tornando bebidas lícitas ou ilícitas em fim tudo que venha ter um propósito especifico, causa vício e destrói o corpo que é templo, morada do Espírito Santo.</p>\n<p>E o Apostolo Paulo diz; nem tudo que é licito lhe convém. Todo aquele que confessa se arrepende não tornas a pecar somos sabedores que somos perdoados e purificados por Cristo através do sangue derramado na cruz. E eu confesso, fui escravo da bebida alcoólica por muito tempo! É triste relatar, mas perdi muitos empregos, fui militar no Exército Brasileiro por quatro anos Cabo do Exército. E teria uma carreira brilhante mas infelizmente eu admito preferi obedecer, Ficar na dependência da bebida, e posteriormente na Polícia Militar mais cinco anos fui um excelente policial, motorista dos oficiais tudo para seguir carreira e hoje estaria aposentado, ou reformado com proventos de Sargento com uma remuneração generosa e digna. Poder viajar conhecer o mundo, dar o melhor para minha família, para minhas netas. Mas novamente a cegueira espiritual a carne vence o espírito a bebida alcoólica entra e destrói, mata, muito mais do que as guerras, são famílias destruídas, filhos, amigos que acabam abandonando o dependente químico quando ele não permite a ajuda. Porque ele próprio não se ama, o inimigo faz com que ele perca a auto estima. Mas a notícia boa é, que de escravo e cavalo do diabo que fui outrora, hoje, liberto sou servo do Senhor dos Senhores e Rei dos reis, sou boca de Deus, estou revestido de poder da unção do Espirito Santo, o domínio foi me restituído pela ressurreição de Cristo. Hoje tenho, graças a Deus, muitas vitórias para testemunhar!</p>\n<p>É forte o testemunho de um jovem chinês que era viciado em bebidas alcóolicas e teve a libertação depois de ter uma visão, diz ele, que foi arrebatado em espírito e guiado por um anjo teve um passeio muito desagradável, foi nas profundeza da terra ou seja no inferno! Mesmo sendo em espírito diz ele parecia real. A sensação de dor e de tristeza, algo muito tenebroso, com gemidos misturados com vozes macabras pois é a casa de satanás com seus seguidores, potestades e principados dominadores das trevas e com certo poder neste mundo mas por pouco tempo. Este jovem conta em um documentário apavorado! o sofrimento das pessoas que fizeram suas escolhas erradas, e fala com propriedade de algo assustador e foi recomendado para que se propaga por toda terra sobre o que foi lhes mostrado, na verdade a origem de todas as drogas mas principalmente a bebida alcoólica foi apresentada a formula verdadeira seja bebida destilada ou fermentada seu teor principal o que envenena o corpo e a alma do ser humano, com poder destruidor este veneno é inserido nas bebidas alcoólicas invisivelmente para mente humana é (sangue de serpentes peçonhentas.) coloquei em parênteses a última frase! para destacar o mal que as bebidas alcoólicas trazem para o indivíduo, para família e toda sociedade. O poder de destruição muito grande no corpo e na alma! Isto é muito forte quando tomamos consciência do mal que pode causar algo sendo até mesmo lícito para a lei do homem. Sabemos de casos de pessoas que foram picadas por serpentes peçonhentas, muitas não sobreviveram e outras ficaram com sequelas, parte dos membros atrofiados e tecido do corpo no local da picada apodrecido devido o poder destruidor do veneno e mesmo tratado a tempo.</p>\n<p>Nossa obrigação é de orar, interceder, abraçar e informar aos dependentes químicos! que haja realmente uma autoajuda por parte do dependente e que ao se livrar deste terrível mal sejam somente dependentes; da misericórdia e do amor de Deus. E o melhor remédio para todos os males, não há nada melhor do que A Raiz! A Raiz que falo é a Raiz de Jessé, da linhagem, descendência de Davi! Jesus Cristo! Cristo é quem nos restituiu o &quot;domínio&quot;, Ele cura, liberta, batiza no Espirito Santo e Ele voltará buscar a sua noiva.</p>\n<p>Então Jesus chega no barco onde está Pedro com seus funcionários de pesca, e percebe que eles estavam lavando as redes para recolher e guardar. Mas não havia peixe no local. Pescaram a noite toda não deu nada! e Pedro era expert quando se tratava de pescaria, o que ele fazia de melhor era pescar, ou seja era um pescador nato, profissional ele pescava com mais de um barco, havia pessoas que trabalhavam com ele, ou para ele em fim comercializava o pescado. Então Pedro, não era nem um Amarildo, marinheiro de primeira viagem! Pedro sabia o que fazia se tratando de pesca, redes, barco e mar. Pega pra ti esta que vem quentinha do céu! se Deus falar contigo e não interessa por qual seja o meio de comunicação, e você percebeu que vem de Deus! obedeça! toma posse, acredite, aposte todas as fichas que Ele é fiel para cumprir Sua Palavra e suas Promessas. Jesus restituiu o domínio que havíamos perdido do primeiro homem Adão. Jesus, com a Sua simplicidade nas margens do mar da Galileia disse; &quot;vá para o outro lado e solte as redes..! &quot; quando Jesus libera esta Palavra, Ela vai carregada de poder! de Unção! Porque quando Jesus fala até os peixes ouvem tudo e todos obedecem no céus e na terra quando é dada uma ordem pelo Rei dos reis e Senhor dos senhores. Importante a obediência de Pedro, ele poderia questionar! Veja, Mestre eu conheço muito bem a área por aqui, e durante dia os peixes observam a rede com mais nitidez e por este lado não há correntezas e nem tem se observado cardumes de peixes! Mas Pedro, aquele que posteriormente disse; &quot;Tu és filho de Deus! &quot; a Jesus, e Jesus disse; &quot;tu falas não da carne mas falas do espirito!&quot; Pedro por mais fanfarrão, nervoso, precipitado, ele conheceu a <strong>mente de Deus</strong>! andou e foi discipulado por Jesus. Pedro não questiona nada, sobre a ordem de Jesus e torna, a jogar as redes pela fé na obediência e a Palavra diz; foi um barco e precisou segundo barco quase que naufragam de tanto peixe! quando obedecemos a Deus sempre vem mais do que pedimos ou imaginamos, vem com abundancia. Você deseja conhecer a <strong>Mente de Deus?</strong></p>\n<p>Então não fica duvidando e questionando por que isto? ou aquilo ou outro? E muitas vezes querendo ensinar a Deus como fazer as coisas! quando duvidamos, questionamos, murmuramos em outras palavras estamos afirmando que Deus não é capaz. Testemunhamos que Jesus é nosso Salvador único e suficiente, mas ao mesmo tempo, negamos que teríamos dúvidas no provedor! e constantemente nossa fé é abalada por setas lançadas pelo inimigo, colocando dúvidas em nossa mente! Mas quando colocamos nossa fé em ação, cremos num Deus invisível mas real, Poderoso, Sabe de todas as coisas, basta obedecer e crer, <strong>quem</strong> <strong>Crê obedece e quem obedece crê.</strong></p>\n<ul class=\"booklist\"><li>Esquecemos, ou talvez, nem saibamos que estamos aqui na terra mas somos cidadãos do céu! e o que acontece no céu é natural para Deus. Mas aqui na terra é o sobre natural é algo extraordinário, milagre então a terra é uma extensão do céu na verdade é uma colônia de um país chamado Céu! Onde, Jesus falou deste Reino do céus, e Jesus trousse a cultura do céu para terra a língua dos anjos é a língua do céu! mas o homem rejeitou a jesus. O homem, preferiu ficar na escravidão ou servidão ao maligno e em consequência viver na pobreza, na miséria e quando estamos separados de Deus, nos tornamos uma presa vulnerável ou seja presa fácil para o inimigo atacar. E ele não tem dó de ninguém! Não sabemos, que satanás vem pra matar, roubar e destruir. Como ele é sujo e astuto, acaba invertendo a ordem da citação Bíblica por Cristo, e escrita por (João) 10:10 primeiramente o enganador mente, ele rouba os sonhos, destrói todos os projetos, planos e por fim a pessoa que não está aliançada com Deus, que não está compromissada com o Senhor, sendo presa fácil, ela esta separada de Deus porque o pecado nos separa de Deus! eu repito; a palavra &quot;santo&quot; quer dizer separado das coisas mundanas, corruptivas que impedem a presença do altíssimo Rei dos reis. Então o indivíduo que outrora estava na presença de Deus, com a garantia de mais de oito mil promessas de Deus para sua vida e os propósitos de Deus ainda há serem cumpridos! Ao fazer uma escolha equivocada, acaba separando de Deus! a recompensa ou o preço do pecado é a morte! Ele fica em estado de profunda depressão! E a Palavra depressão sempre foi e nos dias atuais continua sendo a doença da alma! O que mais se ouve é; \\&quot;ninguém me ama\\&quot; \\&quot;não tenho valor\\&quot;. É aquela pessoa que passa a interpretar a si, o outro, o mundo e o futuro por um olhar negativo. A depressão é uma doença \\&quot;do corpo como um todo\\&quot;, que compromete seu corpo, humor e pensamento, por isso atinge a alma o psique. Ela afeta a forma como você se alimenta e dorme, como pensa.  \\</li><li>Sintomas da depressão; Tristeza persistente, ansiedade, pessimismo, Sentimentos de culpa, inutilidade, desamparo \\</li><li>Perda do interesse ou prazer em passatempos e atividades que anteriormente causavam prazer, incluindo a atividade sexual \\</li><li>Insônia, despertar matinal precoce ou sonolência excessiva \\</li><li>Perda de apetite e/ou de peso, ou excesso de apetite e ganho de peso, Diminuição da energia; fadiga, sensação de desânimo, Ideias de morte ou suicídio; tentativas de suicídio \\</li><li>Inquietação, dificuldade para concentrar-se, recordar e tomar decisões, sintomas físicos e persistentes que não respondem a tratamento; por exemplo: dor de cabeça, distúrbios digestivos e dor crônica.  Mesmo que Deus colocou psicólogos e psiquiatras que são usados na mão de Deus! mas, há casos que são espirituais e só o Psicólogo dos psicólogos Jesus Cristo, pode resolver a situação. Ou restituir a saúde! Vejamos a importância do trabalho de um pastor! De um servo de Deus! há muita gente sim, sofrendo com doenças espirituais, perturbados por ataques do maligno e não percebendo, como não conhecem a Mente de Deus! não tem o discernimento de espirito. Ficam uma vida toda consumindo medicamentos e chegam a ficar dependentes de certos medicamentos paliativos, apenas ameniza a dor, mas não há uma cura total ! Esta cura é somente Jesus realiza, o Espirito Santo que queima, exclui, expulsa através de um servo que está na legalidade, na oração e unção. Muitas vezes e infelizmente acontece, que a pessoa desiquilibrada tenta o suicídio! Satanás no comando da mente desta pessoa fala que ela pode dar um basta, um fim no problema, se livrar desta depressão que seria opressão do inimigo, estar na servidão debaixo do jugo de satanás.  A cangalha (ou <strong>jugo) é</strong> uma peça de madeira que ata os bois, através do canzil e brocha, assim fica firmado no animal para trabalhar na lavoura, dando-lhe direção quando estão puxando carroça, ou mesmo um arado e o animal faz tudo que seu dono mandar fazer em relação ao trabalho pesado e só recebe alimento e água. Pior que muitos depressivos não suportam a carga do jugo e realmente acabam tirando sua própria vida! e acabam perdendo de vez a salvação. Há uma controvérsia entre Teólogos que defendem a tese de que quando a pessoa se encontra neste estado avançado de profunda depressão! ela não responde mais por si própria e Deus terá misericórdia no julgamento! E condenação! Essa questão pertence a Deus, Ele é quem decidirá! É importante não dar brecha, espaço ao inimigo, porque ele não tem dó de ninguém é perverso, cruel e tirano. O Espirito Santo manda perguntar para você agora mesmo! você conheceu ou conhece alguém na situação depressiva? Esta pessoa perdeu a auto estima, e em nada tem prazer! nem mesmo quer se alimentar, então, uma missão a vista para você! vai até ela, que Deus vai te usar como psicólogo e servo com o dom da cura! e és enviado por Deus! depois de ouvir ela vomitar pra fora, tudo o que tens a dizer! seja na área financeira contas impagáveis, uma perda significante, de um ente querido! talvez uma doença incurável pela medicina humana, ou uma calúnia vinda de alguém que ela tanto ajudou no passado recente! Não sei, mas Deus me fala agora; servo meu há leitores com lágrimas nos olhos porque já passaram por estes sintomas e muitos estão em situações semelhantes a essas citadas! E sem uma saída, sem perspectiva! Amados..! a noticia boa é que no final do versículo 10 do capítulo 10 de (João) Palavra nos diz; &quot;Eu vim para que tenham vida e vida em abundancia.&quot; Necessitamos de tomar posse destas promessas do Reino de Deus! sim devo declarar isto é pra minha vida! é direito meu! herança minha! eu quero! eu desejo! eu me aproprio! estas bênçãos é para mim e para minha família! talvez esteja faltando ação, atitude de nossa parte. É por isso que o inimigo sendo atrevido, rouba o que é nosso, foi reconquistado lá na cruz. E o diabo não tem nada, somente um titulo; pai da mentira. Então devemos saquear o inferno e resgatar o que nos foi roubado e usufruir, comer o melhor desta terra a promessa de Isaias 19. É para os filos de Deus que andam na obediência, que ouvem e praticam a Palavra de Deus!</li></ul>\n<p>CONNECENDO A MENTE DE DEUS</p>"}, {"id": "parte-3", "num": "III", "title": "Parte III", "html": "<p>Jesus restituiu o domínio ao homem aqui na terra, mas para ser reestabelecido novamente este domínio individual é necessário sim ser aliançado com Deus, ser compromissado com as coisas de Deus, com a obra missionária, nosso Pai Celestial é apaixonado por almas. Ele se entristece e chora quando se perde uma alma para trevas. Próprio Deus diz;&quot; uma alma vale mais que o mundo&quot;. Quantas vezes você, e eu, falamos e pregamos sobre salvação! Mas será que já paramos para refletir o quanto somos importante para Deus! e não murmurar dizer que estás esquecido! que o pastor não te vê! Mas tenho me esforçado, com dedicação na obra! Mas parece ninguém ver! Lembram de Mefibosete? neto do rei Saul e filho de Jônatas e depois de seu pai e avô já haviam morridos na batalha e este remanescente da família do rei Saul, estando no esquecimento em Lo-debar, terra da miséria do ninguém, do esquecimento! A noticia boa, que o rei, manda te chamar para comer na mesa do Rei. &quot; Davi demonstra o Amor de Deus para com <strong>Mefibosete</strong> (2 Sm ) 9: 1 Disse Davi: Resta ainda alguém da casa de Saul, para que eu use de benevolência.&quot; Assim você é especial para Deus, você e eu valemos mais que toda riqueza existente aqui na terra. Não dá pra reclamar mais, vamos colocar nossa fé em ação. Quem manda chamar o herdeiro neto do rei Saul é o Rei de Israel há três mil anos atrás conhecido como; &quot;segundo o coração de Deus! &quot; e nada mais do que Rei Davi, este cara achou graças aos olhos de Deus! Este homem, assim como você e eu, humano com as mesmas paixões e limitações da carne humana, a diferença que ele conheceu a <strong>Mente de Deus.</strong> Mas como assim Pr. Amarildo? O Deus que nos fez é Pai! E inseriu todas as qualidades na fabricação! vem tudo no pacote já completo e as peças altamente genuína, original de fábrica, mas nós recusamos colocar em prática, usar os dons, as qualidades que fazem a diferença aqui na terra. Davi orava três vezes ao dia. E na lida de campo no pastoreio de ovelhas quando ainda menino lá nos campos mantinha um contato, uma intimidade permanente Deus! nem dava pelotas para seus irmãos quando fora rejeitado, excluído muitas vezes, humilhado pelos irmãos fortões que serviam o rei Saul, ele sendo de estatura menor e ruivo mesmo que a Bíblia diz que era um menino formoso, importante que ele atraia o olhar de Deus em tudo que fazia! enfrentou, lobos, leões e ursos famintos muitas vezes a unha e dentes para salvar uma ovelha e deixava as noventa e nove no aprisco. Eu que já fui pastor titular muitas vezes me pego a pensar! Quanto aquelas ovelhas dispersas! e sentindo a ausência de irmãos na igreja será que fui atrás todas vezes para passar um azeite em sua feridas, tirar os espinhos, arrancar os carrapichos por no ombro e trazer de volta ao aprisco? Eu poderia ter me dedicado muito mais! E desgarrando-se a ovelha do aprisco, já estaria nas unhas e dentes do predador. E a Palavra é enfática em dizer que todo sangue derramado da pessoa que nós deveríamos ter evangelizado, e não evangelizamos será cobrado em nossa mão. Davi, foi Rei ungido pelo profeta Saul, mas por mais de dez anos foi perseguido implacavelmente por ciúmes pelo rei Saul, mas Davi mesmo tendo oportunidade de ferir Saul ele não o fez, porque tinha o entendimento da Palavra, ele conhecia a Mente de Deus! foi &quot;rei, sacerdote e profeta,&quot; hoje lendo os seus 73 salmos, ficamos imaginando tamanha sabedoria! isto foi a três mil anos atrás. É a Mente de Deus sim, inspirando a Davi, Davi era alicerçado com Deus, tinha compromisso, sabia que a hora dele chegaria! que o propósito de Deus ia ser cumprido no tempo de Deus! e disse ele; não é licito que se toque em um ungido, mesmo Saul estando em pecados, desagradando a Deus. mesmo assim Davi sabia e respeitava princípios bíblicos! Que não era legal, correto, licito tocar num ungido, mesmo com tantos motivos.</p>\n<blockquote>Para conhecer a mente de Deus! eu devo ser ungido e não devo tocar em um ungido, não devo provocar contendas, falar mal, criticar um ungido. Amados vocês não imaginam como Deus está tratando comigo neste livro, parece até que é só para mim estas palavras! eu digito, com lágrimas nos olhos e fica até difícil de digitar, pois sou PCD, pessoa com deficiência. Deficiência visual; cegueira olho esquerdo e 40% de eficiência olho direito. Uso óculos com lente para o olho direito. Eu tinha a toxoplasmose! porque ela não vai mais prosseguir, em nome de Jesus! A toxoplasmose que estava em mim, dizem os oftalmologistas que os agentes estão em dormência, depois de várias cirurgias e aplicação de laser! Eu creio em um Deus que cura e já não há mais essa enfermidade em mim. Só para esclarecer melhor, tem situações que esta doença causada pelo protozoário agente transmissor da toxoplasmose acaba atacando na cabeça ou coração. A infecção em mim foi na visão, mas eu tinha esta enfermidade! e Deus me curou! mesmo assim, se torna embaçado minha visão e com auxilio de óculos consigo ler e escrever. Mas quando meu olho direito fica tomado de lágrimas eu sei, que Deus colocou em meu coração para escrever estre Livro e primeiramente para tratar comigo! Porque Ele me ama! me salvou doando Seu Filho Jesus Cristo, me deu olhos espirituais, uma família linda, que serve ao Senhor, minha esposa Marines é funcionária pública e envolvida na obra de Deus! e meus filhos Diego é advogado bem sucedido, professor na universidade federal e estadual de Direito ao consumidor e Direito constitucional, ministro de louvor na Igreja é temente a Deus! e tantas conquistas em seu trabalho mesmo sendo muito jovem! Tenho orgulho e satisfação em dizer atribuo a Deus toda sabedoria, sensibilidade, faro, percepção faz a diferença porque Deus está no controle de tudo. Minha nora Patrícia, esposa de Diego é psicóloga envolvida na obra missionária é filha dos Pastores Ademar e Ivanete de Góis, ambos titulares na IEQ Bairro Engenho Braun! onde eu sou pastor auxiliar, e a minha família membra, se alimenta da Palavra de Deus! E Bruno meu filho casula, que está bem maior do que o pai em estatura, está concluindo Engenharia Elétrica também envolvido na obra de Deus é tecladista da banda. Pensei que seria importante registrar e honrar minha família, meus pastores e mentores para que o amigo (a) leitor conhecesse um pouco melhor minha vida pessoal através desta obra. E é assim que Deus quer me usar, muitas vezes no trabalho, em sala de aula com filmes que fala do amor de Deus, é no louvor, Deus é tão bondoso permitiu que eu gravasse dois CDs e está por ai rodando, evangelizando é na pregação e na literatura mesmo com a minha simplicidade de me expressar eu estou confiante que o Espírito Santo que está me iluminando e soprando as palavras, sabemos que é Ele que pode transformar vidas! e muitas pessoas passarão a ter uma nova ótica de vida! e terão a mente e olhar de Cristo! cheio de amor, compaixão e desejo ardente no coração, de contribuir mais para o Reino de Deus, para o Plano de Salvação.</blockquote>\n<p>Falando do Reino de Deus! desejo comentar sobre uma palavra usada muito no cristianismo. A palavra; &quot;Logos&quot; !</p>\n<p>Em (João) 1.14 &quot; No princípio era o Verbo, e o Verbo estava com Deus, e <strong>o Verbo era Deus</strong>. ^2^ Ele estava no princípio com Deus. ^3^ Todas as coisas foram feitas por Ele&quot;.</p>\n<p>Percebemos que a palavra &quot;Logos &quot; no grego significa o verbo, a palavra escrita ou falada, razão. verbo\\&quot; ou &quot;palavra&quot;: *rhema* e *logos*. Elas têm significados ligeiramente diferentes. *Rhema* normalmente significa \\&quot;uma palavra falada, profetizada, revelada.\\&quot; Por exemplo, em (Lucas) 1:38, quando o anjo disse a Maria que ela seria a mãe do Filho de Deus, Maria respondeu: \\&quot;Aqui está a serva do Senhor; que se cumpra em mim conforme a tua palavra *\\[rhema\\]*\\&quot; É muito importante conhecermos os significados das palavras, e quando profetizarmos, determinarmos em nome de Jesus, realmente deve ser com muita fé e certeza que vai se cumprir, ou materializar o que você chamou para existência, vai passar a existir.</p>\n<p>Mas o que esta palavra grega &quot; logos&quot; tem em comum com o objetivo principal deste livro que é &quot;<strong>Conhecendo a Mente de Deus</strong>&quot;!</p>\n<p>Tudo começou na Antiga Mesopotâmia, hoje região do Iraque. Eu tenho ensinado aos meus alunos ainda no ensino fundamental o significado da palavra Mesopotâmia; cidade entre rios! E Deus me usa grandemente para falar! falo da geografia daquele lugar; Rio Eufrates e Rio Tigre! sabemos que o berço da civilização, a filosofia, e filósofos recitando nas ágoras ( praças de Atenas na Grécia) Conceitos de família, a ética moral, cidade estado, local também, onde adoravam muitos deuses (paganismo), a Democracia nasce neste lugar, ideologias, nomes, palavras sendo criadas e seu significados, teria então uma iniciação vinda de lá. pois quando se fala de cultura greco-romana é conhecimentos em arquivos, guardados pelos romanos quando ainda no expansionismo romano, invadiam cidades e nações tomavam os bens matérias e os escritos da época, também levavam jovens cativos para serem seus escravos, prestadores de serviço e a Bíblia esta rechiada desses acontecimentos.</p>\n<p>Antes de me aprofundar sobre o significado real da palavra &quot; Logos!,&quot; quero falar de algo que talvez nunca tenha passado pela sua brilhosa mente. Bem, hoje se olharmos no espelho, vamos ver esta figura maravilhosa, formosa feito a imagem e semelhança de Deus, esta camisa, com botões, esta calça, este calçado quem fabricou e quando foi o primeiro calçado? Ou as roupas quando foram fabricadas no mundo? Em que época? Aonde foi? Penso que primeira roupa foi extraída do couro do cordeirinho que Deus mesmo mostrou a Adão o preço da desobediência do pecado levaria a morte do cordeiro. Mas eu viajo para uma época bem posterior aos dias de Adão. E a três mil e quinhentos anos aproximadamente, isto, a quinhentos anos antes de Cristo na Antiga Grécia onde começou a cultura, as ideias se efloresceram, e com filosofias se tornando ideologias e hoje são apresentadas em forma de governo. <strong>Nós vivemos hoje influenciados de ideias de mortos!</strong></p>\n<p>Tudo o que usamos; roupas, calçados, carros, o que falamos, estudamos, a própria Bíblia inclusive foi escrita em mil e seiscentos anos , mil e quietos anos antes de Cristo e cem anos depois. O primeiro exemplar da Bíblia foi impresso por Johannes Gutenberg, e ficou conhecido como a Bíblia de 42 linhas, saiu da imprensa alemã de Maguncia em 23 de fevereiro de 1455. A invenção da imprensa foi por Gutenberg aperfeiçoada e possibilitou que milhões de pessoas no mundo pudesse ter a Bíblia. Mas Ela se renova todos os dias e aprendemos coma Santa Palavra a fazer escolhas acertadas, que é andar com Jesus Cristo, ser fiel até a morte, ou quando Cristo vier buscar sua noiva.</p>\n<p>Abriria um leque muito grande para comentar sobre tudo o que nós vemos, consumimos etc, falo de inventos, utensílios que foram feitos ou criados por pessoas que já morreram a centenas, milhares de anos. E nós hoje pouco criamos, inovamos é melhor comprar já vem pronto é só por no micro-ondas tudo prático, é triste mas é verdade tem criança já estudando! se perguntar a ela da onde vem o pão? o leite? pensariam muito pra responder. Mas o que é mais triste que se perguntar para adultos, onde está localizado o metro quadrado de terra de maior valor? Talvez, responderiam, campos de ouro! ou de pedra preciosas na África! poços de petróleo no Oriente Médio! Á, sim, o Aquífero Guarani , águas no subsolo no Sul do Brasil, na Região Oeste catarinense. Todos nós enganados se enganaríamos porque a maior riqueza existente infelizmente esta no cemitério, ali perto de sua casa sim. Porque ali há sonhos, empresas nunca abertas, cantores que nunca gravaram um CD, missionários que nunca ganharam uma alma pra Jesus, casamentos, destruídos, bilhões de pessoas que não realizaram seus sonhos. E ali foi enterrado bilionários mão de vaca, que nunca olharam para os mais necessitados e somente juntaram, mas não levaram nada junto, e junto a esses bilionárias foram bilhões de crianças que morreram de fome. Não preciso dizer mais nada, deixo você imaginar. É o hoje o agora que podemos fazer algo para obra de Deus.</p>\n<p>Se você está compreendendo o que está escrito neste livro, em seu discernimento, percebe que vem de Deus estas palavras e Ele se entristece muito quando um filho Seu se rebela, se nega de aceitar que o propósito de Deus seja cumprido em sua vida. Sabia que você também com seus sentimentos e desejo de conhecer a Mente de Deus já está conhecendo pela fé e ao se envolver na obra, assim como você vai lendo este livro e mergulhando no mundo espiritual, é como que se fosse juntar as peças do quebra cabeça e devagarinho é que vamos tendo a compreensão. Sempre lembrando que é o Espirito Santo que nos proporciona este saber e a Ele toda honra e toda glória.</p>\n<p>&quot;Logos&quot;! no grego significa o verbo, a palavra escrita ou falada, razão. ´</p>\n<p>No cristianismo a palavra logos é muito citada referindo-se da pessoa de Jesus Cristo, a Bíblia foi escrita primeiramente em Hebraico, Grego e Romano. A Palavra é clara em dizer que o Verbo era Deus e &quot; O Verbo se fez carne e habitou entre nós (João) 1.14.&quot; quando se trata O Verbo, A Palavra, A Ideia, A Razão de tudo. É a mente de Deus sendo revelada, a ideia de Deus sendo colocada em prática, aqui está o segredo &quot;<strong>Jesus Cristo é a Ideia Expressa de Deus</strong>&quot;, foi anunciado em todo tempo, antes de Sua vinda no Antigo Testamento, depois no Novo Testamento o mundo viu Ele nascer, crescer, realizar Seu Ministério, morrer e ressuscitar. Somente após ressuscitar a Bíblia nos diz; que mais de 500 pessoas viram! O Cristo Ressurreto, todas estas pessoas contemplaram o rosto , os olhos brilhantes que emana fogo, este povo privilegiados tocaram em Cristo, comeram com Cristo e tiveram a alegria de conhecer e ver a &quot;Ideia expressa do Pai&quot;, conheceram a Mente de Deus, Jesus é a Ideia o &quot;Querer de Deus&quot;! Partindo deste entendimento, ficará mais fácil de conhecer a Mente de Deus e Seu Plano de Salvação. Jesus falou tanto deste Novo Reino! Porque Ele falava com propriedade do que é Seu, de onde Ele veio, das coisas do Pai. O Reino de Deus não é uma simples condição no coração dos imitadores de Cristo (cristãos)! A Palavra de Deus fala de localização exata deste Reino. Quando se refere a Ele como &quot;O REINO DOS CÉUS&quot;. Mostra que o Reino é um Governo que está no céu, podemos verificar em (M) 4;17. O Reino de Deus tem sim Governantes, Leis; A Bíblia é a (Constituição deste Reino), este Reino, tem súditos, e a missão de estabelecer a vontade de Deus no céu e na terra. ( M) 6.10) e a Revelação ( Apocalipse) 5.10.</p>\n<p>O Governo ou Reino de Deus apresentado por Jesus</p>\n<p>&quot;governará sobre todos, os povos, grupos, nações e línguas da terra.&quot; (Daniel ) 7.13, Essa autoridade lhe foi dada não por seus súditos mas pelo próprio Deus. (Salmo) 2;4-6. Aprendo que no sistema de governo onde há um rei absoluto, é diferente do sistema de governo como o atual do Brasil. Onde o sistema é democrático! na Democracia é o povo quem escolhe seu Presidente, no exercício de cidadania com seu voto. E diga-se de passagem que nunca está satisfeito na escolha de seu representante legal no cargo majoritário, eleito a votos no Executivo o Presidente da República. Já um Rei não é eleito pelo povo! Ele herda este poder, e seu poder é absoluto! Em 1824 foi encomendada por D. Pedro I, e elaborada pela constituinte, a primeira constituição! nesse sistema de Império no Brasil havia quatro poderes! Executivo, Legislativo, Judiciário e Moderador. O Poder Moderador da o poder absoluto ao rei.</p>\n<p>Jesus disse; que seus fiéis apóstolos se juntariam a Ele no Reino dos céus para serem reis (Lucas) 22.28-30. A palavra Reino, ou boas novas podem e devem influenciar nosso coração (Mt) 13.19; 24.14. Jesus falava muito com os fariseus, grupo de lideres religiosos que eram inimigos dEle, e planejavam matá-lo. (Mt) 12.14. O Reino era uma condição muito presente no coração orgulhoso daquele povo. O Mestre ensinava a respeito do Reino de Deus e dizia; que Sua missão aqui na terra seria, declarar as Boas Novas do Reino de Deus! isto é proclamar o Evangelho &quot;e porque Fui enviado para isso! &quot; ( Lucas) 4;43. E vejamos, tem plano de trabalho, nosso Rei é muito organizado e apresenta quatro tópicos importantes de Seus governo. 1ª Jesus não foi designado Rei, Jesus disse sem rodeios que era sim o predito &quot;Messias&quot;! O anunciado!(João) 4.25. Mostrou também que era o Rei que o Profeta Daniel havia observado em visão. Nosso Salvador, disse aos seus discípulos, que um dia Ele se assentaria &quot; num glorioso trono&quot;. E que eles da mesma forma se sentariam em tronos. (Mt) 19.28. e referiu-se a este grupo de governantes como seu pequeno rebanho, mas disse também que tinha outras ovelhas que não faziam partes deste grupo.(Lucas) 12;32 e (João )10.16.</p>\n<p>2ª O Reino de Deus promoveria a verdadeira justiça; O Reino acabaria com a maior das injustiças por santificar, ou tornar santo o nome de Jeová nosso Deus, e livrá-lo de todo o vitupério que Satanás, de qualquer afronta do maligno. Que tem lançado sobre ele desde a rebelião no Éden! (Mt) 6;9-10. Jesus, diariamente mostrava imparcialidade por ensinar homens e mulheres, ricos e pobres sem distinção, sem preconceitos, sabendo que havia na cultura da época muitos impedimentos e crianças e mulheres eram consideradas inferiores, mas Jesus quebra estes preconceitos. Embora Sua missão era ensinar em especial os israelitas, Ele também ajudou samaritanos e gentios, ou não judeus. Bem ao contrário dos lideres religiosos da época, Jesus demostrou sua pureza seu amor e não demonstrou nenhum traço de preconceito ou favoritismo.</p>\n<p>3ª disse também em Seu Plano que; O Reino de Deus não faria parte deste mundo. Cristo viveu num momento muito conturbado, alhas parecendo com os dias de hoje, onde a violência está exposta em todos os lugares, a ganancia, o poder e os nossos representantes legais já citados; no Legislativo, no Executivo, até mesmo no Judiciário! Hoje, no Brasil, há uma crise institucional! Onde, deveriam trabalhar em harmonia os três poderes mesmo independentes , para o bem estar do cidadão! mas esta sendo uma disputa de poder.</p>\n<p>Jesus então também vivendo nesse clima tenso, na Antiga Palestina, e a Palestina estava sob domínio de uma potência estrangeira (Roma). Mas Ele resistiu a tentativa de certas pessoas de envolve-lo em assuntos políticos de seus dias. (João) 6.14-15 Jesus disse a um político &quot;Meu Reino não faz parte deste mundo.&quot; (João) 18.36 e a seus seguidores Ele disse; &quot;Não fazeis parte do mundo (João) 15.19 Jesus não permitiria que usassem armas de guerra, nem mesmo para defende-lo (Mt) 26.51-52. Jesus realizava missões, viajava de aldeia a aldeia, pregando, declarando as Boas Novas do Reino de Deus (Lucas) 8.1.</p>\n<p>4ª O Governo de Jesus Cristo seria baseado no amor; a promessa de Cristo é revigorar as pessoas, aliviar os seus fardos (Mt) 11.28-30. Ele cumpriu Sua palavra. Deu concelhos amorosos e práticos sobre lidar coma a ansiedade, melhorar relacionamentos, combater o materialismo e &quot;hoje vivemos neste sistema capitalista!&quot; e ensinou como encontrar a felicidade. Nos cap. 5 e 7 de (Mateus). O Mestre por ser amoroso, pessoas de todas as classes sociais o achavam acessível. Até os mais oprimidos chegavam a Ele na certeza que seria tratados com bondade e dignidade. Que maravilhoso Este governante Jesus Cristo! Jesus realizou muitos milagres mostrando que no Reino de Deus não há enfermidades, nem dor.</p>\n<p>‎</p>\n<p>No Novo Testamento, contém mais de cem referências ao Reino. Jesus passou os três anos e meio de Seu Ministério pregando o Evangelho do Reino ( Mt) 4.23. Tudo o que Ele disse e fez neste período da Sua vida, estava relacionado ao Reino. Narrativas paralelas mostram Jesus falando sobre O Reino de Deus;( Mt ) cita, 33 vezes dizendo; &quot;O Reino dos Céus&quot;. Jesus reforça lindamente a explicação diante de Pilatos a respeito de Seu Reino quando disse; &quot; O meu Reino não é deste mundo&quot;(João) 18;36. Positivamente o Reino veio do céu, Seu governo, Suas leis, Seu modo de vida, a cultura do céu, os pensamentos que vem da mente do Rei, as adorações a um Rei digno de toda adoração e louvor, toda honra e toda glória pertencem a Este Rei e a grande nação a qual os santos são os cidadãos está agora centrada no céu ( Filipenses) 3;20 A partir de nossa crença em olhar para o céu como nosso lar, nossa pátria! Posso afirmar que estamos conhecendo e conectados com a Mente de Deus.</p>\n<p>É importante saber e entender, que todo reino tem também sua Eclésia! seus Senadores, e tudo o que o Rei determina, ou pensa torna-se lei! os senadores são representantes legais do rei, ao mesmo tempo representam os súditos, fazendo assim um elo de ligação. Eles, os senadores tem uma missão importantíssima de levar aos súditos os planos, as ideias do rei e estas ideias se tornam leis! dando direitos e deveres aos súditos ou servos. E estas leis estão lavradas em um testamento. Porque até mesmo quando em vida, é realizado uma operação de doação de um bem material, é lançado em um documento dados pessoais do doador e para quem está sendo agraciado o bem(testamento). Assim a Bíblia Sagrada, é tanto no Antigo, quanto no Novo Testamento, está registrado em cartório nossa herança, nossos direitos e deveres da cidadania do céu. Você e eu, estamos aqui na terra, mas somos cidadãos do céus! Você crer nessa verdade? Sabemos que no Brasil a história nos relata, já foi governado por Reis! na colonização a partir de 1500, pertencíamos a Coroa de Portugal, e aqui era uma colônia de Portugal, onde aprendemos a falar a língua portuguesa, toda cultura europeia foi inserida no Brasil, a religião, e, alhas, veio muitas religiões, costumes, tradições e muitas são reprovadas pela Palavra de Deus! em fim, religiões além do catolicismo que foi a mais forte inserida pelos jesuítas, veio se instalar também seitas e heresias, através dos escravos e imigrantes, a, Umbanda, Quimbanda, Candomblé, Pensamentos Filosóficos etc. Posteriormente tivemos visitas de pastores estrangeiros e a implantação de Igrejas Evangélicas, como Assembleia de Deus, Igreja do Evangelho Quadrangular, a IEQ no Brasil foi um trabalho de missão vindo do exterior e veio no ano de 1945, quando Harold William foi nomeado pelo gabinete de missões e enviado à Bolívia. No ano seguinte, foi, enfim, enviado ao Brasil. Chegando aqui, morou na cidade de Poços de Caldas, enquanto aprendia o idioma e ensinava inglês. Viajou para a cidade de São João da Boa Vista em 1950, quando fundou a Igreja do Evangelho Quadrangular com seu templo próprio no ano seguinte, a qual era originalmente denominada Evangélica do Brasil. Na verdade a IEQ foi fundada em 1922 por Aimee Semple McPherson, mas só chegou ao Brasil em 15 de novembro de 1951 sendo implantada pelo missionário Harold Edwin Williams. Nesses 62 anos de atuação o ministério cresceu e se solidificou, sendo hoje uma das maiores denominações do Brasil. No total são mais de 3 milhões de membros espalhados em todas as regiões do país, e representada em mais de 100 países. Também a Luterana, Presbiteriana e outras tantas denominações tiveram e continuam tendo uma contribuição muito especial na evangelização aqui no Brasil. Na colonização do Brasil havia nativos, índios, caboclos e com a vinda de escravos, imigrantes de várias nações, veio também outras culturas e várias etnias miscigenando nosso povo sendo assim o que vemos hoje; seres humanos lindos e inteligentes. Mas Deus nos dá a liberdade de escolha na adoração! Deus não divide Sua glória com ninguém! Ele se importa que o adoramos em espirito e verdade. O que eu quero dizer é! Existem muitas religiões! (religião; religar) e todos dizem que adoram o mesmo Deus! e que todos os caminhos chegarão a Deus! Mas, é ali que há o engano! Somente através de Jesus Cristo é que chegamos ao Pai! (Timóteo ) 2.5 &quot; Há somente um Deus, e um Mediador entre Deus e os homens e o nome dEle é Jesus Cristo&quot;. E através de Cristo que somos os Senadores, os embaixadores do Rei, atalaias, somos portadores dos Planos, Projetos, da ideia de Deus. Agora estamos entendendo melhor porque é interessante não somente ver o agir da mão de Deus, mas conhecer a Mente de Deus! e poder ser porta-vos de Deus! ser atalaia de Deus! ser a ideia expressa de Deus! Jesus disse; farão milagres ainda maiores do que os meus. Então, &quot;Eclésia é um grupo seleto de lideres aprovados de alta confiança de um rei.&quot; Na época de Cristo, Havia um espaço físico específico, onde se reunia a Eclésia ( senadores), para os súditos ouvirem as ideias do rei, e par fazer emendas na constituição e era comum chamar este lugar também de Eclésia. Penso que você está entendendo! Então redobre sua atenção! Nas comunidades organizadas, hoje utilizava-se também deste espaço físico para a comunidade desenvolver suas tarefas, como, cultos ecumênicos, teatros, recreação em fim para realização de grandes eventos e cerimonias locais. O que seria hoje uma espécie de Salão Comunitário. Ainda na época de Cristo também havia as sinagogas, kailar ou igreja para nós nos dias atuais seria um espaço físico separado para os separados, local de aperfeiçoamento dos santos onde se reúne pessoas com objetivo de ter intimidade com Deus, ouvir a Palavra e a reflexão do pastor ou de seu líder religioso e para os cristãos participar da Santa Ceia e agradecer, contribuir, pedir, interceder e adorar ao Rei dos reis e é denominada igreja.</p>\n<p>Quando nos abrimos nosso coração para o Espírito Santo fazer morada! Realmente que somos templo, casa, moradia do Espirito Santo. É o Espírito de Deus ligado em nós em sintonia com Seus pensamentos, Sua mente, Suas promessas serão nossas promessas, e Seus sonhos nossos sonhos! e tudo se transforma para o melhor de Deus em nossas vidas. Porque tudo é para que o nome dEle seja glorificado. E tudo se torna prazeroso é feito com amor, as atitudes do bom cristão são notáveis, porque nelas há a presença de Deus e cria-se uma atmosfera de paz ao redor deste cristão e as pessoas que não conhecem a Palavra dizem este cara é iluminado, esta mulher é iluminada ela tem algo especial, quero ficar perto desta pessoa me sinto muito bem toda vez que me aproximo dela! ou quando falo com esta pessoa vejo o rosto dela brilhar e é Jesus que está brilhando, quando o crente é justo reflete o brilho do Salvador! nos dando sabedoria para fazer a diferença neste mundo conturbado, carregado de violência, corrupção, egoísmo e bilhões de almas gemendo nas garras de satanás sendo enganadas todos os dias e carecem de nossa intercessão, nossa solidariedade o nosso carinho e o nosso abraço.</p>\n<p>Quando entendemos verdadeiramente o Plano de Salvação do Reino de Deus, este projeto maravilhoso passa a ter mais um atalaia, se juntando no grande exército onde Jesus Cristo é o General nosso comandante e marcharemos na obediência em frente para um bom combate. É somente através de Cristo pela Sua morte e ressurreição que somos legalmente herdeiros das mais de oito mil promessas é pela Graça; favor imerecido. O desejo de Deus, é que toda criatura feita por Ele, mas que está afastada da presença de Deus, já pelo pecado original estamos destituídos, mas em Cristo Seu Filho amado tornaremos ao Pai como filhos herdeiros das promessas, é necessário sim para o regresso, que haja o arrependimento dos pecados, crer e ser batizado, este crer! É aceitar verdadeiramente Jesus como único e suficiente Salvador para sua vida. Deve ser uma entrega total, uma doação de corpo e alma, colocar a vida no centro da vontade de Deus, isto significa estar aliançado, compromissado com a obra do Senhor é proclamar o Reino de Deus.</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-4", "num": "IV", "title": "Parte IV", "html": "<p>Mesmo reconhecendo que somos fracos, pecadores, Deus conhece nossa condição, mesmo assim Ele ama o pecador e odeia o pecado! se você está sentindo este desejo ardente em seu coração de conhecer mais de Deus! é porque Deus já está trabalhando, lapidando para ser usado em Sua obra, mas eu gostaria que você entendesse! Deus nos dá o trabalho e as ferramentas! Ele só nos dá uma missão, que realmente podemos realizar. Este Deus que falo tanto! e nunca irei me cansar de falar de Seu poder, Ele não vence o inimigo no segundo tempo ou na prorrogação com bola na trave e entra na goleira quase parando, não! Este Deus é O El-shaddai Deus Forte e Poderoso, Único! Pode todas as coisas, Ele quer derramar do Seu poder, da Sua unção neste vaso que é você! se prepare, para receber! você vai fazer a diferença sim, preste atenção se você crer de alma e coração neste Deus, você então não vai ser mais a mesma pessoa! a partir de hoje! Não será apenas mais um mensageiro! Também, não será apenas mais um membro de sua igreja!! Ou, mais um obreiro, pastor, Ministros de sua denominação! No exército de Deus há muitos guerreiros, mas Ele não precisa de multidões para guerrear contra o inimigo! mas Deus está chamando um homem! uma mulher de Deus, que estejam dispostos a servir, a obedecer ao General dos generais, Jesus Cristo. Você é escolhido (a) para ser combatente; para ser Senador, (a Eclésia) o embaixador, és o representante legal de Deus aqui na terra! E revestido de poder! com autoridade e domínio vai dar ordem a potestades e principados eles fugirão, porque não resistirão o poder de fogo que Deus colocará em sua boca! é através de sua fé e suas palavras n
