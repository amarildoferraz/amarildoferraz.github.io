o nome de Jesus! Aquele que era Deus, e esvaziou-se de sua gloria e se fez homem! porem, sem pecado algum! não foi encontrado pecados nEle! Eu gostaria que você lesse! se possível em voz alta e sem interrupção como Ele Foi, e como É chamado aquele que te ama muito! Vamos abrir a boca! Jesus quer ouvir a sua vós maravilhosa! E o inimigo não quer que você pronuncie este Santo nome; milhares de anos foi, é, e será pronunciado e exaltado; O Messias, o Cordeiro Santo, o Autor da vida, Consumador da Fé, Deus Bendito, Jesus de Nazaré, Homem de dores, Justiça nossa, Libertador, luz verdadeira, Lírio dos vales, Luz do mundo, Rei e Juiz de Israel, O Escolhido de Deus, Leão da Tribo de Judá, Pão da vida, Poderoso Salvador, Primogênito, Princípio da criação de Deus, Raiz de Davi, Redentor, Rei dos Judeus, Rei dos séculos, , Renovo, Resplandecente Estrela da Manhã, Rocha, Pedra Angular, Santo, Salvador, Semente da mulher, Senhor da Glória, Senhor de todos, Senhor Deus, Sol da Justiça, Testemunha Fiel, Único, Verbo de Deus, Verdade, O Caminho, A Vida, Videira Verdadeira, Zeloso, Seu nome acima de todo nome, para que o nome de Jesus se dobre todo o joelho, no céus e na terra e de baixo da terra e toda língua confesse que Jesus Cristo é Senhor, para glória de Deus Pai. (Filipenses) 2;9-11. Será que você pode dar um &quot;Glória a Deus&quot; bem forte ai onde você está!</p>\n<p>O mundo busca constantemente uma solução para seus problemas! um libertador, um governante que tenha uma varinha mágica e num toque de mágica (a palavra mágica pertence ao inimigo) resolveria todas as adversidades atuais. No Reino de Deus não há espaço para magia. É o poder Santo de Deus governando, mas é curioso que o povo nunca esteve satisfeitos, na época dos profetas e juízes o povo clamava por um rei, e tiveram muitos reis! Rei Saul reinou por quatro décadas, Davi mais quarenta anos, seu filho Salomão mais quarenta anos, e filho de Salomão Roboão, reinou por 17 anos e foi no período de 932 a.C a 916 a.C. E foram dez reis em Israel e Judá que fizeram reto aos olhos de Deus. O mundo busca várias maneiras, estratégias, sistemas de governo que seria o menos ruim! É normal trocar de governo, e as coisas cada vez ficam piores! Ou seja, troca o chicoteador, mas o chicote é o mesmo! e dele chicote no lombo do povo! A democracia é o sistema de governo menos ruim! E o berço da democracia é a Grécia, que hoje infelizmente está falida! sem créditos, e com dívida nos dias atuais, com mais de 271 bilhões de euros para bancos da União Europeia. Grande números de desempregados! Quando a mídia retrata documentários sobre refugiados é este povo explorado, fugindo, sem perspectivas. Repito; sempre foi terra de muito paganismo! Preferem sofrer e morrer na miséria servindo deuses, mas não se curvam, para o verdadeiro Deus Jesus Cristo!</p>\n<p>O mundo viu, o terror do nazismo! Um líder totalmente desequilibrado, escravo de satanás! O <strong>Holocausto,</strong>   foi uma prática de perseguição política, étnica, religiosa e sexual estabelecida durante os anos de governo nazista de Adolf <strong>Hitler</strong> e extermina, dizima mais seis milhões de judeus! Tortura e humilha! É possível ver a tortura e a crueldade de um homem submisso e obediente a satanás! Em documentários ainda pode-se ver os locais onde ficavam aprisionadas as crianças, mulheres, idosos. E os calçados de crianças todos amontoados na frente dos portões das câmaras de gás falam por si, o terror que essas almas passaram os sentimentos de medo enfileirados um por vez, tirando seu calçado e jogando-os formando uma montanha de calçados junto aos de seus familiares e posteriormente seguindo ao destino final fornalhas! O fascismo na Itália com Musseline, de mafioso se torna um líder e o povo pensa ser bem representados, mas um dia teve seu fim. Outro carrasco comunista, Josef Stalin na antiga União Soviética não deu certo! Hoje Rússia socialista de Putin. Mas ainda Stalin foi de 1927 a 1953 governo totalmente totalitário. E teve o apoio da Rússia também na implantação do comunismo com Fidel Castro em Cuba! Esse revolucionário que vem a falecer neste final de ano, e por 49 anos no comando da ditadura. Sendo que houve muito massacre, pessoas inocentes que foram assassinada, torturadas e uma vida condicionada a um sistema de governo que parou no tempo, há um senário de tristeza, construções muito antigas necessitando de reformas, pinturas novas! se vê hoje carros sucateados, a ausência da tecnologia da inovação! em fim um povo esquecido e se eu pudesse dar um novo nome a esta nação eu chamaria de &quot;Terra de lúdebar&quot; lugar do esquecimento!</p>\n<p>Retornamos ao Brasil! Há poucos anos, que temos, como sistema de governo a Democracia! E passamos também, por momentos difíceis. Foi apenas um breve comentário de alguns regimes políticos, sistemas de governo experimentados no mundo, onde há povos clamando por um libertador! Mas acabou não dando certo! E percebemos que, o que Jesus vivia há dois mil anos atrás! e comparando aos últimos cem anos! nada mudou! E Jesus apresentou aquele povo, um Reino diferente. Totalmente oposto, do tradicional, e eles rejeitaram à Jesus e ao Seu Plano. Hoje, Jesus novamente apresenta este Novo Reino! Como assim apresenta? através de mim, de você, que somos bocas de Deus, senadores do Rei! Estamos incumbidos de proclamar o melhor Sistema de Governo &quot; O REINO DO CÉUS &quot;! Este Reino, que na área da saúde não há fila, nem falta de médicos, não há falta de medicamentos! É infinitamente melhor porque, nesse Reino nem há enfermidades! Nem precisa de medicamentos onde o Rei é Ministro da saúde e Médico dos médicos! Você conhece o Dr. Jeová Rafá? Jesus nos apresenta este Plano de Saúde que faz parte do Reino do Céus! Mas não cremos porque nossa mente é limitada as coisas desse mundo e buscamos socorro de homens mortais que a sabedoria quem possuem vem de Deus! e os problemas que vemos todos os dias de falta de hospitais, filas enormes aguardando dias, semanas, meses e até anos para uma consulta, pessoas morrendo na maca por não ter médicos, enfermeiros suficientes! A Falta de equipamentos, órgãos para implantes! &quot; Jesus deu aqui na terra uma demonstração de como é realizado implantes no céu! Foi quando Pedro cortou a orelha de um soldado que pretendia prender a Jesus, e Ele colou a orelha e imediatamente foi restituída&quot;! Essas necessidades no Reino de Deus não haverá! Porque Deus sempre Foi, É e Será Perfeito! O QUE O Senhor faz é com perfeição, realiza a obra por completo! Seu Plano de Salvação e vida eterna! estava organizado e perfeitamente planejado antes da vinda de Jesus a terra! Já está tudo Nosso Médico, Aquele que Cura, Batiza no Espirito Santo, Salva e que Voltará para buscar Sua igreja!</p>\n<p>Jesus deu a mostra como será, ou oque o Reino de Deus fará para humanidade; Ele não se limitou a mostrar e prometer o que o Reino de Deus fará! e faz hoje para aquele que crer, Jesus realizou muitas curas milagrosas demonstrando em uma escala pequena o que Ele realizará no futuro numa escala bem maior! durante o domínio de Seu Reino. Jesus percorreu toda a Galileia , ensinando nas Sinagogas deles e pregando as Boas Novas do Reino, e curando toda sorte de moléstias e toda sorte de enfermidades entre o povo (Mt)4:23. Jesus abriu os olhos de quem nasceu cego (João) 9;1-7. Com um toque suave Jesus curou dez leprosos de uma vez! Vejamos a ingratidão, e somente um retornou para agradecer! os surdos ouviram, os mudos falaram ( Lc ) 7;11-15. 8:41-55.</p>\n<p>Jesus que é vida, toda vez que se deparava com a morte Ele ordenava o espirito de morte e a pessoa ressuscitava! Onde será que Jesus fez medicina? Ele disse; Eu estou no Pai e o Pai está em Mim! Jesus é a &quot;Ideia expressa de Deus&quot;, é Deus conosco ( Emanoel), mesmo andando na terra normal como humano sentindo as mesmas dores, os mesmos sentimentos e paixões, porém sem pecado. Ele nos deixa ensinamentos que podemos sim conhecer a Mente de Deus. Amados! Eu gostaria muito que vocês adquirissem também meu primeiro Livro &quot; Desvendando Costumes e Tradições&quot;, o segundo é este &quot; Conhecendo a Mente de Deus&quot;, mas o terceiro você esta convocado (a) á ler porque Deus fala muito comigo ainda na confecção deste Livro sobre o próximo que fala do quanto nós pecadores necessitamos da Graça de Jesus Cristo e o título será &quot; Sem Jesus o que seria da minha vida!&quot; os três livros é fruto de muitas orações, jejum e sabedoria fluente do Espirito Santo e muita pesquisa de fontes iluminadas já usadas por Deus em outras épocas conjecturando com os dias atuais em uma linguagem simples mas compreensiva e com objetivo único de ganhar almas para o Reino de Deus! todas as pessoas precisam saber quem é O Rei dos Reis e aceitar Jesus Cristo como seu senhor e Salvador de sua vida. Nem mesmo a morte conseguiu deter nosso Rei designado de Deus. Registros nos mostram por três ocasiões Jesus ressuscita e restaura vida de pessoas que haviam morrido. O filho único de uma viúva ( porque não citam o nome do menino e nem da viúva? Repito, a cultura preconceituosa consideravam a mulheres e crianças; como inferiores. Jesus vem pra quebrar este paradigma de preconceito, machismo). Foi Talita que havia morrido, filha de alguém importante essa tem nome! e Jesus restaura sua vida. Mas é importante que saibamos; Cristo convidou Pedro, João, Tiago e pai de Talita Jairo. Que se retiraram-se do meio dos incrédulos e foram até a casa de Talita. Muitas vezes milagres não acontecem, por estarmos entre os incrédulos e ao invés de intercederem pela cura eles oferecem resistência, e a incredulidade impede a realização de milagres. Também Jesus ressuscita à Lazaro seu amigo! Vamos conjecturar para os dias de hoje, com tantas tecnologias disponíveis e a medicina evoluída, se apresentarmos uma pessoa a um medico, sendo depois de quatro dias que ela esteja morta. Ele fará um pedido para nós o quanto antes, providenciar o sepultamento que esta em processo adiantado de putrefação. Mas O Médico dos médicos, isto aproximadamente 2016 anos atrás, primeiro Ele nos ensina a crer no milagre, e Ele agradece a Fonte inesgotável de amor, de milagres! E Jesus levanta as mãos e diz; obrigado &quot;Aba&quot; ! a intimidade com Deus, penso que deve ter falado mais algumas palavras com O Criador, e que talvez não fosse interessante para nós hoje e é por isso que não foi registrado na Bíblia! Mas um dia saberemos todos os detalhes da fala do Filho com o Pai! Era e é um relacionamento amoroso de cumplicidade. É eu que penso assim e poderia em Seu diálogo ter dito; Papaizinho ( Aba ) vamos mostrar um pouquinho do sistema de saúde do Reino dos Céus! Para estes incrédulos! A oração modelo que Ele nos ensinou quando se dirigíssemos ao Pai! foi; seja feito Sua vontade, aqui na terra como céu! vem a nós o Vosso Reino! Ainda na ressurreição de seu amigo Lazaro, Ele levanta as mãos e agradece! Ato de nobreza que nos ensina é a gratidão! Obrigado Senhor por aquilo que ainda não aconteceu aos olhos humanos, mas sei do Seu Poder e do Seu amor! E Jesus olha para tumba e ordena ao espirito de morte! aquela matéria que não tinha mais vida, a partir daquele momento passava a ter vida! Repito, estes três que Jesus ressuscitou tinham propósitos de Deus a serem cumprido! e quem tem propósito, e promessas de Deus para sua vida não pode morrer! E como já disse; na cidade de Chipre Lazaro foi pastor. Que belo testemunho teria o pastor Lazaro para contar para sua igreja! Vejamos estes três, que Jesus ressuscitou é obvio que posteriormente morreram. E novamente eu creio que em vida aprenderam com Jesus sobre o Plano de Salvação e tiveram a salvação porque ela é individual. E hoje ainda, são lembrados nas pregações. Assim Jesus no arrebatamento, primeiro ressuscitará todos que morreram em Cristo, para a vida eterna e para sempre juntos ao Rei dos reis. É maravilhoso o futuro que nos aguarda! É para os súditos fieis do Reino de Deus. Jesus predisse por meio do Apostolo João; &quot; Eis que atenda de Deus esta com a humanidade, e Ele residirá com eles e eles serão Seus povos. É o Próprio Deus que estará com eles, com os salvos. E enxugará de seus olhos toda lágrima, e não haverá mais morte, nem haverá mais pranto, nem clamor, nem dor, as coisas anteriores já passaram&quot; (Apocalipse ) 1.1 21.3-4 Na mente de Deus esta, este dia em que se verá um mundo sem lágrimas de tristeza! sem dor e sem morte! e neste tempo a oração, a adoração ao Pai será recebida como suave perfume em Suas narinas! e Ele se alegrará e toda glória irá resplandecer sobre seus súditos e louvaremos assim; mais perto eu quero estar\\... meu Deus de Ti. Jesus deixou bem claro sobre Sua volta e Seu domínio régio e coincidiria com um período especifico e Ele chamou de Sua &quot; presença&quot;, Jesus deu uma profecia detalhada para indicar quando Sua presença em poder régio teria inicio. E este tempo seria marcado por problemas globais, como guerras, terremotos, fomes, doença corrupção (Mt) 24.3 7-12 e (Lc )21.10-11. Essas e outras tantas características preditas por Jesus ficaram evidentes especialmente a partir de 1914, o ano em que começou a primeira guerra mundial, e os dias de hoje o mundo está em conflito as grandes potencias estão prestes a acionar bombas atômicas e em minutos a terra desaparece. Governantes sendo eleitos sem o mínimo de sentimentos humano, intolerantes, mostrando sua imponência, seu poderio bélico, o capitalismo predomina e dissemina para outras Nações e o Brasil como outros países copiando e cada vez mais o coração do homem vem a esfriar e o temor a Deus acabou. Amados Estados Unidos foi colonizado por Cristãos evangélicos e prosperou tanto se tornando uma grande se não a maior nação! e hoje imponente, mas o crescimento do paganismo é grande, a maçonaria o satanismo, o espiritismo e pensamentos filosóficos crescem espantosamente, retiraram a Bíblia das escolas, na Casa Branca também foi retirada, e quando aconteceu os ataques terroristas derrubando as Torres Gemias de onze de setembro! foi perguntado á filha de Billi Graham a Anni Graham; por que Deus se afastou da América do Norte? ela respondeu sem pensar muito; Deus não se afastou! Deus não se afasta do pecador! O Pai ama o pecador arrependido e o que Ele odeia é o pecado e mesmo no ato do pecado, Ele continua sendo Deus Soberano! é obvio que Se entristece ao permitir que façamos escolhas erradas ( livre arbítrio) , mas somos nós quem nos afastamos dEle, porque é o pecado que nos afasta da gloriosa Presença do Senhor! E Anni continua; foi nosso povo que retirou a Palavra de Deus dos locais públicos! é as pessoas que se afastam de Deus! pensam que não precisam andar na dependência de Deus, e negam o favor de Deus o estar na dependência. Dia 20\\\\01\\\\17 por volta do meio dia á posse do novo Presidente Americano e com um discurso pesado recheado de poder imponência, dividindo opiniões quando diz; somos a maior nação do mundo! Demonstrando intolerância de gênero e prometendo que será radical com refugiados e não agradando mais de 60% da população americana, ou seja assume a presidência com á rejeição de 60% da população em seu discurso se isolando do mundo. e neste mundo globalizado e competitivo não mostra muito interesse em unir nações e sim demonstra seu egoísmo meio que fechando as portas para exportações mundiais. E isto não é bom. Em seu discurso Donald Trump citou o nome de Deus algumas vezes e disse em valorizar a classe de trabalhadores mais humilde e anteriormente de seu discurso teve um momento onde três lideres religiosos tiveram a oportunidade para o momento de fé e um Rabino Judeu, proferiu as primeiras palavras em nome de Deus, e posteriormente mas dois pastores evangélicos sendo o último Frank Graham! Filho do saudoso Billy Graham faleceu aos 98 anos de idade pastor Batista muito respeitado nos Estados Unidos e no mundo todo! Usadíssimo por Deus ganhou milhões de almas para Jesus! E seu filho também homem de Deus seguindo a mesma linha de pregação sobre Salvação falou do amor de Jesus na posse e citou Tm 2.5 &quot; há somente um Deus e um Mediador entre, Deus e os homens e o nome dEle é Jesus.&quot; Não preciso falar mais nada sobre o poder dessa Palavra proferida, foi um silencio naquela multidão, o Presidente olha para o céu e diz amém! Deus colocará você e eu entre os príncipes, como boca de Deus! e o Pr. Frank conhece a Mente de Deus! porque falou o que é ideia de Deus, o que é propósito de Deus para vida daquele povo.</p>\n<p>Assim, no Reino do Céus, jesus esta reinando agora! e em breve Ele virá buscar os seus e será feita a vontade de Deus na terra como no céu. Este Reino será conquistado individualmente, pessoalmente e depende de como você e eu reagirmos á mensagem de jesus! Nossa mente deve estar formatada, limpa, pura, para receber e praticar, proclamar este Reino do Céus. Você já teve esta péssima experiência de conectar um pendrive (usb) com vírus em seu Notebook? Não! Então, não faça isto porque poderá perder todos os dados e documentos existentes em seus computador. Eu já perdi trabalhos de escola, fotos e muitos registros importantes. É por isso que digo que nossa mente deve estar formatada. O inimigo lança dardos inflamados todo instante em nossa mente. A Bíblia diz; que ele esta ao redor, tentando nos enganar e ruge como leão, mas não é leão! leão da tribo de Judá somente há Um e o nome dEle é Jesus Cristo é aquele que tem poder de anular, toda espécie de vírus material ou espiritual! Ele Cura, Salva, Batiza no Espirito Santo e Voltará em breve arrebatar os súditos, servos, fieis até o toque das trombetas suarem!</p>\n<p>Nós devemos estar em perfeito estado de purificação nossa mente, nossa alma, espirito em harmonia e dominando a carne, ai sim começamos o processo conhecendo a Mente de Deus! porque enquanto estamos ligados nas coisas mundanas corruptíveis, a Mente de Deus rejeita, não aceita conexão, porque A Majestade o Rei dos reis é Santo, Puro, há uma atmosfera de luz de paz e amor única. É por isso que Deus enfatiza ao dizer; &quot; sede santos porque Eu Sou Santo.&quot; Santidade, é estar separado das coisas mundanas. Imagine só, uma vasilha uma jarra de água suja, escura barrenta e imprópria para consumo. E você ficaria responsável para substituir a água da jarra, mas com uma condição não poderia jogar fora a água que está neste recipiente. Então vou te ajudar dando-lhes uma mangueira que flui água limpa, que deve ser usada para purificar ou substituir a água suja da jarra. Depois de algum tempo água suja com a limpa vão se misturar e quase não vai fazer diferença, é obvio que você terá a água totalmente limpa , porque você permitiu que somente água limpa derramasse na jarra! e exigiu esforço e um tempo para a purificação! pronto, sua jarra de água está cristalina, talvez fique algum resquício de sujeira, mas certamente será imperceptível a olho nu e somente alguém especializado na área com equipamentos tecnológicos talvez com o auxilio de um microscópio.</p>\n<p>Sei que você já captou a mensagem! A jarra é nosso cérebro, nossa mente e a água suja que temos lá dentro é a cultura do mundo, as coisas do mundo corruptível que vai contaminando quando permitimos, através das portas de entradas audição , ouvindo e armazenando na mente poluição sonora, piadas, vídeos picantes do watts e fofocas de irmãos, picuinhas que com sua contribuição se tornam robustas, sabe aquela empolgação de passar para seus amigos as desgraças, acidentes somente algo podre, lixo que destrói a mente! Com a mente poluída surgem as contendas, abandono da igreja, esfriamento espiritual ou apostata a fé. Nossos olhos são portais de entrada, visualizam e jogam informações para o cérebro numa velocidade incrível! e o nosso HD interno para armazenar as coisas inúteis sempre tem espaço. Deus está falando comigo primeiramente! E é verdade, só podemos dar o que temos! é óbvio que por mais límpida que é sua jarra de água sempre fica alguns resquícios de sujeiras e permanentemente devemos purifica-la! e sabe como? É com a Palavra de Deus. Então nosso cérebro é abastecido diariamente com uma grande quantidade de informações consideradas ao lixo da moral dos bons costumes , ou comida estragada, essas viroses virtuais nos infectam a través dos nossos cinco sentidos; tato, visão, audição, paladar e olfato. A grande maioria de nós em função da vida agitada, corrida, nem tomamos o cuidado de filtrar as informações que estão sendo levada para nosso cérebro! e fazemos as coisas muitas vezes por instintos sem pensar e acaba tornando-se em hábitos, costumes, por ouvirmos e assistirmos repetidas vezes, o que não edifica e pensamos porque a maioria das pessoas fazem assim ou assado e seria o correto, normal? Devemos ter muito cuidado com o que o sistema nos impõe! Há muita coisa rotulada, padronizada! Sendo passada como verdade ou na condição de perfeição. E contraditar muitas vezes a esses conceitos que os sábios criaram em suas mentes ser o correto! Nos leva a sermos vistos por uma ótica fanática na condição de rebeldes, desobedientes e descrentes! Sei que devo ser fiel e obediente ao meu Deus e é través da Palavra que eu terei discernimento. Aprendo que não devo dar ouvido a tudo que se vê! E filtrar toda informação recebida, porque são elas que vão determinar o que vamos pensar, que vão determinar as nossas ações e que vão determinar nossos resultados.</p>\n<p>As ações, são o resultado dos pensamentos! e se eu quero saber como obter os mesmos resultados, que uma pessoa bem sucedida obtém? Devo descobrir como esta pessoa pensa e isto fará toda a diferença.</p>\n<p>Vejamos que Paulo diz em (Efésios) 4; 22-24 &quot; Que, quanto ao trato passado, voz despojeis do velho homem, que se corrompe pelas concupiscências do engano; e vos renoveis no espírito de vossa mente; e vos revistais do novo homem, que segundo Deus é criado em verdadeira justiça e santidade&quot;.</p>\n<p>Isto é revelado por Deus ao Apostolo Paulo e para nós hoje! mas vejamos que mil anos para Deus é um piscar de olhos, foram dois mil anos atrás, quando um ser humano desprovido das tecnologias ou do conteúdo das bibliotecas atuais! mesmo que Paulo foi um intelectual e ele mesmo disse; também se desfez de sua sabedoria seu conhecimento intelectual e buscava do alto sabedoria divina. A Palavra revelada é para quem conhece a Mente de Deus! Imagine quando Senhor enviar um download ao seu HD conteúdo confidencial são palavras do Rei! E Paulo conheceu a Mente de Deus então recebia downloads constantemente do Espirito Santo! E como a Palavra se renova todos os dias! Assim é dever do cristão renovar a mente e é um processo que exige foco, determinação, compromisso, seriedade, muito trabalho e esforço, persistência para se tornar uma nova pessoa com uma nova mente. Jesus nos mostrou estar focado em sua tarefa, em todos os Evangelhos podemos ver Sua dedicação em tudo que realizava. Jesus trabalhava muito, era de manha a noite, não tinha nem onde dormir, alhas a noite e nas madrugadas Ele orava, falava com o Pai, e eu aprendo porque os apóstolos antes de serem ungidos e tocados pela presença do Espirito Santo no Pentecostes, ficavam orando, com as mãos impostas aos enfermos e aos possessos permaneciam minutos e muitas vezes não havia o milagre, nem a libertação ou a cura ( faltava oração). Jesus não precisava orar e duvidar do milagre! Ele, o Senhor seguramente quando tocava ou era tocado, imediatamente os demônios não resistiam o poder que havia e há em Cristo. Cristo era focado em Seu Ministério, sempre foi prioridade para Ele o Reino dos céus. E e muitas vezes ficava sem comer por não ter tempo, Seu alimento era fazer a vontade do Pai e nada mais importava a não ser anunciar o Evangelho e a chegada do Reino de Deus. Foi através de um trabalho de infinito amor e bondade que Jesus implantou no coração daqueles homens rudes, foi uma nova mentalidade, tornando-os novas criaturas. E Sua estratégia, maneira de trabalhar foi utilizando-se de milagres extraordinários, parábolas, muita paciência, mas também com palavras rudes e todo amor que Deus pode ter por Seus filhos. Foi Ele próprio se doar e morrer por nós, para salvação eterna. Hoje muita gente quer a salvação, deseja as bênçãos de Deus as promessas, mas não querem o Salvador para sua vida, desejam as bênçãos mas o Dono das bênçãos negam! Não desejam aceitar o Senhoril de Jesus! Pressupõe obedecê-lo, honrá-lo, respeitá-lo e estabelecer com Ele um relacionamento pessoal. Renovar a nossa mente é ter a mente de Cristo, é pensar como Jesus pensou, andar como Jesus andou, falar o que Jesus falou e fazer as coisas que Ele fez ( e maiores ainda) é amar como Ele amou.</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-5", "num": "V", "title": "Parte V", "html": "<p>Paulo diz; em (Coríntios) 2;4-16 &quot; Ora o homem natural não compreende as coisas do Espírito de Deus, porque lhes parecem loucura, e não pode entende-las, porque elas se discernem espiritualmente. Mas o que é espiritual discernem bem tudo, e de ninguém é discernido porque, quem conheceu a mente do Senhor, para que possa instruí-lo?&quot; Mas nós temos a mente de Cristo. Quando realmente há uma conversão, eu sendo convertido, pensando como Jesus Cristo, vivendo com Jesus, agindo como Jesus, tenho a Mente de Jesus e sem dúvidas que Paulo e os discípulos tinham sim a Mente de Cristo e assim conheciam a Mente de Deus. Portanto, renovar a mente é ter a Mente de Cristo, é conhecer a Mente de Deus, é se tornar uma nova criatura através de uma obra sobrenatural do Espírito Santo de Deus. Mas cabe a permissividade de cada um de nós, devemos desejar e permitir e com a mente renovada passamos naturalmente a amar a Deus sobre todas as coisas é prioridade número um, e estará inserido na mente o desejo de amar o próximo como a si mesmos! e entender perfeitamente que esta vida aqui na terra, não significa absolutamente nada diante do que Jesus tem prepara para os Seus. ( I Coríntios) 2.9.</p>\n<p>Mas, como está escrito; &quot;As coisas que o olho não viu, e o ouvido não ouviu, e não subiram ao coração do homem. São as que Deus preparou para os que o amam&quot;. Paulo fala não de si próprio da carne, esta Palavra é revelada é espiritual, esta vem quentinha da Mente de Deus, fala do que é eterno, puro, Santo, sagrado e glorioso de um Reino Único e perfeito! mas se você olhar para as coisas do mundo e esquecer ou ignorar que existe um Criador, um Rei Absoluto, que deu Sua maior prova de amor pela humanidade sendo que Seu filho primogênito morresse numa cruz para perdoar todos os pecados da humanidade, não faria sentido e seriamos ingratos para com Deus pelo o que Ele É e tem prepara para os Seus filhos. Infelizmente a mente do ser humano está voltado para o aqui e ao agora! Vivemos de momentos, de muita alegria e em segundos mergulhamos na dor, tristeza, rancor! Mas avida eterna que Jesus nos promete é muito maior e melhor tudo é precioso. Nossa sociedade não olha para o céu e esta presa, alienada em nossas limitações. É por isso que em nossas mentes muitas vezes Deus está distante! E a cada dia mais nos afastamos de Deus porque focamos somente aqui na terra. Há mais de três mil anos atrás um menino no campo pastoreando as ovelhas de seu pai, aquele que tinha seu coração segundo, o de Deus! sim posteriormente Rei Davi. (Salmo) 8.3-5 Davi olha para o céu e diz; &quot; Quando contemplo os teus céus, obra dos teus dedos, a lua e as estrelas que ali firmaste, pergunto; Que é o homem para que com ele te importes? E o Filho do homem, para que com ele te preocupes? Tu o fizestes um pouco menor do que os seres celestiais e o coroastes de glória e de honra.&quot; E em Ezequiel 1.1 servos de Deus que viram o céu aberto; Ezequiel, Daniel, Estevão! O inimigo tenta nos enganar para não vermos o céu, quando focamos nosso olhar nas coisas mundanas, acabam nos detendo e contaminando nossa mente com a poluição material e espiritual existente produzida pelo príncipe das trevas. É a Palavra do Senhor que nos purifica e permite ver as belezas do céu. Mas se você olhar somente para as coisas do mundo e se apegar vai encher a sua jarra de água suja, poluída e pensar como o mundo a carne pensa! mas se olhar para Jesus e meditar na Palavra de Deus, praticá-la todos os dias, vai transbordar de água limpa, cristalina! Haverá multidões de sedentos querendo saciar sua sede desta jarra onde a água é Jesus! Pensará com a Mente de Cristo, conhecerá as maravilhas de Deus, porque conheceu a Mente de Deus! E seus pensamentos estarão alinhados aos de Deus é promessas é propósitos se cumprindo em sua vida, porque você vai agir conforme a boa, agradável, perfeita vontade de Deus.</p>\n<p>Esse processo é fácil Pr. Amarildo? Não é fácil não! é tarefa árdua, Jesus disse; em( Lucas)13;24. &quot; Porfiai por entrar pela porta estreita; porque eu voz digo que muitos procurarão entrar, e não poderão.&quot; Muitos procurarão entrar e não poderão, mas quem são estes que não podem entrar?</p>\n<p>Importante esta reflexão! porque de quem estou me referindo não são as pessoas do mundo, que são a grande maioria! Eu estou me referindo infelizmente nesses que formam maioria! Os que aceitaram Jesus Cristo como seu Senhor e Salvador, são os que leem a Bíblia, vão a igreja, andam com outros crentes, levam uma vida até exemplar aos olhos da sociedade, (aparentemente boa reputação) mas não tem a Mente de Cristo! Está faltando o caráter! É Deus que vê em nosso interior. ) É Deus que manda eu falar! Sempre lembrando que Deus fala comigo primeiramente e você fique sabendo que a ponta do chicote ou da vara de Deus alcança bem a ponta dos meus dedos muitas vezes, e é dolorido o processo correção do Senhor! Penso que Deus perdoa o tempo de ignorância ( a falta de conhecimento ( Mt ) 22. 29)&quot; Errais, não conhecendo as Escrituras, nem o poder de Deus.&quot; Mas a quem mais é dado mais é cobrado! A prestação de contas será individual! E disse Jesus; não adianta dizer; Senhor! Senhor! Eu realizei milagres em Seu nome! Jesus diz; apartai de mim, você não viveu, não praticou A Palavra de Deus. Então se eu não viver o cristianismo verdadeiro virá o julgamento e condenação! Meu Deus, é algo serio que estamos tratando. Acontece que muitas vezes nós, não admitimos o erro! É nariz empinado! Não nos sujeitamos ao Senhoril de Deus! os olhos veem a porta larga e fácil! Somos orgulhosos para pedir perdão! Então para conhecer a Mente de Deus! eu necessito trocar esse coração de pedra, por um de carne, flexível, aquebrantado e disposto a servir ao Senhor. Como não sou perfeito, estou incluído no holl dos pecadores de (Rm) 3.23. &quot; porque todos pecaram e destituídos estão da glória de Deus&quot;. Acontece que há muitos cristãos com um pé na igreja e outro no mundo, amigos das coisas do mundo. Para ter amente de Cristo, Conhecer a Mente de Deus é amar o que Deus ama! e odiar o que Deus odeia. É limpar totalmente a água da jarra. Permita que a Palavra de Deus purifique todos os dias sua mente e as coisas do mundo verdadeiramente se tornam inúteis, sem valor e separam o santo do profano e o Espírito Santo o renovador da mente fará morada em ti.</p>\n<p>Para conhecer a Mente de Deus, nossa mente deve estar limpa, pura, o espírito dominando a carne. E o que é mais fácil para o ser humano! Se controlar? ou brigar? Ainda mais para quem é sanguíneo ( pavio curto), dar a outra face? Ou dar o troco? Opa! De novo o Senhor fala comigo..! Pensar antes de falar ou falar sem pensar? Mais não acabou; dizer a verdade ou mentir? Ajudar quem está passando por adversidades ou olhar somente para seu umbigo?</p>\n<p>Fala Senhor\\... ! É óbvio que a segunda opção é a mais atraente, cômoda, e mais fáceis para nós, seres humanos falhos pecadores. Vejamos, por mais que nós não desejamos e ainda na maioria das vezes é o que acabamos fazendo. Mas o agravo é ainda maior quando nos se tornamos conhecedores da Verdade de Cristo, ai fica complicado, porque nossa mente brilhante tem consciência dos nossos atos e a noite faz o papel de juiz! vem o arrependimento, por que fiz isto ou aquilo outro! Esta ilustração é verídica, havia um judeu que no período da segunda Guerra Mundial residia com sua família na Alemanha. E sabemos que Adolf Hitler o líder nazista queria exterminar todos judeus e acabou com mais de seis milhões e não só judeus, matou milhares de pessoas de outras etnias porque pretendia criar uma raça &quot;Ariana&quot;, homens grandes e brancos com olhos claros. Mas graças a Deus acabou não conseguindo realizar seus desejos diabólicos mesmo assim deixou rastro de destruição terrível. As forças aliadas combateram e destruíram Hitler seu exercito e suas ideias perversas. Mas este judeu que me refiro era um homem de uma sabedoria muito desenvolvida era um intelectual da época, um Mestre, para os judeus um Rabino e sua família acabou fugindo das garras dos soldados alemães e este homem foi torturado, espancado e deixado como morto em sua residência. Mas como Deus ainda tinha propósito para vida dele, então ele não poderia morrer. E posteriormente resgatado por membros da família e trouxeram-lhe para Argentina, onde viveu por mais alguns anos, porém aquele homem expert, ativo, pregador fervoroso já não existia mais! Ele necessitava de ajuda de seus familiares, pois ficou paralisado em cadeira de rodas e sua mente não processava mais como outrora. Porque apresento esta ilustração? A nossa mente é o maior bem que possuímos. Tudo oque poderíamos responder se fossemos questionados sobre; qual é o bem maior que possuímos? E diríamos; &quot;Jesus&quot; e não estaríamos errados! Poderíamos dizer; a salvação, a família, filhos, saúde e vai por ai afora, e tudo estaria correto. Veja bem! Mas se nós não tivermos a consciência de quem é Jesus Cristo? de quem são nossos filhos? de que é a salvação? quem é a família para você? De nada adiantaria! Eu falo de valor espiritual, sentimental, moral e não valor material aqui da terra que a ferrugem e a traça vai comer e destruir. É assim que Deus nos vê! pelo que somos e não pelo que temos ou sabemos. Deus nos fez para eternidade, por isso não somos qualquer um, quando olham para nós de cima para baixo tentando nos diminuir, humilhar! Essas pessoas desenformadas estão equivocadas! Porque somos o melhor de Deus, você e eu somos a coroa da criação de Deus! escolhidos e separados para viver junto ao Rei Jesus para eternidade.</p>\n<p>A mente nos julga a noite quando colocamos nossa cabeça sobre o travesseiro! No momento em que aceitamos Jesus como nosso Senhor e Salvador, uma verdadeira batalha começa dentro de nós; a carne: espirito. Apalavra nos diz; &quot; Pois a carne deseja o que é contrário ao espírito; e o espírito o que é contrário a carne. Eles estão em conflito um com o outro, de modo que vocês não fazem o que desejam&quot; (Gálatas) 5.17. Há uma luta constante entre o &quot;velho eu&quot; e o &quot;novo eu&quot; e parece nunca ter fim, mas enquanto estivermos nesta terra na colônia do Reino de Deus, todos os dias teremos que decidir quem irá prevalecer. Nesta disputa, a melhor coisa que podemos fazer é nos perguntar; em meu lugar o que faria Jesus? Não é fácil agir como Jesus agia, mas A Palavra nos exorta que &quot; Aquele que testemunhar que está nEle, também, deve andar como Ele andou ( l João) 2.6. fazendo com que obedeçamos aos Seus desejos.&quot; E Paulo fala em (Romanos) 6:12 Pelo contrário; temos que resistir as tentações colocadas pelo diabo e nos livrar das cadeias ( algemas, armadilhais) do pecado, se quisermos ser felizes e ter uma vida próspera com Deus. Toda vez que a carne quiser falar mais alto que o Espírito Santo que habita em você, lembre-se que Jesus já pagou pela Sua liberdade com o próprio sangue. Jesus mesmo sem nunca pecar, Deu a Própria vida para que nós deixássemos de agir pela carne e começássemos a ser dirigido pelo Espírito. Depois da morte e ressurreição de Jesus, você e eu nos tornamos;&quot; Mortos para o pecado, mas vivos para Deus em Cristo Jesus&quot;( Rm )6.11. É por isso que já temos a vitória, mas precisamos buscar a capacitação, o conhecimento da Palavra para nunca mais ser cavalo do diabo ou escravo do pecado. Precisamos sim todos os dias permanecer na oração, A Palavra nos diz; orai sem sessar, louve a Deus e faça leitura da Bíblia e meditar nela dia e noite, leia também bons livros que seu relacionamento com Deus será a cada instante melhor. Em (Gálatas) 5.1; vejamos que Paulo escreve a maioria das cartas na prisão e com sua mente no Reino de Deus! local onde Paulo escreve as cartas é um local de clima tenso, pesado, é mais fácil ouvirmos testemunhos de pessoas revoltadas, indignadas por serem privados da liberdade e o cristão muitas vezes se afasta de vez de Deus e murmura muito. Mas Paulo fala de liberdade, de esperança e de uma fé tamanha porque tinha sua mente focada no alvo que é o Plano de Deus. Diz para aquele povo e para nós hoje; &quot; Foi para a liberdade que Cristo nos libertou. Portanto, permaneçam firmes e não se deixem submeter novamente a um jugo de escravidão&quot;. Esta advertência fala no interior da nossa alma! Cristo nos libertou para sermos livres, e não olhar para trás e desejar retornar ao Egito tornar a ser escravo e o Egito seria o mundo pecaminoso que atrai a carne com ofertas em todas as áreas, mas se resistir as tentações, fazer o bem e ter o autocontrole, sempre recusar o que a carne pede e obedecer ao Espírito. Você ainda quer conhecer a Mente de Deus?</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-6", "num": "VI", "title": "Parte VI", "html": "<p>No inicio da leitura você estava mais entusiasmado não é! foi apenas uma provocação minha! Amados não é tão fácil assim, tudo se tem um preço a pagar, o Reino de Deus também é necessário muito trabalho e dedicação e existe o processo de semeadura e o tempo de colheita e tem sim o tempo de maturação. Lembrando que o fardo maior Cristo levou sobre Si! Pergunto o que você esta semeando para o Reino de Deus? Só tem semente para consumo próprio? ou a melhor semente será lançada em terra boa que é a obra de Deus! É difícil responder! não é? Eu sei do que você esta pensando agora, porque diariamente eu também enfrento esta batalha espiritual e só vai acabar quando Jesus vir buscar Sua noiva ou quando nós formos recolhidos para glória de Deus. Mas não somos os únicos a ter este enfrentamento. Se o próprio Apostolo Paulo é considerado um dos maiores cristãos de todos os tempos. E falou; &quot; Sei que nada de bom habita em mim, isto, é em minha carne. Porque tenho o desejo de fazer o que é bom, mas não consigo realiza-lo. Pois o que faço não é o bem que desejo, mas o mal que não quero fazer, este eu continuo fazendo&quot; (Rm) 7.18-19. Paulo reconhece de onde vem sua luta, &quot;Ora se faço o que não quero, já não sou eu quem o faz, mas o pecado que habita em mim&quot;(Rm) 7.20 . Ele não tem dúvidas que a tendência de pecar vinha do seu corpo contaminado pelo pecado, que foi gerado desde Adão e Eva.</p>\n<p>Importante revelação de Paulo e se quisermos conhecer a Mente de Deus, percebemos algo que está impedindo nossa intimidade com O Pai, é aí que mora o problema! Como é que que venceremos esta batalha? Devemos alimentar nosso homem interior com as coisas de Deus, é assim somente que nosso espírito estará em vantagem sobre a carne e caso contrário quem se alegrará é o diabo, repito; anda ao nosso derredor ruindo como leão e procurando a quem possa tragar ( l Pedro) 5.8. porque ao nosso redor há anjos para nos proteger! E Jesus é Único Leão da Tribo de Judá. E satanás não passa de um cão pulguento vira lata.</p>\n<p>Paulo diz mais aos Gálatas e a nós hoje a respeito disso; &#x27; Os que pertencem a Cristo Jesus crucificaram a carne, com suas paixões e seus desejos&quot; ( Gálatas) 5;24. Reflita um pouco sobre sua vida ministerial! Esta tudo bem? Que bom então continue na presença gloriosa do Pai para perpetuar suas benção! sendo íntimo, aliançado e compromissado com Deus. Se não está fluindo muito bem! não está tendo respostas dos seus projetos e sente que não é mais fervoroso como foi no primeiro amor em suas orações a igreja estagnada, marcando passos, talvez não está tendo uma evolução espiritual chegou até ai, vem aquela ideia de que sabe de tudo da Bíblia, que não tem mais o que aprender do Reino de Deus! nem tem muito desejo de buscar mais capacitação divina a Sabedoria que Salomão pediu e recebeu! Há, Pr. Amarildo nem precisa falar mais nada! É mais o menos isso que acontece comigo, assim a igreja não está cheia mas o importante é qualidade não quantidade Sim e eu sei da Bíblia pro gasto e nem sei porque estou lendo este livro! praticamente tudo que você relatou eu já sabia! Porque os versículos que você citou eu tenho lido já há muitos anos. Pr. Amarildo, sei que Deus tem te usado, mas não se entristeça e não é que eu queira me gabar, mas creio que tenho muito mais conhecimento que você servo de Deus! Certo, eu tenho absoluta certeza que este humilde livro chegará nas mãos de muitos homens e mulheres de Deus que eu admiro muito e em quem eu me espelho, são meus mentores e tantos que nem conheço ainda com um conhecimento invejável! As pessoas medíocres avaliam previamente se vão ou não ouvir o seu interlocutor, enquanto que as pessoas inteligentes ouvem toda a gente, pois reconhecem que todas as pessoas têm alguma coisa para ensinar. porque estão sempre a aprender  novas coisas, a ter novas opiniões e, portanto, estão num eterno processo de transformação espiritual, cognitiva e opinativa. As pessoas inteligentes buscam ler e pesquisar em livros bons! Mas nunca deixam de praticam a arte da retórica, da discussão sobre o Reino de Deus, com a melhor pessoa do mundo: Espirito Santo! Se talvez estaria acontecendo isto com você! é porque Deus está agindo na causa! Mas se você se humilhar a Deus e admitir que tem vasto conhecimento teológico mas ainda não conhece a Mente de Deus! E foi por um desses motivos que você fez a aquisição deste Livro. Se realmente em alguma área de sua vida que não está prosperando, você percebe que há algo impedindo! Querido! (a) e abençoado servo (a ) de Deus! somente acredite no sobre natural Deus vai te revelar mistérios! Sabe porque? porque não sou eu que realizo milagres, que abre portas, que tem o poder de convencer o homem do pecado! Mas é o Senhor que está em mim o Dono das bênçãos que já esta te revestindo de unção e poder e seu Ministério nunca mais será o mesmo! Receba e seja assim como muitos servos de Deus na humildade permitindo que Deus lhes use como canal de benção. E ainda estamos na introdução do livro, é bom relembrar o que já aprendemos, que o inimigo tenta confundir nossa mente, e já que temos Cristo como Senhor e Salvador, não podemos se acomodar que nossa fé poderá apostatar, e menos ainda se acovardar diante do inimigo, não podemos permitir que o pecado continue dominando silenciosamente os nossos corpos mortais, nossa fé, pois nosso entendimento e amadurecimento espiritual acontecem dia após dia, assim como o dia nasce é no amanhecer que aos poucos tudo podemos contemplar o sol, os pássaros a natureza com sua formosura e os seres viventes as pessoas adorando em espirito e verdade ao Criador.</p>\n<p>Você tem percebido o quanto nós cobramos de Deus e o quanto somos infiéis a Ele. (Rm) 3.3 &quot;Se alguns não creram, a incredulidade deles virá desfazer Fidelidade de Deus&quot;? É incrível como temos a petulância de chegar diante dEle e apontar o dedo! É terrível a dureza do coração humano. Mas nosso Deus é um Deus misericordioso, benigno, compassivo, e deseja que venhamos conhecê-lo, Conhecer a Sua Mente e que tenhamos intimidade com Ele.</p>\n<p>Ai se não fosse pela misericórdia de Deus, o que seria da minha vida! As misericórdias do Senhor, são a causa de não sermos consumidos, porque as suas misericórdias não tem fim; renovam-se a cada manhã. Grande é Tua fidelidade (Lamentações)3.22. Verdadeiramente somente pela misericórdia de Deus é que estamos vivos nessa terra, por isso, todos os dias devemos ser gratos a Deus pela Sua infinita bondade. Devemos ser gratos, tementes e fieis ao Senhor Jesus e devemos nos colocar em posição de servos e nos oferecer ao Senhor todos os dias. Você deseja realmente conhecer a Mente de Deus? Sim! Então, dê ao Senhor mais de você, derrame-se diante dEle, esvazia-se de você e seja preenchido por Deus. Ele é fiel e te recompensará e sentirá, e verá algo que jamais viu antes. ( Hb) 13.15 &quot; Por isso, por meio de Jesus Cristo, ofereçamos sempre louvor a Deus. Esse louvor é o sacrifício que apresentamos a oferta que é dada por lábios que confessam a sua fé nEle.&quot;</p>\n<p>Realmente é um momento em que o mundo esta passando de muitas adversidades é um momento de crises e não somente no Brasil mas o mundo num todo e a população multiplicou. São bem mais de sete bilhões de habitantes e há escassez de comida, água e principalmente escassez de e amor, de paz! e a paz é ausência de conflito em nossa mente e o que mais se vê é guerras, conflitos, nos dias de hoje viver na terra requer que esperemos o inesperado e nos preparemos para os imprevistos. É a natureza da vida. Mas muitos de nós não possuímos as ferramentas adequadas ou ferramentas mentais, emocionais, psicológicas e espirituais necessárias para superar, com êxito, os períodos de maior turbulência como esta sendo nos dias de hoje. A diferença é quando conhecemos a Mente de Deus! e entenderemos, que o Reino de Deus nunca estará em crise. Permita que esta ideia vem amadurecer em sua mente, que o Reino de Deus nunca estará em crise porque é muito maior do qualquer crise que possa ter acontecido, venha acontecer ou esteja acontecendo. Ele sempre sabe o que fazer. O Criador não somente sabe o que fazer como se importa conosco, tanto individual como no coletivo. Ele ama pessoas e nunca decepcionou Seu povo. O mais importante é certificar-se de que você faz parte deste grupo seleto, os escolhidos, povo eleito. Penso que este livro Conhecendo a Mente de Deus o ajudará a avaliar se você está vivendo de acordo com os princípios de Deus, como cidadão do Reino de Deus, levando a considerar sua situação atual e mostrando como alcançar os padrões divinos de retidão, para que você seja capaz de superar as crises. Ai brotará o desejo e a possibilidade de auxiliar o seu próximo. Quando você aprender a reivindicar a cidadania do Reino do céus! encontrará saída para todas as crises . lembramos do que Cristo deixou bem claro; Ele garantiu uma saída, uma forma de superar a crise, seja ela grande ou pequena, e não prometeu uma vida livre de tribulações. Ninguém de nós estamos isentos de adversidades inclusive cristãos! Jesus falou; &quot;No mundo tereis aflições, mas tende bom animo; Eu venci o mundo.&quot; ( João) 3.33.</p>\n<p>É verdade que o que pode parecer uma crise para mim,</p>\n<p>pode não parecer para você e vice versa, no entanto, uma crise é um acontecimento sobre o qual ninguém tem controle. As crises são experiências para as quais você não pode antecipar-se menos ainda se preparar. Elas o pegam de surpresa e enchem-no de ansiedade. A Palavra de Deus tem respostas e solução para nossas duvidas e diz; &quot;. Uma crise força mudanças. No principio você não pode controla-la, mas pode com &quot;Não andeis ansiosos por motivo algum; pelo contrário, sejam todas as vossas solicitações declaradas na presença de Deus por meio de oração e súplicas com ações de graça.&quot; ( Filipenses) 4.6. começar a assumir o controle de alguns dos detalhes de sua desagradável situação e pode obter algum progresso depende de seu esforço, mais tarde poderá até mesmo ser capaz de apreciar a crise pela mudança que provocou em você. Uma crise após outra nos alcançará ao longo de nossa vida. Você já não passou por situação muito difícil e venceu! quando alguém ao seu lado estando em adversidades e você aconselha dizendo; passei por isso e hoje estou mais forte! as lutas vem para nós crescermos e cantarmos vitórias. Então é importante entendermos a Mente de Deus para compreender não só como superar algumas das circunstancias, como também e especialmente as nossas respostas emocionais às dificuldades e conseguimos recuperar nossa estabilidade emocional durante a tempestade. Vejamos um exemplo; na eminencia de um assalto, ladrões apontando armas e pedindo seu carro e você tenta ligar este carro que você já havia ligado centenas ou milhares de vezes e a chave não se encaixa na ignição é muita tensão, mas se conseguirmos recuperar nossa estabilidade emocional durante a tempestade, seremos capazes de superá-la, mas para isso acontecer primeiramente devemos colocar nossos pés na rocha firme que é Jesus Cristo. Ele está no controle de todas as coisas. Reflita por um instante..! Que crise você está enfrentando atualmente? E você está enfrentando as suas crises sozinho ou com Deus? Se não puder controlar essa crise que esta instalada em sua vida mas ela está com os dias contados, você sabe que pode assumir o controle de alguns dos detalhes desta situação, e recuperando sua estabilidade emocional para vencer essa crise e declara uma entrega total, e dependência da misericórdia divina colocando seus pés sobre a Rocha firme que é Jesus Cristo. Eu repito, mas se faz necessário afirmar que estamos vivendo hoje uma crise aguda, agônica, endêmica, sistêmica e já não produz impacto em mais ninguém. É a palavra crise que define nossa realidade nos dias de hoje, vivemos uma crise de integridade sem paralelos é triste esta realidade mas é resultado de pesquisa realizada nos Estados Unidos recentemente, três classes mais desacreditadas; Políticos, policiais e pastores. Por coincidência as três Palavras começam com a letra &quot; P &quot; Será esse vergonhoso resultado que está acontecendo somente na América do Norte? Mas antigamente os políticos eram e devem ser representantes legais do povo e legislativo bocas do rei, do presidente, dos governadores, dos prefeitos pessoas confiáveis. Devo reconhecer que há entre os desacreditados homens de Deus legislando e eu cito o nome de meu líder Presidente da IEQ do Estado de SC Missionário Narcizo Parizotto reeleito por seis vezes Deputado Estadual é um notável exemplo de homem público, honesto, compromissado com Deus, homem íntegro e trás inserido em seu caráter o jargão adotado do por ele &quot;fazer o bem sem olhar aquém,&quot; este é seu lema. Um verdadeiro estadista onde não legisla em causa própria mas sim em prol do povo. É um exemplo de servo de Deus e político a ser copiado. No passado quando um pastor se apresentava em uma cidade pela primeira vez as portas se abriam e hoje as portas se fecham. Porque em toda classe de gente, há pessoas com mente de cristo e outas tantas com a mente do maligno. Antigamente quando uma jovem se candidatava a casar-se com um pastor, era como se tivesse em mão um passaporte para felicidade, hoje é um contrato de risco. Hoje tem esposa de crente, esposa de pastor inclusive indo para a casa de Deus arrastando seu colchão e falando eu quero morar aqui, porque aqui você fala palavras, que eu quero ouvir, edificantes de amor é isso que eu e meus filhos queremos e não aquela vida de mesmice, de murmuração sem expectativa, sem esperança. E a pesquisa também mostra a classe que mais se dá divorcio é a de pastores, estou falando do Estados Unidos da América onde foi colonizado por evangélicos. E nós aqui no Brasil como estamos? Os políticos nem preciso falar exceto poucos que são realmente tementes a Deus. Policiais no Brasil já bem poucos que se corrompem, ainda é uma instituição confiável que mantem a Ordem e a Segurança da Manutenção Pública. E a quem foi dado a incumbência de pastorear, orientar, conduzir as ovelhas as águas cristalinas e verdes pastagens, e aquém mais é dado mais é cobrado eu sei que pesa a responsabilidade nos ombros de um pastor, mesmo sabendo que somos humanos e tentado pelo inimigo ainda mais porque temos a missão de resgatar das garras de satanás, resgatar do cativeiro o cativo e pregoar o Plano de Salvação. Eu creio que no Brasil se multiplica a cada dia mais homens valentes, tementes a Deus e disposto a ser fiel, aliançado, compromissado com a obra missionária e atrairá os olhos de Deus, achará graças aos olhos do Pai.</p>\n<p>Cito mais um homem de Deus que conheceu a Mente de Deus, foi usado por Deus e foi um ser humano sujeito as mesma intempéries dos dias atuais, sujeito a alegrias e tristezas, ser amada e odiado, oprimido, enganado etc. em estar no auge de sua fé, em minutos estaria depressivo e até murmurando. Será que Deus pela Sua misericórdia acharia graça ao Seus olhos? Sim, eu me refiro no Profeta Elias, conhecido como &quot;homem de fogo&quot;, quando nascia período de forte paganismo e era de praxe seus pais darem o nome a criança recém nascida de ídolos que eram muito adorados pela população, ou seja honrando ao ídolo propagando o paganismo. Mas o pai de Elias, sendo um crente autêntico deu o nome ao seu filho de Elias e significa; &quot; Só Senhor é Deus&quot;. Penso eu, que a partir deste momento em que o pai honra o nome do Senhor e contrariando o que chamamos hoje de cultura! concordar, aderir, praticar a idolatria , vejam a influencia e o poder que temos na vida de nossos filhos! Meu primeiro Livro cujo título &quot;Desvendando Costumes e Tradições Reprovadas por Deus&quot;! o que Deus mais abomina é a idolatria, Ele não divide com ninguém a Sua glória e ponto final.</p>\n<p>Vamos para História! Com a morte do Rei Salomão o quarto rei em 1931 a.C O Reino de Israel foi dividido, depois de 120 anos de Monarquia sobre os governos de Saul, Davi e Salomão e das doze tribos, dez seguiram a liderança cismática de Gerobão I , formando o que nos conhecemos como Reino do Norte, Reino de Israel cujo a capital se tornou Samaria era formada a Antiga Palestina por; Galileia, Samaria, Judeia. Mas o Reino do Norte durou 209 anos, de 931 a 722 no momento em que a Síria levou de lá cativo a este Reino e nunca mais retornando até os dias de hoje como hegemonia politica. O que eu desejo relatar que nesses 209 anos nós tivemos 19 reis, em oito dinastias diferentes, o que é triste e devo destacar é que nem um desses reis andaram com Deus, todos foram ímpios, todos foram apóstatas, idolatras e se afastaram de Deus. Mas o que me faz refletir neste momento histórico é que o rei que governava na época de Elias! Vejam bem oque eu vou dizer! Nos dias de Elias quem foi o pior rei de Israel, foi o rei Acabe. Se já não estivesse mal, o próprio rei casa-se com a pior mulher do mundo Jezabel. Ela era assassina, idolatra, mandona, feiticeira em fim uma mulher de má índole, e o rei Acabe não deixava de ser um boneco em suas mãos. Foi esta mulher também que impôs cultos a baal em Israel começando ali a perseguir e matar os profetas de Deus, então foi nesse tempo de apostasia, colapso moral, de crise econômica e crise espiritual é que vem o &quot;agir da mão de Deus,&quot; O Senhor levanta não um partido político, não uma denominação, não uma multidão um grupo, mas sim Deus levanta um homem. Hoje Deus precisa de um homem, uma mulher que tenha um coração aquebrantado, alicerçado na rocha que é Jesus, fiel, santo, persistente disposto a servir e proclamar o Reino de Deus. Viver na dependência do provedor e não focar somente na provisão! Deus levanta então Elias, que faz uma grande mudança em sua Nação, pela graça e poder de Deus que agia em sua vida.</p>\n<p>Importante que não há informações na Bíblia sobre os diplomas de Elias, esse profeta vem de um lugar muito insignificante de Tisbe interior das montanhas encostado na Região de Gileade no Oriente. Se formos para o mapa a gente não encontra este vilarejo chamado Tisbe, então sua origem é de um lugar pequeno, ele não vem de uma família de aristocrata, intelectuais, nem vem de uma família sacerdotal, de profetas que seria influenciado a não ser seu nome que honrava a Deus, repito; ele não tinha diplomas, certificados para enfeitar seu escritório nem carta de apresentação,&quot; e para dizer em suas orações; olha Deus, meu currículo estou habilitado a ser Profeta, eu sou o cara! nada disso. Apenas o tesbita, uma pessoa desconhecida, surgindo de um lugar desconhecido, mas um homem escolhido e levantado por Deus. você sabe quem foi Elias sendo usado nas mãos de Deus! o homem de fogo! Aprendemos que Deus não precisa de estrelas para realizar Sua obra. porque é Ele quem nos capacita e unge para o serviço! e nada contra, nós buscarmos conhecimentos pelo contrário, necessitamos sim mas buscar da fonte inesgotável do Espirito do Senhor na Palavra revelada. Mas quando Deus quer usar o Servo Seu, Ele usa de Sua soberania! E usa quem Ele quer, onde Ele quer e quando Ele quer, e como Ele quer! É importante sim estarmos preparados, somente conhecimentos sem uma entrega total somos impedidos de conhecer a Mente de Deus para realizar a obra com eficácia. O conhecimento e a unção devem andar juntos na vida de um servo de Deus! Nas igrejas cristãs do Brasil e principalmente na Região Sul que conheço bem infelizmente encontra-se muitas estrelas, e impedindo o brilhar de Jesus. Aqui na terra há muitas luzes e nós muitas vezes focamos nessas luzes e nem mais apreciamos as estrelas do céu. As estrelas do céu somente brilham a noite quando na terra não há o sol brilhando. Quando o sol esta brilhando não há espaço para as estrelas brilharem. E jesus é a</p>\n<p>luz da justiça é nEle que devemos brilhar. Quando meu corpo verdadeiramente é templo de Cristo, minha mente é de Cristo e as pessoas verão o brilho do sol da justiça e quando o sol da Justiça estiver brilhando não tem espaço para o homem brilhar. Eu estou falado do profeta Elias! Que passava por um momento extremo de crise, conjeturando para os dias atuais em que vivemos não diferente aqueles dias, e aprendendo mesmo no momento de crise com as atitudes de Elias! como posso Conhecer a Mente de Deus? repito! Algo que Deus mais abomina é o culto a personalidades! a idolatria, era condenado na época de Elias e o Mesmo Deus de Ontem, Hoje e Eternamente ( Hb) 13.8. a idolatria é reprovada pela Palavra de Deus em todo Antigo Testamento e também no Novo Testamento. Será que existe nos Evangelhos Jesus prostrado em adoração a imagens? Jesus não desrespeita sua mãe Maria, quando   Maria foi usada como uma serva do Deus Pai, para que se cumprisse o plano da redenção, pois fazia parte do plano da redenção que o Filho de Deus nascesse neste mundo como homem e padecesse por nossos pecados.  Em Mateus 12:48-50 Jesus explica quem são os de sua família. Àqueles que fazem a vontade de Deus que está no céu, estes são chamados filhos de Deus, portanto sua família, pois Ele é o Filho de Deus.</p>\n<p>Me chamou a atenção neste texto que li (Mateus 12:46) que Maria e seus outros filhos, os quais teve com seu marido José, estavam fora querendo falar com Jesus.  Jesus estava falando para a multidão, ou seja, evangelizando, proclamando o reino dos céus, fazendo a vontade do Deus Pai, porém Maria estava fora.  Naquele momento ela não estava servindo à Deus, além de estar do lado de fora do plano desta vez, ela ainda pretendia interromper, ou seja atrapalhar a obra que Jesus estava realizando naquele instante.  por isso Jesus não a reconhece como família naquela hora. Havia um propósito no seu nascimento neste mundo e o Senhor não se desviou dele nunca, sendo fiel a este propósito até a sua morte na cruz, ou melhor dizendo, até hoje, pois Ele permanece fiel até o fim e para sempre.</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-7", "num": "VII", "title": "Parte VII", "html": "<p>Certa ocasião Paulo em sua primeira Carta aos Coríntios exorta, porque ali havia grupos com tendência a idolatria, eles adoravam colocar seus lideres nos pedestais dizendo; eu sou de Pedro, outros, são de Apolo, de Paulo, e outros eu sou de Cristo. Paulo pergunta mas quem são estes caras? E diz; são apenas servos de Cristo a Ele sim toda adoração e toda gloria. Paulo diz que não tem espaço para vaidade humana na igreja, o servo, Ministro está para servir e sejam encontrados fieis. A palavra Ministro vem do grego, tem três significados para distinguir primeira &quot;diáconos &quot;serviço ou para servir, a segunda; &quot;dulos;&quot; o escravo, e Paulo escolhe uma palavra inferior de diácono e dulos para denominar o que chamamos hoje de Ministro. Hupereta; é o escravo condenado a morte e antes de morrer precisa realizar um serviço, traduzindo em miúdos eram os remadores de Galés nos porões dos navios isso acorrentados remando nos porões de navios. &quot; Que os homens nos considerem como ministros de Cristo\\... 1Co 4: Paulo usa este termo pra dizer que não tem espaço para vaidade humana na igreja. Jesus em Sua maior pregação foi para um homem (João) 3.16. pregadores de renome há exceções mas a maioria diz; só prego para multidões e pedem depósito adiantado de um cachê generoso se não for assim não posso ir, olhe, minha agenda por onde tenho andado, sabe eu sou estrela! Misericórdia, cadê o brilho do Rei da glória? Abro um parêntese para comentar um ato nobre de um homem uma personalidade representada na música mundial, sim falo de um ser humano pecador, porem acredito que antes de morrer se arrependeu de seus pecados, na sua juventude adorava a Deus e deixou alguns hinos gospel gravados, mas teve uma vida de glórias muito dinheiro, e fama e no auge de sua fama precisamente em um show na Alemanha em um campo de futebol um grupo de fãs acenavam uma faixa escrita com letras maiúscula &quot;Elvis é o Rei&quot; ele imediatamente pediu para baixar a faixa no centro do campo entre a multidão curtindo suas músicas e disse apontando o dedo indicador para o céu, com seu microfone &quot; Jesus é o Rei, a Ele toda honra e toda glória&quot;. Deus pode usar gente humilde, simples assim como eu, de um coração puro assim como você que odeia a idolatria e Deus é prioridade! Elias profetiza em minha palavra não vai chover! Como pode um ser humano ter tanta fé assim e ele não disse em nome do Senhor. Acontece que lá em (Tiago) 5.17. Está registrado que Elias orou com instancia pra não chover e não choveu. Mais um aprendizado, só podemos se levantar diante dos homens se primeiramente se curvarmos a Deus, antes prostrar-se diante do todo poderoso. Quando nós nos prostramos em reverencia ao Deus de poder o inimigo sai em disparada, porque ele não teme conhecimentos humanos, certificados, de Mestrado em Teologia que possuo! Ou a credencial de membro, de pastor. Mas quando vê um crente, um líder espiritual prostrado ao Senhor e orando, literalmente com aboca no pó! E Elias fez por muitas vezes! potestades e principados sabem que vem fogo santo e o socorro é bem presente aos seus filhos e o inimigo foge pra não ser queimado e destruído. Elias só se levantou ao rei Acabe porque antes ele se prostrou ao Rei dos reis. Infelizmente vemos gigantes pregadores e nanicos na oração, pode até ter luz na cabeça mas não tem fogo no coração, não adianta nada eu ter informação de Jesus se eu não tiver Ele em meu coração! Se não estiver aliançado, compromissado, uma vida santificada e ser intimo do Pai. Se nós quisermos conhecer, ver, sentir a Mente de Deus, e que sejamos ferramenta de Deus, a Eclésia, a boca de Deus, atalaias de Deus, é necessário que nós nos voltemos para Deus para obtermos intimidade do Seu pensar. Se nós não formos um homem uma mulher de oração, Deus não colocará virtudes em nossas bocas. Amados uma coisa é proferir a Palavra de Deus e outra coisa e ser boca de Deus. Elias em momento de crise saindo do anonimato e dirigindo-se para um rei corrompido no palácio, demostrando fé e muita coragem. Uma pergunta básica. Quantas almas você tem ganhado para Deus nos últimos anos? Isso tendo a liberdade de expressar nossa fé, no Brasil a Constituição nos garante é de Estado laico! Deus permitiu que você e eu, tivéssemos conhecimento e discernimento da Palavra e nos liberou Dons Espirituais e não porque merecíamos, mas para ser usado pela igreja para que o nome do Senhor seja exaltado. Será que temos evangelizado autoridades quando tivemos a oportunidade? Ou somos agentes 007, é trabalhei por um ano na empresa x, e ninguém percebeu que sou cristão! Isso não deveria acontecer mais infelizmente acontece de nos dias de hoje cristãos negar a Cristo! Vamos aprender mais um bocado de coisas santas com Elias. Vejam como Deus trata com quem atrai O Seu olhar. Deus tira Elias do palácio do governo de Acabe, ou seja tira do palco, dos holofotes, e envia par o deserto, para que? É evidente que ninguém de nós gostamos do deserto. Porque só falar e pensar em deserto vem em nossa mente sofrimento, calor, sequidão, o deserto nos humilha, não nos promove. Entendamos que o deserto não é um acidente de percurso e sim uma agenda de Deus é a Escola Superior do Espirito Santo onde Ele treina seus lideres mais importantes. É no deserto que Deus primeiro trabalha em você pra depois através de você. Deus está mais interessado em que você é do que você faz. Deus esta mais interessado na sua vida do que em seu trabalho, uma vida para Deus! precede trabalho para Deus! se nós investíssemos mais em intimidade com o Pai, nós conheceríamos os segredos, os propósitos em fim a Mente de Deus que tanto almejamos. Algo muito importante que aprendemos com Elias, em seu tratamento no deserto pelo Professor Espírito Santo, é que no deserto se aprende a depender mais do Provedor do que da provisão! Elias obedece a Deus, está onde Deus mandou ele estar. Vejamos como é maravilhoso estarmos a serviço de Deus podemos comtemplar as maravilhas os sinais do sobre natural, ou seja você já viu alguém sendo servido por garçons voadores com pão e carne servindo com o bico? e bebeu do riacho, mas chegou um tempo que a torrente secou. Não tem acontecido contigo? Está na obediência fazendo a vontade do Pai, mas a provisão acaba e você olha para os lados só deserto, ninguém para lhes estender a mão no momento mais difícil de sua vida. Eu estou falando de deserto, mesmo estando no centro da vontade de Deus! Ouça o recado de Deus para sua vida, quando sua torrente secar! se abrirá os mananciais de Deus e fluirá água cristalina em abundancia, quando sua provisão acaba, os seleiros de Deus continuam! Mantenha-se calo querido! (a), entenda porque isto acontece, &quot;nós somos limitados mas Deus é a fonte inesgotável.&quot; Repito; você e eu, necessitamos mais do Provedor do que da provisão. Então, Deus primeiramente nos dá o treinamento, a capacitação liberando os equipamentos necessários ( fé, atitudes, coragem, domínio) para posteriormente fazer a obra dEle. Mas o Espirito Santo aplica na prática um estágio avançado com Elias, e conjecturando num diálogo bem simples Diz; Elias, você aperta o cinto que Eu vou te avaliar neste trabalho em grupo. Agora você vai até a viúva de Sarepta, onde ela mora com seu filho. A palavra Sarepta! Significa; fornalha! ou fogo, em outras palavras o Espirito Santo diria vou te testar no fogo! e não é assim conosco, quando estamos em aprovação diante das adversidades. Em seguida surgem outras tantas e dissemos se não bastasse essa desgraça me aparece mais aquilo! Saibas então que Deus ainda está trabalhando &quot;em você&quot;! para depois trabalhar &quot;através de você&quot;. Não se entristeça se ainda está no estágio de aprovação! E a fornalha de Deus não queima se quer um fio de cabelo só chamusca e quebra as amarras. Quais as amarras que estão te impedindo seu milagre, sua benção que tanto tens buscado e tem orado nas madrugadas, Deus tem escutado seu clamor e vê sua lagrimas! e parece nada acontecer, mas Ele está anulando, destruindo fortalezas e libertando cativos! Deus está trabalhando em você! para depois através de você. Elias vai a Sarepta a profecia de Elias atingiu as cidades vizinhas ( as bênçãos como as maldições sobrevém tanto no individual, quanto para o coletivo), pois era um período de sequidão e viviam uma crise enorme, e sem chuva nada se produz na terra, ainda se tratando em deserto pior ainda. No período em que Elias estava escondido em Querite, estava sendo procurado dentro e fora de Israel pelo rei Acabe e Gezabel. Corria um serio risco de ser morto pelos homens de Acabe, mas o Deus que envia é o Deus que protege. E Deus diz a Elias; &quot;vai a Sarepta e lá há uma mulher que lhe dará comida!&quot; vejamos a importância de conhecermos a Mente de Deus! Nós somos conhecedores da Palavra e a Lei de Moises era bem clara que as viúvas e crianças deveriam ser sustentadas e cuidadas, era dado uma atenção especial. Vejamos aqui nesta condição é o inverso que Deus pede a Elias. A condição seria que o Profeta seria provido de comida pela viúva. Deus ainda estava trabalhando em Elias para depois através dele. O Senhor está mais interessado em quem você é do que você faz. Não preciso detalhar o milagre que Deus fez com a viúva na multiplicação da farinha e do azeite, mas a cada dia que esta mulher ia fazer comida e utilizava do azeite e da farinha ela percebia o milagre se repetindo, ela via o agir da mão de Deus na vida dela. Nós devemos ser grato a Deus todos os dias pelos milagres recebidos; livramentos, provisões, a misericórdia, o Seu amor incondicional pelos Seus filhos, o ar que respiramos, amados neste instante há muitas pessoas respirando com ajuda de aparelhos de oxigênio! há muitas pessoas com fome, com dor e sem perspectiva de vida. O seu Deus, o meu Deus o nosso Deus ainda hoje multiplica farinha na panela e azeite na botija. Porque é o Deus da nossa provisão. Repito e não me canso em dizer que o Deus da Bíblia do Antigo e Novo Testamento é o Mesmo Ontem, hoje e Eternamente. (Hb) 13.8 Ele faz o que Ele quer, onde Ele quer e com quem Ele quer, tudo para honra e gloria do Senhor, Deus Operando quem poderá impedir! Jesus nunca prometeu ausência de lutas neste mundo, mas o que disse que Estaria presente, Ele prometeu a Sua presença gloriosa no meio das lutas e vitorias. Cristão bate carro, cristão fica doente, fica desempregado. Assim também com a presença do Profeta Elias na casa da viúva depois do milagre morre o menino, vejamos na mesma casa que acontece o milagre, morre o menino, e a mãe imediatamente culpa Elias da morte de seu filho. Ser crente não é ser imune das intempéries da vida. A psicologia explica que todo ser humano tem uma necessidade de transferir sua culpa, suas angustias, suas dores seus dramas, projetar a alguém, culpar alguém. Aprendo com o conhecedor da Mente de Deus! Profeta Elias não se defende, e como é difícil você não ter culpa de algo mas esta sendo acusado e ficar calado sem se defender sabendo que somos gigantes na auto defesa, talvez Elias pensou tripudiar em cima de quem está ferido não seria viável! Só pode agir dessa maneira quem conhece a Mente de Deus! Elias apenas diz; para aquela mulher em prantos &quot;me dê seu filho,&quot; transfira em meus braços seu filho sem vida! e levou para o quarto, lá sim, Elias fala muito, abre o bico, clama mas sabe com quem? com quem ele tem intimidade, com quem ele conhece a Mente, e sabe que tem resposta, e quem tem solução para todas as coisas! Outra lição Elias nos ensina se nós falaríamos mais com Deus, se defenderíamos menos. Se dialogássemos mais com Deus, brigaríamos menos! e veríamos mais milagres acontecerem em nossa vida. Elias pede a Deus a ressurreição do menino algo inédito até então, e Deus ressuscita o menino, aquilo que é impossível para você e para mim! é possível para Deus. Elias devolve o filho a viúva e diz apenas &quot; mulher seu filo vive&quot;. Aprendo que se Deus está usando a minha vida para realização de Sua obra, devo agradecer a Ele, porque tudo vem dEle, tudo é por meio dEle e tudo é para Ele.</p>\n<p>No começo desta fala sobre o Profeta Elias eu falei que seu pai havia dado o nome de Elias honrando a Deus e toda vez que nós honramos a Deus Ele não esquece e nunca fica devendo nada para ninguém. A mulher viúva reconhece e diz; agora vejo que você é um homem de Deus! e a Palavra de Deus na sua boca é verdade! Nós somos famintos por reconhecimentos e como gostaríamos talvez de sermos chamados? Será por títulos? por fama, troféus, medalha no peito? sou a Prata da casa! trinta anos crente, mas deveríamos ser chamados de homens, mulheres de Deus, lá vai um homem de Deus, o Amarildo é boca de Deus! Será que tudo o que eu falo é verdade é vontade de Deus? Eu sei que não! Então como posso conhecer a Mente de Deus? Já reconhecendo nossa fraqueza espiritual. (Jeremias )15.19 Nos dá um recado através da Palavra; &quot;Se tu te arrependeres, te farei voltar e estarás na Minha presença, se apartares do precioso do vil serás a Minha boca&quot;. Nem todos que proferem a Palavra de Deus são boca de Deus! Deus usa lata velha se preciso for, pra falar com alguém, já Usou jumenta pra falar com Balaão, peixe enorme como submarino para transportar Jonas, vimos corvos levando carne a Elias, as pedras do pequeno Davi se transformando em míssil e derrubando o gigante Golias. Acontece de um pregador ter uma boa eloquência e fala de uma verdade da Bíblia e nada acontece, já vem outro mensageiro mas com o mesmo texto Bíblico e mal sabe ler a Palavra, e a mensagem cai fogo é o agir do Espirito Santo transformando vidas. Porque a Palavra é a verdade ( João) 8. 32. Mas este último pregador estava na presença de Deus, intimo do Pai permitiu que o Espírito Santo revelasse a Palavra, desse discernimento a igreja e as pessoas foram impactadas pelo poder de Deus, é a presença gloriosa de Deus tendo a liberdade de agir e os corações se derretem. Porque uns são bocas de Deus e outros não. Outro momento importante em que Elias provoca o Rei Acabe e seus 450 profetas pagão! Deus usa Elias quando ele levanta as mãos para o céu depois de ter restaurado o altar de Deus! vejo a importância de se restaurar o altar antes de conhecer a Mente de Deus! depois, Elias ter encharcado de água um valo que ele fez ao redor do altar e alhas disse água! Sim é o que estava em falta há três anos e meio. Elias provoca o mundo espiritual que estava em alerta, o que este velho maluco esta fazendo! Elias oferece algo difícil de se encontrar naquela sequidão, mas sempre tem aqueles que entendem a mensagem e obedecem porque sabem que Deus é fiel para honrar seu servo. Diante dos 450 profetas de baal derrotados que o deus deles não respondeu o dia todo o clamor auto flagelo em seu altar. Elias com as mãos erguidas ao céu diz; que caísse fogo do céu porque &quot; só O Senhor é Deus&quot;. E o fogo caiu e lambeu a até as pedras do altar. E todos viram o poder de Deus sobre avida de Elias. Quem conhece a Mente de Deus tem mais surpresas agradáveis; falou que vinha chuva seu servo via somente a nuvem do tamanho da mão do homem e em minutos veio a chuva. É as maravilhas de Deus se manifestando na vida de quem é fiel, santo, íntimo, aliançado, compromissado com o todo Poderoso. Elias andando com seu secretário, alhas outro servo de Deus que conheceu a Mente de Deus foi Elizeu. E Elias mais Elizeu passam o Rio Jordão seco, eu imagino só Elizeu que pedia porção dobrada a Elias e Elias diz; dura coisa me pedes! Em outras palavras deve ter dito; filho é uma entrega total ao Pai é de joelhos meu contato diário com Deus. Mas Elizeu Vivendo os milagres de Deus que sensação de felicidade! É sinais e maravilhas, e naquilo Elizeu percebe que começa a ventar muito e num redemoinho Elias é arrebatado havia cavalos de fogo carruagem de fogo é arrebatado Elias. Mas Elizeu persistiu até o fim na fidelidade também foi usado por Deus. Elias no retorno, levantando a capa abriu-se o Rio Jordão novamente e passou no seco. São siais e maravilhas de Deus. Pergunto onde estão os Elias de Deus? E não onde está o Deus de Elias! Deus de Elias sempre será o Mesmo! Onipotente, Onipresente e Onisciente. Vamos para o desafio! Que quer ser boca de Deus? então se você tem este desejo, e eu também! Seremos melhor ainda bocas de Deus! É desses Elias que Deus procura, deseja os verdadeiros adoradores que adoram em espírito e verdade. Se nos não ensinarmos às pessoas sobre o Reino de Deus, elas não avançarão, e se não fizermos as obras do Reino, Ele não será demonstrado com poder. Para vivermos vitoriosos em tempos difíceis e expandir o Reino, trazendo transformação a sociedade, precisamos do poder da verdade, ser boca de Deus. Isto acontece quando o Espirito Santo vem sobre nós e enche-nos, somos capacitados para &quot;explodir&quot; com o poder de Deus por meio das manifestações que vem do mundo invisível ao mundo visível, para suprir as incalculáveis necessidades das pessoas que estão em nosso entorno. Pentecostes veio para avivar a igreja e sobre nós para manifestar o poder da ressurreição e todos que desejarem ter uma experiência com o Espiro Santo terão esta maravilhosa experiência e estando cheios do espírito Santo, revestido de poder se um demônio revelar-se imediatamente será expulso, depararmos com um doente, será curado pelo poder de Deus. Os discípulos de Jesus foram pessoas comuns que fizeram obras extraordinárias pelo poder que receberam no cenáculo. A vinda do Espirito Santo não foi só um evento histórico do primeiro século. Pode acontecer aqui e agora se tivermos a fé para recebe-lo, Deus não busca lideres religiosos, nem grandes eruditos bíblicos para edificar Seu Reino, Ele busca pessoas comuns, cuja as mentes estejam abertas, à verdade, à realidade de Seu poder e Sua gloria e que possam trazer essas facetas de Seu domínio do âmbito invisível ao aqui agora, ao mundo físico, e pessoas que acreditam em Sua Palavra e atuam nela. Amados, diz; o pastor Geraldo Denardi, presidente do Ministério&quot; Íntimo do Pai&quot; pastor usadíssimo por Deus, homem de jejum e oração, quando Ministra a Palavra é fogo puro, sinais e maravilhas, milagres eu contemplei muitas vezes e é para glória do Senhor. Em sua ministração &quot;Escola de cura&quot; que participei ele disse; que basta um milagre extraordinário acontecer, para sua igreja ser visitada por uma multidão! o povo não entende que é Deus que realiza o milagre e nós apenas somos canal de benção, ferramentas usadas pelo Senhor. O milagre é; &quot;algo extraordinário, instantâneo, fora do comum é algo inexplicável para as leis naturais!&quot; O Espírito de Deus estabelece uma estrutura para nós dentro da qual devemos cumprir a obra de Deus e edificar Seu Reino. E sem estrutura não existe ordem nem restauração do propósitos divinos. A primeira estrutura deve ser estabelecida pelo poder de Deus, para, então, ser usada corretamente. Quando Seu poder é liberado sobre os cristãos antes de ter sido estabelecido na estrutura e no contesto do Reino, ou quando este vem sobre cristãos que se esqueceram do propósito do mesmo, este poder pode converter-se em algo difícil de manejar e, portanto, ser perigoso de ter. Penso que esta é a razão pela qual os avivamentos morrem com o passar do tempo e como se fosse fogo de palha. Alguns deles terminam porque as pessoas envolvidas entram em conflitos e divisão, já outras porque seus lideres caem em pecado. Mas que estrutura seria esta usada pelo Espírito Santo para estabelecer e edificar o Reino? Conhecendo a Mente de Deus, Seu Espirito revela uma estrutura de relações, não de regras criadas pelo homem; não pode, não deve, é proibido isso e aquilo mais! E menos ainda tradições herdadas de nossos pais, avós e nossos antepassados acabaram trazendo de outras nações culturas, costumes que a Bíblia reprova. O cristianismo não é uma religião, mas, com frequência, nós a convertemos em uma! deixando que o critério humano nos leve em vez do Espirito Santo nos levar. Já que estamos falando da Igreja Primitiva, dos Pais da Igreja, do Pentecostes, é importante esclarecer a diferença entre &quot; Organização&quot; e &quot;Organismo&quot;. Pois bem, quando a Igreja nasceu era sim um organismo, não uma organização. O dicionário define Organização como uma &quot;associação&quot;, &#x27; sociedade&quot; ou ainda mais como uma&quot; estrutura administrativa
