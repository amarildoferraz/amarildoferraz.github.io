 e funcional&quot; (para simplificar ainda mais seria como um partido politico ou um negócio). Um organismo define-se como &quot; uma estrutura complexa de elementos interdependentes e subordinados, cujas relações e propriedades são determinadas, em grande parte, pela função dentro do todo.&quot; Não há nada de ruim estabelecer uma organização, desde que esteja baseada em relações. Os membros da Igreja, o corpo de Cristo , devem ser interdependentes no exercício da servidão do poder e da presença do Reino de Deus na terra. Porem quase sempre, a igreja fragmenta-se em múltiplas partes independentes; assim, opera mais como organizações diversas do que como organismo. E é isto que eu quero falar que esta fragmentação muitas vezes impede o Espirito Santo de operar ou mover-se como acontecia na Igreja Primitiva. Nos dias de hoje quando a manifestação espontânea de Deus desse sobre a Igreja, primeiramente deve se submeter a um grupo de anciões e diáconos para ver se será bem vinda ou não. É inversão de valores. Será que Deus precisa pedir o licença para realizar sinais e maravilhas! Quando Jesus Ministrou na terra, Ensinou e Estabeleceu uma estrutura flexível para o Reino baseada em relações . Ele disse que o Pai estava nEle, e que Ele estava no Pai ( João) 17.21. E disse aos seus discípulos; &quot; Eu Sou a videira e vós sois os ramos&quot;( João) 15.05. &quot;Se vós estiverdes em Mim e Minhas Palavras estiveres em vós, pedireis tudo que quiserdes e vós será feito. &quot; (João) 15.07 e Paulo escreveu em (1 Co ) 12.12. &quot; Todos os membros, sendo muitos, são , um só corpo, assim é Cristo também&quot;.</p>\n<p>O Reino de Deus compõe-se de relações, e como administrador do Reino, o Espirito Santo sempre está movendo-se, Ele não adere as estruturas rígidas. Vemos hoje uma igreja cheia de estruturas estritas que acabam levando as pessoas a atuarem em independência, ao invés de desenvolverem relações, e por meio delas o poder de Deus possa fluir e operar sinais e maravilhas, o sobrenatural, milagres. Mas quando tivermos uma mentalidade de Reino, reconheceremos o valor de cada um em sua função no corpo de Cristo, e recebemos diversas pessoas que Deus colocou em nossa vida com um dom específico para servir, e esta estrutura inclui lideres que possam apoiar outros lideres cristãos e não ser egoísta, como se fossem proprietários do templo pensar só em seu rebanho, ou competir com outro líder. Oferecendo-lhes benefícios e bênçãos que vem por meio da paternidade e da cobertura espiritual. Saibamos que há igrejas infelizmente, que não funcionam sobre a base de e naturalmente se sente sozinha e desprotegida, faltando-lhes a visão, o treinamento e as ferramentas que auxiliaria a estabelecer o Reina o em seu território. Toda manifestação do Reino deve ser demonstrada dentro de uma estrutura de ordem e de propósito relacionados.</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-8", "num": "VIII", "title": "Parte VIII", "html": "<p>Quando passo a conhecer a Mente de Deus, tudo torna-se compreensível o que antes não era, e as demonstrações do Reino pouco a pouco vou entendendo, e praticando aqui na terra. E as demonstrações do Reino de Deus podem trazer julgamentos, ou misericórdia, serem aceitas ou rejeitadas pelas pessoas e a escolha é individual, como a prestação de contas também será individual ( livre arbítrio, liberdade de escolha). Vamos ver a Justiça de Deus ( 2 Co )2.15-16. Vejamos quando Moises libertou os Israelitas da escravidão, na verdade quem libertou foi Deus. Moises outro homem de Deus, que teve o privilegio de conhecer a Mente de Deus, estar face a face com O Pai. Observamos que foi notável o agir da mão de Deus, e o Poder de Deus trouxe julgamento sobre o Egito e misericórdia para Israel. Destruição para um e liberdade para outro ( as dez pragas) e foi também para mostrar que Deus verdadeiro só existe Um e É&quot; Jeová&quot;, para cada deus que os egípcios adoravam foi uma praga, e sendo a última eliminando o filho primogênito de Faraó e ai ele entendeu e libertou aquele povo, porque conheceu o Poder do Deus dos hebreus, do Deus de Abraão, Isaque e Jacó o meu e seu Deus o nosso Deus que pode todas as coisas, que vê todas as coisas e está presente em todos os lugares ao mesmo tempo. Deus invisível mas Real, Deus vivo que responde o clamor de seus filhos! que se importa que o adoramos em espirito e verdade, e um Deus que não divide a Sua Glória e adoração com ninguém! Porque pertence somente a Ele toda honra, toda gloria e todo louvor. É importante que as motivações de nosso coração sejam puras e que estejam abertas a Deus. Quando Ele se move entre nós, porque desejamos, e queremos Sua misericórdia e não Seu julgamento. A noticia boa pra você que está sedento do conhecimento da Mente de Deus, do Reino de Deus e quer mais, quer ser usado, está disposto então, pega essa! que é só pra tí vem quentinha do céu. &quot; Quando você e eu, nós estamos em Cristo, existe sim misericórdia, e não julgamento! e mais, as misericórdias de Deus são inesgotáveis..! ( Lm ) 3.22-23. Agora mostre as pessoas o poder de Deus que habita em você, para que elas também possam serem curadas e transformadas e libertas. Quanto mais você responder com fé à revelação que Deus lhe dá, experimentando Sua presença e Seu poder, mais crescerá em sua habilidade para testificar. E Jesus disse; Sedes meus testemunhos! E agora somos boca de Deus, lembrando de que somos boca da verdade, e pés disponíveis para ir demonstrar o Teu Reino! É nosso Reino, Jesus preparou para nós.</p>\n<p>O objetivo do Reino de Deus, é dar vida eterna, justiça, paz, alegria e Ele governa da seguinte maneira; por meio da Paternidade, o Reino De Deus não é só um sistema de governo, de leis e estatutos, nem é simplesmente, a associação entre um ser soberano e Seus súditos, mas sim é um relacionamento entre um Pai e Seus filhos, e vice-versa, Deus governa por meio da paternidade. Ele dá a identidade aos Seus filhos; firma, alimenta, disciplina e revela a cada um o motivo pelo qual ele foi criado ( propósito). Diferentemente de satanás. O Pai não deseja subjugar, torturar nem destruir as pessoas, Ele ama Seus filhos e deseja dar-lhes vida eterna para que possam governar junto com Ele. Vejamos o quanto é importante conhecermos a Mente de Deus! e nossos pensamentos estejam alinhados aos de Deus é por meio da revelação ou conhecimento revelado que as maravilhas o sobrenatural acontece em nossas vidas. A Bíblia quase sempre, representa revelação ou conhecimento revelado de Deus é por isso que muitas vezes lemos a Bíblia mas não temos discernimento, ou oque Deus quer dizer naquele momento. ( Jo ) 1.4 em referencia à &quot;luz&quot;. Assim, o inimigo não pode dominar-nos em uma área na qual temos conhecimento, o qual é posto em prática, tanto ofensiva quanto defensivamente, para avançarmos o Reino de Deus. Importante que saibamos; satanás é astuto, especialista em cegar cristãos, os que permitem, dão espaço, legalidade, abrindo portais para o enganador confundir a mente e interpretar a Palavra de Deus erradamente e o diabo infelizmente ataca-nos em áreas nas quais nos falta conhecimento revelado porque somos vulneráveis nela. Meu Deus! ajude-nos a conhecermos a Sua Mente! Repito este versículo que é base desta tese; &quot; Errais, por não conhecer a Palavra de Deus e o Poder de Deus&quot; (Mt) 22.29. Estou repetindo mas é importante ressaltar que o inimigo também tenta invalidar o conhecimento que já obtivemos, criando confusão e levando-nos a duvidar da verdade do que Deus disse, ( o encardido conhece toda Escritura, mesmo não acreditando ele tenta confundir com a verdade da Palavra) como aconteceu no Jardim do Éden com Adão e Eva.</p>\n<p>Não se trata somente de conhecimento intelectual, sabedoria humana. Mas sim, de conhecimento revelado da parte do Senhor e por meio do qual exercemos domínio no Reino de Deus. Uma pessoa pode ser educada em várias áreas acadêmicas, mas se não conhece Jesus e assim não tem acesso a revelação e a Sabedoria de Deus, ela esta vivendo na escuridão espiritual. Portanto o inimigo pode exercer controle sobre a vida desta pessoa ela esta vulnerável. No grego luz; significa &quot;verdade&quot; e &quot;trevas ou escuridão&quot; a &quot;mentira,&quot; é por isso que única paternidade do diabo é a mentira, ele, satanás é o pai da mentira.</p>\n<p>A Palavra revelada faz a diferença no mundo material em que vivemos. Um médico com todo seu conhecimento suponha que opera um paciente com câncer pode ser nos pulmões por fumar, ou no fígado a (cirrose) por ingerir bebida alcóolica por uma vida toda. E assim que termina a suposta cirurgia, o médico sai par fumar ou beber uma dose de cachaça! porque o médico entende a origem da doença de seu paciente, mas o Médico é viciado na nicotina, ou no álcool. Vejamos que estas drogas surgiram depois da queda do homem! foi aberto os portais par o inimigo entrar, ter legalidade para agir, atuar na vida de quem está vulnerável. Então o médico sabe perfeitamente que fumar ou ingerir bebida alcoólicas mais cedo ou mais tarde aquilo vai destruir seu corpo e o corpo. Nosso corpo sendo templo do Espirito Santo, Ele vai expulsar, expelir este mal, é obra do maligno, este câncer para fora. Estudiosos religiosos, cientistas em Roma chegaram a uma conclusão que câncer tem vida própria e com tecnologias muito desenvolvidas observaram, que o câncer tem pelos, minúsculos orifícios onde respiram e tem um dispositivo perceptível, ou seja é sim potestades e principados do maligno que se instalam no interior do corpo de uma pessoa que está vulnerável. E podemos ver frequentemente pastores com uma unção divina, autoridade espiritual para expulsar o inimigo, determinando a siada destes espíritos das trevas! Que se apresentam em forma de câncer e muitas vezes é expelido pela boca, porque espíritos das trevas obedecem uma ordem dada em nome do todo Poderoso Jesus Cristo. Mas retornando ao exemplo citado do cirurgião que é viciado, por tanto, para poder libertar de seu vicio, ele deve reconhecer que possui um inimigo espiritual que deseja destrui-lo e deve receber o poder da ressurreição por intermédio de Cristo. Percebemos que é pelo poder da Ressurreição de Cristo, e Ele foi dado todo poder nos céus e na terra, é por isso que recebendo conhecimento da Mente de Deus e não religiosidade, algo criado pelo homem, muitos infelizmente com a falta do conhecimento, para eles e Jesus ainda é o menino Jesus, e para outros permanece pregado na cruz e é adorado como se ainda estivesse no madeiro e a sensação é de derrota para os cristãos e vitória para o inimigo. Mas quando entendemos e cremos que Cristo está vivo e vive para sempre o Rei dos reis e Senhor dos senhores e é pela Sua ressurreição que recebemos poder de cura, de salvação. Podemos reinar sim sobre as leis naturais e lógicas, contudo, também podemos governar sobre toda força maligna, na medida em que manifestamos a revelação do sobrenatural e o poder da ressurreição.</p>\n<p>Conhecendo a mente de Deus poderemos sim ter um relacionamento íntimo com o Pai. E você já tem uma conexão íntima com Deus? Se não tiver ainda é a oportunidade de conhecer a Mente, os pensamentos o propósito de Deus, sabia que Deus nos criou com a capacidade emocional e espiritual de ter um relacionamento amoroso e pessoal com Ele. Eu já citei as qualidades do rei Davi, ele sabia ter um excelente relacionamento com Deus, mesmo Davi assim como nos pecadores e longe de ser perfeitos e aprendeu que só o amor a misericórdia do Pai poderia satisfazer os anseios mais profundos do seu coração. (salmo ) 63.3. Davi nos ensina que a chave de tudo é a oração. Pois ele buscou apaixonadamente a Deus através da oração, o que agente pouco faz! Passando cinco minutos de joelhos e boca no pó, começa a doer os joelhos, falta palavras é que com Quem estamos dialogando É Um estranho, está distante, será que vai ouvir, e responder? Nossa fé é pequena até mesmo na oração. Devemos buscar santidade, orar, crer, atitude, ação. Davi se via sentado no trono! era uma fé de gigante. Ele orava e em suas orações que se tornaram salmos ele se arrependia de sua falhas e pedia o socorro bem presente do Onipotente e no (Salmo) 51.11. ele pede, clama a Deus que não retire ou se afaste o Espirito Santo da vida dele, isso porque ele teria reconhecido que estava em pecado! Quando se relaciona com a esposa de Urias. Todas vitórias dele, Davi, contra feras, e ao gigante Golias, e em tantas batalhas. quem deu-lhes as vitórias foi o Espirito Santo. Ele estava convicto, certíssimo desta verdade. E eu quero falar sobre o poder do Espirito Santo em nossas vidas. Se permitirmos a Vossa ação! O Senhor Deus É autoridade máxima sobre todos! Na vida de cada ser humano, mesmo aqueles que se recusam a reconhecer a Sua Soberania. No inicio deste livro, eu havia comentado sobre o poder Soberano do Pai, e repito porque é importante ressaltar. Deus Usa do livre arbítrio, (liberdade de escolha); se eu quero servir a ao Senhor ou ao inimigo! ( Mt ) 6. &quot;Ninguém pode <strong>servir</strong> a <strong>dois senhores</strong>; pois odiará um e amará o outro, ou será leal a um e desprezará o outro. Não podeis <strong>servir</strong> a Deus e a Mâmon.&quot; Então supostamente para aquele que não escolher servir a Deus, sendo assim será desobediente, não é aliançado, nem compromissado com a obra do Reino de Deus! mas teve a oportunidade, a liberdade de escolha. Deus Usa de Sua permissividade amorosa! É importante este detalhe; e &quot;Ele nunca vai contra a Sua Palavra&quot;! ( no Reino a Palavra do Rei, ou tudo o que Ele fala torna-se lei), Ele não vai contra Ele mesmo. Vejamos! é dEle O Livre arbítrio! É certo que Ele Deus, se entristece com esta escolha errada, mas se alegra quando for acertada. Usa também da vontade soberana, que um dia todos dobrarão seus joelhos diante do Senhor no juízo final e ai vem o julgamento e a condenação eterna. Se você tem confiança na morte de Jesus na cruz para pagar a divida dos seus pecados, você se tornou um dos filhos de Deus e esta tendo uma relação íntima com o Pai. Devemos ter muito cuidado que muitas vezes nosso relacionamento com Deus acaba desgastando, podemos até ir a igreja, mas não estamos lendo a Bíblia fielmente ou não estamos nos relacionando com Deus em orações. A verdadeira comunhão com Deus, é genuína quando envolve uma profunda paixão e entrega, rejeição as coisas do mundo num nível emocional e espiritual, cria-se uma atmosfera de paz de amor é algo difícil de se expressar é só sentindo mesmo para entender. Deus criou o ser humano a Sua imagem e semelhança, para que todas as pessoas pudessem se relacionar com Ele numa base individual. E permite que o Espirito Santo possa viver dentro de cada crente dando a capacidade de desenvolver uma amizade pessoal com Cristo. Esta intimidade com Deus não pode existir sem confiança, no caso de você recusar a render-se e obedecer a Deus, não pode esperar em ter um relacionamento íntimo com Ele. Sim se quiseres verdadeiramente conhecer a Mente de Deus e o objetivo deste livro é que você conheça e permaneça na intimidade com o Pai celestial, então saibas que essência do caráter de Deus é o amor! A intimidade com Deus deve ser motivada por amor, não pela obrigação ou por interesses particulares; &quot; eu quero ter poder, sou o cara, levantam a cabeça e olham para mim!&quot; nada disso! repito, os dons e virtudes que Deus libera para os Seus é para serviço da igreja, é para a glória do Senhor. Você e eu não precisamos ganhar nenhuma afeição e sim dedicarmos ao conhecê-lo melhor, reservar um tempo para ouvi-lo, ai se torna um dialogo, e não somente eu quem falo e mesmo assim tomo minhas decisões! Assim como a letra da música &quot; May Way&quot; de Frank Sinatra e muito bem interpretada por Elvis Presley que significa; eu fiz do meu jeito. E depois quando dá tudo errado, peço novamente ao Senhor que me livre dessa! sendo que eu nem havia ouvido a resposta, o parecer de Deus, se Ele havia aprovado ou reprovado tal petição minha. &quot; A dedicação em conhecer a Mente de Deus é necessária se você quiser experimentar a plenitude da amizade com o Pai. Quando estamos no centro da vontade de Deus, somos íntimos do Pai, nosso relacionamento é sólido, tudo em nossa vida prospera e ate mesmo nas adversidades somos fortalecidos e teremos livramentos na adversidade. &quot; me vem na lembrança o irmão membro da nossa igreja em que já citei. Recentemente foi assaltado em sua residência, é médico veterinário, homem de Deus, ele reagiu e foi alvejado por vários tiros de revolver e os projeteis perfurando a cabeça e sua esposa também foi atingida pelos disparos nos braços eles estando feridos com tiros a queima roupa, e Deus livrou não do assalto, mas sim no assalto. Este é nosso Deus vivo, e pra quem tem propósito a cumprir não pode morrer. No meio das tempestades da vida, se estivermos aliançados com nosso Deus, Ele será nossa ancora, pois o Senhor esta sempre pronto a nos ajudar, o cair é do homem mas o levantar é de Deus, a mão de Deus esta sempre estendida para nos erguer e recomeçar. Quando somos íntimos de Deus Ele nos dá sensibilidade, maior compreensão espiritual, discernimento de espirito, o aumento da consciência para as necessidades dos outros será notável. Devemos observar e ter muito cuidado com impedimentos que podem surgirem e atrapalhar, o orgulho; há muitas pessoas que fazem quase tudo certo, mas o orgulho acaba impedindo de conhecer a Mente de Deus, alguns colocaram sua confiança em si mesmos e buscaram relacionamentos, realizações, posses ao invés de intimidade com o Pai. No momento em que desobedecemos ao Senhor, não podemos ser íntimos do Pai e isto é rebeldia! Pessoas rebeldes, que murmuram, andam impacientes em outras palavras, estão afirmando que Deus é limitado e é incapaz. Somente pela misericórdia de Deus e quando houver uma reconciliação verdadeira dessas pessoas se arrependerem e se renderem aos pés de Cristo para obter benefícios do Reino de Deus. Se você não esta tendo intimidade com o Senhor, saibas que Ele deseja revelar-se de uma maneira pessoal para você, agora mesmo. Deixe de lado o orgulho, confesse seu pecado e rebelião, e dedique-se a um relacionamento com Ele.</p>\n<p>Vejamos o que Davi escreveu e porque ele é o homem segundo coração de Deus? Ele conheceu a Mente de Deus! (Salmo) 16.11 &quot;Na Tua presença há plenitude de alegria, em Sua mão direita, há prazeres para sempre&quot;. Você quer isso pra sua vida? É só Deus mesmo que pode satisfazer os anseios mais profundos do seu e meu coração. Que tal agora você reservar um tempo para descobrir a profundidade impressionante do amor de Deus para com você, por meio de um relacionamento intimo com Ele .</p>\n<p>Jesus se concentrou em seu Ministério aqui na terra em pregar, declarar as Boas Novas do Reino (Lc) 8.1. Cristo percorreu centenas de quilômetros por Israel para ensinar as pessoas sobre o Reino de Deus. Podemos ver nos quatro Evangelhos mais de cem referências do Reino, e são na maior parte as Palavras de Jesus é apenas uma fração de tudo que Ele falou sobre o Reino. ( João 21.25. Jesus sabia que Ele seria escolhido por Deus para ser o Rei desse Reino (Isaias) 9.6. e ( Lc) 22.28-30. O objetivo de Jesus nunca foi obter poder ou glória aqui na terra, pois O Próprio se desfez de Sua glória celeste para sim ser humilhado por pecadores ainda para salvar os pecadores que crerem nEle. (Mt) 11.29; (Mc )10.17-18. Cristo não proclamou o Reino pensando em Si mesmo! E sim, era e é ainda importante para Jesus, principalmente por causa das coisas que esse Reino fará pelas pessoas que Ele ama; Seu Pai celestial e seus seguidores fieis. Jesus sente na pele profundo amor por seu Pai.( provérbios ) 8.30 e João 14;31 Admira Sua belas qualidades, como; o amor, a compaixão e a justiça. Muitos homens e mulheres de Deus que conheceram a Mente de Deus, eles andaram com Deus. Será que realmente temos andado com Deus? Acabamos de ver, que nosso Deus é amor e também é justiça, e se andamos com Ele, então Seu amor deve manifestar em nossas vidas, em nossas atitudes cotidianas. Devemos resplandecer em justiça, pois somos justificados por Cristo através de Seu sacrifício na cruz do calvário. Devemos emanar a alegria da salvação, e se andamos com Deus verdadeiramente, as pessoas que convivem conosco no dia à dia, ao olharem para nós, ou quando se aproximarem de nós sentirão esta atmosfera de paz, de amor e ver o brilho de Cristo em nosso rosto e sentir a gloriosa presença de Deus em nosso interior. (Deuteronômio ) 32.04; (Isaias)49.15; (1 João) 4.8. Jesus odeia as mentiras que são ditas frequentemente sobre Seu Pai; que Deus não se importa com o sofrimento das pessoas e até mesmo Quer que soframos, as Boas Novas do Reino proclamada por Cristo principalmente por isso Ele sabia que o Reino defenderia o nome de Seu Pai (Mt)4.23; 6.9-10. E através do Reino Deus trará grandes mudanças para quem obedecer; Enxugará toda a lágrima dos olhos é óbvio que é dos, (fiéis), Deus eliminará as causas das lágrimas, que é a morte, a dor, o pranto o clamor. (Apocalipse) 21.3-4. Acabará todo sofrimento por meio do Reino de Deus. Assim Jesus sendo próprio Deus encarnado e no momento Sua natureza humana porem sem pecados Conhecedor da Mente de Deus, falava, proclamava com tanta vontade as pessoas sobre o Reino de Deus, e hoje cabe a nós dar continuidade. Esse Reino mostraria que Seu Pai É muito Poderoso e Misericordioso. Tiago 5.11 repito, Jesus sabia que este Reino também beneficiaria todos aliançados que permanecerem fieis até fim. João conhecedor da Mente de Deus, andou com Cristo e nos ensina através da Palavra; (1 João) 1.5-7 &quot; E vos anunciamos que Deus é luz, e não há nele trevas. Nenhuma, se dissermos que temos comunhão com Ele, e se andarmos em trevas, mentimos e não praticamos a verdade. Mas se andamos na luz como Ele na luz está, temos comunhão uns com os outros e o Sangue de Jesus Cristo, Seu filho nos purifica de todo pecado. &quot; Vejamos, que se andarmos com Deus assim como Apostolo João andou, o propósito de Deus como sempre prevalece, não foi diferente com o Apostolo, quando tinham matado quase todos os Apóstolos de Cristo. Isso com requinte de crueldade, exceto João, já era um ancião quando veio a ideia do maligno; vamos jogar este velho cristão que ainda resta dentro de um taxo com óleo fervescente e ao retirarem o Apostolo saiu com a pele brilhando como se fosse a pele de um bebe! Quando Deus tem propósito a cumprir na sua vida, você não pode morrer! Penso que a ideia de dos primeiros cosméticos foi copiada deste milagre. Posteriormente aquele povo indignado com a propagação do Reino de Deus, quanto mais eles matavam os seguidores mais crescia o Exercito de seguidores de Cristo e acabaram levando João para a Ilha de Patmos , lugar isolado onde havia muitos presos perigosos numa espécie de prisão perpétua. Mas quando você pensar que tudo acabou, ai vem a provisão divina, o agir de Deus, o sobre natural, é as janelas e portas do céu se abrindo para sua vida. João foi arrebatado para o céu e escreve Apocalipse. E hoje podemos refletir sobre esses livramentos, milagres de Deus e que o Mesmo Deus de Ontem, é Hoje e Eternamente. ( Hb) 13.8. se andamos com Deus assim como João, então devemos deixar o caminho das trevas, e sermos diferentes e andarmos na contramão do sistema que rege este mundo pecaminoso. Devemos deixar o pecado, a mentira, a murmuração, o falar mal do próximo, respeitar nossos lideres, nossos irmãos, não devemos julgar ou propagar mentiras, devemos deixar tudo aquilo que desagrada a Deus e ao Espirito Santo. O pecado na vida de um cristão deve ser um acidente e não algo premeditado. Devemos ter comunhão com nosso próximo, para que possamos também ter comunhão com Deus e esta comunhão é Conhecer e se comunicar com a Mente de Deus. E não podemos ter comunhão com o Pai, ou não conseguiremos conhecer a Mente de Deus, se nos falta amor para aceitar e respeitar nossas diferenças como indivíduos! ( tolerância) se não somos capazes de perdoar quem nos feriu. É tempo de arrepender-se por tais atitudes que só você e Deus sabem! algo que desagrada a Deus, é o Sangue de Jesus que tem poder para purificar todos os pecados. Amados, é a hora agora, é o tempo certo que Jesus está voltando! É o tempo de voltarmos a caminhar com Deus, e emanar Seu amor por onde quer que andamos. Se queremos prosperar em graça até alcançarmos o céu tenhamos comunhão com nosso próximo e com Deus. Aprendemos com o (Salmo )18.19-24 &quot; Trouxe-me para um lugar espaçoso, livrou-me porque tinha prazer em mim. Pelo que me retribui o Senhor conforme minha justiça, conforme a pureza de minhas mãos perante aos seus olhos.&quot; Quando agimos com justiça e integridade, e quando nossas obras são puras perante ao Senhor. Ele tem prazer em nos ouvir e responder nossas petições, tem prazer em nos livrar, em nos abençoar. Mas devemos reconhecer que nada receberemos se não guardarmos Seus mandamentos, se não vivermos uma vida em obediência a Sua Palavra. O (Salmo )19.14 É maravilhoso e nos ensina algo importantíssimo; &quot;Sejam agradáveis as palavras da minha boca e a meditação do meu coração perante a tua face Senhor, Rocha minha e Redentor meu!&quot; para que possamos almejar alcançar graças aos olhos do Pai, mudando nossa postura e agora cristão comprometido, desejando ardentemente um coração puro e sincero, refletindo a Sua glória através de um bom testemunho de vida, até que possamos ouvir de Deus o que Ele disse a Jesus; &quot; Este é Meu ilho amado, aquém me comprazo! (Mt) 3.17 São palavras que o Senhor disse para Jesus, quando iniciava Seu Ministério no Rio Jordão no momento em que Seu primo João Batista realizava o batismo.</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-9", "num": "IX", "title": "Parte IX", "html": "<p>Meu desejo neste momento é de que você possa refletir profundamente sobre como posso conhecer a &quot;Mente de Deus&quot;? É possível conhecer a Mente de Deus? A Palavra de Deus nos mostrou até aqui que é possível sim, mas devemos observar os Mandamentos, os direitos e deveres da Constituição divina que é a Bíblia Sagrada. E é extraído da Palavra que eu provoco você a não ter dúvidas! Mas conhecer e prosseguir a conhecer ao Senhor! (Oséias)6.3 A conhecer mais do Reino de Deus e a viver das benesses Rei dos reis. (Romanos) 11 &quot; Ó profundidade da riqueza, da sabedoria e do conhecimento de Deus! Quão insondáveis são os seus juízos, e tão inescrutáveis os seus caminhos! Pois, quem conheceu a mente do Senhor? Quem se tornou seu conselheiro? Quem primeiro lhe deu alguma coisa, para que Ele lhe recompense?&quot; Vai refletindo nessas indagações feitas por Paulo, sendo humilde em suas expressões dirigindo-se a um povo pagão e de coração de pedra da época, de difícil compressão. Paulo tinha tido uma experiência com Cristo em uma de suas andanças para Damasco, ainda na perseguição de cristãos. E nós conhecemos a história dele. Paulo conheceu a mente Deus sim porque fala com tanta profundidade e amadurecimento espiritual. E diz mais (1 Coríntios) 2.16 &quot;Quem jamais conheceu a Mente do Senhor, para que possa instrui-lo? Toda via, nós temos a Mente de Cristo&quot;. Maravilhoso o que Paulo acaba de afirmar, o crente fiel tem a Mente de Cristo. Mas vem mais uma provocação se é possível mesmo conhecer a Mente de Deus? Agora Deus usa a boca de dois homens de Deus do Antigo Testamento; (Jó) 15.8 &quot; Ou apenas a ti fora revelado os princípios secretos de Deus? E só a Ti pertencem o conhecimento e a sabedoria? (Jó) 21.22 &quot;Ora, será possível que alguém possa acrescentar algum conhecimento ao Todo Poderoso, que julga também os seres celestiais?&quot; E (Isaias) 40.13 também nos diz; &quot; Quem teve acesso a Mente do Espirito do Eterno; instruiu-lhe com seus conselheiros?&quot; Isaias profetiza a vinda do Messias, predisse o nascimento de Cristo e seria em Belém da Judéia e assim aconteceu. Vejamos que Jesus é enviado embora o homem tenha se corrompido e se feito inútil para o propósito de Deus. Saibamos que o propósito de Deus é imutável. (Hb) 6:17 O homem estava morto, precisava voltar a viver. A raça humana era gerada à semelhança de Adão, inútil, portanto. Precisava nascer uma nova raça. A palavra &quot;raça &quot; quando tratamos de toda humanidade á raça humana. E &#x27;etnia &quot; é um grupo definido pela mesma origem, afinidades linguísticas e culturais. Vou te instigar novamente! Você faz parte de uma etnia que falam a mesma língua, que possuem os mesmos hábitos, procuram andar na santidade e adorar o mesmo Deus? Acertou, estamos falando dos escolhidos e separados! os cidadãos do Reino de Deus.</p>\n<p>Preste muito a atenção nesse detalhe! Era necessário nascer uma nova raça, (humanos) porém não nascida da carne, mas sim no espirito. É por isso que Jesus diz a Nicodemos; &quot;importa-vos nascer de novo&quot;! e também, &quot;se alguém não nascer de novo, não pode ver o Reino de Deus&quot;. É por isso que quando estamos em Cristo somos novas criatura. E se não entendermos essa realidade não é possível conhecer a Mente de Deus e menos ainda sermos chamados de filhos de Deus pra sermos salvos, ter direito de herança das mais de oito mil promessas e os propósitos de Deus ser concretizando é somente através de Cristo. ( 2 Co) 5.17 &quot; Assim que, se alguém está em Cristo, nova criatura é; as coisas velhas já passaram; eis que tudo se fez novo&quot;. Precisamos entender, pois as pessoas que ainda tem semelhanças de Adão, são inúteis para o propósito de Deus. Mas em Cristo recebemos novamente a natureza de Deus (2 Pedro)1.4 &quot;Dessa maneira, Ele nos deu as Suas grandiosas e preciosas promessas, para que por elas vocês se tornassem participante\\&quot;</p>\n<p>A natureza de Cristo que deve ser copiada pelos seus imitadores e Ele diz todo aquele que crer em Mim farão obras maiores do que as minhas. A natureza de Jesus é completamente diferente da de Satanás. Satanás quis ser igual a Deus, ser independente e passou essa ideia ao homem, dizendo que Deus era mau, ardiloso, e infelizmente o homem comprou aderiu esta ideia. Jesus no entanto conhecia Deus, amava o Senhor, e sabia que Deus era bom, o conhecimento do caráter de Deus era tão profundo para Jesus, que Ele poderia deixar a Sua essência de Deus, se esvaziar de tudo e se entregar nas Sua mãos como um homem qualquer e assim O fez. Jesus obedeceu em tudo até a morte. O que vem acontecendo ainda nos dias de hoje com nós pecadores e jesus viu, quando olha para multidão e Ele percebe o cansaço e a aflição das pessoas! e isto é porque querem ser independentes, tentam cuidar de suas vidas sozinhos, sem amparo, sem direção. Lutam, se esforçam para cuidar de suas vidas, mas não tem competência para resolver todos os problemas sozinhos que este mundo lhes oferece. É por isso que Jesus diz; &quot; Vinde a Mim! &quot; em outras palavras Jesus nos diz; aprendam e façam do Meu jeito, se submetem como Eu, sejam obedientes como Eu, sejam mansos, deixem se conduzir, sejam humildes, reconheçam que Deus é infinitamente superior a nós e vocês serão cuidados e acharão descanso.</p>\n<p>A salvação do homem é um meio para Deus alcançar o Seu propósito e não um fim. Você e eu nós a humanidade precisa ser salva, para ganhar uma nova natureza e novamente ser útil ao propósito de Deus. É triste afirmar, mas nesta situação é que muitos se encontram. pensando que Deus pretendia somente salvá-los. Tomaram uma posição com Jesus, abandonaram o pecado, a vida de perdição e tudo isso é louvável, mas andam por ai pensando que estão fazendo a vontade de Deus, e não percebem que eles, quando digo eles falo também de nós, estamos aqui para cumprir o propósito de Deus. E a razão de nossa existência é para colaborar com tudo o que tem, que é, com sofrimento e esforços para sermos uteis à Deus neste propósito. Antes quando éramos do mundo fazíamos o que queríamos, agora que temos nova natureza, fazemos o que Jesus quer, do jeito que Ele quer. Não podemos sair de qualquer forma para tentar cumprir o propósito de Deus, precisamos entender qual é a forma que Deus quer. A conversão pode acontecer instantânea, mas a libertação e intimidade com Deus vai acontecendo aos poucos gradativamente! Homem de Deus Pr. Ademar de Gois, meu pastor em suas mensagens onde é revelada a Palavra de Deus e o Espirito Santo tem a liberdade de operar sinais e maravilhas na IEQ onde sou membro e pastor auxiliar. E é exatamente com esta visão que pode ser instantânea a conversão após o arrependimento dos pecados mas, a libertação de tantas coisas seculares que nos impedem de ver e viver no céu vai acontecendo aos poucos. Não entendeu o que eu quis dizer? Então, eu me refiro quando num passado não tão distante onde o pastor preparava esta ovelha até um ano ou mais tempo, ensinando para ser batizada, em outras palavras era extraído dela toda sujeira, espinhos inflamados, carrapichos, feridas, mordidas do predador. Hoje em algumas igrejas, há exceção sim, o batismo é instantâneo aceitou Jesus e imediatamente vamos as águas. Eu vejo problemas e isso não pode acontecer! é o pastor não dar a tenção devida ao crente bebe! Para que esta alma não venha a esfriar o seu coração, apostatar e voltar ao mundo. É muito importante todos os dias buscar de Deus com mais intensidade, com fervor, por prazer e ser dependente do Senhor! Toda igreja tem a obrigação de cuidar dessa ovelhinha, porque para ela tudo é novo, e precisa aprender a verdade, mas quem ganhou ela para Jesus, deverá dar bom exemplos e alimentá-la com a Palavra e conduzi-la ao aprisco, as verdes pastagens onde o Pastor dará o alimento necessário! Hoje pela manhã precisamente 6hs do dia 08\\\\01\\\\16 nos encontramos para orar nos preparar para Santa Ceia e é de praxe nosso pastor convocar a liderança, diáconos, obreiros, levitas para este momento de preparação, intercessão e que antecede a Santa Ceia em nossa igreja local. E o pastor após a oração abordou um texto de Isaias, que fala onde Deus faz seu chamado para obra. E Isaias diz; sou um homem de lábios impuros, ele reconhece sua pequinês e a natureza pecadora. Mas Deus através de um anjo queima seus lábios com brasa. E Isaias responde na segunda vez que Deus lhe chama para obra do Senhor e Isaias diz; Eis-me aqui Senhor. Essa reflexão veio a minha mente e pensei vou compartilhar com meus amigos leitores do livro &quot;Conhecendo a Mente de Deus.&quot; Se queremos conhecer a Mente de Deus! isso é ter mais intimidade com o Senhor, devemos estar preparados, ou seja para se aproximar do Santo devemos se santificar, porque o pecado nos afasta de Deus. lembramos do primeiro homem Adão, onde toda tardinha recebia uma visita muito importante, Deus vinha prosear com Adão, vejamos que Deus gosta de Se relacionar com Seus filhos. Na rebeldia e desobediência de Adão veio o pecado e é por isso que temos a natureza caída e pecaminosa. Deus chama, onde estás Adão? E Adão diz; estou atrás de uma bananeira! aqui! O pecado é a vergonha do mundo diante de Deus e nos afasta de Sua Presença, antes Adão e Eva estavam nus mas vestido pela gloria de Deus, quando pecam é retirada a gloria de Deus e vem o isolamento, a dor, o sofrimento e somente em Cristo que poderemos retornar a Deus. E Deus nos chama hoje, e eu faço menção novamente de uma Dupla Gospel usadíssima por Deus; composta pelo Pr. Ademar e Duarte. Os Levitas estão lançando o CD &quot;Rastros de Fé&quot; muito abençoado e ouvimos a primeira faixa ainda da matriz antes de ser enviada para Manaus e ser efetuado a prensagem dos CDs. E o Missionário Parisotto nosso Líder, tem participação e faz uma oração neste hino. E diz; &quot; Onde estás filho ó meu? Quando te busco nas madrugadas! De joelhos dobrados e com a boca no pó, ó que saudade do primeiro amor, ó que saudade!&quot; Eu reconheço que devo orar mais, buscar mais a face de Deus, permitir que Ele trate comigo, não devo ser uma figueira verde cheio de folhas mas sem frutos. Devo dar bom testemunho e produzir bons frutos. Muito além de conhecer a Mente de Deus é ter a salvação eterna , viver junto de Deus eternamente e para entrar nos portões dos céus sabemos que o caminho é estreito, e se minha árvore estiver com brotos desnecessários, galhos infrutíferos , vai atrapalhar para entrar no céu, então devo permitir a poda em tempo. Sabia que a videira, e outras tantas plantas para produzir perfeitamente existe um tempo especifico para sua poda, e posteriormente ela brota dando frutos enormes e deliciosos. Quando permitimos a correção divina e Ele faz porque nos ama. O processo é doloroso quando a tesoura, a escova, a lixa, a vara de Deus trabalha em nosso lombo. Mas é retirado a inveja, o ódio, a ganancia, a murmuração o orgulho. É necessário uma renuncia as coisas mundanas que nos tentam todos os dias e muitas vezes se manifestam como puras e santas, importante termos o discernimento e saber filtrar. A pedra preciosa, e o ouro devem passar no teste de refinar no fogo, Deus tem uma fonte de calor, processo doloroso, para você e eu posteriormente brilhar e ter valor. Deus vê o valor de cada alma mesmo antes da conversão e santificação. Importante é uma entrega total a Deus, e nessa entrega Deus vai nos apresentando situações, como atividades ou testes para uma evolução espiritual. Se eu preciso de um espírito de mansidão Deus apresenta uma situação onde atinge meu ponto fraco, onde eu facilmente perco o controle emocional e costumeiramente estaria agindo pela razão e possivelmente perderia o controle emocional, agindo pela carne. Mas é diante do problema que eu me coloco em oração e estou ciente que Deus está no controle de toda as coisas, aguardo um sinal de Deus, assim vou exercitando e adquirindo, paciência, mansidão. Como que eu posso testemunhar uma conquista, ou uma vitória! Se eu nunca tive lutas, adversidades, problemas, desertos, servem para o crente crescer e ter vitórias e testemunhar que você é mais que vencedor em Cristo e operando Ele quem impedirá.</p>\n<p>Conhecendo a Mente de Deus entenderemos com clareza sobre o mundo espiritual. Quando não conhecemos encontramos culpados para tudo o que acontece de errado em nossa vida, e menos a nós, assumimos a culpa. Deus pode sim conceder aos cristãos o discernimento e a revelação para perceber a raiz espiritual de várias doenças, de tal forma que elas possam ser curadas. Vejamos o quanto é importante conhecer a Mente de Deus e ser intimo do Pai, ser revestido de poder, porque muitas vezes nos poderemos estar lidando com entidades espirituais controlando, habitando na aquela doença, ou na área financeiras, conflitando na família até mesmo com o proposito de levar aquele casal ao divorcio. Talvez você possa sentir tangivelmente o ódio dos demônios por você e por Deus. É por ai que devemos pedir a Deus discernimento para lidar com esses seres e para expulsa-los de sua vida, de seu lar, de seu matrimonio. Será que você nunca viu separações de famílias que na igreja eram exemplos de santidade. E na vida do rebanho que Deus deu para você cuidar. E verão como os demônios desaparecerão no nome de Jesus. Faço menção de um homem de Deus muito usado nessa área. Pastor Carlo Ribas, amigo meu e de meu Filho Diego. Pr. Carlo grande conferencista nacional e internacional, escritor de vários livros é um especialista nesta área, Livros e DVDs &quot; Desvendando o Satanismo&quot;. Recomendo adquirir materiais do pastor Carlo, são muito instrutivos Deus tem usado de uma forma sobre natural para glória do Senhor. Essa referencia por exemplo busco em seus livros, contudo, permita-me esclarecer que entidades espirituais, malignas não são seres humanos que já morreram e que, agora, voltam para atormentar as pessoas. Não são fantasmas. Mas sim espíritos demoníacos a serviço de satanás, que não são humanos e nunca foram. Vamos parar de ignorar a existência do reino invisível e perverso de Satanás. Ele é astuto, estruturado e indivisível. O inimigo aprendeu de Deus, que o poder vem de um esforço coordenado, porem o esforço unido que ele cria é por meio da força e da sujeição de seus espíritos e não mediante a verdadeira harmonia. Essa unidade, não possui vontade e fraternidade, é sim um acordo de ódio, violência e destruição. Mas a noticia boa é que Satanás foi vencido em quatro principais aspectos; ele foi derrotado, foi destronado, desarmado e destruído. É a vitória de Jesus na cruz sobre o inimigo. (Colossenses) 2.15 &quot; E, despojando os principados e potestades, os expos publicamente e deles triunfou em Si mesmo.&quot; Por meio de Sua morte e ressurreição, Jesus levou Satanás como prisioneiro, assim como seus principados e fortalezas, e publicamente os exibiu. O diabo pensava que finalmente matara Jesus, mas na verdade, Cristo Entregou Sua própria vida para cumprir o propósito de Deus.</p>\n<p>E satanás sempre se engana e tenta nos enganar. O inimigo pensou que os pecados da humanidade manteriam Jesus no inferno pela eternidade, mas Cristo , vitoriosamente tomou a chave do hades, acabando, assim, a autoridade e o poder do inimigo. O Pai ressuscitou Jesus junto aos mortos. Vejamos que depois da ressurreição os discípulos não tiveram mais medo do inimigo, mas continuaram seguindo seu Mestre nos cinquenta dias entre a ressurreição e a subida de Cristo para o Pai; e, depois que Ele enviou o Seu Espirito Santo, os Apóstolos dedicaram sua vida a fazer com que se cumprisse a derrota de satanás, submetendo-o a Deus e expulsando-o dos territórios que havia adquirido de varias pessoas e lugares. Satanás e seus demônios não são os únicos inimigos que temos! Falo de outro inimigo conhecido e já comentamos sobre ele neste livro, mas é importante reforçar o cuidado que devemos ter com este outro inimigo que peleja contra nós; nossa carne! Ou natureza carnal. Para conhecer a Mente de Deus é necessário sim matar a natureza carnal para que a ressurreição da vida de Jesus seja manifesta, satanás usará a carne em sua tentativa de derrotar-nos, ele sabe que pela natureza carnal por onde acontece a tentação e o inimigo conhece nossa fraqueza. Mas é importante que saibamos, a carne não é a mesma coisa que o diabo! Porem, temos que lidar com ela de maneira diferente do que como lidamos com o inimigo. Se aprendemos a derrotar a carne é vital para nossa defesa espiritual. É fácil cair nas garras de satanás, quando a pessoa já está liberta, mas dá espaço, brecha ao cederem a carne! isso é dar livre acesso ao diabo, dar legalidade para ele agir. Mas conhecendo o Reino de Deus aprendemos que devemos crucificar a carne e viver conforme o espírito, enquanto estamos neste mundo. O perigo é que cristãos pecam porque vivem na carne e assim abre um portal para o inimigo entrar e ele faz um estrago danado. Porque a vida espiritual desses cristãos estão vulneráveis e até por fim perdem-se e vivem nas trevas. E vivendo nas trevas o inimigo nem tenta mais sujeito, porque pensa que já pertence a ele. Nessa triste situação infelizmente há muita gente, e até prosperam em algumas áreas, mas não irão perpetuar, se não houver uma conversão e tocado pela misericórdia de Deus serão julgados e condenados para sempre. A alma é composta por mente, vontade e emoções, é o nosso psique. Quando vivemos para a alma, somos dirigidos por ela e não pelo Espírito. A vontade diz; &quot; eu quero&quot;, e as emoções dizem; &quot;eu sinto&quot;, e a mente diz; &quot; eu penso&quot;. Vejamos, se permitirmos que nossa alma controle-nos, então estaríamos vivendo de acordo com a carne. A qual tem como motivação satisfazer o ego, agradar a si, que é confortável o mais fácil, a natureza da carne deseja. Em (Gl) 5.16-17 Apostolo Paulo diz; &quot;Digo, porém; andai em Espirito e não cumprireis a concupiscência da carne. Porque a carne cobiça contra o Espírito, e o Espírito contra a carne; e estes opõem-se um a outro; para que não façais o que quereis&quot;. Detalhes que impedem uma intimidade com Deus, e precisamos de ser intimo do Pai para conhecer Sua Mente, Seus pensamentos, Seu propósito. Viver para satisfazer a &quot;carne&quot; ou o &quot;eu&quot;, è desobediência! E o pior amados isso atrai os demônios que nos atacam e nós não entendemos o que esta acontecendo desentendimento na família, até mesmo na igreja existem contendas e principalmente no grupo de louvor, pois era o que satanás fazia; conduzir a orquestra angelical para prestar louvores a Deus e foi ali que ele o inimigo sentiu inveja e quis ser adorado, mas nosso Deus não divide a Glória dEle com ninguém. É por isso que o inimigo foi expulso da presença de Deus. A cruz é único luar seguro que podemos estar! Cada um de nós cabe crucificar nossas atitudes, desejos, estilo de vida, oriundos do &quot; eu&quot;. Devemos estar prontos para lidar, de modo efetivo, com os conflitos espirituais que surgirão, eles já estão acontecendo e a tendência é aumentar porque o fim dos tempos esta chegando. Importante amados, que nós nos humilhamos diante de Deus e neste conflito entre o Reino de Luz e o das trevas exige mais de nós, que vivemos em obediência a Deus dentro da plenitude de Suas revelações através da Palavra. Assim o conflito entre a carne e o espírito requer que crucificamos o ego carnal, com suas paixões e desejos incontrolados, para que possamos viver pela graça e no Espirito, evitando assim que satanás infiltre-se em nossa vida. E iremos demonstrar toda superioridade do Reino de Deus ao inimigo; proclamando o Plano de Salvação e revelando o poder criativo e o sobrenatural do Senhor; ensinando, curando os doentes, expulsando demônios e levantando mortos assim como Jesus fez. ( Isaias) 61 Jesus foi convidado numa sinagoga para ler um texto aleatório, e Jesus abre o pergaminho e lê (Isaias) 61, é um texto profético mas poderia ser, poético, histórico. Também está registrado em ( Lc ) 4 Jesus diz; &quot; O Espirito do Senhor está sobre mim, o Senhor me ungiu com o Espirito do Senhor, para curar enfermos, expulsar demônios, ressuscitar mortos e pregoar o ano aceitável do Senhor!&quot; e Jesus diz ainda antes de se assentar; &quot;Hoje, se cumpre as profecias&quot;, A reação foi imediata, dos incrédulos, oque? Você, filho do carpinteiro José! As pessoas olham e julgam nosso exterior, nossas limitações, mas Deus vê nosso coração. Jesus fala mais e diz; Em verdade, em verdade vos digo! Que nenhum profeta é bem recebido na sua pátria, e havendo muitas viúvas em Israel no período de sequidão e Elias foi a sarepta realizar um milagre a uma mulher viúva.</p>\n<p>No Antigo Testamento a manifestação do Espirito Santo se realizava instantaneamente para poucos homens e mulheres de Deus, esses que conheceram a Mente de Deus, os mais íntimos do Pai. Novo Testamento a través da morte e ressurreição de Jesus Cristo a permanência é constante para todos que aceitarem Jesus como Salvador e desejarem a presença do Espirito Santo. É o que desejamos ser batizado no Espirito e foi João quem disse ; Eu batizo na água e em Nome do Pai, Filho e Espirito Santo! Mas, virá Aquele que é mais poderoso que eu e batiza no Espirito Santo e com fogo.( João) 1.32-34 Jesus também prometeu aos discípulos; Eu preciso ir ao Pai, mas vós não ficarão órfãos Eu enviarei o Espirito da verdade, que o mundo não pode ver, ou crer. ( João) 14.8 Amados irmãos! o que o homem pode aprender com Deus na criação material é importante, mas é limitado; jamais alguém poderia saber a vontade de Deus, ou conhecer a Mente de Deus, que é o que estamos buscando através de orientações neste livro, se apenas observássemos a criação (Rm) 1.8-20 Este livro é inspirado pelo Espirito Santo na revelação e na confirmação da Palavra de Deus ao homem. Vejamos desde o inicio da criação, uma das funções principais do Espirito Santo no projeto divino de redenção é a Obra de Revelar a mensagem de Deus ao homem. Esta frase talvez a mais importante deste livro! &quot; Sem a Obra do Espirito Santo, seria possível que o homem se salvasse&quot;? Para conhecer a Mente de Deus eu preciso, conhecer a Pessoa do Espirito Santo! e ser revestido do Poder do Espirito Santo, permitir que Ele faça morada e meu corpo. Sendo o templo do Espirito Santo e para isso acontecer precisamos renunciar as coisas mundanas estar aliançados, compromissados com Deus. viver na obediência, na dependência divina, ai poderemos dizer sou intimo do Pai!</p>\n<p>O Espirito Santo possui todas as características de uma pessoa, Ele é uma pessoa e é Um dos membros da divindade. Mal se começa ler a Bíblia e já se percebe que o Espirito Santo está associado com Deus é um Ser Poderoso. O Pai O Filho e O Espirito Santo desempenharam, cada um, seu papel na criação ( Gn) 1;1-2; ( Jo) 1:1-3; (Colossenses) 1.16 . Se ouve falar do &quot; Mover do Espirito Santo.&quot; Este fenômeno acontece desde o Antigo Testamento, como homens sem conhecimento intelectual, homens humildes, pescadores, agricultores, cobradores de impostos. E bem antes de Cristo os Profetas, juízes e reis, deixaram para nós nos dias de hoje, podermos ler e refletir, seus escritos, registros, testemunhos em forma de livros, provérbios, salmos, cartas com mensagens de tanta profundidade e conhecimento sobre a Obra de Deus. em tudo posso afirmar que estava presente O Espirito de Deus só podia ser a Mente do Espirito Santo iluminando aquelas mentes. Os homens eram e ainda somos movidos pelo Espirito Santo para falar com ousadia, com discernimento. Eu creio que você neste instante esta sendo visitado. Quando há presença de uma autoridade na cidade em algum evento importante, para-se tudo é guardas, seguranças, por terra e por ar, se tiver próximo do mar, também a Marinha agindo, protegendo esta autoridade. Eu sei servi o Exercito Brasileiro em Curitiba por quatro anos e mais cinco anos PM em SC e participei muitas vezes quando éramos solicitados para dar segurança as autoridades e dias antes do evento já havia treinamentos tudo muito disciplinado não podia haver erros! Porque uma autoridade estava por vir e pelas regras do homem é dever, obrigação de guarnecer e honra-los. A palavra nos diz também; honra aquém é de honra, mas a glória é de Deus. Não é maravilhoso, quando buscardes a presença do Espirito Santo e saber que no instante cria-se uma atmosfera, um manto de paz, vem uma sensação alegre e você chora, porque é muita glória são hostes angelicais ao redor do Todo Poderoso, Santo e Puro. É por isso que devemos ter temor quando se referimos as coisas de Deus. Vou repetir; deve estar inserido em nossa mente o TEMOR, TEMOR, TEMOR A DEUS. Com as coisas Santas. Deus Diz para um homem que conheceu a Mente de Deus, que falou e ouviu, e houve varias vezes o dialogo, isto é uma comunicação entre duas pessoas. Eu me refiro de Jeová nosso Deus vivo conversando com Moisés e diz; &quot; Moises, este lugar é Santo, tire as sandálias do pé! Vejamos que Deus zela pelo sagrado, pela santidade , o Senhor fala conosco; sede santo porque Eu Sou Santo! O que eu falo agora é o que eu penso, posso estar equivocado! Mas como nos dias de hoje onde há tanta propaganda de marcas, logotipos nos produtos que consumimos, seja nas roupas, nos calçados em tudo leva etiqueta ou na impressão já vem o Market. É eu que estou conjecturando, possa talvez estar nas sandálias de Moisés a marca ou símbolo do império de faraó que governava na época e Deus repudiava e ainda hoje reprova o paganismo a idolatria, porque a gloria pertence somente ao Senhor. Quando Deus tem propósito o Espirito Santo nos Prepara, nos purifica, nos santifica, deve haver uma transformação radical para estarmos alinhados a postura de um Rei, com Deus não existe meia boca, gambiarra, fezinha, vou a igrejinha, curtinho, oro um pouquinho, ai meu Deusinho, Jesuzinho, e em casa muiezinha, e para os filhos esse é o pior do mundo, outro praguinha, e chama o menor para vir em seu colo; vem cá coisinha ruim do pai. Misericórdia Senhor, digo eu. Mas quando o sujeito é enganado pelo inimigo continua; é vou ficar mais um pouquinho afastado da Igreja, sabe é muita pressão, não se pode mais nada, tudo é pecado, então, eu quero a porta espaçosa, a minha mente diz isso, e aquilo, a carne deseja as coisas do mundo e eu não sou nada bobo sei o que é bom e vou curtir a vida, daqui alguns anos eu volto para igreja, sabe é lá que se busca a salvação eles não estão errados não! E chegam a dizer morreu acabou a mente fica em dormência e o corpo pó. Sabe que é verdade mesmo! Mas o corpo vira pó e a alma fica em dormência mas ficará aos cuidados de Deus e quando Jesus voltar que a qualquer momento a trombeta vai tocar e Cristo virá numa nuvem para buscar sua noiva! Primeiramente será os que morreram em Cristo que ressuscitarão com seus corpos glorificados e todos verão evento! Isto quer dizer que os que morreram no pecado e negaram a Cristo ressuscitarão também, mas voltarão aos seus túmulos novamente para aguardar o julgamento e condenação no juízo final. E quem está na terra com sua vida pautada em Cristo também subirá com Jesus e seu corpo será glorificado para receber a coroa no Reino de Deus. O que Deus mais Se entristece, é, que para muitos, infelizmente não dará mais tempo o inimigo tragou. Antes não tinha tempo para Deus. &quot; Buscai enquanto há tempo&quot;! disse o Profeta Isaias. Voltando ao nosso objetivo, que é conhecer a Mente de Deus! tanto, homens do passado como nos dias atuais, foram e somos movidos, orientados, ou levados, arrebatados pelo Espirito Santo para dizerem exatamente o que Deus queria e quer que dissessem ou dissemos no exato momento em que Ele desejava ou deseja. O homem segundo o coração de Deus, já citado neste livro o rei Davi disse; &quot;O Espirito do Senhor fala por meu intermédio, e a Sua Palavra está na minha língua&quot;. (2 Samuel) 23.2 Entendemos agora porque Davi é segundo o coração de Deus, mesmo sendo pecador, falho e agindo algumas vezes pela carne, mas se arrepende imediatamente. Percebemos que o Espirito Santo participou ativamente na revelação da vontade de Deus naquela época. Isso há três mil anos atrás O Espirito Santo usa um jovem desprezado pelos irmãos por ter pequena estatura, mas Deus vê e procura um coração aquebrantado, que honra Seu Nome. Será que você poderia repetir o que Davi disse há mais de três mil anos? Não havia livros, na verdade teve um inicio muito lento e poucos tinha acesso a informações culturais e teológicas e surgia os primeiros filósofos nas ágoras na Antiga Grécia a.C 500, E das tecnologias como INTERNET para pesquisar e estudar sobre a Palavra de Deus é obvio que não existia.</p>\n<p>CONHECENDO A MENTE DE DEUS</p>"}, {"id": "parte-10", "num": "X", "title": "Parte X", "html": "<p>Mas a pergunta que não me cala é essa; será nos poderíamos proferir as mesmas palavras de Davi? As atitudes dos servos de Deus, são diferentes a de Davi! Hoje devo dobar meus joelhos diante do Pai, vou confessar meus pecados, estou arrependido e pela misericórdia divina entro em Sua presença e venho pedir a Sua manifestação em minha vida! Pai, vou profetizar, curar, ensinar em o Nome de Cristo. Nada disso aconteceu com Davi, ele vivia em constante comunhão com Deus! aliançado, compromissado, intimo, Davi tinha temor a Deus, para Davi não era um problema uma fardo ter que ir a igreja! Ele sentia prazer em estar na casa de Deus!. Que maravilha quando o ser humano limitado pelo sistema aqui na terra, fala com convicção do sobrenatural, estar presente em sua vida aqui no natural, no mundo físico e diz; &quot; O Espirito do Senhor fala por meu intermédio, E A Sua Palavra está na mina boca&quot;. Em outras palavras, Deus está em mim, eu sou boca de Deus, eu falo só o que edifica o nome do Senhor. Eu profetizo para sua vida, em nome de Jesus Cristo, pegue agora, tome posse e a pós você ler o texto Bíblico na sua igreja ou onde estiver evangelizando e já na oração que antecede a mensagem que você ira pregar, diga; &quot; O Espirito do Senhor falará por meu intermédio e a Sua Palavra está na minha boca, hoje serei aqui profeta de Deus pra sua vida e sou boca de Deus.&quot; Amém. Quando concluir você verá pessoas curadas, vidas restauradas, casamentos restituídos, pessoas aos prantos sendo batizadas no Espirito Santo. ( Efésios) 3.3-5 Paulo disse; que os dominadores desse século não entendiam a sabedoria de Deus. As coisas que Deus preparou para o homem nem mesmo tinham entrado no coração do homem e Paulo afirma que; &quot; Deus nos revelou pelo Espirito; porque ao Espirito a toda as cousas perscruta, até mesmo as profundezas de Deus&quot; (1 Coríntios) 2 10. para quem deseja ardentemente conhecer a Mente de Deus observe o que Paulo vem afirmar em (1 Coríntios)2.13 Paulo ressalta que as palavras que ele proferia eram &quot; Ensinadas pelo Espirito&quot;. Mais referencias que nos auxiliam ao entendimento; (Judas) 3 ; ( 2 Timóteo) 3.16-17 ; (2 Pedro) 1.3-4. Esses versículos deixam claro que o Espirito Santo Havia então revelado a Vontade de Deus ao homem. E é através do Espirito Santo que hoje também poderemos conhecer a Mente de Deus, que tanto almejamos e para que possa estar nossos propósitos, sonhos alinhados aos de Deus. A importância maior de conhecermos a Mente de Deus é salvar vidas! Este é o propósito de Deus! A Palavra proferida pelos Apóstolos foi confirmada por sinais, maravilhas e dons espirituais. Antes de Jesus subir ao céu Ele deixou a grande comissão aos Apóstolos ( Marcos ) 16.17-18 O Evangelho tinha de ser proclamado para que o homem pudesse ser batizado e salvo. Olha só o que Jesus nos garante se andarmos segundo Seus ensinamentos; &quot;E estes sinais acompanharão aos que crerem: em meu Nome expulsarão demônios; em línguas novas falarão. Pegarão serpentes com as mãos; e, se algo mortífero beberem, de modo nenhum lhes fará mal, sobre os enfermos imporão as mãos e eles serão curados!&quot; Jesus sobe à direita do Pai.&quot; Deus zela pela disciplina e a obediência! Vejamos o comentário de um Rabino Judeu poucos dias antes de Cristo, quando foi perguntado a ele, como ele entendia e oque seria verdadeiramente o Reino de Deus? Um certo Rabino Berequias, disse que quando Moises perguntou a Deus por que somente Israel (os escolhidos), dentre todas as nações, estava entregue aos Seus cuidados? E a resposta foi; &quot; porque eles tomaram sobre si o jugo de Meu Reino no Sinai,&quot; e disse; &quot; Tudo o que falou o Senhor faremos e obedecemos). ( Êxodo ) 24.7 será que foram fiéis? E hoje somos fieis a Deus? naquela época o povo acreditava na vinda do Messias, hoje nas sabemos que Ele veio a terra desfez de Sua glória se fez homem viveu como nós, porém sem pecado algum e é mais difícil de ver crentes e ser fiéis. Estudiosos, teólogos, relatam em seus livros unanimes que se Israel fizesse perfeitamente apenas por um dia a vontade de Deus! E o Messias teria vindo. Mas a teimosia o coração duro e desobediência fez com que Israel rodasse por 40 anos no deserto. Israel como uma Nação, jamais atingiu tal ideal. Verdadeiramente a vontade do céu só pode ser perfeitamente conhecida e praticada entre os homens quando &quot;O Verbo se fez carne e Habitou entre nós&quot; (João) 1.14. Jesus, a Ideia expressa de Deus, Rei dos reis veio para nos ensinar a cultura do céu, apresentou o Reino de Deus. Este Novo Reino proposto por Jesus é perfeito sem nenhuma limitação nacional, é a própria realização da ideia profética referente ao domínio de Deus, a sujeição de todas as coisas ao Senhor em Cristo que é a Ideia Expressa, Palpável, Viva, Atuante, Poderosa, Única e Esta Ideia está te visitando nesse momento e você deseja recebe-la? Crer que já está conectado com a Mente de Deus? O sobre natural para nós é o natural para Deus! está prestes a acontecer na sua vida. É ali mesmo em seu escritório, no carro, em seu aposento, na cozinha, na praia, no púlpito, no avião, no barco, no shopping onde quer que estejas você sentirá a manifestação do Espirito Santo, sinais e maravilhas é promessa de Jesus! não foi só para o Pentecostes! Também é para os dias de hoje para quem desejar e buscar com fervor a gloriosa presença, Ele se manifestará e o ambiente se transformado em milésimos de segundo tudo é transformado para melhor. É a sabedoria do céus inserida em sua mente, somente ela proporciona a paz que transcende qualquer compreensão humana. Amados irmãos! sabemos o que o rei Salomão pediu a Deus! foi sabedoria ! E foi revestido de tanta sabedoria é considerado o homem mais rico aqui na terra e reinava com muita sabedoria, construiu o maior templo todo revestido em ouro e pedras preciosas. A sabedoria hoje nós, irmãos e pastores oramos para obtê-la, na escola eu tenho observado que alunos e professores anseiam por ela, seus pais querem que seus filhos adquirem a sabedoria, as Universidades sustentam as virtudes dela, empresários, executivos dependem dela, alguns a racionalizam, outros se gabam por julgarem possui-la. Em fim todos nós buscamos mais dela. Devemos ter muito cuidado para diferenciar a sabedoria da tolice, a verdade da ficção. Somente com a sabedoria de Deus depois de conhecer a Mente de Deus é que poderemos tomar a dianteira e tornar a terra num lugar mais seguro, mais forte e mais bonito. A partir desta sabedoria inserida em sua mente você terá uma nova fase em sua vida, vai declarar vitória sobre o inimigo e não vai mais temer como outrora, será fortalecido para resolver problemas que surgirem, tomando decisões sabias, e vai descobrir o propósito de Deus para sua vida, o objetivo que Deus estabeleceu para você. O Espirito Santo esta sempre pronto a te ouvir! Ele é o Psicólogo dos psicólogos! Ai você pode falar, desabafar ao seu melhor amigo o Espirito Santo. E Expresse os desejos de seu coração, talvez segurou até hoje, algo que está te tirando o sono a paz, seus sentimentos, suas ideias, seus sonhos e anseios fale tudo, coloque tudo na presença do Senhor. A partir de hoje segundo sua fé, tudo vai mudar na sua vida. Vai refletir sobre todos os tópicos escritos neste livro. Quando acabar de ler e passado alguns dias, reflita e leia novamente principalmente alguns tópicos que mais lhes tocou para entender melhor o que Deus quer lhes dizer! Será experiências vitoriosas de homens e mulheres de Deus. Quem viver com uma vida pautada na presença de Deus, com temor, na santidade, na obediência, aliançados, comprometidos, íntimos ao Senhor e com desejo ardente de continuar a proclamar o Reino de Deus eu vejo O espirito Santo indo a sua frente abrindo o caminho e em sua caminhada uma estrada cheia de sabedoria e pavimentada com a gloriosa presença de Deus. Saibas que você possui um potencial necessário para cumprir o propósito de Deus em sua vida! Se aprisionar este potencial, sua existência não atingirá o fim proposto pelo Senhor. Deus lhes deu uma capacidade grandiosa para mudar sua atitude e suas condições mentais, internas até estejam pronto para a germinação das sementes de seu potencial, a materialização de seus sonhos. Deus pode começar a revelar Sua vontade à nossa mente renovada e tornar a ser uma realidade o Plano especial que Ele tem para cada um de nós! Quanto mais renovada for nossa mente, mais Deus vai revelando e liberando o sobre natural. Este sonho que está em dormência em seu interior é uma semente de grandeza que repousa mas esta com os dias contados para germinar e dar bons frutos, será muito produtivo. Talvez alguém nunca te falou o que vou dizer agora? Permita que o Espirito Santo aquebranta seu coração e diga quem você é ! Você é, a menina dos olhos de Deus e ai de quem tocar em você!</p>\n<p>Você é escolhido, separado para ser o verdadeiro adorador que adora em espirito e verdade. Escuta agora! A quantidade de promessas de Deus disponíveis pra ti abençoar! São mais de oito mil promessas! e você já tomou posse de algumas delas? É para seus filhos! É pra dar tapa na cara do diabo, essas promessas são somente para os filhos de Deus pra você e eu! Mas para o desqualificado, mentiroso, enganador satanás e seus seguidores perderam tudo isso. Você foi dotado de talentos naturais, dons (Pessoais, Espirituais, e Ministeriais), desejos e sonhos. E escondido dentro de todas as coisas existe o potencial para ser realizado e produzir muito mais que vemos. Você pode sim realizar qualquer coisa sendo que o seu propósito esteja alinhado ao de Deus. Só depende de você para liberar o seu potencial, Deus já lhes presenteou e se importa que você realize todos os seus sonhos porque Ele é Pai, e todo pai se alegra quando seu filho realiza sonos e é feliz. O Espirito Santo é Aquele que nos transforma! E qualquer experiência com Ele cria uma diferença notável em nossa conduta, em nosso comportamento, até mesmo nas palavras que fluem de nossa boca. Aquela procura invisível por respostas chegarão ao fim, porque vai encontrar a resposta para todas as questões mais importantes da sua vida. A ansiedade acaba a insatisfação chega ao fim. Cheio do Espirito Santo você perde todos os temores humanos com respeito ao que o homem poderia fazer contigo. Medo com reação ao fracasso acaba de vez, medo de criticas, ou se sentir inseguro e pelo contrario também quando recebe elogios. Depois de ter uma experiência com Espirito Santo, essas coisas já não importam mais, o que vale é a opinião de Deus. Diria oque Paulo já falou; &quot;Sua graça me basta&quot;, ou a presença de do Espirito Santo me basta! A presença do Espirito Santo na vida do ser humano causa impacto, tudo que você faz é para agradar ao Senhor. Quando falamos do céu, ficamos irradiantes de alegria, falamos de um Reino, um lugar muito precioso, onde á ruas de ouro e lá não há tristeza, tudo verdadeiro, mas oque é precioso, o que brilha e faz-nos alegrar-nos para sempre é Deus Pai, Filho e Espirito Santo. Então o Espirito Santo nos proporciona esta oportunidade com Sua Gloriosa presença de sermos felizes já aqui na terra e para sempre um dia lá no céu. O Espirito Santo não é uma coisa um objeto, um pássaro! Ele é o Espirito de Deus devemos ter muito cuidado quando evangelizamos na utilização de metáforas, símbolos usados na Bíblia. Espirito Santo é uma pessoa, e não simplesmente uma presença. Ele é uma pessoa que possui uma presença, uma atmosfera que emana dEle. Então o Espirito Santo não é, língua de fogo, não é vento, Ele não é chuva, não é uma pomba branca durante um culto de batismo. Se fosse o vento! como poderia ensinar aos homens? Se fosse fogo não poderia aconselhar! e se fosse pássaro não poderia falar conosco sobre ensinamentos de Cristo! Ele usa sim de varias imagens para revelar Suas obras a Sua natureza e Suas qualidades. Ele pode sim, se nos desejarmos a Sua presença entrar em nossa vida como a água, refrescando-nos. A palavra nos diz; &quot; Pois derramarei água na terra sedenta, e torrentes na terra seca; derramarei Meu Espirito sobre sua prole ( família) e Minha benção sobre seus descendentes. Eles brotarão como relva nova, como salgueiros junto a regatos&quot;. ( Isaias) 44.3-4 Ele pode mover-se de maneira muito rápida e repentina em nossa vida como o vento mas não é vento! A manifestação do Espirito Santo em nós é da maneira que mais necessitamos. Pode mostrar-se como alguém que cuida de nós como a mãe que amamenta o filho que esta faminto. Ele Pode vir como um médico, quando a medicina humana esgotou sua sabedoria ai entra a intervenção divina, cura doenças incuráveis, ressuscita mortos, restitui órgãos do corpo humano , dá rim zero bala par quem não tinha mais e estava condenado fazer hemodiálise para o resto da vida, mas é alcançado pelo favor divino, pelo Medico dos médicos Dr. Jeova Rafá ( Deus que cura) o Deus vivo representado pelo Espirito Santo. Quando aceitamos verdadeiramente que o Espirito Santo é uma pessoa, nossa experiência cristã muda drástica, instantânea, e satisfatoriamente em todas as áreas de nossa vida.</p>\n<p>Infelizmente muitos cristãos ainda não aprenderam que não devemos pecar contra o Espirito Santo! Porque não conhecem a pessoa do Espirito Santo. Pois quem nos dá avida é o Espirito Santo. &quot; O Espirito Santo vivifica&quot; ( 2 Coríntios) 3.6b &quot; O Espirito da Vida&quot; ( João) 6.63b. O dom da vida é precioso e inestimável. Vejamos a ação do Espirito Santo em nossa salvação Ele não só convence o homem do pecado e que devemos andar na dependência de Deus, como no nascimento de Cristo, foi o Espirito Santo quem engravidou Maria mãe de Jesus! E foi assim o nascimento de Jesus. Maria uma jovem de coração puro que achou graça aos olhos de Deus, estava prometida em casamento a José, mas antes que se unissem, achou-se grávida pelo Espirito Santo, mas depois de José ter refletido na situação e em até abandoná-la, pois corria risco de serem apedrejados até a morte. Principalmente a mulher, na cultura da época eram apedrejadas quando encontrada numa situação como tal. E apareceu-lhe um anjo do Senhor em sono e lhes disse; &quot; José, filho de Davi ( da raiz, descendência de Davi), não tema receber Maria como sua esposa, pois o que nela foi gerado procede do Espirito Santo&quot; (Mt) 1.18-20 foi o Espirito Santo quem possibilitou a vinda de Jesus a terra para nos salvar! O Espirito Santo é a própria vida de Deus habitando em nosso íntimo. &quot; Eu pedirei ao Pai e Ele vos dará outro conselheiro ( advogado, aquele que esta ao seu lado o tempo todo para te defender e instruir) e para estar com vocês para sempre&quot;. Vejamos &quot; É o Espirito da verdade que o mundo não pode recebe-lo porque não o vê e nem conhece. Mas vocês o conhecem, pois Ele vive com vocês e estará em vocês&quot;. (João) 14.16-17 Percebemos o que Jesus prometeu, para quem for fiel e andar nos trilhos da salvação e enfatiza ao dizer &quot; vocês conhecem!&quot; Promete o Espirito de Deus, e eu gostaria que você fizesse uma pausa na leitura e refletisse na quilo que eu falei ainda na introdução deste livro, bem no inicio algo muito importante como ninguém melhor do que nosso próprio espirito para conhecer nossa intimidade, nossos sonhos guardados, segredos etc. Como Deus é maravilhoso e sempre nos dá a mais do que buscamos, alhas, Ele nos dá sempre com abundancia! Jesus afirma que a Ideia de Deus, a Mente, o Espirito do Senhor estaria conosco todos os dias, faria morada, então somos moradia de Deus, templo de Deus e através do Espirito Santo que está em nós podemos sim conhecer os sonhos de Deus, conhecer a Mente de Deus. Mas o Espirito Santo tem vários títulos e um deles é &quot;Espirito de vida&quot;, &quot; Porque por meio de Cristo Jesus a Lei do Espirito de vida me libertou da lei do pecado e da morte&quot; (Rm ) 8.2 . Como é muito importante conhecermos bem a Pessoa do Espirito Santo, e não pecarmos contra Ele que não há perdão para quem pecar contra o Espirito Santo. Em (Rm) 8.11 veremos mais ações do Espirito Santo; &quot; E se O Espirito daquele que ressuscitou &quot; Jesus&quot; dentre os mortos habita em vocês, aquele que ressuscitou a Cristo entre os mortos também dará vida a seus corpos mortais, por meio do Espirito, que abita em vocês&quot;. Entendamos que; o Espirito Santo soprará vida em qualquer pessoa que morreu em Cristo, quando Jesus voltar! O detalhe á ser observado! O sopro, para vida eterna do Espirito Santo é somente para quem morreu em Cristo, aceitou a Cristo como Salvador e teve uma vida reta na presença de Deus. Em(1 Coríntios) 3.16 Mais uma recomendação; &quot; Vocês não sabem que são santuários de Deus e que o Espirito de Deus habita em vocês?&quot; na verdade o Espirito Santo nos considera Sua habitação e muitos cristãos ainda não sabem ou não zelam, porque o Espirito de Deus só habita em casa restaurada, limpa e em taperas abandonadas, carregadas de vícios, rancor, ódio o Espirito recusa em habitar. Como está minha casa? Está preparada para receber visitas? E visita muito especial que deseja permanecer para sempre, porque não é incomodo Ele nos proporciona somente alegria é nosso amigo de verdade Ele intercede Ele é a Fonte da provisão e intercede por nós com gemidos inexprimíveis, naqueles momentos mais difíceis de nossa vida O Espiro clama ao Pai. Paaaaaaaaaaaaaaaai! seu filho Amarildo, necessita de Seu favor e Esse Pai que tem Seus ouvidos abertos e uma sensibilidade ilimitada e Sua mão está sempre estendida e Esse Pai que Ama Seus filhos responde o pedido de Seu Espirito! e a graça é derramada pelas mãos do Visitante vertendo da Fonte Inesgotável. O Espirito Santo é Aquele que É, que Tem, e que Faz que Habita e que Reina e há de se manifestar gloriosamente em sua vida. O Espirito Santo dá tenacidade, força e determinação a todos que buscarem, desejarem para sua vida, Ele é a fonte da própria vida. &quot; O Espirito Santo nos ajuda a proteger e preservar tudo de bom que Deus nos dá, quanto ao que lhe foi confirmado, guarde-o por meio do Espirito Santo que habita em nós&quot;( 2 Timóteo) 1.14. O Espirito Santo é o doador de toda vida. Tudo que podemos contemplar a pesar do homem não zelar da natureza, mas ainda podemos contemplar belas árvores, flores desabrochando, abro um parêntese para dizer que Deus tem me abençoado também na área musical nos louvores nos dois CDs que tenho gravado a maioria dos hinos é composição minha e o Mentor e a glória pertencem ao Espirito Santo. Em uma das composições há um hino que retrata a natureza e faço um paralelo com o homem que muitas vezes não é lembrado, no sentido valorizado e sendo mais um talentoso anônimo. A canção fala que é no silencio da noite que as mais lindas e perfumadas flores se desabrocham e o dia vem contemplar pela manhã! Existe um Deus que vê todas as coisas. O Espirito Santo elaborou milhões de maneira de trazer vida a esta terra, e Ele pensou em você e em mim, nós não estamos sozinhos temos um destino que é o céu e temos quem nos guia o tempo todo se permitirmos, porque Ele é o doador da vida. É maravilhoso observar a natureza as belezas que o Senhor imaginou e fez existir. Agradeça ao Espirito Santo agora mesmo onde estás se puder. Ó preciosos Espirito Santo, te agradeço do fundo do meu coração por ter me dado a vida e oportunidade de contemplar a natureza, por ter me dado inteligência, sabedoria, e eu possa reconhecer que Tu vives em mim e eu possa ser grato por toda minha vida ao Senhor e mostra-me Espirito Santo como posso te agradar em sinal de gratidão. Sei, que Tu me criastes Senhor, para a grandiosidade, para ser cabeça e não cauda, me criastes para te dar prazer, te adorar em espirito e verdade. Espirito Santo abraça-me, levam-me para perto de Ti e Tens liberdade de entrar em minha casa, no meu trabalho e na minha vida. Cuida de mim Espirito de Deus, em nome de Jesus, amém.</p>\n<p>O Espirito Santo também é Aquele que nos dá nova vida após operar o segundo nascimento, falo da regeneração. Podemos ver em (Tito) 3.5 &quot; Não por causa de atos de justiça por nós praticados, mas devido a Sua misericórdia, Ele nos salvou pelo lavar regenerador e renovador do Espirito Santo. O Espirito Santo é a Fonte de nossa vida e de cada aspecto de nossa vida, Ele nos criou. Foi depois do Senhor amassar o barro, moldar com carinho e parece que estou vendo a alegria do Pai olhando para Jesus e ao Seu Espirito, e dizendo; Vamos fazer uma criatura a Nossa imagem e semelhança e depois soprou na narinas de Adão dando vida, o Espirito do Pai saindo de Suas entranhas, foi quando Deus encheu seus pulmões de ar e soprou Junto com este ar, vem todo Seu DNA, e é inserido no interior de Adão, sabemos que perdemos parte desse DNA na queda do homem, mas através de Jesus seremos restituídos e nos tornamos filhos de nosso Pai. O Espirito Santo queria soprar vida em nós, Ele queria que Seu poder fosse transmitido através de nós, Ele queria e quer que Seu caráter e Sua natureza fossem evidentes e óbvios em nós, e Sua sabedoria fosse depositada em nosso coração. Ele sempre quis que nós soubéssemos o que Ele sabe, para sentir o que Ele sente, e que pudéssemos ver o que Ele enxerga. É por isso que o Espirito Santo inspirou por 1600 anos a cada um dos quarenta homens e mulheres que foram sensíveis a voz dEle, na confecção da Bíblia Sagrada. Ele nos deu a Palavra de Deus como uma arma especial, a Espada do Espirito. &quot; Usem o capacete da Salvação e a espada do Espírito, que é a Palavra de Deus&quot; (Efésios) 6.17 esta é a arma que o Espirito Santo usa contra satanás. Na batalha do mundo espiritual. Somos sabedores que não é usado fuzil, canhão e nem misseis, mas sim as Palavras do Espírito Santo são armas destrutivas que derrubam as fortalezas do diabo. Jesus utilizou-se desse material bélico contra seu inimigo no deserto, usou a Espada do Espirito e com Ela se defendeu e atacou satanás e Jesus acabou com o inimigo quando disse; &quot; Nem só de pão vive o homem, mas de toda Palavra que sai da boca de Deus. E assim o inimigo foi derrotado. A Palavra de Deus é a arma que satanás não pode suportar, e o Espirito Santo sempre percebe nossas lutas com antecedência. Ele se importa com isso e pensa em nossa vitória o tempo todo. Ele não nos deixou sem defesa e colocou Sua arma em nossas mãos, em nossos lábios e em nossas vidas, podemos ter um bom relacionamento com o Espirito Santo diariamente meditando na Palavra de Deus. (Apocalipse) 12.10 Temos de &quot;apaixonar-nos&quot; pelo Espirito Santo, para podermos viver continuamente com paz que é a ausência de conflitos em nosso interior. Amados, dúvidas são mortíferas, nada é mais venenosos do que emoções erráticas e instáveis com relação a nossa salvação. O diabo nos tormenta dia e noite, nos acusando, e culpando de tudo. O Espirito Santo é o único que pode dar-nos a confiança inabalável de que Cristo habita em nós. Maravilhas o que Jesus diz, e Ele não esta para alisar o ego de ninguém não! E doa aquém doer! vejamos; (Lc) 11.13 &quot; Se vocês, apesar de serem maus, sabem dar boas coisas aos seus filhos, quanto mais o Pai que estás no céus dará ( o que?) o Espírito Santo ( para quem?) a quem o pedir&quot;. É o Espirito Santo que nos concede os dons e talentos, para que nos possamos fazer a diferença aqui na terra! e use seus dons par abençoar as pessoas próximas de você. Oque esta acontecendo neste exato momento é um dom do Espirito Santo sendo colocado em prática. Eu sinto prazer, desejo, satisfação em escrever e editar este livro para outras pessoas possam compartilhar daquilo que o Espirito Santo tem me inspirado, revelado sobre a obra de Deus. Então eu posso chamar isso de dom do ensino. &quot; Floresça onde estiver plantado.&quot; Quanto lhe for possível, não deixe de fazer o bem aquém dele precisa&quot; ( Provérbios) 3.27. Quando pensas que estás esquecido assim como José no Egito! em terra estranha, posteriormente em uma prisão, havia perdido toda sua juventude, quando parecia que nada ia acontecer, o Propósito de Deus é concretizado, arrancando o jovem da prisão para o palácio, onde foi governo de Faraó por mais de oitenta anos! O Espirito do Senhor nos revelará aqueles sobre quem o julgamento irá cair! &quot; Então Saulo, também chamado Paulo, cheio do Espirito Santo, olhou firmemente para Elimas e disse; &quot; filho do diabo e inimigo de tudo que é justo! Você esta cheio de toda espécie de engano e maldade! Quando é que vai parar de perverter os retos caminhos do Senhor?&quot; ( Atos ) 13.9-10. O Espirito Santo fala conosco através de homens e mulheres de Deus, através de nossa consciência, através das Escrituras e O Espirito fala com nós também através dos acontecimentos. Ele nos dá discernimento com relação as nossas amizades, é algumas pessoas infelizmente são contenciosas. Suas criticas geram uma atmosfera de conflito, ira e cinismo &quot; Afaste-se destes também&quot; ( 2 Timóteo) 3.5 . Porque o Espirito Santo nos dá a paz? Pois o fruto do Espirito Santo contém a paz autentica. &quot; Sem lenha a fogueira se apaga; sem caluniador morre a contenda. O que o carvão é para as brasas e a lenha para a fogueira, o amigo de brigas é para atiçar discórdias&quot; (Provérbios) 26.20, 21. Penso que não temos dúvidas o quanto é necessário a presença do Espirito Santo em nossa vida pra conhecermos a Mente de Deus. não devemos ig
