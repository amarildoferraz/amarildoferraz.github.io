  <style>
    :root{
      --serif: 'Merriweather', Georgia, 'Times New Roman', serif;
      --sans: 'Nunito Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --bg: #faf6ef;
      --bg-panel: #ffffff;
      --text: #2b2620;
      --text-soft: #6b6255;
      --accent: #8a5a2b;
      --accent-soft: #d9c3a3;
      --border: #e7ddc9;
      --shadow: 0 6px 24px rgba(60,45,20,.08);
      --quote-bg: #f3ead9;
      --link: #8a5a2b;
      --radius: 14px;
    }

    html[data-theme="dark"]{
      --bg:#181511;
      --bg-panel:#211d17;
      --text:#eee6d8;
      --text-soft:#b5a892;
      --accent:#e0b374;
      --accent-soft:#4a3f2c;
      --border:#332c22;
      --shadow: 0 6px 24px rgba(0,0,0,.4);
      --quote-bg:#2a2419;
    }

    html[data-theme="sepia"]{
      --bg:#f1e5c9;
      --bg-panel:#f8efd9;
      --text:#4b3a20;
      --text-soft:#7a6440;
      --accent:#7a4a1e;
      --accent-soft:#e4cfa0;
      --border:#e0cd9d;
      --shadow: 0 6px 24px rgba(80,55,10,.12);
      --quote-bg:#ecdcb4;
    }

    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--sans);
      transition:background .25s ease, color .25s ease;
      -webkit-font-smoothing:antialiased;
    }

    a{color:var(--link);}

    #progress{
      position:fixed; top:0; left:0; height:3px; width:0%;
      background:var(--accent); z-index:1000; transition:width .1s linear;
    }

    header.topbar{
      position:sticky; top:0; z-index:900;
      display:flex; align-items:center; gap:.75rem;
      padding:.6rem 1rem;
      background:var(--bg-panel);
      border-bottom:1px solid var(--border);
      box-shadow:var(--shadow);
    }
    header.topbar .title-mini{
      font-family:var(--serif);
      font-weight:700;
      font-size:.95rem;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      flex:1;
    }
    .home-link{
      color:var(--text); text-decoration:none; font-family:var(--sans);
      font-size:.8rem; white-space:nowrap;
    }
    .home-link:hover{ color:var(--accent); }
    .icon-btn{
      background:none; border:1px solid var(--border); color:var(--text);
      width:36px; height:36px; border-radius:10px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; flex:none;
    }
    .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }

    .layout{
      display:flex;
      max-width:1200px;
      margin:0 auto;
    }

    nav.toc{
      width:300px; flex:none;
      border-right:1px solid var(--border);
      padding:1.25rem 1rem 3rem;
      position:sticky; top:57px;
      height:calc(100vh - 57px);
      overflow-y:auto;
    }
    nav.toc h2{
      font-family:var(--serif); font-size:1rem; letter-spacing:.04em;
      text-transform:uppercase; color:var(--text-soft); margin:.25rem 0 1rem;
    }
    nav.toc ul{ list-style:none; margin:0; padding:0; }
    nav.toc li a{
      display:block; padding:.5rem .6rem; border-radius:8px;
      color:var(--text); text-decoration:none; font-size:.86rem;
      border-left:3px solid transparent;
      line-height:1.35;
    }
    nav.toc li a:hover{ background:var(--accent-soft); }
    nav.toc li.book-title-item a{
      border-left-color:var(--accent); color:var(--accent); font-weight:800;
      background:var(--accent-soft); margin-bottom:.5rem;
    }
    nav.toc li a.active{
      border-left-color:var(--accent); color:var(--accent); font-weight:700;
      background:var(--accent-soft);
    }

    main{
      flex:1; min-width:0;
      padding:2rem 1.5rem 6rem;
    }
    .cover{
      text-align:center; padding:3rem 1rem 2.5rem;
      border-bottom:1px solid var(--border); margin-bottom:2rem;
    }
    .cover .kicker{
      font-family:var(--sans); text-transform:uppercase; letter-spacing:.18em;
      font-size:.75rem; color:var(--text-soft); margin-bottom:1rem;
    }
    .cover h1{
      font-family:var(--serif); font-size:clamp(1.8rem,4.8vw,2.8rem);
      line-height:1.25; margin:.2rem 0 1rem;
    }
    .cover .author{
      font-family:var(--sans); font-weight:700; color:var(--accent); font-size:1.05rem;
    }
    .cover .start-btn{
      display:inline-block; margin-top:1.75rem; padding:.75rem 1.6rem;
      background:var(--accent); color:#fff; border-radius:999px;
      text-decoration:none; font-weight:700; font-family:var(--sans);
      box-shadow:var(--shadow);
    }

    article.chapter{
      max-width:680px; margin:0 auto 3.5rem;
      font-family:var(--serif);
      font-size: var(--reader-size, 1.125rem);
      line-height:1.85;
    }
    article.chapter h2.chap-title{
      font-family:var(--serif); font-size:1.5rem; margin:0 0 .3rem;
      color:var(--accent); line-height:1.35;
    }
    article.chapter .chapter-subtitle{
      font-family:var(--serif); font-size:1.15rem; margin:0 0 1rem;
      color:var(--text); line-height:1.45; font-weight:700;
    }
    article.chapter .chap-eyebrow{
      font-family:var(--sans); text-transform:uppercase; letter-spacing:.14em;
      font-size:.75rem; color:var(--text-soft); margin-bottom:1rem; display:block;
    }
    .epigraph{
      margin:0 0 1.75rem; padding:.9rem 1.2rem;
      border-left:3px solid var(--accent-soft);
      font-family:var(--sans); font-style:italic; color:var(--text-soft);
      font-size:.95rem;
    }
    .epigraph p.epigraph-line{ margin:0 0 .4em; }
    .epigraph p.epigraph-line:last-child{ margin-bottom:0; }
    article.chapter p{ margin:0 0 1.2em; text-align:justify; hyphens:auto; }
    article.chapter blockquote{
      margin:1.5em 0; padding:1em 1.3em; background:var(--quote-bg);
      border-left:4px solid var(--accent); border-radius:0 10px 10px 0;
      font-style:italic;
    }
    article.chapter ul.booklist{ margin:1em 0 1.4em 1.2em; padding:0; }
    article.chapter ul.booklist li{ margin-bottom:.4em; }
    article.chapter strong{ color:var(--accent); }

    .chapter-nav{
      max-width:680px; margin:2.5rem auto 0; display:flex;
      justify-content:space-between; gap:1rem; font-family:var(--sans);
    }
    .chapter-nav a{
      flex:1; text-decoration:none; padding:.8rem 1rem; border:1px solid var(--border);
      border-radius:10px; color:var(--text); font-size:.85rem; display:block;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .chapter-nav a:hover{ border-color:var(--accent); color:var(--accent); }
    .chapter-nav a.next{ text-align:right; }

    .ad-slot{
      max-width:680px; margin:2.25rem auto; padding:1rem;
      border:1px dashed var(--border); border-radius:10px;
      text-align:center; color:var(--text-soft); font-family:var(--sans);
      font-size:.75rem; letter-spacing:.05em; text-transform:uppercase;
      min-height:90px; display:flex; align-items:center; justify-content:center;
    }

    #controls-panel{
      position:fixed; right:1rem; bottom:1rem; z-index:950;
      background:var(--bg-panel); border:1px solid var(--border);
      border-radius:14px; box-shadow:var(--shadow); padding:.6rem;
      display:flex; gap:.4rem; align-items:center;
    }

    .toc-toggle{ display:none; }
    @media (max-width: 900px){
      nav.toc{
        position:fixed; left:0; top:57px; bottom:0; z-index:800;
        background:var(--bg-panel); width:82vw; max-width:320px;
        transform:translateX(-100%); transition:transform .25s ease;
        box-shadow:var(--shadow);
      }
      nav.toc.open{ transform:translateX(0); }
      .toc-toggle{ display:flex; }
      main{ padding:1.25rem 1rem 6rem; }
      #controls-panel{ right:.6rem; bottom:.6rem; }
    }
    #overlay{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:790;
    }
    #overlay.show{ display:block; }
  </style>
</head>
<body>
  <div id="progress"></div>

  <header class="topbar">
    <button class="icon-btn toc-toggle" id="tocToggle" aria-label="Abrir índice">☰</button>
    <div class="title-mini">O Poder do Espírito Santo</div>
    <a class="home-link" href="../" aria-label="Voltar para a página inicial"><i class="fa-solid fa-house"></i> Início</a>
    <button class="icon-btn" id="themeToggle" aria-label="Alternar tema">◐</button>
  </header>

  <div id="overlay"></div>

  <div class="layout">
    <nav class="toc" id="tocNav">
      <h2>Sumário</h2>
      <ul id="tocList"></ul>
    </nav>

    <main id="main">
      <section class="cover" id="cover">
        <div class="kicker">E-book devocional</div>
        <h1>O Poder do Espírito Santo</h1>
        <div class="author">Amarildo Adão Ferraz</div>
        <a class="start-btn" href="#intro">Começar a leitura</a>
      </section>

      <div class="ad-slot" data-ad-slot="top">
        Espaço reservado para anúncio
      </div>

      <article class="chapter" id="intro">
        <span class="chap-eyebrow">Apresentação</span>
        <h2 class="chap-title">O Poder do Espírito Santo</h2>
        <div id="introBody"></div>
      </article>

      <div id="chaptersRoot"></div>
    </main>
  </div>

  <div id="controls-panel">
    <button class="icon-btn" id="fontMinus" aria-label="Diminuir fonte">A−</button>
    <button class="icon-btn" id="fontPlus" aria-label="Aumentar fonte">A+</button>
  </div>

  <script>
    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function markdownToHtml(markdown) {
      if (!markdown) return '';
      let html = markdown.trim();

      html = html.replace(/\r/g, '');
      html = html.replace(/\n{3,}/g, '\n\n');

      const blocks = html.split(/\n\n+/);
      const rendered = [];

      for (const block of blocks) {
        const trimmed = block.trim();
        if (!trimmed) continue;

        if (/^\s*[-*]\s+/.test(trimmed)) {
          const items = trimmed.split(/\n\s*[-*]\s+/).filter(Boolean).map((item) => `<li>${item}</li>`).join('');
          rendered.push(`<ul class="booklist">${items}</ul>`);
          continue;
        }

        if (/^>\s?/.test(trimmed)) {
          const lines = trimmed.split(/\n/).map((line) => line.replace(/^>\s?/, '').trim()).filter(Boolean);
          rendered.push(`<blockquote>${lines.map((line) => `<p>${line}</p>`).join('')}</blockquote>`);
          continue;
        }

        const lines = trimmed.split(/\n/).filter(Boolean);
        let paragraph = lines.map((line) => line.trim()).join(' ');
        if (!paragraph) continue;

        paragraph = paragraph
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`(.*?)`/g, '<code>$1</code>');

        rendered.push(`<p>${paragraph}</p>`);
      }

      return rendered.join('');
    }

    function slugify(value) {
      return value
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    function extractLeadLine(rawHtml) {
      if (!rawHtml) return '';
      const temp = document.createElement('div');
      temp.innerHTML = rawHtml;
      const firstParagraph = temp.querySelector('p');
      if (!firstParagraph) return '';
      const text = firstParagraph.textContent.replace(/\s+/g, ' ').trim();
      if (!text) return '';
      return text.length > 110 ? text.slice(0, 110).trim() + '…' : text;
    }

    async function loadBook() {
      try {
        const response = await fetch('../o-poder-do-espirito-santo.md');
        if (!response.ok) throw new Error('Arquivo do livro não encontrado.');
        const markdown = await response.text();

        const blocks = markdown
          .split(/(?=^#\s+)/m)
          .map((block) => block.trim())
          .filter(Boolean);

        const bookTitle = blocks[0]?.replace(/^#\s*/, '').split('\n')[0].trim() || 'O Poder do Espírito Santo';

        const introBlock = blocks.find((block) => /^#\s*Introdução\b/i.test(block));
        const introHtml = introBlock ? markdownToHtml(introBlock.replace(/^#\s*Introdução\s*/i, '').trim()) : '<p>Introdução em construção.</p>';

        const chapterBlocks = blocks.filter((block) => !/^#\s*Introdução\b/i.test(block) && !/^#\s*O Poder do Espírito Santo\b/i.test(block));

        const tocList = document.getElementById('tocList');
        const chaptersRoot = document.getElementById('chaptersRoot');
        document.getElementById('introBody').innerHTML = introHtml;

        const bookTitleItem = document.createElement('li');
        bookTitleItem.className = 'book-title-item';
        bookTitleItem.innerHTML = `<a href="#cover">${bookTitle}</a>`;
        tocList.appendChild(bookTitleItem);

        const introItem = document.createElement('li');
        introItem.innerHTML = '<a href="#intro">Apresentação</a>';
        tocList.appendChild(introItem);

        const chapters = chapterBlocks.map((block) => {
          const lines = block.split('\n');
          const title = lines.shift().replace(/^#\s*/, '').trim();
          const body = lines.join('\n').trim();
          return {
            title,
            id: slugify(title),
            html: markdownToHtml(body)
          };
        });

        chapters.forEach((chapter, index) => {
          const li = document.createElement('li');
          li.innerHTML = `<a href="#${chapter.id}">${chapter.title}</a>`;
          tocList.appendChild(li);
        });

        chapters.forEach((chapter, index) => {
          const article = document.createElement('article');
          article.className = 'chapter';
          article.id = chapter.id;

          const leadText = extractLeadLine(chapter.html);
          article.innerHTML = `
            <span class="chap-eyebrow">Seção ${index + 1} de ${chapters.length}</span>
            <h2 class="chap-title">${chapter.title}</h2>
            ${leadText ? `<h3 class="chapter-subtitle">${leadText}</h3>` : ''}
            <div>${chapter.html}</div>
          `;
          chaptersRoot.appendChild(article);

          const prev = index === 0 ? { id: 'intro', title: 'Apresentação' } : { id: chapters[index - 1].id, title: chapters[index - 1].title };
          const next = index === chapters.length - 1 ? null : { id: chapters[index + 1].id, title: chapters[index + 1].title };

          const nav = document.createElement('div');
          nav.className = 'chapter-nav';
          nav.innerHTML = `
            <a class="prev" href="#${prev.id}">← ${prev.title}</a>
            ${next ? `<a class="next" href="#${next.id}">${next.title} →</a>` : `<a class="next" href="#cover">Voltar ao início ↑</a>`}
          `;
          chaptersRoot.appendChild(nav);

          if ((index + 1) % 4 === 0 && index !== chapters.length - 1) {
            const ad = document.createElement('div');
            ad.className = 'ad-slot';
            ad.setAttribute('data-ad-slot', `mid-${index}`);
            ad.innerHTML = 'Espaço reservado para anúncio';
            chaptersRoot.appendChild(ad);
          }
        });

        const adEnd = document.createElement('div');
        adEnd.className = 'ad-slot';
        adEnd.setAttribute('data-ad-slot', 'bottom');
        adEnd.innerHTML = 'Espaço reservado para anúncio';
        chaptersRoot.appendChild(adEnd);

        const themes = ['light', 'sepia', 'dark'];
        const themeToggle = document.getElementById('themeToggle');
        function applyTheme(t){
          document.documentElement.setAttribute('data-theme', t);
          localStorage.setItem('book-theme', t);
        }
        let savedTheme = localStorage.getItem('book-theme') || 'light';
        applyTheme(savedTheme);
        themeToggle.addEventListener('click', () => {
          let idx = themes.indexOf(document.documentElement.getAttribute('data-theme'));
          const next = themes[(idx + 1) % themes.length];
          applyTheme(next);
        });

        let fontSize = parseFloat(localStorage.getItem('book-font-size')) || 1.125;
        function applyFontSize(){
          document.documentElement.style.setProperty('--reader-size', fontSize + 'rem');
          localStorage.setItem('book-font-size', fontSize);
        }
        applyFontSize();
        document.getElementById('fontPlus').addEventListener('click', () => {
          fontSize = Math.min(1.6, fontSize + 0.075);
          applyFontSize();
        });
        document.getElementById('fontMinus').addEventListener('click', () => {
          fontSize = Math.max(0.9, fontSize - 0.075);
          applyFontSize();
        });

        const tocNav = document.getElementById('tocNav');
        const overlay = document.getElementById('overlay');
        const tocToggle = document.getElementById('tocToggle');
        function closeToc(){ tocNav.classList.remove('open'); overlay.classList.remove('show'); }
        tocToggle.addEventListener('click', () => {
          tocNav.classList.toggle('open');
          overlay.classList.toggle('show');
        });
        overlay.addEventListener('click', closeToc);
        tocList.querySelectorAll('a').forEach(a => a.addEventListener('click', closeToc));

        const progress = document.getElementById('progress');
        window.addEventListener('scroll', () => {
          const h = document.documentElement;
          const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
          progress.style.width = scrolled + '%';
        });

        const sections = [document.getElementById('intro'), ...chapters.map(c => document.getElementById(c.id))];
        const linkMap = {};
        tocList.querySelectorAll('a').forEach((a) => {
          const target = a.getAttribute('href');
          if (target && target.startsWith('#')) linkMap[target.slice(1)] = a;
        });

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              Object.values(linkMap).forEach((a) => a.classList.remove('active'));
              const link = linkMap[entry.target.id];
              if (link) link.classList.add('active');
            }
          });
        }, { rootMargin: '-40% 0px -55% 0px' });

        sections.forEach((section) => section && observer.observe(section));
      } catch (error) {
        document.getElementById('introBody').innerHTML = '<p>Não foi possível carregar o conteúdo do livro neste momento.</p>';
        console.error(error);
      }
    }

    loadBook();
  </script>
</body>
</html>
