anos atrás e posterior se torna rei de Israel E o rei David disse: &quot;Reconheço as minhas transgressões e o meu pecado *está *sempre à minha frente. Contra Ti, e a Ti apenas, eu pequei e fiz *este *mal a Teus olhos... lava-me e ficarei mais branco que a neve... apaga todas as minhas iniquidades. Cria em mim um coração limpo&quot; (Salmo) 51:3-4, 7,9-10.</p>\n<p>Uma confissão apressada, superficial e menos sincera dos pecados, não é suficiente. Uma pessoa deve fazer mais do que simplesmente dizer &quot;Perdoa todos os meus pecados&quot;. A confissão deve ser minuciosa e não apressada e confessar os pecados um a um, conforme o Espírito Santo nos convence dêles.</p>\n<p>Outra condição muito importante para a confissão dos pecados e recebimento de Jesus Cristo como Salvador, é que tudo deve ser feito com fé. Os pecadores que aínda não responderam ao chamamento de Deus, estão mortos em pecados e aínda não têm fé, uma vez que continuam não-crentes, de corações endurecidos. A mensagem do Evangelho é o que os acorda para reconhecerem a sua condição pecadora e perdida. E então, &quot;a graça de Deus que traz a salvação&quot;(Tito) 2:11 entra nos seus corações, tornando-lhes possível por a sua confiança em Jesus para os salvar. Como o penitente coletor de taxas então pode exclamar: &quot;Deus, tem compaixão de mim um pecador!&quot; (Lucas) 18:13.</p>\n<p>Paulo explica como podemos receber fé, Lendo a Palavra de Deus, que nos leva ao verdadeiro arrependimento: &quot;Assim, pois, a fé *vem *pelo ouvir, e o ouvir pela Palavra de Deus&quot; (Rom) 10:17. Quando o não crente lê, ou escuta bôas mensagens evangélicas sôbre o arrependimento, o Espírito Santo coloca fé nos seus corações para acreditarem na mensagem e reagirem bem à mesma. Contudo, existem aquelas pessoas que insistem que simplesmente não podem acreditar. A soluçaão para êste problema não está na argumentação teológica, nem em convencer as pessoas de que devem apenas aceitar os factos com a mente. Essas pessoas necessitam posterior exposição à Palavra de Deus, porque o princípio mantem-se que *a fé* *vem pela Palavra de Deus. * Portanto, lendo longos textos do Novo Testamento e escutando boas pregações, lendo bons livros a fé virá a essas pessoas, na altura certa, ao receberem a Palavra viva de Deus nos seus corações. O Senhor Jesus disse notàvelmente: &quot;As palavras que Eu vos falo são espírito e *são vida*&quot; (João) 6:63.</p>\n<p>Quando a fé em Jesus como Salvador penetra aos corações dos pecadores acordados e por sua vez convencidos, eles podem ter a certeza de que Deus os receberá de braços abertos, como na parábola do filho pródigo (Lucas) 15:11-24, e que Deus é &quot;justo e justifica aquele que tem fé em Jesus&quot; (Rom) 3:26. &quot;Sem fé *é* impossível agradar-*Lhe*, porque aquele que vem a Deus deve acreditar que Ele é e *que *Ele é Quem recompensa aqueles que diligentemente O procuram&quot; (Hb) 11:6. Glória a Deus por isso!</p>\n<p>Sendo que uma vez &quot;Deus já demonstrou o Seu amor para conosco, mesmo do quanto eramos pecadores e para remir nossos pecados Cristo morreu por nós&quot;(Rom) 5:8, podemos ter a certeza de que a porta da graça de Deus está aberta para nós e que podemos entrar por ela em arrependimento e fé! Jesus disse:</p>\n<p>&quot;Aquele que vier a Mim! Eu de forma alguma repudiarei&quot; (João) 6:3.</p>\n<p>&quot;No momento em que confessarmos os nossos pecados e nos arrependermos de todo coração, (Deus) é fiel e justo para nos perdoar os nossos pecados e nos limpar de toda a Injustiça&quot; (1 João) 1:9.</p>\n<p>*A importância de conhecer melhor e acreditar *em Jesus (João) 3:16; (Atos) 16:3. Inclui mais que acreditar que Ele veio ao mundo para morrer para a nossa salvação. Nós devemos ter um conhecimento básico da Sua divindade, do plano de Deus para a salvação, da nossa responsabilidade e também da promessa de santificação feita a todos os crentes. Devemos acreditar: Que Ele é o verdadeiro Deus e vida eterna, e o único Salvador do mundo (1 João 5:20; Lucas 19:10). Que temos de nos arrepender, com a confissão dos nossos pecados para obter o Seu perdão (Mat) 9:13; (Atos) 17:30. Que Ele é capaz de fazer de nós novas criaturas, que as coisas velhas podem passar, e que tudo pode ser feito novo (2 Co) 5:17. Que Ele nos comprou com o Seu sangue e que, se O rece bermos como Salvador, daí em diante Lhe pertencemos para sermos usados por Si (1 Cor) 6:19-20; (1 Pedro) 1:18-19. Que, por causa do novo nascimento, nós iniciamos uma vida nova, que implica um processo de crescimento para atingir a maturidade espiritual (Efesios) 4:13-14; (Hb) 5:12 -- 6:1 E que devemos estar cheios do Espírito Santo, estudar a Bíblia e dedicarmo-nos a uma vida de serviço como testemunhas do Senhor (Atos) 1:8; (Efésios) 5:18; (2 Pedro) 3:18; (2 Tim) 3:16-17; (2 Tim) 4:2.</p>\n<p>Você já ouviu falar de justificação? Se ainda não? Redobre sua atenção porque há dois aspectos na salvação de pecadores, isto é, o <strong>perdão e absolvição</strong> dos seus pecados *(justificação) *e o receber de nova vida (*novo nascimento*). Estes dois aspectos estão ìntimamente ligados, porque a humanidade caída está espiritualmente morta devido ao pecado e ao seu afastamento de Deus. Ela necessita de ser justificada* e *de ser reavivada.</p>\n<p>A justificação requer a obediência à lei de Deus! Que decreta a pena de morte para os pecadores (Rm) 6:23. Todos os pecadores necessitam de alguém para morrer em seu lugar (uma morte substitutiva). E apenas alguém sem pecado pode substituir uma humanidade pecadora, visto que os pecadores apenas podem morrer (e perder-se para a eternidade) por causa dos seus próprios pecados! Mas não pelos pecados de outros. A *única * base para o perdão dos pecados é a <strong>morte substitutiva de Jesus na cruz</strong>, &quot;<strong>o Cordeiro de Deus que retira o pecado do mundo</strong>&quot; (João) 1:29. Por meio deste supremo ato de amor, Ele aceitou o castigo pelos nossos pecados para podermos obter um perdão livre, na condição de nos arrependermos, confessarmos os nossos pecados e acreditarmos nEle:</p>\n<p>Repito; &quot;Porque todos pecaram e estão destituidos da glória de Deus, sendo justificados gratuitamente pela Sua graça, através da redenção que há em Cristo Jesus, O qual Deus propôs *para ser *propiciação pela fé no Seu sangue, para demonstração da Sua justiça&quot; (Rm) 3:23-25.</p>\n<p>&quot;Ele *foi* ferido pelas nossas transgressões, *e *moído pelas nossas iniquidades, o castigo que nos traz a paz *estava *sobre Ele e pelas suas pisaduras fomos curados&quot; (Isaias) 53:5. Isaias profetiza essas palavras há setecentos anos a.C, É algo divino, é o Plano de Salvação sendo anunciado para aquele povo da época de Isaias e para nós nos dias atuais pois a Palavra é viva e eficaz sempre se renova. &quot;É somente em Jesus que temos redenção através do Seu sangue e o perdão dos pecados, de acordo com a riqueza da Sua graça&quot; (Efésios) 1:7.</p>\n<p>Todo o pecador deste mundo possui uma lista quase infindável de pecados que o condenam. As suas numerosas transgressões da lei do amor de Deus tem de ser eliminado, antes de uma pessoa poder ser reconciliada com Deus. A pergunta que se põe é se *nós* tomamos a sério a lista dos *nossos *pecados considerando-os sistemàticamente, confessando-os e abandonando cada um dêles, e aceitando o perdão de Deus pela fé? Ele perdoará então os nossos pecados tornando-nos espiritualmente vivos:</p>\n<p>&quot;E vós, que estáveis mortos nas vossas transgressões e na incircuncisão da vossa carne, Ele vivificou com Ele, perdoando-vos todas as ofensas, tendo apagado a acusação que era contra nós e contrária a nós nas Suas ordenanças, e pregando-a na cruz (Cl) 2:13-14. Para nascermos de novo é do mais alto significado na salvação dos pecadores. Com este conceito, Deus ensina-nos claramaente: Que, por causa do pecado e do nosso afastamento de Deus, estamos espiritualmente mortos e necessitmos dEle para nos dar vida, e que a nossa natureza do &quot;Velho Adão&quot; é uma natureza caída e pecadora, que Deus afirma não poder ser melhorada ou alterada, e que por conseguinte *temos* de nascer de novo para nos tornarmos novas criaturas (2 Cor) 5:17.</p>\n<p>Jesus disse a Nicodemo: &quot;Na verdade na verdade te digo que aquele que não nascer de novo não pode ver o reino de Deus&quot; (João) 3:3.</p>\n<p>A nova vida do crente, em Cristo, pode-se comparar espiritualmente à ressurreição de Jesus Cristo. Com a Sua morte por nós, nós somos perdoados, e Deus vê-nos como espiritualmente &quot;crucificados com Cristo&quot; (Gl) 2:20, mas &quot;vivos para Deus&quot; através dEle e capazes de &quot;caminhar em novidade de vida (Rom. 6:4,11).</p>\n<p>&quot;Abençoado *seja *o Deus e Pai de nosso Senhor Jesus Cristo que, de acordo com a Sua abundante compaixão, nos gerou de novo para uma esperança viva através da ressurreição de Jesus Cristo de entre os mortos&quot; (1 Pd) 1:3.</p>\n<p>A verdade que Deus não só nos perdoa os nossos pecados Ele também nos dá uma nova vida e uma nova natureza. Nós devemos conhecer o Senhor Jesus como nosso Salvador *e *como a ressurreição e a vida. Deus insufla a nova vida em todos os crentes através do Espírito Santo: de acordo com a Sua compaixão, Ele salvou-nos, através da lavagem de regeneração e renovação do Espírito Santo, O qual Ele derramou abundantemente sobre nós através de Jesus Cristo nosso Salvador&quot; (Tt) 3:5-6.</p>\n<p>O batismo de água dos crentes, ( crente é aquele que crer em Cisto como único e suficiente Salvador para sua vida) por imersão, aponta simbolicamente para a experiência acima, e constitui também uma declaração de fé no Senhor Jesus (Mc) 16:16. O testemunho de fé em Jesus Cristo, é uma condição para o batismo, visto que o batismo em si não pode salvar qualquer pessoa. &quot;E quando eles desciam a estrada, encontraram alguma água. E o eunuco disse -- Vêde, *aqui temos *água. Que é que me proibe que eu seja batizado? Então Filipe disse se acreditas com todo o teu coração podes ser. E o eunuco respondeu dizendo; Eu acredito que Jesus Cristo é o Filho de Deus&quot; (Atos) 8:36-3. E então ele foi batizado. Paulo e outros convertidos também foram batizados pouco depois de terem sido salvos (Atos) 9:18; 10:47-48; 16:31-33. Na grande comissão, (Mt) 28:19, declara-se claramente que à salvação se segue o batismo e depois a santificação e o crescimento cristão.</p>"}, {"id": "secao-5", "num": "5", "title": "É aqui que falamos sobre a santificação!", "epigraph_html": "", "html": "<p>Todo aquele que é nascido de novo da verdadeira igreja de Jesus Cristo, são instruidos no sentido de se negarem a si próprios, caminharem no Espírito e produzirem &quot;o fruto do Espírito&quot; (Gl) 5:22-23. Nós somos chamados a uma vida de sobriedade e verdadeira santidade. O primeiro princípio da santificação e discipulado é nos indicado claramente pelo próprio Senhor Jesus:</p>\n<p>&quot;Então Ele disse *a todos,* se alguém desejar seguir-Me, que se negue a si próprio, tome a sua cruz diàriamente e Me siga&quot; (Lucas) 9:23.</p>\n<p>Podemos ver em (Lucas), 14:27-33, a cruz da auto-negação está relacionada com a consideração cuidada do custo do discipulado. Deve-se fazer uma escolha definitiva entre querermos agradar aos desejos da carne (a velha natureza), ou estarmos preparados para renunciar ao mundo e servir o Senhor com todo o nosso coração e tudo quanto temos. Nós não podemos agarrar-nos à riqueza e à fama deste mundo *e* ao mesmo tempo seguir e agradar verdadeiramente ao Senhor Jesus. Poderemos nós testemunhar como Paulo, que estamos &quot;crucificados com Cristo?&quot; (Gl) 2:20, considerando-nos através da Sua cruz mortos para o mundo e seus enganosos e passageiros &quot;prazeres do pecado? (Hb) 11:25; Rm. 6:2.</p>\n<p>&quot;Deus me livre que me vanglorie a não ser na cruz de nosso Senhor Jesus Cristo, pela qual o mundo está crucificado para mim e eu para o mundo&quot; (Gl) 6:14. Se nós rejeitarmos as tendências pecadoras da velha natureza, Deus recompensar-nos-á com uma vida de vitória e verdadeira felicidade. Paulo exortou claramente os cristãos de Efeso; &quot; Quanto à vossa conduta passada, despojai-vos do velho homem que se corrompe com as concupiscências enganosas e renovai-vos no espírito da vossa mente revestindo-vos do novo homem, que foi criado por Deus em justiça e verdadeira santidade&quot; (Efésios) 4:22-24.</p>\n<p>Nosso dever é carregar* diàriamente *a cruz da autonegação. &quot;Apenas dessa maneira podemos ser verdadeiros vencedores santificados na vida cristã, e capazes de obedecer às seguintes exortações da Palavra de Deus: Portanto eu digo: Caminhai no Espírito e não seguireis as concupiscências da carne&quot; (Gl) 5:16. &quot;Mas, como Aquele que vos chamou *é* Santo, sede vós também santos em toda a *vossa *conduta, porque está escrito, Sede santos porque Eu sou santo&quot; (1 Pedro) 1:15-16; 9 (Levítico). 11:44-45. &quot;Porque esta é a vontade de Deus a vossa santificação... Porque Deus não nos chamou para a imundícia, mas para a santidade. Portanto, aquele que rejeita *isto *não rejeita o homem, mas rejeita Deus, que também nos deu o Seu Espírito Santo&quot; (1 Tessal) 4:3, 7-8.</p>\n<p>Através da santificação e da fiel dedicação ao Senhor, que dela resulta, Ele pode transformar-nos em instrumentos puros e eficazes, aptos para o Seu serviço. Ele habilita-nos a produzir o fruto do Espírito, a fazermos frente aos ataques de Satanás, (Efésios) 6:10-11, a obedecer a todas as exigências do discipulado, a manter-mo-nos fiéis aos princípios divinos perante a oposição e as tentações, e a perseverar no caminho estreito até à vinda do Senhor Jesus (Hb) 12:1-2. Deixar de obedecer ao comando de sermos santos reduz muitos cristãos ao deplorável baixo estado espiritual e moral evidente na igreja de Corinto: &quot;E eu, irmãos, não podia falar-vos como a *pessoas * espirituais, mas sim como a carnais, como os recém-nascidos em Cristo. Eu alimentei-vos com leite e não com alimento sólido, pois até agora não éreis capazes * de recebê-lo *e mesmo agora aínda não sois capazes.* *Pois continuais a ser carnais. Pois onde *há *inveja, luta e divisões entre vós, não sereis carnais e a proceder como simples homens?</p>\n<p>(<strong>1 Cor)3:1-3; *Carnal * é * da carne refere-se à velha natureza que deve ser crucificada.</strong>*</p>\n<p>No mundo de hoje, muitas igrejas estão cheias de membros não-espirituais, infrutíferos, sem poder, zaragateiros, mundanos, amantes de diversões, cujo serviço se limita a problemas sociais, sem contarmos os membros que são apenas crentes nominais tendo apenas uma semelnança de santidade (2 Tm) 3:5. Aínda pior é a reação de alguns membros de congregações decadentes e voltadas à rebeldia, que até se exprimem abertamente contra a doutrina bíblica da santidade.</p>\n<p>Nos tempos em que vivemos, o poder do Espírito Santo também está à nossa disposição, para nos habilitar a fazer grandes coisas para o Senhor. Tudo depende da nossa determinação em servi-lo com todo o coração. Nós devemos ser obedientes e estar dispostos a dedicarmo-nos a servir Cristo. A pergunta é: Irá Ele encontrar-nos ocupados na Grande Comissão, quando voltar para levar os Seus santos para as suas mansões celestiais? Ou irá encontrar-nos na companhia de membros da igreja preguiçosos, comprometedores, não espirituais e até não regenerados, espiritualmente a dormir? (Mt) 25:1-13.</p>\n<p>O Senhor Jesus deseja discípulos que Lhe sejam verdadeiramente dedicados e ao Seu trabalho na Terra, e não aqueles que afirmam acreditar nEle, mas não Lhes dão mais que magra atenção. Nós devemos ser testemunhas da Sua graça salvadora e levar vidas santas marcadas pela oração e serviço. Os Cristãos nominais que apenas Lhes dão uma aceitação mental sem dedicação do coração hão de verificar que se enganaram a si mesmos: &quot;Nem todos os que Me dizem Senhor, Senhor, vão entrar no reino do céu, mas sim aqueles que fazem a vontade de Meu Pai que está no céu!&quot; E isto é muito grave! É importante refletir e reconcilhar-se a Cristo (Mt) 7:21.</p>\n<p>Através do poder do Espírito Santo é possível fazer a vontade do Pai e viver uma vida agradável a Deus. Se uma pessoa não se deleita em fazer a Sua vontade na Terra, como é que essa pessoa vai ser feliz no céu, onde apenas a Sua vontade é feita?</p>\n<p>Vejam só a verdade que o trabalho que nós fazemos para o Senhor, não é feito como esforço *para sermos* salvos, mas sim *porque estamos *salvos. Jesus disse: &quot;Da mesma maneira que o Pai Me enviou, assim Eu vos envio também&quot; (Jo) 20:21. Aqueles que são capazes e estão dispostos a isso, Ele envia a todas as partes do mundo a levar a Boa Nova do Evangelho a todas as gentes. O Espírito Santo nos dá o poder para levar perfeitamente esta obra vitalmente importante. Será que está o leitor (a) pronto (a) e disposto (a) a isso?</p>"}, {"id": "secao-6", "num": "6", "title": "E agora sim podemos Glorificar a Deus!", "epigraph_html": "", "html": "<p>Sim é o passo final na salvação completa é a glorificação. Ela tem lugar na primeira ressurreição, quando todos os verdadeiros cristãos vão receber corpos ressurrectos, glorificados e imortais: &quot;Olhai, Eu digo-vos aqui um mistério: Na verdade, nem todos dormiremos, mas todos seremos transformados, num momento, num abrir e fechar de olhos, ao soar a última trombeta. Pois a trombeta soará, os mortos ressuscitarão incorruptíveis e nós seremos transformados&quot; (1 Cor) 15:51-52. <strong>O que seria da mina vida sem Jesus Cristo?</strong></p>\n<p>Os mistérios, ou pormenores completos do nosso estado de glorificados no céu aínda não nos foram revelados, mas nós sabemos que, quando Jesus aparecer em todo o Seu explendor, nós seremos como Ele. Ele é o Noivo da Sua igreja e o Rei dos reis e nós partilharemos da Sua glória.</p>\n<p>&quot;A nossa cidadania é no céu, de onde ardentemente esperamos pelo Salvador, o Senhor Jesus Cristo, que transformará o nosso pobre corpo, para ser conforme o Seu glorioso corpo&quot; (Fl) 3:20-21.</p>\n<p>&quot;Amados, agora sim estamos na condição de filhos de Deus, e aínda não nos foi revelado o que vamos ser, mas sabemos que, quando Ele for revelado, seremos como Ele, porque O veremos como Ele É. E todo aquele que tem esta esperança nEle purifica-se, mesmo como Ele É puro (1 João) 3:2-3.</p>\n<p>Entendemos e praticamos a Adoração a Deus aqui na terra, nós devemos estar preparados para a próxima vida no céu, tudo pela fé! Sendo puros e santos em toda a nossa conduta. O nosso estado espiritual presente, determina a nossa futura posição. Além de sermos nascidos de novo, devemos viver vidas de dedicação ao Senhor revestidos do Espírito. Receberemos recompensas pelos nossos labores pelo Senhor a quando do julgamento do assento de Cristo (2 Cor) 5:10. A Bíblia menciona as coroas seguintes, para nos encorajar a níveis mais altos de serviço cristão: A corôa incorruptível para uma vida santa e vitoriosa (1Cor) 9:24-25. A corôa da alegria para os que ganham almas (1Ts) 2:19. A corôa de glória para os bons pastores (1Pedro) 5:2-4. A corôa da vida para os mártires cristãos (Apc) 2:10. A corôa da justiça para os que amaram a vinda do Senhor (2Tm) 4:8.</p>\n<p>Irá o leitor apresentar-se de mãos vasias nesse dia, salvo como pelo fogo? (1Cor. 3:15), ou será declarado servo fiel do seu Mestre? Será digno nesse dia de palavras do Senhor como estas: &quot;O seu Senhor disse-lhe: Bem te vai servo bom e fiel; foste fiel em algumas coisas, sobre muitas coisas te colocarei. Entra no gozo do teu Senhor (Mt) 25:21.</p>\n<p>O Senhor Jesus Cristo veio não só para nos salvar do inferno, como também para fazer de nós Seus discípulos. Ele deseja ser o nosso Salvador e Messias, mas também o nosso Amigo, Pastor, Mestre, Senhor, Rei e Noivo Celestial. &quot;Vós sois uma geração escolhida... para poderdes proclamar os louvores d&#x27;Aquele que vos chamou da escuridão para a Sua luz maravilhosa&quot; (1Pedro) 2:9. Depois da nossa salvação, somos chamados e dedicados a servir Cristo, participando em trabalho evangélico tanto em casa como no estrangeiro, para sermos membros eficientes da Sua igreja na Terra e colaboradores de Deus e de Jesus Cristo (1 Co) 3:9.</p>\n<p>É importante ressaltar que também durante esta vida estamos a ser preparados para o nosso papel futuro de governar como reis com o Senhor Jesus no Seu próximo Reino. A igreja glorificada cantará ao Cordeiro: &quot;Foste morto e redimiste-nos para Deus, com o Teu sangue, de todos...os povos... e reinaremos na Terra&quot; (Ap) 5:9-10. Em antecipação deste papel, agora nós devemos sobrepor-nos ao pecado nas nossas vidas. Devemos também travar batalha contra Satanás no mundo presente, e obter vitórias em Nome de Jesus. Não devemos contentar-nos apenas com estar salvos, mas devemos dedicar-nos por inteiro à Sua causa e segui&#x27;Lo e servi&#x27;Lo enquanto Ele permitir que aqui estejamos.</p>\n<p>Infelizmente, muitos lideres espirituais em suas pregações tentam massagear o ego de seus fiéis e deixam de falar de salvação eterna! A mentalidade mundana e a baixa espiritualidade de muitas igrejas modernas estão muito longe das normas de conduta e santidade do Senhor. A maior parte dos cristãos mostra-se satisfeita com a sua pobre condição espiritual e não consegue viver de harmonia com &quot;o alto chamamento de Deus em Jesus Cristo&quot; (Fl) 3:14. A razão deste estado de coisas, é que muitos de tais cristãos não são verdadeiramente nascidos de novo, enquanto que alguns que são, não vivem vidas vitoriosas de vencedores no Espírito Santo (At) 1:8; (Efésio) 6:10-11; (Ap) 3:11-12, 21. Os cristãos cheios do Espírito devem servir o Senhor ativamente. Produzimos nós fruto próprio, do arrependimento e usamos nós os talentos que Deus nos deu ao serviço do Senhor!</p>"}, {"id": "secao-7", "num": "7", "title": "E quando damos ouvidas as falsas doutrinas!", "epigraph_html": "", "html": "<p>Há várias fundações teológicas falsas, que o inimigo das nossas almas e seus cúmplices oferece às pessoas, quando elas desejam tornarem-se cristãs. O seu primeiro objetivo é evitar que elas decidam acreditar no Senhor Jesus para nascerem verdadeiramente de novo. No entanto, se não consegue bons resultados com o *Plano A*, ele não abandona os seus esforços, mas experimenta o *Plano B*, que inclui toda a espécie de espertamente delineados estratégias para enganar os novos convertidos com mundanismo e ignorância das verdades bíblicas, que os impedem de se tornar cristãos maduros cheios do Espírito.O que segue são algumas das fundações falsas à base das quais muitas pessoas constroiem as suas vidas, aderindo assim a uma forma de Cristianismo não-bíblico, concebido pelo homem e que é destituido de verdadeira vida espiritual.</p>"}, {"id": "secao-8", "num": "8", "title": "A ausência de um chamamento claro!", "epigraph_html": "", "html": "<p>Como resultado de uma pregação deficiente e de livros cheios de mensagens pobres, muitas pessoas não recebem um chamamento claro para se reconciliarem com o Senhor. Os pregadores conduzem as congregações a um estado de sonolência espiritual, deixando-as com a impressão de que são cristãs por serem membros de uma igreja e por concordarem com a sua profissão de fé. Os membros não são encorajados a desejar um relacionamento pessoal com o Senhor, e contentam-se com uma semelhança de retidão exterior.</p>\n<p>Acontece muito nas Igrejas do mundo todo e ultrapassa o número de trinta e cinco mil denominações cristãs na atualidade!</p>\n<p>É muitas vezes ensinado as pessoas que vão à igreja, a ideia que são boas pessoas por obedecerem a uma norma que se espera ser seguida por cristãos. Sendo elogiadas por esta ideia, elas não sentem a convicção do pecado, nem a necessidade do arrependimento e da fé em Cristo como Salvador. Não com preendem que estão perdidas. Agarram-se a crer nas suas vidas como moralmente irrepreensíveis e por isso esforçam-se por fazer boas obras na esperança de obter a aprovação da sociedade* e *de Deus. Tràgicamente, é triste e dolorido eu dizer isto; mas é verdade! Preste bem atenção! Essas boas pessoas estão a caminho do inferno se não se arrependerem.</p>"}, {"id": "secao-9", "num": "9", "title": "O QUE É REGENERAÇÃO BATISMAL?", "epigraph_html": "", "html": "<p>Muitos milhares de pessoas que vão à igreja, baseiam-se as suas vidas na fundação falsa da chamada &quot;Regeneração Batismal&quot;. Elas acreditam que o batismo de infantes lhes garante a segurança eterna. Agarram-se à ideia enganadora, que as cerimónias do batismo e da confirmação numa igreja lhes garantem a salvação. Depois de tais ritos, é-lhes dito que, com eles, estabelecem um acordo eterno com Deus. Pensam que através do batismo nasceram de novo e estão a caminho do céu. A Bíblia afirma que a religiosidade, não precedida do arrependimento e da fé na obra de redenção culminada em Cristo, não nos livrará do julgamento de Deus e do inferno (Hebreus) 4:2; (2 Tm) . 3:5.</p>\n<p>A grande verdade que acontece infelizmente na vida de pessoas que dizem ser convertidas e até acreditam na salvação! É por isto que religião não salva, e somente Cristo salva. A religião de muitas pessoas consiste apenas numa mudança de conceitos. Muita da pregação é caracterizada por &quot;palavras persuasivas de sabedoria humana,&quot; e não em &quot;demonstração do Espírito e de poder&quot; (1 Cor) 2:4. Como resultado disso, a mente, dos que ouvem enchem-se de argumentos teológicos frios, destituidos de algo que mova as suas almas em resposta ao Senhor Jesus. Os ouvintes podem confessá-LO com a boca, mas os seus corações estão longe dEle (Mt) 15:8. Os seus corações não sofreram alteração, mas sim apenas os seus conceitos mentais, o que os confunde e os leva a pensar que são cristãos guiados pelo Espírito Santo, o que pode não ser verdade. A auto-retidão de nada vale: &quot;Vós sois daqueles que se justificam a si mesmos perante os homens, mas Deus donhece os vossos corações. Porque aquilo que é altamente estimado entre os homens é uma abominação aos olhos de Deus&quot; (Lc) 10:15. Tais pessoas nunca sentiram a santa tristeza que leva ao arrependimento pelos seus pecados (2 Cor) 7:10. Não podem verdadeiramente testemunhar que estão salvas e nascidas de novo, pois registrou-se apenas uma mudança superficial nas suas vidas.</p>"}, {"id": "secao-10", "num": "10", "title": "Outros com o arrependimento apenas emocional!", "epigraph_html": "", "html": "<p>Muitas pessoas são tocadas pela mensagem do evangelho apenas emocionalmente. Decidem-se por Cristo, não em fé e arrependidas, mas movidas apenas pela emoção. Porque as emoções vêm e vão, tais decisões muitas vezes não duram muito. &quot;Mas aquele que recebeu a semente em lugar pedregoso, é aquele que escuta a Palavra e a recebe imediatamente com alegria; no entanto, não tem raiz em si, e aguenta-se apenas algum tempo. Pois quando as tribulações ou perseguição chegam por motivo da palavra, ele logo tropeça&quot; (Mt) 13:20-21. Notemos que a pessoa a que nos referimos recebeu a Palavra de Deus com *alegria,* uma emoção que não se deve confundir com verdadeira fé. Uma resposta emocional e superficial, não constitui verdadeiro e profundo arrependimento dos nossos pecados, nem fé no Senhor Jesus como Salvador e como único caminha para a salvação, pode ser um arrependimento falso. Algumas pessoas podem até mencionar a data em que receberam o Senhor com alegria, mas sem arrependimento e fé em Cristo não foram verdadeiramente salvas.</p>"}, {"id": "secao-11", "num": "11", "title": "Será que adiantaria apenas acreditar?", "epigraph_html": "", "html": "<p>Vejamos, já é outra versão dos ensinamentos de uma graça barata, é que uma pessoa necessita apenas de acreditar e o céu está garantido, nada mais há a fazer! Franze-se o nariz às obras incluindo ao arrependimento do pecado. Os professores falsos que tal ensinam referem-se ao seguinte: &quot;Pois pela graça fostes salvos através da fé, e isso não de vós mesmos, *isso é* dádiva de Deus, não pelas obras, para que ninguém se vanglorie&quot; (Efésios) 2:8-9. Embora isso seja verdade, continuamos a não poder ser salvos pela graça através da fé * sem que *primeiro nos arrependamos profunda e genuìnamente de todos os nossos pecados conhecidos, confessando-os a Deus, abandonando o pecado e contando com a Sua compaixão. Se fomos salvos pela graça, devemos começar prontamente a viver uma vida de serviço a Deus com boas obras, *não * para obter a salvação, pois já a temos, mas sim para agradar a Deus ao obedecermos à Sua Palavra&quot; (Efésios) 2:10.</p>\n<p>A vida cristã requer de nós a nossa cooperação consistente e dedicada com Deus, na aplicação do Seu plano para as nossas vidas *e * para o mundo, tornando-nos assim Seus colaboradores (1 Co) 3:9. Isto exige um ato disciplinado da nossa vontade, confiando ao mesmo tempo na força abundante e graça de Deus através de Jesus Cristo. Paulo afirma que a graça do Senhor lhe tornou possível trabalhar com ardor no cumprimento do seu ministério (1 Co). 15:10.</p>"}, {"id": "secao-12", "num": "12", "title": "Diz-me aí..! Você já ouviu palavras impróprias de conforto?", "epigraph_html": "", "html": "<p>Os pecadores acordados sob a convicção do pecado procuram muitas vezes conselho entre outros cristãos para o seu profundo sentimento de culpa. É pouco sábio dizer a essas pessoas que não são tão más como julgam. Membros de família fazem isso muitas vezes, para ajudá-las a diminuir tal sentimento. Tal atitude pode destruir o trabalho de convicção do Espírito Santo sobre o pecado para levá-las à salvação. Elas devem ser ajudadas a compreender que todo o pecado é tão mau, que merece o castigo eterno no inferno. A boa nova do Evangelho, é que Deus providenciou a solução ideal para o problema, isto é, que o Senhor Jesus foi castigado na cruz pelos nossos pecados, e que, acreditando, podemos obter um perdão gratuito e a dádiva da vida eterna. Êle veio para destruir as obras do diabo (1 João) 3:8, e para nos libertar de todos os nossos pecados e do castigo para eles.</p>"}, {"id": "secao-13", "num": "13", "title": "É comum também acontecer sentimentos de dó", "epigraph_html": "", "html": "<p>Muitas vezes pena de nós mesmos, quando graves acontecimentos ocorrem nas nossas vidas e pensamos que não tivemos culpa disso. Nada de bom pode resultar de tal sentimento, pois &quot;a tristeza do mundo produz a morte&quot; (2 Co) 7:10. A tristeza que vem da convicção do pecado é a obra do Espírito Santo para nos levar ao arrependimento e a acreditar na obra de redenção de Cristo ao morrer por nós na cruz. A autocomiseração leva-nos a apresentar desculpas e a procurar simpatia (e soluções humanas, o jeitinho brasileiro), para os nossos problemas. Isto leva-nos também rua abaixo ao desastre e não ao arrependimento e à vitória sobre os nossos pecados. Devemos ler a Bíblia e passar pela verdadeira convicção do Espírito Santo, que nos levará por sua vez a pedir a Deus a Sua compaixão, perdão e ajuda. Os nossos problemas são aliviados no Calvárío, onde o preço pelos nossos pecados já foram pagos pela morte e ressurreição de Cristo. O que seria da minha vida sem Jesus Cristo?</p>\n<p>Também acontece uma grave forma de decepção emergente em algumas igrejas, é a ideia que Deus revela-se através de sinais e maravilhas pelas atividades do Espírito Santo. Isto deu origem a uma teologia de manifestações físicas dramáticas em que se acredita que, se os sinais não são evidentes, é sinal que Deus não está presente. Muitas pessoas convence-se que são cristãs, porque tiveram determinada experiência dramática, e não por terem tido a convicção dos seus pecados e se terem se arrependido deles. Algumas caiem ao chão e têm ataques de riso, uma visão, ou são curadas, e por isso acreditam que Deus as tocou e salvou devido a tais experiências.</p>\n<p>Milhões de pessoas são enganadas desta maneira, alimentando a sua fé emocional em serviços de viva adoração acompanhados de música rítmica, aliviando assim as suas consciências e levantando os seus espíritos durante alguns dias, para depois deles necessitarem de nova dose emocionalmente estimulante do mesmo. Tais pessoas deviam ler as suas Bíblias e compreender sèriamente que, quando se apresentarem diante do trono do Senhor, de nada lhes valerá dizer-Lhe: &quot;Senhor, Senhor, não...fizemos nós muitas maravilhas em Teu nome?&quot; Pois Êle lhes dirá &quot;Nunca vos conheci, afastai-vos de Mim...&quot; (Mt) 7:22-23. E nessa altura será demasiado tarde para nos arrependermos e obtermos a verdadeira e única vida que nos pode transformar em discípulos do Senhor Jesus.</p>\n<p>&quot;Todos os cristãos são cheios do Espírito&quot;</p>\n<p>Há também fundações falsas para uma vida de Santidade. Uma presunção muito comum é que, uma vez que todos os cristãos são nascidos de novo pelo Espírito Santo, êles também estão cheios do Espírito. Muitos crentes afirmam que, porque o Espírito Santo é uma pessoa que não pode ser diminuída ou acrescentada, nós não necessitamos de ser cheios de novo com o Espírito à medida que crescemos em graça (2 Pedro) 3:18.</p>\n<p>Esta afirmação é contrária ao que a Bíblia ensina, e priva muitos cristãos de uma vida vitoriosa e cheia do Espírito. O facto é que a nossa velha natureza deve ser negada e crucificada, antes da completa autoridade do Espírito Santo ser estabelecida nas nossas vidas. Os cristãos carnais de (1 Coríntios) 3:1-3 por certo que não eram cristãos cheios do Espírito, e tinham grande necessidade da experiência da santificação. Todos os crentes necessitam saber que o Espíriton Santo reside neles e que devem ser guiados por Ele. O Senhor Jesus disse: &quot;Quando... o Espírito da verdade vier, Ele vos guiará em toda a verdade&quot; (João) 16:13.</p>\n<p>O evangelho não-ofensivo</p>\n<p>Muitas das falsas fundações discutidas acima convergem no movimento moderno para o crescimento da igreja. Os pastores são encorajados por um espírito humanista de pensamento positivo e de sucesso, que os leva a apresentar o evangelho do Senhor Jesus como não-ofensivo, e tão agradável ao mundo quanto possível. Isto é feito para atrair largas multidões de seguidores populares de Jesus Cristo. E, nesta maneira positivista de apresentar o evangelho, não se faz qualquer menção das coisas &quot;negativas&quot;, como por exemplo das pessoas não-salvas serem pecadoras, do julgamento do pecado por Deus, da existência de falsos profetas, do Anticristo etc. Tais prègadores também evitam falar da cruz e do sangue de Cristo, por essas coisas estarem relacionadas com o julgamento de Deus sôbre o pecado.</p>\n<p>É um evangelho sem alma, em que se dizem muitas coisas bôas àcerca do Senhor Jesus, mas em que se oferecem as Suas bênçãos a toda a gente sem se mencionarem as consequências destruidoras do pecado e o futuro dos pecadores no contexto da ira de Deus sôbre êles, o que não traz qualquer benefício real. Aínda mais, tal evangelho não conduz a uma apreciação sã da natureza da morte de Cristo na cruz para perdão dos nossos pecados, e falta-lhe valor prático como directiva para a nossa vida, pois todos os aspectos negativos como a decepção espiritual não são mencionados e são deliberadamente ignorados. Desta maneira, a mensagem verdadeira do evangelho é rebaixada e eventualmente silenciada. Por meio de prègação desta natureza, incluindo programas de dedicação de 40 dias, as pessoas são privadas das armas espirituais necessárias a fazer frente às artimanhas do diabo (Efésios) 6:10-12).</p>"}, {"id": "secao-14", "num": "14", "title": "COMO CRESCER EM GRAÇA", "epigraph_html": "", "html": "<p>A vida cristã deve ser uma peregrinação de santificação enquanto caminhamos na luz da presença de Deus, comunicando com o Senhor Jesus e sendo contìnuamente lavados de todo o pecado pelo Seu sangue (1João) 1:7: &quot;O caminho do justo *é *como o Sol brilhante, que brilha cada vez mais para um dia perfeito&quot; (Pv). 4:18. Exige-se dedicação: &quot;ponhamos de lado todo o peso e o pecado que tão fàcilmente *nos* enreda, e corremos com perseverança a corrida que está à nossa frente&quot; (Hb) 12:1.</p>\n<p>Graça é favor. Na Bíblia, a palavra * graça *significa muitas vezes uma prenda gratuita. Assim, a graça de Deus é um *favor *de Deus, a Sua prenda gratuita para nós.</p>\n<p>O comando para crescermos em graça não quer dizer que devemos abandonar gradualmente o pecado. Estranhamente, algumas pessoas pensam que é esse o significado. Mas a Bíblia em lugar algum nos comanda que abandonemos o pecado pouco a pouco. Pelo contrário, cada palavra exige de nós que o abandonemos por completo e de imediato. Nós devemos crescer no favor de Deus, na Sua estima por nós, na Sua satisfação connosco e em procurar merecer o Seu favor.</p>"}, {"id": "secao-15", "num": "15", "title": "Condições para o crescimento espiritual!", "epigraph_html": "", "html": "<p>O que se segue são algumas das condições básicas a que devemos obedecer, se quizermos crescer em graça:</p>\n<p>Já devemos estar *em *graça. Da mesma maneira que o crescimento ou aumento de qualquer coisa implica um começo, o crescimento no favor de Deus implica que já obtivemos favor a Seus olhos. Já estamos em dívida pela graça recebida; na qualidade de um dos favoritos de Deus, já estamos * em graça*.</p>\n<p>Os nossos pecados foram abandonados e perdoados. O crescimento em graça pressupõe que já nos arrependemos dos nossos pecados, que, na prática, já abandonamos todo o pecado conhecido. Ser aprovado por Deus implica que fomos perdoados e favorecidos por Ele por amor ao nosso Senhor, Jesus Cristo. O Seu favor pressupõe que renunciamos à rebelião contra Deus. Nós nunca podemos manter-nos no favor de Deus se conscientemente pecarmos contra Ele.</p>\n<p>Crescimento contínuo. Quando a graça começa, passa a haver lugar em nós para um crescimento eterno. À medida que conhecermos melhor Deus, seremos capazes de amÁ-lo mais, mostrando uma confiança mais vasta e profunda n&#x27;Ele. Deus revela-Se-nos em Jesus Cristo, e n&#x27;Ele descobrimos a verdadeira personalidade do Deus infinito. O texto diz, portanto: &quot;Crescei na graça* e *no conhecimento de nosso Senhor e Salvador Jesus Cristo&quot;. Quanto mais amarmos, acreditarmos e conhecermos Deus. Se nos conformarmos com este conhecimento, <strong>mais Deus se agradará de nós</strong>; e, quanto mais nos elevarmos no Seu favor, <strong>mais Ele nos abençoará e usará ao Seu serviço.</strong></p>\n<p>Completa dedicação a Deus. Para <strong>crescer</strong> em graça devemos aumentar o conhecimento que temos do significado de nos termos entregado completamente a Deus. Pega esta meu irmão! <strong>A verdadeira conversão inclui a nossa consagração a Deus com tudo quanto possuimos e fazemos.</strong> Os novos crentes não se apercebem de tudo quanto as mais elevadas formas de consagração exigem: A entrega completa de tudo quanto somos, possuimos,e desejou e amou! Logo que qualquer destes elementos entre na nossa mente, e que é uma das condições do crescimento no favor de Deus. À medida que recebemos nova luz, a nossa consagração deve alargar-se cada dia e cada hora, para o nosso crescimento não parar. Quando não colocamos tudo no altar da consagração, nesse mesmo instante paramos de crescer. Que esta verdade entre fundo nos nossos corações.</p>\n<p>Conformidade com o ensino do Espírito Santo. Uma nova condição para o crescimento é a constante conformidade com os ensinamentos do Espírito Santo. Nós temos de aprofundar a nossa prática cristã, procurando luz espiritual através da iluminação do Espírito Santo. Não ganharemos qualquer conhecimento espiritual efetivo, senão através do ensino interior do Espírito Santo. Devemos orar constante e instantemente pelo Seu ensino, e evitarmos resistir-Lhe e ofendê-LO, continuando sempre na atitude de um discípulo de Cristo. Ele não nos ensinará através do Espírito Santo, se não renunciarmos ao eu, não vivermos sempre submetidos a Ele, e não seguirmos as Suas instruções na Bíblia.</p>\n<p>Inabalável fé em Deus. <strong>Uma fé em Deus cada vez mais *implícita* conduz ao crescimento</strong>. Nós necessitamos de uma confiança tão profunda no carácter de Deus, que confiamos n&#x27;Ele tanto nas trevas como na luz, tanto quando compreendemos os Seus caminhos e exigências como quando não compreendemos. A fé implícita é uma fé firme e inquestionável, um estado mental baseado em Deus, nas Suas promessas, na Sua fidelidade e no Seu amor! E independentemente do grau de dificuldade e aparente falta de senso que os seus comandos e circunstâncias orientadoras nos possam parecer.</p>"}, {"id": "secao-16", "num": "16", "title": "A Completa santificação", "epigraph_html": "", "html": "<p>Para termos uma alma mais profundamente santificada!</p>\n<p>O centro dos nossos desejos, amizades, emoções, sentimentos, apetites e paixões devem estar no centro da vontade de Deus, estar alinhado ao Senhor, é outra das condições para o crescimento no favor de Deus. Antes da conversão na sua condição depravada, a natureza humana é horrenda no todo. Embora a vontade esteja submetida a Deus, a alma pode continuar a ser desagradável àqueles que podem ver o seu desejo, paixão e concupiscência. E é através da alma que a tentação nos ataca. A vontade batalha contra estes apetites para mantê-los sujeitos à vontade de Deus, e se a vontade humana mantiver a sua integridade e se agarrar à vontade de Deus, o pecado não acontece. No entanto, estas tendências rebeldes prejudicam a vontade, no serviço de Deus: &quot;Porque a carne é contra o Espírito e o Espírito contra a carne; e êstes opõem-se um ao outro, de forma que vós não fazeis as coisas que desejais&quot; (Galatas) 5:17. Quando a alma se torna cada vez mais entregue e em harmonia com a devoção da vontade a Deus, nós ficamos livres para prestar serviço desimpedido a Deus. E assim, quanto mais completa for a santificação da alma, mais completamente nós estaremos no favor de Deus.</p>\n<p>Cheios com o Espírito Santo. Crescer em Deus depende de uma crescente presença do Espírito Santo. Cada passo na vida do cristão deve ser dado sob a orientação do Espírito Santo, de maneira a sermos guiados em *todas *as coisas pelo Espírito de Deus. &quot;Caminhai no Espírito e não seguireis a concupiscência da carne&quot; (Gal) 5:16. Lembremo-nos que para crescer em graça devemos crescer na plenitude do Espírito Santo.</p>\n<p>Um conhecimento mais íntimo de Cristo. Antes do crescimento em graça, devemos obter um conhecimento e experiência pessoais mais profundos de Cristo, e da maneira como Ele opera e se relaciona conosco. A Bíblia apresenta-nos Cristo como uma Pessoa viva e é assim que eu creio Cristo ressurreto. O que nos é dito sobre Ele deve levar-nos a procurar intimidade com Ele, visto que com um relacionamento pessoal com Cristo, Deus faz-nos como Ele. O que Amarildo? Somos Deuses? É claro que não, mas nosso corpo sendo santificado e um dia seráglorificado como o de Cristo e faremos obras como as de Cristo isto Ele mesmo nos diz. Conheçamo-LO na Sua plenitude, apropriando-nos pessoalmente de Cristo pela fé, em todas as áreas do nosso relacionamento com Ele. Devemos vestir-nos com Cristo, tomando-O como nosso, pois Ele é a nossa sabedoria, a nossa retidão, santificação e redenção, o nosso Profeta para nos ensinar, o nosso Rei para nos governar, o nosso Sumo Sacerdote para nos reconciliar, o nosso Mediador, o nosso Advogado, a nossa força, o nosso Salvador, o nosso esconderijo, a nossa torre alta, o nosso Capitão e Chefe, o nosso escudo, a nossa defesa, o nosso premio. Conheçamo-LO pessoalmente em cada uma destas áreas, apropriando-nos d&#x27;Ele pela fé. Isto é uma condição indispensável para o crescimento no Seu favor.</p>"}, {"id": "secao-17", "num": "17", "title": "Os nomes do Senhor Jesus Cristo!", "epigraph_html": "", "html": "<p>Os nomes do Senhor Jesus Cristo podem dividir-se em quatro categorias, a saber: O Seu nome pessoal, os Seus nomes como Deus, o Seu nome e títulos oficiais e os Seus nomes descritivos.</p>"}, {"id": "secao-18", "num": "18", "title": "Nome pessoal de Jesus:", "epigraph_html": "", "html": "<p>O nome Jesus (O Senhor [Yahweh ] é Salvação; Hebreu: Yeshua) foi dado pelo próprio Deus a Seu Filho. Um anjo do Senhor apareceu a José num sonho, e diz: &quot;José, tu, filho de David, não tenhas receio de tomar Maria como tua esposa: Pois Aquele que foi concebido nela é do Espírito Santo. &quot;E ela dará à luz um Filho, e tu chamarás o Seu nome JESUS: Porque Ele salvará o Seu povo dos seus pecados&quot; (Mateus) 1:20-21. A responsabilidade de Jesus era obedecer ás normas divinas e ser o Salvador de Israel e do mundo inteiro, Jesus tinha de ser o perfeito Deus-homem. Ele tinha de se tornar homem e nascer numa geração humana (a linhagem real de David) para ser o <strong>Filho do Homem.</strong> Isso tornar-lhE, ia possivel substituir o homem e expiar os seus pecados. Por este motivo, Jesus não podia ser gerado por qualquer família ou homen e mulher sem linhagem da profecia da vinda do Messias! de forma a não herdar a natureza depravada do homem caido &quot;Não hà nenhum que faça o bem, não, nem um só&quot;, (Salmo) 14:3. O Pai Celestial gerou o Filho por meio da operação do Espírito Santo, de maneira a que, Ele como homem, pudesse tambem ser o <strong>Filho do Homem.</strong> Foi por isso que nasceu de uma virgem. E o nome da virgem era Maria e o anjo respondeu e disse-lhe: O Espírito Santo virá sobe ti e o poder do Altíssimo te cobrirá: Portanto, O Santo que nascerá de ti será chamado O Filho de Deus&quot; (Lucas) 1:27, 35.</p>\n<p>Jesus, o exaltado Filho de Deus, estava preparado para se humilhar, Ele despojou-se de Sua glória e aceitou ser enviado para a terra por Seu Pai e a se sujeitar a baixa condição de homem. Como Filho do Homem, Ele sujeitou-sE explicitamente à autoridade e vontade do Pai (Mateus) 26:39. É Por isso que eu não me canso de dizer; &#x27; O que seria da Minha vida sem Jesus Cristo?&quot;</p>"}, {"id": "secao-19", "num": "19", "title": "Agora vejamos seu Nome como Deus!", "epigraph_html": "", "html": "<p>Na Sua capacidade como Deus, Jesus é igual a, e um com o Pai; daí poder Ele dizer: &quot;Eu e Meu Pai Somos Um&quot; (João) 10:30. Aos discípulos Ele disse: &quot;Aquele que Me viu, viu o Pai&quot; (João) 14:9. O profeta Isaías deu ao povo de Israel a promessa de que lhes havia de nascer um Filho, que seria tambem Deus, e um com o Pai: &quot;Porque nos nasceu uma Criança, nos é dado um Filho: E o governo estará sobre os Seus ombros: E o Seu nome será chamado Maravilhoso, Conselheiro, O Deus Poderoso, o Pai Eterno, o Príncipe da Paz&quot; (Isaías 9:6.</p>\n<p>Em (João) capítulo 5, a igualdade de Jesus e Seu Pai, é confirmada de sete maneiras: Igual em obras (verso 19); Igual em sabedoria (verso 20); Igual em poder vivificante (verso 21); Igual em julgamento (verso 22); Igual em honra que lhes é devida (verso 23); Igual em poder recreador (verso 24); e Igual em auto-existência (verso 26).O apóstolo Paulo compreendeu a extensão total da revelação de Deus Pai através de Deus Filho: &quot;Porque nEle próprio reside corpòriamente, a totalidade da Divindade&quot; (Colossenses) 2:9.</p>\n<p>É importante saber! Que Deus Filho co-existiu toda a eternidade com Deus Pai e com Deus Espírito Santo. E isto não é laço que tenha sido estabelecido ao nascer de Jesus como Filho do Homem. &quot;O Seu caminhar tem sido de longa data, de todo o sempre&quot;. João afirma que a Palavra que se tornou carne, existiu desde o princípio com Deus, e que o mundo foi criado por Ele.&quot;No princípio era a Palavra, e a Palavra estava com Deus, e a Palavra era Deus... Todas as coisas foram feitas por Ele, e sem Ele nada foi feito do que foi feito. Nele havia vida; e a vida era a luz dos homens. E a luz brilha na escuridão; e a escuridão não a compreendeu &quot;... E a Palavra fez-se carne, e viveu entre nós, e nós vimos a Sua glória, como a glória do Unigénito do Pai, cheio de graça e verdade&quot; (João)1:1-5, 14.</p>\n<p>Paulo acrescenta à revelação divina do Senhor Jesus o seguinte: &quot;Que é a imagem do Deus invisível, o Primogénito de todas as criaturas: pois por Ele foram criadas todas as coisas que estão nos céus e que estão na terra, visíveis e invisíveis. &quot;E Ele é antes de todas as coisas, e por Ele todas as coisas existem&quot; (Colossenses) 1:15-17.</p>\n<p>Jesus é não só homem mas tambem Senhor (<strong>Kurios;</strong> Atos) 10:36, e Deus (<strong>Theos no grego, em</strong> Romanos 9:5). É importante dirigirmo-nos a Si nestas capacidades, quando se lh&#x27;E dirigimos em oração ou falamos dEle a outros. Antes da Sua ressurreição, ascensão e derramamento do Espírito Santo, Jesus era chamado apenas de <strong>Mestre </strong>(*Didaskalos, Kathegetes, Rabbi *ou *Epistates*). Apenas alguns dos Seus discípulos compreenderam que Ele era o Messias prometido (*Mashiach *ou *Cristo*) e o Filho de Deus (Mateus) 16:13-17. À Sua glorificação seguiu-se a revelação total da Sua Divindade. E, depois disto, passou a ser denominado não só como Mestre, mas tambem como Senhor e Deus.</p>\n<p>Na sua segunda epístola, Pedro refere-se a &quot;Deus e nosso Salvador Jesus Cristo&quot; (2 Pedro) 1:1. Por sua vez João diz que &quot;Jesus Cristo... é o verdadeiro Deus e vida eterna&quot; (1 João) 5:20. E Paulo refere-se a Jesus como Senhor (Efésios) 1:15.</p>\n<p>De facto, nós não deviamos falar àcêrca de Jesus sem ligar o Seu nome pessoal à Sua Divindade (Senhor Jesus) ou ao Seu nome official (Jesus Cristo), ou aínda a ambos os nomes (O Senhor Jesus Cristo).</p>\n<p>Tendo em vista a atual extensa negação do nascimento virgem e da Divindade do Senhor Jesus, nós devíamos adorá-lo e proclamá-lo sempre como Senhor e Deus. Devíamos também abster-nos de falar apenas de Cristo (O Ungido). Não está errado, mas muitas pessoas referem-se com frequência a Cristo e à vida Cristã, de uma maneira demasiado formal e impessoal, dando a impressão, nesses casos, que muitas dessas pessoas não O conhecem pessoalmente e, portanto não utilizam o seu nome pessoal.</p>\n<p>Devemos lembrar-nos, de que não existe qualquer outro nome sob os céus, dado entre os homens, por meio do qual devamos ser salvos, além do nome de Jesus (Atos) 4:12. Apelemos para o nome de Jesus, reconhecendo sempre a sua posição de Cristo e Senhor:</p>\n<p>&quot;Portanto, Deus também O exaltou grandemente e lh&#x27;E deu um nome que está acima de todos os nomes: Para que ao mencionar-se o nome de Jesus, todo o joelho se dobre dos que estão no céu, dos que estão na terra e dos que estão debaixo da terra; e que toda a língua confesse que Jesus Cristo é Senhor, para glória de Deus Pai&quot; (Filipenses) 2:9-11.</p>\n<p>Comparados com os discípulos, nós temos a vantagem de uma revelação mais completa do Senhor Jesus. Eles maravilhavam-se com o Seu poder e autoridade, mas não O conheciam em toda a Sua totalidade. No mar, exclamaram: &quot;Que espécie de homem é êste, que até o vento e as ondas lh&#x27;E obedecem?&quot; (Marcos) 4:41.</p>\n<p>O Espírito Santo dá aos crentes, um mais profundo conhecimento da riqueza insondável, da grandeza, omnipotência e graça do seu Salvador, &quot;para que possam ser capazes de compreender, juntamente com todos os santos, qual a largura, comprimento, profundidade e altura do amor de Cristo, que ultrapassa todo o entendimento, para que possam ser cheios com toda a totalidade de Deus&quot; (Efésios) 3:18-19. Nós não temos de viver na ignorância dos maravilhosos atributos e amor de Deus.</p>"}, {"id": "secao-20", "num": "20", "title": "O seu Nome oficial!", "epigraph_html": "", "html": "<p>O Senhor Jesus é tambem <strong>O Ungido </strong>(em hebreu *Mashiach, *em grego *Cristos,* em inglês *Messias* ou *Cristo*). De acôrdo com uma profecia messiânica em (Isaías), Ele tinha de ser ungido para a Sua missão especial no mundo:</p>\n<p>&quot;O Espírito do Senhor DEUS (*Adonai Yahweh*) está sobre Mim; porque o SENHOR (*Yahweh*) ungiu-Me, para pregar boas novas&quot; (Isaías) 61:1.</p>\n<p>Cristo é um título oficial inclusivo, que representa sete títulos ou capacidades oficiais, para os quais Ele foi ungido e enviado para o Mundo. 1ª é o cordeiro de Deus! A razão mais importante porque Jesus Cristo foi ungido e enviado ao mundo, foi redimir dos seus pecados a humanidade caída. Para poder fazer isso, Ele tinha de aparecer na semelhança do homem, para que pudesse oferecer-Se como sacrifício pelos nossos pecados, vertendo o Seu sangue e morrendo fisicamente na cruz. <strong>Ele tinha de se transformar no Cordeiro de Deus, do sacrifício:</strong> &quot;Porque não é possível que o sangue de novilhos e de bodes livre de pecados. Portanto, quando Ele vem ao mundo afirma: Sacrifício e ofertas não quiseram, mas um corpo Tu Me preparaste... Então disse Eu, Olho, Eu venho (no conteúdo do livro está escrito sobre Mim), para fazer a Tua vontade Ó Deus... Por cuja vontade somos santificados de uma vez para sempre, pela oferta do corpo de Jesus Cristo&quot; (Hebreus) 10:4-5, 7, 10.</p>\n<p>A lei espiritual que diz que &quot;sem o derramamento de sangue não há remissão&quot; (Hebreus) 9:22 e 9 Levítico) 17:11, foi ditada a Israel 1 500 anos antes da vinda do Messias. Dantes, milhares de animais de sacrifício haviam sido mortos, de acôrdo com as leis do Velho Testamento, de forma a que os sacerdotes levíticos pudessem propiciar pelos pecados do povo.</p>\n<p>Todos estes sacrifícios eram apenas indícios, que apontavam para a morte do Cordeiro de Deus, quando o tempo próprio chegasse. Foi João Batista que anunciou a vinda do Cordeiro: &quot;Olhai, o Cordeiro de Deus, que tira o pecado do mundo&quot; (João) 1:29.</p>\n<p>Jesus fez o sacrifício final, pelo qual pôs termo a todos os repetidos e incompletos sacrifícios do Velho Testamento:</p>\n<p>Porém, &quot;Cristo não precisava fazer, como os sumos sacerdotes faziam diariamente, sacrifícios primeiro pelos seus próprios pecados e depois pelos pecados do povo; pois Ele O fez uma única vez, quando Se ofereceu a Si próprio&quot; (Hebreus) 7:27.</p>\n<p>Isaías preparou o povo de Israel, muito antes do acontecimento, para o grande sacrifício do Messias como sumo Cordeiro de Deus:</p>\n<p>&quot;Mas Ele foi ferido pelas nossas transgressões, Ele foi moído pelas nossas iniquidades: O castigo que nos traz a paz estava sobre Ele; e com as Suas chagas somos curados... Ele foi oprimido, e Ele foi afligido, e, no entanto não abriu a boca. Ele foi (levado) como um cordeiro, para o matadouro&quot; (Isaías) 53:5-7.</p>\n<p>Neste instante da leitura você já pode reconhecer devidamente a expiação de pecados que o Cordeiro fez, através do derramamento do Seu sangue e da oferta da Sua vida na cruz? Aceitáste êsse sacrifício com fé, e foi a tua vida totalmente mudada? Pensa bem no profundo significado que êste sacrifício devia ter para ti.</p>\n<p>Ao participarmos da Santa Ceia, os símbolos do pão e do vinho significavam solene lembrança do corpo quebrado e do sangue vertido pelo Cordeiro (Lucas) 22:19-20. A pergunta que se pôe é se nós hoje reconhecemos profundamente o Senhor Jesus, no que se refere ao grande sacrifício que Ele fez por nós? Sem o reconhecimento do significado do Seu sangue, nenhum conceito de Cristo é completo:</p>\n<p>&quot;A Quem Deus enviou, para ser a propiciação, através da fé no Seu sangue... para que Ele fosse justo e o justificador de todo aquele que acredita em Jesus&quot; (Romanos) 3: 25-26.</p>"}, {"id": "secao-21", "num": "21", "title": "A nossa salvação e renascimento, baseiam-se no sangue:", "epigraph_html": "", "html": "<p>Nós somos justificados pelo Seu sangue, e salvos da ira através d&#x27;Ele (Romanos) 5:9.</p>\n<p>N&#x27;Êle temos redenção através do Seu sangue, o perdão dos pecados, de acôrdo com a riqueza da Sua graça (Efésios) 1:7.</p>\n<p>Nós somos redimidos com o precioso sangue de Cristo, como de cordeiro sem defeito ou mancha (1 Pedro) 1:18-19. Jesus Cristo lavou-nos dos nossos pecados no Seu próprio sangue (Apocalipse) 1:5. Nós estamos incluidos num Novo Testamento, pelo sangue de Cristo (1 Coríntios) 11:25.</p>"}, {"id": "secao-22", "num": "22", "title": "Importante que saibamos a nossa lavagem contínua, é tambem baseada no sangue:", "epigraph_html": "", "html": "<p>Se caminharmos na luz, como Ele está na luz, temos comunhão uns com os outros e o sangue de Jesus Cristo lava-nos de todo o pecado (1 João)1:7.</p>\n<p>O sangue de Cristo purga as nossas consciências de obras mortas, para servirmos o Deus vivo (Hebreus) 9:14.</p>\n<p>Quando Jesus se deu a Si próprio, como sacrifício pelos pecados, Ele aperfeiçoou para sempre aqueles que são santificados (Hebreus) 10:12-14). E falando em aperfeiçoar, a Igreja é um local de aperfeiçoamento dos santos, sim é ali que as pessoas se reunem para ouvir a Palavra de Deus e meditar nela, para posteriormente por em prática.</p>\n<p>Um bocadinho de fermento fermenta toda a massa. Purgai-vos portanto do velho fermento, para que sejais uma nova massa, e não estejais fermentados. Porque Cristo, o nosso Cordeiro da Páscoa, sacrificou-se por nós (1 Coríntios) 5:6-7.</p>"}, {"id": "secao-23", "num": "23", "title": "O sangue é tambem uma arma poderosa, na batalha espiritual contra o inimigo das nossa almas:", "epigraph_html": "", "html": "<p>Os mártires da grande tribulação, vencerão Satanás e o Anticristo com o sangue do Cordeiro, com a palavra do seu testemunho e por não amarem as suas vidas até à morte (Apocalipse) 12:11. Tambem para nós, há poder no Sangue do Cordeiro. ( muitas vezes se ouve por ai esta expresão &quot;Sangue de Jesus tem poder&quot;, muitos falam mas não tem noção do que estão falando e brincando com algo serio).</p>\n<p>É evidente que a posição do Senhor Jesus como Cordeiro de Deus, que deu a vida por um mundo a morrer, constitui a base de todos os seus ofícios. Com o fato de ter pago o restage pelos nossos pecados, Ele confirmou as promessas do Seu ministério profético de salvar e guiar o seu povo, e de finalmente reinar tambem com Ele. Essa posição torna-lh&#x27;E possivel servir como Sumo Sacerdote, Mediador entre Deus e o homem, Pastor, Cabeça da Sua igreja redimida, e Rei sobre a Sua herança. Assim, Ele pode ser tambem o Juiz dos Seus próprios servos, por SI nomeados, e no dia do julgamento Ele julgará todas as pessoas que rejeitarem o Seu trabalho expiatório na cruz.</p>\n<p>No livro do Apocalipse, é o Cordeiro que é mencionado 26 vezes como Aquele que vai julgar o mundo na grande tribulação, por o mundo estar em rebelião contra Si. Os reis e seus súbditos fugirão para as montanhas, escondendo-se nas cavernas, e dirão às montanhas e às rochas: &quot;Caí sobre nós, e escondei-nos da face d&#x27;Aquele que está no trono e da ira do Cordeiro: Porque o grande dia da Sua ira é chegado e quem poderá enfrentá-l&#x27;O?&quot; (Apocalipse) 6:16-17.</p>\n<p>Por outro lado, haverá aqueles que foram fiéis ao Cordeiro, e que exclamarão com gratidão:</p>\n<p>&quot;Tu és digno de pegar no livro e de abrir os seus selos; pois Tu foste morto e redimiste-nos para com Deus pelo Teu sangue, de entre todas as famílias, línguas, povos e nações; e Fizeste-nos reis e sacerdotes para o nosso Deus, e reinaremos na terra&quot; (Apocalipse) 5:9-10.</p>\n<p>Infelizmente ainda há muitas pessoas que colocam a sua fé num Evangelho popular, que não se baseia no sangue redentor do Cordeiro. Possuem vários substitutos ou falsas fundações, como uma teologia do contrato baseada na regeneração batismal (salvação pelo batismo), moralização (viver uma vida boa) ou uma santidade pelas obras (obter a salvação por boas obras). Devemos abster-nos de toda e qualquer forma de auto-santidade, e sim honrarmos o Cordeiro pela obra sem preço que Ele levou a cabou na cruz para o perdão dos nossos pecados e pelo poder de contínuar à lavagem e santificação pelo Seu sangue aos novos converdidos, aqueles que convencidos pelo Espirito Santo se tornarão filhos de Deus e herdarão além de mais de oito mil promessas a maior delas a Salvação eterna.</p>"}, {"id": "secao-24", "num": "24", "title": "O que é Profeta?", "epigraph_html": "", "html": "<p>Um profeta é aquele que anuncia ou proclama a palavra de Deus às pessoas, um prègador. Jesus Cristo teve um forte ministério profético. Entre os Seus mais conhecidos sermões, contam-se o sermão na montanha, as parábolas, e o Seu discurso profético. Muitas das grandes verdades sobre o plano de Deus para a salvação, foram proclamadas durante os Seus milagres, às refeições, em sessões de instrução aos Seus discípulos e em resposta a perguntas que lh&#x27;E eram dirigidas. Ele revelava verdades até então desconhecidas:</p>\n<p>&quot;Abrirei a Minha boca em parábolas; proferirei coisas que se mantiveram escondidas desde a fundação do mundo&quot; (Mateus) 13:35.</p>\n<p>Uma regra do Velho Testamento para os profetas, era que eles tinham de ser mensageiros de confiança, que deviam falar ao povo apenas as palavras de Deus. Nada devia ser alterado, acrescentado ou retirado da mensagem, de forma a que não se tornasse distorcida ou incompleta. Esta é a razão porque as profecias bíblicas são 100%, as precisas e verdadeiras Palavras de Deus. Os falsos profetas eram apedrejados e as suas profecias rejeitadas:</p>\n<p>&quot;Mas o profeta que presumir a falar uma palavra em Meu nome que Eu não lhe ordenei que falasse, ou que fale em nome de outros deuses, esse mesmo profeta morrerá&quot; (Deuteronômio) 18:20.</p>\n<p>Na Sua capacidade de Profeta, Jesus apenas proferiu palavras que lh&#x27;E eram dadas pelo Pai:</p>\n<p>&quot;Porque Eu não falei por Mim próprio; mas o Pai, que Me enviou, Ele deu-Me uma ordem, o que Eu devia dizer e o que Eu devia falar. E Eu sei que o Seu comando é vida eterna: Portanto, o que quer que Eu fale, Eu falo mesmo como o Pai me disse&quot; (João) 12:49-50; veja também 17:8.</p>"}, {"id": "secao-25", "num": "25", "title": "Cristo É Sumo Sacerdote e Mediador", "epigraph_html": "", "html": "<p>No Velho Testamento, o Sumo Sacerdote era o mediador que mediava entre o povo e Deus. Uma vez por ano, no Dia da Reconciliação, êle entrava no Santo dos Santos para fazer expiação pelos pecados da nação. Nenhum outro sacerdote tinha autorização para entrar naquela área, onde se encontrava a Arca do Contrato.</p>\n<p>Jesus Cristo é o Sumo Sacerdote e Mediador do Novo Testamento (Hebreus) 8:1-6 e 9:15. Para ocupar esta posição, Ele tinha de se identificar com a humanidade, tornando-se Ele próprio homem, preparando-Se para ser tentado, de maneira a poder ter compaixão pelos tentados:</p>\n<p>Era necessário se cumprir todas as coisas com os seus irmãos, para que pudesse ser um Sumo Sacerdote compassivo por exemplo ser fiel nas coisas concernentes a Deus, de forma a operar a reconciliação para os pecados do povo. Pois, uma vez que Ele Próprio sofreu ao ser tentado, Ele é capaz de socorrer os tentados.&quot; (Hebreus) 2:17-18; veja também (Hebreus) 4:15-16.</p>\n<p>Jesus não ocupou um sacerdócio Levítico, visto que os levitas eram homens mortais que sucediam uns aos outros. Eles eram também homens pecadores, que tinham de oferecer primeiro sacrifícios pelos seus pròprios pecados, e depois pelos pecados da nação, assim como nos dias atuais quem tem o chamado para evangelizar é pecador, porém busca santificação e unção para que Deus possa usá-lo. Agora eu falo de quem foi o divisor de águas e que fez e faz toda adiferença, e <strong>o que seria da minha vida sem Jesus Cristo?</strong> Jesus tem um sacerdócio perfeito e eterno!</p>\n<p>&quot;Pois aqueles sacerdotes eram feitos sacerdotes sem juramento; mas Este, com um juramento por Aquele que lh&#x27;E disse: &#x27;O Senhor jurou e não se arrependerá: Tu és um sacerdote para sempre, segundo a ordem de Melquizedeque&#x27;. Por tão grande promessa foi Jesus feito garantia de um melhor testamento. Os outros na verdade, eram muitos sacerdotes, pois não lhes era permitido continuar no sacerdócio porque morriam; mas Este Homem, porque continua para sempre, tem um sacerdócio perpétuo. Portanto Ele pode também salvar completamente, aqueles que vêm até Deus por Seu intermédio, visto que vive para sempre para interceder por eles. Pois convinha-nos tal Sumo Sacerdote, o qual é santo, inofensivo, imaculado, separado dos pecadores e mais elevado que os céus; que não necessita, como os outros sumos sacerdotes, de oferecer diariamente sacrifícios, primeiro pelos seus próprios pecados e depois pelos pecados do povo: pois isso Ele fez uma única vez, quando Se ofereceu a Si Mesmo. Porque a lei faz sumos sacerdotes de homens, que são enfermos; mas a Palavra do juramento, que veio depois da lei, faz o Filho, que é consagrado para todo o sempre&quot; (Hebreus) 7:21-28.</p>\n<p>Conheceis este Mediador, Advogado e Sumo Sacerdote, que pode compreender as nossa enfermidades, tendo já propiciado pelos nossos pecados, e que vive apenas para interceder por nós? Compreendeis a responsabilidade que tendes de seguir os Seus passos, de viver uma vida santa e consagrada a Deus e de interceder pelos outros junto do trono da graça? Compreendeis que podeis entrar no Santo Tabernáculo pelo sangue de Jesus, pelo novo e vivo caminho que Ele abriu para nós pelo Seu sangue, através do véu, até ao assento da graça? (Hebreus) 10:19-22. Visitais esse lugar com regularidade?</p>\n<p>Você pode crer que nós somos um sacerdócio real, chamados a proclamar os louvores d&#x27;Aquele que nos chamou da escuridão para a Sua luz maravilhosa! (1 Pedro)1:9. Um sacerdote tem de falar ao povo, por Deus, (levar a mensagem) e tambem interceder junto do trono da graça pelo povo (orar). Tem de viver uma vida santa e ter muito cuidado para não pecar e ofender e afastar o Espírito Santo da sua vida. Se tiver pecado, sabe onde encontrar graça, devendo procurá-la imediatamente: Se uma pessoa pecar, ela tem um advogado junto do Pai, Jesus Cristo, o Reto, e Ele é o expiador dos nossos pecados&quot; (1 João) 2:1-2.</p>"}, {"id": "secao-26", "num": "26", "title": "Cristo nosso Pastor", "epigraph_html": "", "html": "<p>Como Pastor do Seu rebanho, Cristo está totalmente dedicado ao seu bem-estar, visto tê-lo redimido por elevadíssimo preço: &quot;Eu sou o bom pastor: e o bom pastor dá a Sua vida pelas ovelhas&quot; (João) 10:11.</p>\n<p>Devemos compreender que, se Ele sacrificou a Sua vida pelas ovelhas, Ele providenciará tambem e satisfará todas as suas necessidades. E isso inclui a proteção contra o seu arqui-inimigo, o diabo, que é um ladrão e um assassino:</p>\n<p>&quot;O ladrão não vem senão para roubar e matar e para destruir: Eu, vim para que eles possam ter vida, e para que a possam ter mais abundante&quot; (João) 10:10.</p>\n<p>O pastor guia as suas ovelhas mostrando-lhes o caminho e elas seguem-o (João) 10:4). É no seu próprio interesse que sigam o Pastor, que obedeçam à Sua voz e se mantenham perto d&#x27;Ele. Se seguirem o seu próprio caminho, e se perderem, o diabo atacá-los-á, e os desgarrará (João) 10:12. Desta posição de rebeldia, há apenas um caminho a tomar, que é o caminho de volta ao Pastor, que é capaz de restaurar completamente as ovelhas feridas e perdidas! Eu aprecio e tenho louvado a Deus muito com um hino de Jair Pires; &quot;Cem Ovelhas&quot;. Muito lindo esse hino.</p>\n<p>&quot;Pois vós éreis como ovelhas desgarradas: mas regressásseis agora ao Pastor (e cuida) das vossas almas&quot; (1 Pedro) 2:25. O Pastor mantem-se fiel e cumprirá sempre as suas obrigações para com o rebanho! Ele guia em verdes pastagens águas limpidas etc.</p>\n<p>&quot;O Senhor é meu Pastor. De nada terei falta. Ele faz-me deitar sobre pastagens verdes, leva-me à beira de águas tranquilas, Ele restaura a minha alma: Ele guia-me no caminho da retidão para bem do Seu nome. Sim, embora eu caminhe pelo vale da sombra da morte, não temerei nenhum mal: Pois tu estás comigo...&quot; (Salmo) 23:1-4.</p>\n<p>Devemos lembrar-nos, que vivemos num mundo máu, que está sob a influência do diabo (1 João) 5:19. Muitas vezes, tentações, ataques do inimigo e perigos mortais vêm ao nosso encontro. O Senhor sabe quais as tentações necessárias para experimentar a nossa fé, e permite que isso aconteça. Durante tais tentações devemos render-nos sempre de novo ao &quot;grande Pastor das ovelhas&quot; (Hebreus) 13:20.</p>\n<p>Não devemos permitir que qualquer azedume penetre nos nossos corações, quando as coisas não correm de acordo com os nossos planos. Os caminhos do Senhor são mais elevados que os nossos. É importande lembrarmos diante das adversidades diária, que Deus é infinitamente maior e Poderoso comparado aos problemas e Ele tem misericordia de seus filhos. Podemos ter a certeza de que Ele fará com que todas as coisas, incluindo as nossas aflições e frustrações, operem juntas para o bem, para aqueles que confiam em Si e fielmente lh&#x27;E dedicam as suas vidas (Romanos) 8:28.</p>\n<p>O Pastor também nos guia nomeando certas pessoas idoneas, para o desempenho de certas funções no cuidado do Seu rebanho: E Ele fez alguns apóstolos, outros profetas, outros evangelistas e outros pastores e professores, para o aperfeiçoamento dos santos (Efésios) 4:11-12.</p>\n<p>O pastor, em colaboração com o conselho da igreja, é o pastor da congregação. Ele não só ensina a Palavra de Deus, mas também tem deveres pastorais para encorajar e motivar os seus membros, guiá-los em todas as decisões importantes, aconselhar os que se encontram em situações difíceis, orar pelos doentes, admoestar os passivos, os teimosos e os desviados e avisá-los contra perigos espirituais: &quot;Alimentai o rebanho de Deus que está entre vós, olhando por eles, não por constrangimento, mas de boa vontade; não por lucro aviltante, mas de mente pronta; não como senhores, sobre a Herança de Deus mas sendo exemplos para o rebanho. E quando o Grande Pastor aparecer, recebereis uma coroa de glória que não se desvanece&quot; (1 Pedro)5:2, 4.</p>"}, {"id": "secao-27", "num": "27", "title": "Cristo é Cabeça da Igreja!", "epigraph_html": "", "html": "<p>A posição de Jesus como cabeça da Igreja, estou repetindo para que memorizamos com alguns versículos bíblicos; foi um mistério que apenas foi revelado depois do estabelecimento da Igreja. O que pode-se comparar entre Cristo e a Igreja assemelha-se a uma relação matrimonial:</p>\n<p>&quot;Porque o marido é a cabeça da mulher, mesmo como Cristo é a cabeça da Igreja: E Ele é o salvador do corpo... Isto é um grande mistério: Mas eu refiro-me a Cristo e à Igreja&quot; (Efésios) 5:23, 32.</p>\n<p>Em (Efésios) 5:25-27, afirma-se claramente que Cristo ofereceu-Se a Si Próprio, para santifcar e limpar a Igreja, para que ela fosse sã e sem mácula. Ele é a nossa cabeça e o nosso Noivo, e nós devemos caminhar em santidade, com o nosso vestuário sem mácula ou ruga. Devemos ser dignos de aprovação no dia em que aparecermos perante Ele. E Ele é o único que nos pode fazer dignos, embóra seja necessário darmos-lh&#x27;E a nossa boa vontade e total cooperação.</p>\n<p>O conceito de santidade significa tambem, ser escolhidos para o serviço do Senhor. Neste contexto, somos vistos como membros do Corpo de Cristo. Todos nós desempenhamos funções diferentes, mas complementares na realização da missâo e trabalho da Igreja de Cristo na terra: &quot;Pois, da mesma maneira que nós temos muitos membros num corpo, e nenhum dos membros desempenha as mesmas funções dos outros, assim também nós, embora sejamos muitos, somos um corpo em Cristo, e todos membros uns dos outros&quot; (Romanos) 12:4-5. Para uma explicação das funções dos membros, veja por favor (Romanos) 12:6-8 e 1 (Coríntios) 12:12-31.</p>\n<p>Levai a cabo o vosso trabalho e vocação, apenas no poder e sob a orientação do Espírito Santo. &quot;Pois somos todos batizados num mesmo corpo por um único Espírito&quot; (1 Coríntios) 12:13. Devemos também compreender, que a autoridade, no nosso chamamento espiritual, reside em Cristo, que é a Cabeça. N&#x27;Ele estamos numa posição de vitória:</p>\n<p>&quot;O Deus de Nosso Senhor Jesus Cristo, ressuscitou-O dos mortos e sentou-O à Sua própria mão direita, nos lugares celestiais, acima de todo o principado e força e poder e domino e de todo o nome nomeado, não só neste mundo mas também naquele que está para vir: e colocou todas as coisas sob Seus pés e dedicou-O como Cabeça sobre todas as coisas da Igreja, que é o Seu corpo, a totalidade d&#x27;Ele, que preenche tudo em todos&quot; (Efésios) 1: 17-23.</p>"}, {"id": "secao-28", "num": "28", "title": "Porque Rei dos reis?", "epigraph_html": "", "html": "<p>Porque o Senhor Jesus tem todo o poder no céu e na terra, também ocupa a posição de Rei. No ambito da Sua vontade permissiva, no sistema presente, as nações podem rebelar-se contra a Sua autoridade, o que certamente fazem. Deus permite estas ações, porque deu ao homem livre arbítrio para escolher entre o bem e o mal. Na prática, a escolha errada predomina, devido a que a maior parte das pessoas prefere a escuridão à luz, porque as suas obras são más (João) 3:19. O deus deste mundo, o (diabo), cegou as suas mentes (2 Coríntios) 4:4 e enganou-as levando-as a seguir o caminho da escuridão. Consequentemente, &quot;o mundo inteiro está envolto na maldade,&quot; você já observou uma criança mesmo sendo bebe tem uma tendencia, um instinto negativo, do não quero! Não vou, negando a obediência aos pais e uma tendência, uma inclinação à rebeldia, e isto ficou inserido no homem após aqueda de Adão! Mas Cristo tem o poder de quebrar toas as maldições. (1 João) 5:19.</p>\n<p>Como Cristãos, nós estamos a viver num mundo máu, as pessoas são más, tem inveja, odeia, oprime e rejeita, por causa da nossa fé (João) 15:18-19; 16:33; e (Lucas) 6:22-23 e 26. Lembram que eu falei no inicio deste Livro que nós somos estrangeiros e peregrinos, num mundo que rejeita a Deus! (Hebreus) 11:13; (1 Pedro) 2:11 e somos chamados a brilhar como luzes, no meio de uma geração perversa, incredula e má.</p>"}]}</script>
<script>
const data = JSON.parse(document.getElementById('book-data').textContent);

const tocList = document.getElementById('tocList');
const chaptersRoot = document.getElementById('chaptersRoot');
document.getElementById('introBody').innerHTML = data.intro_html;

const introLi = document.createElement('li');
introLi.innerHTML = '<a href="#intro">Apresentação</a>';
tocList.appendChild(introLi);

data.chapters.forEach((c) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${c.id}">${c.title}</a>`;
  tocList.appendChild(li);
});

data.chapters.forEach((c, idx) => {
  const art = document.createElement('article');
  art.className = 'chapter';
  art.id = c.id;
  art.innerHTML = `
    <span class="chap-eyebrow">Seção ${idx + 1} de ${data.chapters.length}</span>
    <h2 class="chap-title">${c.title}</h2>
    ${c.epigraph_html ? `<div class="epigraph">${c.epigraph_html}</div>` : ''}
    <div>${c.html}</div>
  `;
  chaptersRoot.appendChild(art);

  const prev = idx === 0 ? {id:'intro', title:'Apresentação'} : {id: data.chapters[idx-1].id, title: data.chapters[idx-1].title};
  const next = idx === data.chapters.length - 1 ? null : {id: data.chapters[idx+1].id, title: data.chapters[idx+1].title};
  const chNav = document.createElement('div');
  chNav.className = 'chapter-nav';
  chNav.innerHTML = `
    <a class="prev" href="#${prev.id}">← ${prev.title}</a>
    ${next ? `<a class="next" href="#${next.id}">${next.title} →</a>` : `<a class="next" href="#cover">Voltar ao início ↑</a>`}
  `;
  chaptersRoot.appendChild(chNav);

  if ((idx + 1) % 4 === 0 && idx !== data.chapters.length - 1) {
    const ad = document.createElement('div');
    ad.className = 'ad-slot';
    ad.setAttribute('data-ad-slot', `mid-${idx}`);
    ad.innerHTML = 'Espaço reservado para anúncio';
    chaptersRoot.appendChild(ad);
  }
});

const adEnd = document.createElement('div');
adEnd.className = 'ad-slot';
adEnd.setAttribute('data-ad-slot', 'bottom');
adEnd.innerHTML = 'Espaço reservado para anúncio';
chaptersRoot.appendChild(adEnd);

const themes = ['light','sepia','dark'];
const themeToggle = document.getElementById('themeToggle');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('book-theme', t);
}
let savedTheme = localStorage.getItem('book-theme') || 'light';
applyTheme(savedTheme);
themeToggle.addEventListener('click', () => {
  let idx = themes.indexOf(document.documentElement.getAttribute('data-theme'));
  const next = themes[(idx + 1) % themes.length];
  applyTheme(next);
});

let fontSize = parseFloat(localStorage.getItem('book-font-size')) || 1.125;
function applyFontSize(){
  document.documentElement.style.setProperty('--reader-size', fontSize + 'rem');
  localStorage.setItem('book-font-size', fontSize);
}
applyFontSize();
document.getElementById('fontPlus').addEventListener('click', () => {
  fontSize = Math.min(1.6, fontSize + 0.075);
  applyFontSize();
});
document.getElementById('fontMinus').addEventListener('click', () => {
  fontSize = Math.max(0.9, fontSize - 0.075);
  applyFontSize();
});

const tocNav = document.getElementById('tocNav');
const overlay = document.getElementById('overlay');
const tocToggle = document.getElementById('tocToggle');
function closeToc(){ tocNav.classList.remove('open'); overlay.classList.remove('show'); }
tocToggle.addEventListener('click', () => {
  tocNav.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', closeToc);
tocList.querySelectorAll('a').forEach(a => a.addEventListener('click', closeToc));

const progress = document.getElementById('progress');
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
  progress.style.width = scrolled + '%';
});

const sections = [document.getElementById('intro'), ...data.chapters.map(c => document.getElementById(c.id))];
const linkMap = {};
tocList.querySelectorAll('a').forEach(a => { linkMap[a.getAttribute('href').slice(1)] = a; });
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      Object.values(linkMap).forEach(a => a.classList.remove('active'));
      const link = linkMap[entry.target.id];
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-40% 0px -55% 0px' });
sections.forEach(s => s && observer.observe(s));
</script>
</body>
</html>
