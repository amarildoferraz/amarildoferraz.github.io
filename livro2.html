 é apenas parte dos milagres que Cristo realizou e já é suficiente para entendermos e crermos em Seu poder. Hoje seguidores de várias denominações religiosas não cristãs, visitam e tem a liberdade de visitar os túmulos dos fundadores de sua fé e lá há restos mortais de seus líderes e que provavelmente deixaram um bom legado, bons exemplos a serem seguidos e ensinamentos sobre ética, moral até mesmo de amor, misericórdia e perdão tudo isso esses líderes que são adorados pelos seus seguidores podem ter realizado, mas eles, (seus espíritos) estão descansando em um local intermediário que Deus tem preparado e seus corpos tornam-se matéria, pó. Já Cristo, nos dá a esperança de vida eterna. Sabia que a visitação é muito grande no túmulo de Cristo e ao chegarem lá observam uma placa escrita em várias línguas; &quot;Aqui jaz!!!&quot; Amados, Cristo vive e vive para sempre, Ele está junto ao Pai e com Sua missão cumprida exceto a segunda vinda quando voltará para arrebatar Sua noiva, a igreja, você e eu.</p>\n<p>Está entendendo porque o título deste livro é &quot;O que seria de minha vida sem Cristo&quot;. Talvez você possa estar pensando que este pastor deve estar meio fora da casinha porque inicia seu livro narrando fatos já da vida adulta de Jesus, de Seu Ministério e nem comenta sobre o Messias anunciado tanto pelos Profetas, o milagre do nascimento e a perseguição implacável na vida de Cristo que foi do nascimento, infância, se agravando mais no período de Seu Ministério até a morte de cruz. Então, como não estou relatando na ordem cronológica, seguindo assim linha de tempo é porque penso que deve ser assim, e o Espirito Santo Age como Ele quer, onde Ele quiser e quando Ele quiser, também na vida de quem Ele quiser. Por tanto inicialmente falei de milagres de Cristo, mensagens de Jesus que estão nos Evangelhos e para quem já tem um amadurecimento Espiritual, entende fácil este processo quando se trata das obras de Deus, porque já leram, meditaram e pregaram passagens das Escrituras Sagradas. Como a do Profeta Elias; num período de sequidão eram três anos sem chuva inclusive profetizada por ele mesmo; &quot;não haverá chuva por três anos e meio&quot; e assim se fez, porque Deus honrou Seu servo? Elias tinha crédito com Deus, tinha intimidade, era aliançado e fiel com o Pai. E seu pai terreno numa época de paganismo colocou o nome de seu filho de Elias, cujo significado &quot;Só o Senhor é Deus&quot;. Então Elias adulto sabendo do propósito de Deus na sua vida foi obediente. Diante de quatrocentos e cinquenta profetas de baal e do próprio rei da época rei Acabe, desafia a todos que cairia fogo do céu. Primeiramente restaura o altar de Deus, que estava abandonado, fez todo o ritual, oferendas, holocausto que seria oferecida a Deus, mas antes de qualquer coisa ele literalmente pega uma ferramenta e faz uma vala ao redor do Altar, (para não haver desperdício de água liquido precioso que estava escassa, também a quando cavava trabalhava de joelhos representava sua fé, sua entrega total ao Dono do milagre, dos sinais e maravilhas que estava prestes a acontecer, Elias pede por três vezes água, algo que valia muito mais do que ouro, pois era um período de sequidão e ninguém estava entendendo nada naquele instante! talvez assim como você esteja pensando agora eu não estou entendendo nada o que o Pr. Amarildo escreve neste livro, pois o título é; &quot;O que seria da mina vida sem Cristo&quot; O Espirito Santo que tem o poder de convencimento, tocará em seu coração e você terá com certeza uma nova percepção de quem é Cristo para sua vida. O Profeta Elias, depois de ver uma manhã todos os profetas de baal clamando pelo seu deus e nada de respostas, Elias diz; é ele deve estar dormindo ainda num tom de deboche, diz; vocês devem clamar ainda mais alto! Em fim Elias clama ao Senhor Jeová, ao Deus verdadeiro e diz; em alta voz e com muita fé; &quot; Só o Senhor é Deus ...!&quot; e literalmente desceu fogo lambendo aquela água e queimando todo o holocausto. E o povo antes desse evento chamavam Elias de maluco, depois menos os que morreram, os curiosos se prostraram e adoraram ao Deus verdadeiro Deus de Elias. Faço uma comparação àqueles que ainda não conhecem o poder de Cristo, como eles tem uma péssima ótica do verdadeiro cristão e nos chamam de malucos, idiotas etc. mas depois que conhecem a Cristo, se arrependem de seus pecados e aceitam Jesus como único e suficiente Salvador é outra visão do Reino de Deus. Nós precisamos de Deus e Sua misericórdia sempre! mas cadê os Elias de Deus? Jovens , homens e mulheres de fé!</p>\n<p>Depois outro fato que achei importante relatar neste momento em que estamos no início deste livro e foi com o Profeta Elizeu, ele foi Obreiro, Pastor auxiliar de Elias, aquele que largou de suas juntas de bois lá na roça e seguiu a Elias, e pediu porção dobra quando Elias pergunta a Elizeu o que queres? Amados, quando temos certeza que é de Deus as ofertas, é portas se abrindo, o vento soprando ao nosso favor, devemos abraçar com unhas e dentes por que é benção para nossa vida e saibamos quando Deus está nos abençoando é porque Ele quer nos usar como vasos, ferramentas, e podermos abençoar outras pessoas, os Dons Ministeriais, Espirituais até mesmo pessoais não são para ficar retidos, como egoístas espirituais! Manda Senhor só para mim. Não nem devemos bater no peito eu sou o cara o doutor no que faço, isso é muito bom que você buscou especialização, conquistou títulos intelectuais, prosperou em sua empresa, é bem sucedido financeiramente Deus te honrou na prosperidade, ou seja, em sua função você é doutor, mas saibas que tudo vem de Deus..! e Ele quer te usar ali em seu trabalho com seu talento, seu conhecimento prestando serviço ao próximo, amando e perdoando seu irmão. É Elizeu pediu e recebeu porção dobrada. Certo dia apareceu um oficial do Exército chamado Namã com uma doença incurável na época (lepra), e o próprio oficial pensou! vou chegar até este homem de Deus o Profeta Elizeu e vou ser tratado como sou aqui no Exército pois sou de confiança do Rei estou com recomendações do Rei e trago comigo presentes caríssimos para pagar minha cura então me receberão com chazinho, boas vindas, um belo quarto com suíte esta reservado para ti oficial Namã! Mas nada disso aconteceu! Elizeu ao ser informado pelo seu auxiliar da presença do oficial Namã e estando acometido de lepra. Assim falou Elizeu; diga a ele que mergulhe sete vezes no Rio Jordão! O Número sete é o número de Deus, o número da perfeição. Elizeu cheio da presença de Deus, imaginam só, o homem com a unção dobrada em sua vida, a palavra que ele emitiu foi cura instantânea, o remédio acertado, glória Deus! nós só podemos dar o que temos! E nesse mundo em que vivemos conflitantes devemos fazer a diferença e semear a paz, mas o que é a paz? A ausência de conflitos em nossa mente! e Não havendo conflitos em nosso interior sou uma pessoa de paz e Jesus nas suas saudações diz; A paz seja convosco, no plural e no singular; a paz seja contigo. Estou falando como ainda nos dias de hoje como as pessoas desenformadas nos veem, muitos pensam que somos doidos, malucos, por sermos cristãos e por trilhar no caminho da salvação, ser fiel e proclamar o Plano de salvação do Nosso Senhor Jesus Cristo. Estou falando da cura de lepra de um Oficial do Exército; e Namã questiona; tendo águas límpidas em sua terra porque haveria necessidade de mergulharem águas contaminadas! É muitas vezes o que nos impede da realização do milagre é o por quê? Disso e daquilo o outro. Mas em fim Namã é curado. Amados o próprio Cristo com todo Seu Poder poderia simplesmente dizer a um cego de nascença; &quot;Enxerga&quot; e o cego passaria a ver! Mas existe um processo sobre natural que nós naturais humanos que somos dificulta o entendimento, porque funciona em uma outra dimensão, algo sobrenatural, o que é natural para Deus glórias a Deus..! eu imagino, não somente humanos assistindo e não entendendo nada do que estava prestes a acontecer. Mas eu imagino anjos seres celestiais assistindo atentamente, será o que nosso Rei vai fazer agora! e para tudo o que acontece na terra e no céu, as potestades do mal e dominadores deste mundo que estão ao derredor também não entendem nada! mas ficam paralisados o que o Príncipe das luzes esta fazendo com uma cuspida no chão e forma com seu dedo um lodo e passa nos olhos do cego e diz; vá se lavar no tanque de Siloé! Em seguida foi àquela gritaria, um tremendo alvoroço e quem recebeu o milagre dizia; estou vendo! Realmente, ele esta enxergando e todos puderam ver o milagre brotando das mãos do Mestre Jesus Cristo. Quanto vale a restituição da visão ou para quem nunca havia enxergado a luz do dia e poder contemplar o rosto de seus familiares? &quot;<strong>O que seria de minha vida sem Jesus&quot;</strong>. E este Jesus é o mesmo ontem, hoje e eternamente (Rm) 13.8.</p>\n<p>Vamos manusear a Palavra de Deus, no capítulo 1 de Colossenses apresenta quatro relações básicas de Jesus: Para entendermos melhor Sua relação com a divindade. Ele é a imagem do Deus invisível, em quem habita toda a plenitude. Sua relação com a criação foi e é real, Ele, Jesus Cristo É o criador e o Sustentador. Ele É a Fonte, O Agente e o Alvo da criação. Amados, fiquem atentos da importância em conhecermos com profundidade e termos uma intimidade com nosso Senhor Jesus e sem Ele nada somos! A Sua relação com a salvação, Não há outro substituto sem máculas, vou repetir; não há outro! Então Ele É o Redentor e o Agente da reconciliação. É através de Cristo que seremos chamados de filhos novamente de Deus, repito &quot;Porque todos pecaram e afastados estamos da glória de Deus e carecemos da misericórdia,&quot; da graça o favor imerecido e isto é possível por meio de Cristo somente. Como em nosso corpo há vários membros e todos estão unidos e coordenados pelo cérebro, que fica na cabeça. Cristo em Sua relação com a igreja, Ele é o cabeça da igreja e nós somos membros. Jesus não é apenas uma pessoa, Ele é a origem da criação e também da nova criação. Ele É antes da criação, Sendo a origem da criação, está acima e além da criação, Ele é o sustentador da criação e Cristo É o alvo da criação. Ele É A cabeça da igreja e O Agente da nossa salvação. Ele É preeminente no céu e na terra. O que muita gente não sabe ou não entende e é muito importante que entendemos; Jesus teve dupla natureza, cem por cento Deus e cem por cento homem, a diferença é quando palmeou esta terra nascido de uma virgem, denominada Maria e concebido pelo Espirito Santo, ou seja na concepção de Jesus já podemos ver o milagre acontecendo e assim em toda Sua vida e Ministério. <strong>MARAVILHOSA A RELAÇÃO DE JESUS COM A IGREJA!</strong></p>\n<blockquote>Sem sombras de dúvidas Jesus é a cabeça orgânica da igreja! E a palavra &quot;cabeça&quot; significa; origem, fonte. A igreja não teria vida sem Jesus, nós estávamos mortos. Raciocina comigo, Cristo nos deu vida. &quot;Vejam como é importante,&quot; só temos vida se estamos ligados a Ele. Cristo É a fonte de poder, alegria e vida da igreja. Sendo cabeça da Igreja é O Governante da igreja. A palavra &quot;cabeça&quot; significa também; aquele que governa, que controla e dirige. A igreja cristã não tem outra cabeça, por exemplo; (papa), sim, é considerado o líder maior para os Católicos e eu tenho muito respeito pelos irmãos católicos. Mas quando olhamos para a Palavra de Deus, lemos, meditamos e entendemos que há somente um Mediador entre Deus e os homens ( 2Tm) 2.5 e o nome dEle é Jesus Cristo. Então cremos que Só Cristo é o cabeça da igreja. (Mt) 16:18 Diz; Cristo É O fundamento, edificador, Dono e Protetor da igreja. Como cabeça É aquele que recebe honra e que tem autoridade para comandar, e depois de morte de cruz ressuscitou ao terceiro dia e foi dado a Ele todo poder nos céus e na terra. Por que Jesus é a fonte da igreja? A palavra &quot;princípio&quot; (arquê) significa que Cristo é a fonte da igreja! A igreja tem sua origem nEle. Podemos ver que a igreja romana fala &quot;ubi Petros, ibi eclesia&quot;, mas nós dizemos &quot;ubi Cristos, ibi eclesia&quot;. Cristo supre a igreja através dos dons e através do poder do Seu Espírito e da sua Palavra.\\ <strong>\\ Por que Jesus Cristo é o Primogênito dentre os mortos?</strong>\\ Jesus é o vencedor da morte! Ele não apenas ressuscitou como outras pessoas, ele arrancou o aguilhão da morte e Ele matou a morte, Ele venceu a morte sendo primícias de uma nova criação por quem Deus trará muitos filhos à eterna glória, foi o poder da ressurreição. Vejamos em (Jo 11:25; Ap 1:18). Assim como todo o universo é a criação de Cristo, a igreja é a mais bela criação de Cristo. Cristo não é um herói morto ou um fundador do passado, mas o <strong>&quot;autor da vida e o conquistador da morte!&quot;</strong> E promessas para nossas vidas; quem nEle crê não teme a morte, ou seja; quem nEle crê não morre eternamente! Quem nele crê é vencedor da morte! É ai que eu me refiro, <strong>&quot;O que seria da minha vida sem Jesus Cristo&quot;!</strong> <strong>Verdadeiramente é em Jesus Cristo que há toda plenitude</strong>\\ A palavra &quot;plenitude&quot; é a soma total de todo o divino poder e atributos. E toda a plenitude da divindade, dos atributos divinos residem em Cristo! Isto é bíblico. A palavra não significa uma residência temporária, mas uma habitação necessária e permanente, isto quer dizer; estar em casa permanentemente! A plenitude não foi alguma coisa acrescentada a Cristo que ele não tinha naturalmente, mas a plenitude sempre foi parte do Seu Ser, está inserido no Seu caráter e a essência do caráter de Cristo é o amor.\\ Por que Cristo tem a preeminência nobre em toda terra? É O triunfo de sua ressurreição que lhe deu preeminência em todo o universo. Ele é o Senhor da vida, a fonte e origem da igreja, aquele que dirige a igreja, em Apocalipse 5 podemos ver que só Ele foi encontrado Digno de abrir o livro e desatar-lhe os selos. E quando Ele recebe o livro, todo o céu se prostra prestando louvores ao Cordeiro preeminente. Importante que saibamos Jesus Cristo é preeminente na criação, na salvação e na igreja. A cruz de Cristo é fonte da reconciliação da Igreja. O homem estava longe, caído, perdido, cego, inimigo, morto. Deus tomou a iniciativa de nos reconciliar consigo mesmo (2 Co)5:18-19.\\ Não fomos reconciliados pela vida de Cristo, pelos seus ensinos, exemplo e milagres. Fomos reconciliados pela sua morte, pelo seu sacrifício substitutivo, pelo poder da ressureição. Quando olhamos para cruz ela nos revela o poder, a santidade, a justiça e o amor de Deus (Sl. 85:20). Importante sabermos; que não podemos é ficar contemplando uma cruz com a imagem de um Cristo morto, precisamos entender que a cruz não foi um fracasso, mas vitória. Cremos em um Jesus Cristo ressurreto, que vive para sempre e não é a fraqueza, a derrota, mas sim o poder, este poder através da ressurreição de Cristo. A cruz ocupa lugar central no Evangelho (Gl 6;14; 1Co 1;21-23, Gl .1;19-20) Quando meditamos No Velho Testamento percebemos que usava-se a prática de sacrifícios e muita simbologia. E o símbolo da cruz. Cristo é o Cordeiro, a serpente de bronze foi um símbolo do Cristo que foi suspendido na cruz. Na cruz Deus puniu os nossos pecados em seu Filho, e foi muito dolorido para Jesus que sem pecado algum, minutos antes da crucificação foi retirado o Espirito Santo de Cristo, Jesus falava com o Pai constantemente Sua intimidade era tamanha. Penso que quando Deus retira o Espirito Santo de Jesus nas Oliveiras e Jesus chora e ao chorar transpira sangue e diz; se possível afasta de mim este cálice! Depois diz; Aba, aba, por que me abandonaste? Jesus tinha e tem uma intimidade um carinho com nosso Pai muito caloroso uma relação de filho com seu pai e Jesus quando falava Aba, Aba falava com carinho, com Seu coração em chamas; Papaizinho, Papaizinho! Vejamos a profundidade do relacionamento, o respeito que há entre Deus Pai e Deus Filho! Que belo exemplo para nós praticarmos em família. Aquelas doces palavras de amor e carinho fazem toda diferença na vida de uma criança de um adolescente neste mundo corrompido, competitivo, tecnológico, robotizado onde ainda em casa a comunicação da sala para cozinha através de uns watts. Mas cadê o abraço, o olho no olho o beijo e na despedida e na chegada do trabalho ou no estudo! Liberar a um filho uma palavra como; Deus lhes abençoe e lhes guarde. Eu não só penso, mas creio que Deus chorou e chorou muito! Meu filho amado aquele que me compraz, que Eu coloco nEle todas as fixas, Meu representante legal na terra, fez tudo certinho o que Eu pedi o filho obedeceu e agora Eu ouço Ele, mas Ele, não pode mais me ouvir! e por três dias não pode usar dos atributos divinos!(Onipotência, Onipresença e Onisciência). Mas é necessário fazer isto porque eu amo minhas criaturas e meus filhos que estão caídos, perdidos na terra. Penso eu que nesse instante que Deus reflete como Ele amou o mundo de tal maneira! que os anjos não estavam entendendo nada mas percebiam ao adorar a Deus o Seu semblante triste! muito triste! E foi pelos meus e seus pecados, que Cristo precisou morrer no madeiro e ainda hoje toda vez que negamos a Ele, mentimos, traímos, corrompemos e se omitimos a realizar a Sua Obra Seu Plano de Salvação e ecoa-se um toque de martelo com os cravos nas mãos de Cristo. (Deus me deu a letra de um hino que está em meu 2ª CD &quot;Toques de Martelo&quot;). Jesus sabendo que Ele seria o cordeiro perfeito sem mácula e disse ao Pai; faça Sua vontade! (2 Co 5:21). Não foi o sacrifício de Cristo que mudou o coração de Deus, mas a cruz foi o resultado do amor de Deus. Foi na cruz que Deus mostrou seu repúdio ao pecado e seu amor ao pecador e Deus ama o pecador mas reprova a prática do pecado. Tratando-se em obediência ( Filipenses 2.5 ) Seja a atitude de vocês a mesma de Cristo Jesus,. que, embora sendo Deus, não considerou que o ser igual a Deus era algo a que devia apegar-se mas esvaziou-se a si mesmo, vindo a ser servo, tornando-se semelhante aos homens. E, sendo encontrado em forma humana, humilhou-se a si mesmo e foi obediente até à morte, e morte de cruz!\\ Por isso Deus o exaltou a mais alta posição e lhe deu o nome que está acima de todo nome, para que ao nome de Jesus se dobre todo joelho, no céu, na terra e debaixo da terra, e toda língua confesse que Jesus Cristo é o Senhor, para a glória de Deus Pai. Jesus nos ensina primeiro vem à obediência depois a honra. Quer as bênçãos de Deus obedeça! (João 15.14) Vós sereis meus amigos, se fizerdes o que eu vos mando. Já vos não chamarei servos, porque o servo não sabe o que faz o seu senhor; mas tenho-vos chamado amigos, porque tudo quanto ouvi de meu Pai vos tenho feito conhecer. Na obediência seremos amigos de Cristo e Jesus nos ensinou a amar a Deus sobre todas as coisas e amar o próximo como a si mesmo! Ou seja, na horizontal amar nosso irmão, mas na vertical obedecer e amar a Deus. (Hb 5.9) E, sendo ele consumado, veio a ser a causa da eterna salvação para todos os que lhe obedecem. Se obedecer terá salvação. Ap 22.14) Bem-aventurados aqueles que guardam seus mandamentos, para que tenham direito à árvore da vida, e possam entrar na cidade pelas portas. Felizes são aqueles que obedecerem, sendo fiel até o fim e receberá a coroa, o galardão a vida eterna. E não adianta orar, gritar, espernear se não andou nos caminhos de Deus ou se viveu na desobediência porque Deus não divide Sua glória com ninguém, toda adoração e toda honra pertencem a Ele. E se inicia com o &quot;arrependimento&quot;; que é um sentimento de rejeição ao pecado! E vem a &quot;conversão&quot; é o Espírito Santo que tem o poder de nos convencer que somos pecadores e a conversão é uma entrega total as coisas de Deus. Jesus disse aos discípulos; ficai em Jerusalém até que sejam revestidos do poder! Obedeceram alguns e ficaram cheios do Espirito Santo e Pedro depois disso realiza um culto e ganha mais de 3.500 almas para Cristo. A pergunta que não me cala é estamos obedecendo ao Senhor? Será que estamos no lugar que Deus deseja que estivéssemos? Quando obedecermos e estivermos alinhados aos propósitos de Deus os milagres o sobrenatural acontece <strong>A reconciliação é para todos que desejarem</strong> Com a desobediência de Adão e Eva, com a queda do homem, o pecado separou o homem de Deus. Com o pecado o universo todo foi afetado. Toda a criação geme (Rm 8:22). Cristo morreu para trazer restauração ao universo todo. A criação natural será redimida do seu cativeiro. Tudo vai convergir em Cristo (Ef 1:10). Universal reconciliação não é igual salvação universal. Cristo vai separar o joio do trigo, os cabritos das ovelhas, os salvos dos perdidos. Os pecadores perdidos, os gentios eram estranhos e também inimigos. Havia uma alienação de Deus e uma hostilidade a Deus. O homem não é apenas cego, é inimigo. A inimizade é conceitual e moral. O entendimento errado produz obras erradas em nossa mente. É importante entendermos que nossos olhos e nossos ouvidos são portas de entrada e diariamente é um bombardeio de informações e é importada centenas de mensagens, informações para nossa mente e devemos filtrá-las porque com o tempo vamos reproduzi-las ou materializá-las, devemos ter muito cuidado para não armazenar lixo em nossa mente porque se estiver com vírus é necessário deletar e sem deletar não há conexão com Jesus porque Ele é Santo, Separado, Puro, nosso Senhor. Pensamento dirige o comportamento. Exemplo: A bomba das Ideias -- As filosofias que dominam o mundo. Vivemos sim influenciados por ideias de mortos! Quinhentos anos a.C Sócrates, Platão, Aristóteles, lá na Antiga Grécia, nas ágoras (praças) falavam muito sobre suas teorias e nascia a Democracia e muitas ideologias tornaram-se teorias e hoje nós estamos inseridos nelas, ensino aos meus alunos nas aulas de Historia que podemos reconstruir a história, inovar, criar, e certos hábitos, tradições e costumes que não deram certo com nossos antepassados podemos reconstruir uma nova história com novos hábitos adequando com nossa realidade dos dias atuais. Porque as obras malignas são fruto de entendimentos errados. A nossa relação com Deus foi restaurada. Não há mais barreira entre nós e Deus. Fomos justificados. Temos paz com Deus. A inimizade foi tirada. O muro da separação foi quebrado e tornamos a casa do Pai! Isto foi e é possível somente através de Cristo! Vejamos quanto é importante em nossa vida Jesus Cristo! Repito; não é a religião, a placa de Igreja e nem outra pessoa a não ser Jesus Cristo que tem o poder de nos salvar e este salvar é para uma vida eterna! De eternidade em eternidade.\\ Mas para isto acontecer é necessário um arrependimento autêntico de seus pecados, aceitar Jesus Cristo como Único e suficiente Salvador para sua vida, e ser batizado em nome do Pai, Filho e Espírito Santo. Este batismo é a confirmação daquilo que você prometeu de aceitar Jesus com único salvador para sua vida, ser fiel, estar aliançado e andar nos caminhos de Deus. A palavra batismo vem do grego ( batma) quer dizer. Emergir, mergulhar e estaríamos imitando a Cristo quando foi batizado por seu primo João Batista no Rio Jordão e neste evento João pregava e dizia; arrependei-vos, arrependei-vos porque avinda do Messias está próxima e eu batizo com água e em nome do Pai do Filho e do Espirito Santo, mas Ele (Jesus Cristo) batiza com fogo e o Espírito santo. &quot;No instante em que Jesus está sendo batizado desceu sobre Ele o Espirito Santo em forma de uma pomba, e ouviu-se uma vós em forma de trovão dizendo&quot; Este é meu filho e nEle me comprazo&quot;, foi a manifestação do Pai, do filho e do Espirito Santo. Mas após sermos batizados a vida continua e os obstáculos, os problemas e as adversidades surgem e como aprendemos no versículo de (MC)16.15 &quot;Todo aquele que crer e for batizado será salvo&quot;. Então será salvo é uma longa caminhada com Cristo e neste período vamos conhecendo mais e mais, a cada dia uma luta e vem uma vitória, a Palavra diz; &quot; conhecei e prossegui-lo a conhecer&quot;! isto quer dizer que devemos ter uma vida voltada para o Senhor, uma vida em santidade, afastado do pecado. Santidade é propósito da reconciliação não é que continuemos rebeldes, mas sejamos mudados interiormente e este processo é gradual mas devemos sempre avançar porque é nos cultos que aprendemos sobre as coisas de Deus a igreja é o local do aperfeiçoamento dos santos e ao ouvir a Palavra de Deus que nossa fé é aumentada, nossos olhos espirituais são abertos, podemos ver tocar no sobrenatural, nas maravilhas de Deus isto não é algo maravilhoso é possível para aquele que crer. Existem Santos Inteiramente consagrados e separados; os inculpáveis, palavra usada para descrever animais limpos e aceitáveis para o sacrifício. E os irrepreensíveis que não haverá cheiro de escândalo nem crítica válida que o inimigo das nossas almas possa lançar contra os candidatos das bodas do cordeiro. Esperança da glória, a reconciliação corrige uma alienação passada e nos oferece bênçãos presentes, também nos oferece a futura glorificação e essa esperança é descrita (Cl 1:5, 23, 27; Jo 17:24; Rm 8:18,30). Arrependemo-nos dos pecados, aceitamos o Senhor Jesus como único Senhor e Salvador, nos aperfeiçoou e santificou para adorar e glorificar a quem é digno de toda hora, todo louvor e toda glória que é nosso Senhor e Salvador Jesus Cristo. Atributos divinos pertencem a Cristo como Onipotência, Onipresença e Onisciência, Jesus Cristo é a origem de todas as coisas do universo e da nova criação. Jesus Cristo toma conta de todas as coisas Jesus Cristo é tudo o que nós necessitamos. Deus o Pai se alegra quando o Seu Filho Jesus Cristo recebe a preeminência. Em Cristo nós temos vida, reconciliação com Deus, paz com Deus, santidade e esperança da glória. O que seria da mina vida sem Jesus Cristo. A Palavra de Deus nos adverte, para ter cuidado com falsos profetas e falsos mestres. Assim como há os falsos profetas nos dias atuais que não negam a importância de Cristo, mas não lhe dão a devida honra o reconhecimento de Senhorio que é dado a uma divindade eu me refiro aos atributos divino pertencem somente a Deus Pai, Filho e ao Espírito Santo, também houve muitos no passado. Para os gnósticos Cristo era apenas uma emanação de Deus e não o próprio Deus encarnado. Os Muçulmanos pregam que Cristo foi um grande profeta, mas não o Próprio Deus encarnado o Filho de Deus. Os Espíritas dizem que ele é um Espírito de luz que não precisou se reencarnar, mas não é o Eterno Deus. Os Romanos dizem que ele é um Mediador, mas não o único Mediador entre Deus e os Homens. Os Testemunhas de Jeová afirmam que Ele foi o agente da criação, mas não o Eterno Deus. Mas <strong>O que seria da minha vida sem Jesus Cristo!\\ Por que Jesus Cristo É nosso libertador?</strong></blockquote>\n<p>Vejamos que a palavra &quot;libertou&quot;, significa; libertar do perigo. Então nós não poderíamos libertar a nós mesmos da culpa e da penalidade do pecado, mas Jesus libertou-nos. Esta verdade deve ser proclamada a todos porque é essencial é um caso de vida eterna ou morte eterna, pois estávamos em perigo de passar toda a eternidade nas trevas exteriores, longe de Deus, mas Cristo libertou-nos do poder das trevas. O império das trevas é a esfera em que Satanás, potestades, dominadores deste século e seus seguidores exercem sua jurisdição, é o campo de ação de Satanás, dominando sobe os corações, as mentes de quem permite, através de portais e brechas abertas nas vidas e as atividades da raça humana. Estávamos na casa do valente (Mt) 12:29, na potestade de Satanás (At) 26:18, andando segundo o príncipe da potestade do ar (Ef 2:2). A noticia boa é que Cristo nos libertou, ou seja, é uma obra consumada. Deus não transportou os vencidos, mas os vencedores. Deus nos arrancou da casa do valente, da potestade de Satanás, do reino das trevas e nos transportou para o seu Reino, para O Seu domínio e Poder. O Senhor nos tirou do reino obscuro dos ideais falsos e imaginários para introduzir-nos na terra banhada pelo sol da justiça e do conhecimento claro e da expectativa real. arrancou-nos da esfera dos desejos pervertidos ao bem aventurado Reino de Deus.</p>\n<p>Vejamos, o resgate a transformação que somente Cristo pode fazer na verdade foi um translado das trevas para a luz, da escravidão para a liberdade, da condenação para o perdão, do controle de Satanás para o poder de Deus. Assim como Deus libertou o seu povo da escravidão do Egito e o trouxe para a terra prometida, é assim que o Senhor nos transporta para o seu Reino. e temos sido transladados de uma vez por todas. Porque já estamos no Reino da Luz ( 1 Pe 2), Cristo me redimiu! E a palavra &quot;redimir&quot; significa libertar um prisioneiro ou um escravo pelo pagamento de um resgate (Ex 21:30). Paulo não está dizendo que o resgate foi pago a Satanás para que fôssemos libertos do reino das trevas. Por sua morte e ressurreição, Cristo satisfaz as demandas da lei de Deus e nos redimiu com o seu próprio sangue derramado na cruz do calvário (Ef 1:7). Satanás procura nos acusar a todo instante porque ele esta ao nosso derredor, ao redor estão anjos do Senhor! Mas o inimigo sabe que nós somos culpados de quebrar a lei de Deus. Mas o resgate pago por Cristo no calvário nos redimiu e agora estamos quites com a lei de Deus (Rm) 8:33-34). Amados, essa redenção implica em libertação da maldição (Gl 3:13), e em libertação da escravidão do pecado, ( Rm) 7.14 ( Jo) 8.34,36, Cristo nos perdoou! Quando perdoamos se parecemos ainda mais com Cristo e o inimigo sai na disparada, porque o que ele o diabo mais quer, é conflito entre os cristãos, entre a família e este conflito é nada mais do que as pessoas estão clamando a falta de paz, sossego e assim levam uma vida de ansiedade, de medo e depressiva. O inimigo vem pra matar, roubar e destruir (João) 10.10 mas satanás segue uma ordem inversa; primeiro ele rouba os sonhos e depois destrói planos, projetos e por fim tenta matar porque quando o homem está distante Dos caminhos de Deus o inimigo ataca a presa é fácil e está depressiva tenta suicídio e muitas vezes acontece o suicídio. Mas no mesmo versículo (João) 10.10 na parte b do versículo; vem Cristo dizendo e fazendo a diferença; &quot;Eu vim para que tenham vida e vida com abundancia&quot;. A palavra perdão significa deixar o outro livre ou cancelar a dívida. Quando retemos o perdão e endurecemos o coração é como se tivéssemos preparado um copo com veneno para o inimigo mas é nos que beberíamos deste veneno, isso produz a mágoa, a amargura, toda vez que vai dormir leva-se consigo o inimigo, no momento da refeição ele esta na mente e você não consegue digerir bem os alimentos e forma-se úlceras, Gastrites e enquanto isso quem lhe feriu esta de boa e já esqueceu. Perdoando sempre mesmo que tenha razão e entregue a causa a Jesus Cristo. Quando você perdoa você se parece com Deus e o inimigo parte em retirarada. Jesus não apenas nos deixa ir livres e transferiu-nos para o Reino da luz, mas ele também cancelou toda a dívida que tínhamos como escravos. Nossos débitos não podem mais nos escravizar. Satanás não pode encontrar mais nada nos nossos arquivos que possa nos condenar ( Rm) 8.33-34. Quebra a barreira entre o pecador e o Deus Santo, ou seja abarreira foi removida. O perdão de Cristo não é uma desculpa para pecar! Mas um encorajamento para a obediência, e o perdão de Cristo é o referencial do perdão que devemos oferecer (Cl 3:13; Mt 18:21-35). <strong> Você tem Planos e Projetos para sua Vida?</strong></p>", "chapters": [{"id": "secao-1", "num": "1", "title": "Redobre sua atenção para entender quão grande é o Plano de CRISTO e \" Oque seria da minha vida sem Jesus Cristo!\"", "epigraph_html": "<p class=\"epigraph-line\">Maravilha, você tem sonhos e Jesus quer realizar nossos sonhos!</p><p class=\"epigraph-line\">Jesus Cristo nos apresenta o Plano de Salvação!</p><p class=\"epigraph-line\">É o Maior e melhor de todos nossos planos.</p>", "html": "<p>Jesus Cristo é a ideia expressa de Deus, quando Logus, o verbo se faz carne, abriu mão de Sua glória, esvaziou-se de Si mesmo e veio a terra habitou como um homem natural a diferença sem pecados. Cristo é a &quot;Imagem do Deus invisível &quot;. Imagem e não imitação. Tudo que Deus É, O É igualmente Jesus. Ele É verdadeiro Deus, Jesus, a imagem perfeita do Deus Invisível, Deus o infinito Espírito não pode ser visto pelo ser humano (Jo 4:24). Em Cristo, O Deus Invisível, tornou-se Visível e Palpável (Jo 1:1,14; e 1Jo1:1)Quem quiser saber quem é Deus? e conhecer a Mente de Deus? olhe para Jesus, e nos quatro Evangelhos narra Sua vida e Seu Ministério.(João)1:18 Ninguém jamais viu a Deus; o Deus Unigênito que está no seio do Pai, é quem o revelou. (Hebreus) 1:3 Ele, que é o resplendor da glória e a expressão exata do seu Ser. (Colossenses) 1:15 Cristo, Ele é a imagem do Deus invisível. (Colossenses) 2:9 Porquanto, nEle, habita, corporalmente, toda a plenitude da Divindade. (João) 14:9 Quem me vê a mim vê o Pai. (João) 10:30 Eu e o Pai somos Um. (Colossenses) 1:13 Jesus é o Filho Amado de Deus. Jesus é o Herdeiro de tudo que foi criado (Sl) 89:27; (Hb) 1:1-2); Jesus tem o direito de possuir e exercer absoluta autoridade sobe a criação, Jesus recebeu o privilégio de ser eleito para ocupar a mais alta posição de honra no universo (Lc) 3:22; ( Ap) 1.5; ( Rm) 8.29 Por que Jesus é a fonte originadora de tudo o que existe no céu e na terra? &quot;Pois, nEle, foram criadas todas as cousas, nos céus e sobre a terra, as visíveis e as invisíveis, sejam tronos, sejam soberanias, quer principados, quer potestades&quot;. Você sabia que os anjos não têm nenhum poder à parte de Cristo. De fato separados dele nem poderiam existir. Os anjos nada podem acrescentar à plenitude dos recursos que os crentes possuem em Cristo nem os anjos maus podem separar os crentes do amor de Deus ( Rm) 8.35-39.&quot;Tudo foi criado por meio de Jesus Cristo&quot;. Ele é o agente do poder criador de Deus. Repito, Ele é o verbo criador (Gn) 1.3 (Jo) 1.1-3. As centenas de milhões galáxias, e somente em nossa galáxia há bilhões de estrelas e Deus dá nome à cada uma, e é importante sabermos como tudo funciona perfeitamente em harmonia, se houver diferença de dez minutos na rotação da terra a natureza reagirá e grandes catástrofes surgirão. Deus cria tudo com perfeição, criou os anjos, os homens, e todo o universo foi criado por meio dEle, Ele trouxe tudo à existência &quot;Tudo foi criado por meio dEle e para Ele&quot;. Todo o universo tem uma única finalidade; render-se a Jesus e todo o louvor e a glória pertencem a Ele. Diante dEle todo o joelho deve se dobrar no céu, na terra e debaixo da terra e confessar que Jesus é Senhor para a glória de Deus Pai. Pois o universo inteiro deve celebrar a glória de Jesus (Sl) 19:1-6; (Ap)5.13.Todas as criaturas devem dar glória a Jesus e servir aos Seus propósitos (Rm) 11:36; (1Co) 10:31. &quot;Ele é antes de todas as cousas&quot;. Jamais houve um tempo em que Cristo não existiu. Ele é pré-existente. Ele é o alfa e o ômega. Ele é eterno. Ele é auto-existente e autossuficiente. Ele não é dependente da criação. Ele não deriva sua glória da criação nem dela depende. Ele é transcendente sem deixar de ser imanente. Já nós somos criaturas e através de Cristo nos tornamos filhos de Deus e somos dependentes da Sua misericórdia, do Seu amor, de Sua graça. Cristo não foi criado no tempo. Ele é o Pai da eternidade (Jo) 8:58. Jesus Cristo é imutável (Bb) 13.08 &quot;Nele tudo subsiste&quot;. Jesus é o centro de coerência e coesão do universo. É Jesus Cristo quem interliga e dá simetria a todas as leis da física, da química, da biologia, da astronomia. nEle vivemos, nos movemos e existimos. Lembras do barco que estava naufragando diante da tempestade com os discípulos? e Jesus ordena ao vento e ao mar que se aquietasse e imediatamente tudo se acalmou! Os discípulos jogando a água pra fora que havia entrado no barco, comentavam; quem é este? que até o vento e o mar lhes obedecem! Este é Jesus Cristo e &quot;O que seria da minha vida sem Jesus Cristo!&quot; É ele quem nos dá a respiração e tudo mais que necessitamos nesta vida e nos garante a eternidade. (Atos) 17. Em resposta às orações Ele pode intervir nas próprias leis da natureza. Podemos afirmar que todas as coisas existem em Cristo, por Cristo e para Cristo. Jesus Cristo é a esfera, o Agente e o Alvo para quem todas as coisas foram feitas. Apostolo Paulo usa três preposições para descrever a preeminência de Cristo na criação: nEle, por meio dEle e para Ele. Os filósofos gregos tinham ensinado que todas as coisas necessitam de uma causa primária, de uma causa instrumental e de uma causa final. A causa primária é o Plano de Deus, a causa instrumental é o poder e a causa final é o propósito. Quando olhamos para a criação, podemos ver que Jesus é a causa primária (Ele planejou a criação). Ele é a causa instrumental (Ele produziu-a). Ele é a causa final (Ele fez tudo para o Seu próprio prazer e glória). A criação portanto, existe para dar glória a Cristo.</p>\n<p>O sangue de Jesus, é o tema principal. No Antigo Testamento, o sangue de Jesus é prefigurado no derramamento do sangue dos animais sacrificados nos holocaustos. No Novo Testamento o sangue de Jesus é derramado para a nossa redenção. Você não é reconciliado com Deus por suas obras, méritos ou religiosidade, mas por meio do sangue de Jesus A sua salvação depende do sangue de Jesus. Se você não estiver debaixo do sangue de Jesus não haverá esperança para você. Sem derramamento de sangue não há remissão de pecado. Suas obras não são suficientes para levar você ao céu. Sua igreja não pode levar você ao céu. Fora do sangue do Cordeiro de Deus ninguém pode entrar no céu. O precioso sangue de Cristo derramado na cruz para a remissão dos pecados! Apostolo Pedro seleciona dois metais preciosos usados para comprar bens: o ouro e a prata. Mas Quando Deus foi nos comprar, nos redimir, ele não empregou o ouro nem a prata, mas o precioso sangue de Cristo. Você vale mais do que ouro, que a prata. Muita gente pensam que podem comprar a &quot;graça de Deus&quot; com dinheiro, com obras. Mas foi Deus quem nos comprou. Ele não usou os tesouros do mundo, mas o sangue do seu Filho: &quot;a igreja de Deus, a qual ele comprou com o seu próprio sangue&quot; (At) 20:28. A Palavra de Deus é clara e enfática em afirmar que &quot;sem derramamento de sangue, não há remissão de pecados&quot; (Hb) 9:22. Em (Gênesis) 3:21: &quot;E fez o Senhor Deus a Adão e a sua mulher túnicas de peles e os vestiu&quot;. Essa é a primeira indicação de sangue. Aqui é o inocente sacrificado a favor do culpado. ( Gênesis) 4:4 Abel leva o sangue e é aceito; Caim leva o fruto da terra e é rejeitado.( Êxodo) 12:13 Deus pôs toda a nação de Israel sob o sangue. Deus não disse: &quot;Quando Eu vir suas obras, suas lágrimas, seu sofrimento, passarei por vós, mas quando vir o sangue. E Não foi o Cordeiro, foi o sangue -- O Cordeiro precisou ser imolado. Não somos salvos pela vida do Cordeiro, mas por sua morte e ressurreição! Os bons e os maus, pereceram igualmente se não estavam debaixo do sangue todo aquele que estava sem a proteção o sangue do cordeiro pereceu A penas como ilustração, o sangue é o bilhete, Quando você vai viajar de Avião, ninguém pergunta se você é rico ou pobre. Eles querem ver o bilhete. O bilhete é o sinal. O sangue é o bilhete o passaporte para entrar no céu. Cristo é o Cordeiro de Deus (Is) 53:7 A suprema submissão de Jesus até a morte e morte de cruz é um dos grandes aspectos da sua obra redentora. Ele não morreu como mártir, Ele entregou-se voluntariamente por você e eu (Jo)10.18 Mas que tipo de cordeiro Jesus é? Ele é o Cordeiro sem mácula! Por isso Sua morte pôde ser vicária e só Cristo poderia morrer por nós! Ele não conheceu pecado (2 Co) 5.21.Nele não havia pecado (1 Jo) 3:5 Nenhuma culpa foi encontrada em sua boca (1 Pe) 2:22. <strong>A grande verdade é, que há poder no sangue de Jesus para lidar com a escravidão do pecado,</strong> todo aquele que comete pecado é escravo do pecado ( Jo) 8.34 é por natureza e prática, que o ser humano é escavo do pecado O pecado pode tomar a forma de um temperamento incontrolado, ódio, orgulho, vício, impureza, ganância, vaidade. Nós temos redenção somente através do sangue de Jesus ( Ef) 1;7 Cristo sofreu o castigo por nossos pecados. Ele recebeu a condenação do nosso pecado. Qual o tipo de vício ou pecado que ainda está apegado a sua vida? A mentira, o álcool, drogas, sexo ilícito, impureza da sua mente? A cobiça e o ciúme? Adultério? O sangue de Cristo pode libertar você do poder desse pecado! Somente se arrepender e confessar seus pecados a Cristo.</p>"}, {"id": "secao-2", "num": "2", "title": "É importante saber e crer que há poder no sangue de Jesus para lidar com a punição do pecado", "epigraph_html": "", "html": "<p>Devemos estar cientes que o salário do pecado é a morte! (Rm) 6:23. A que pecar, essa morrerá ( Ez) 18;4 Cristo assumiu o nosso lugar. Ele foi à cruz como nosso fiador, substituta e representante. Ele morreu a nossa morte. Ele sofreu o nosso castigo. (Isaias; 53 Levou sobre Si todas enfermidades ...) Ele pagou a nossa dívida. Ele morreu por nós &quot;Tendo sido justificados pelo seu sangue, seremos por ele salvos da ira&quot; (Rm) 5:9.</p>\n<p>Você não precisa temer mais o inferno, a condenação, o juízo Final. Porque Cristo morreu sua morte. Ele carregou seus pecados. Ele pagou sua dívida. Você está quite com a lei de Deus, com as demandas da justiça. Nenhuma condenação há mais para você. Seus pecados foram jogados no fundo do mar. Mas a partir de que você aceitar Jesus como Salvador, este processo acontecerá em sua vida, e neste momento tudo está perdoado. Inicia-se uma nova caminhada na presença de Deus O pecado é sujo e ele suja as pessoas, mas o sangue de Jesus nos limpa (Is) 1:18. O pecado contamina, mas o sangue de Jesus purifica(1Jo)1:7. Como você tem lidado com a sua mente, filtrando o bombardeio diário de informações pela Internet? Seu coração não precisa mais ser um poço de impureza, um HD onde é guardado todas as informações remetidas por satanás ou por vontade própria é você e eu na maioria das vezes que achamos graça e até mesmo de curiosidade fazemos Download do software desconhecido ou inseguro, não apropriado e perigoso de vírus e perder todos seus dados em seu computador. Depois de ser convertidos e verdadeiramente ter uma vida na presença de Deus! Você não precisa mais ser um escravo da impureza sexual. Você pode ser limpo de coração. Você agora pode ter a mente de Cristo! O sangue de Abel clamou por vingança (Gn) 4:10,13. Mas o sangue de Jesus clama por perdão &quot;Pai, perdoa-lhes&quot;. Repito; &quot;NEle (Cristo) nós temos redenção através do Seu sangue&quot; (Ef) 1;17 O inimigo é visto como acusador e opressor do povo de Deus. Como o venceremos? É pelo sangue de Jesus! Quem intentará acusação contra os eleitos de Deus? É Deus quem os justifica. Quem os condenará? É Cristo Jesus quem morreu! Se estamos debaixo do sangue de Jesus estamos protegidos! Glorias A Deus ( Ex) 12;13 O sangue de Jesus não é apenas arma de defesa (Ex) 12, mas também arma de ataque (Ap) 12:1. Nós vencemos as hostes do inferno pelo poder do sangue de Cristo. O inferno treme diante do poder do sangue de Cristo. Foi na cruz que Cristo esmagou a cabeça da serpente e desbaratou o inferno. Foi na cruz que Cristo abriu uma fonte de cura e libertação para o seu povo. Foi na cruz que ela nos libertou, nos remiu e pagou a nossa dívida. Foi na cruz que ele tirou de nós o veneno da antiga serpente (Jo)3. E hoje é o Espírito Santo a Terceira pessoa da Divindade que da continuidade a Obra de Deus ao Plano de Salvação.</p>"}, {"id": "secao-3", "num": "3", "title": "O Espírito Santo dando continuidade na Obra de Cristo!", "epigraph_html": "", "html": "<p>Vejamos a obra do Espírito Santo no mundo por que é dupla? Em primeiro lugar, Ele veio para convencê-lo do pecado, da justiça de Deus e que somos dependentes de Deus. A Palavra de Deus ensina, todos nós sabemos isto de experiência própria, que todos pecaram e estão afastados da presença gloriosa de Deus, e necessitamos de Sua Misericórdia (Rom). 3:23, Um pecador não pode herdar a vida eterna. Todos que nasceram neste mundo revivem a queda de Adão. Todos nascem com a semente do pecado dentro de si, e ao chegarem à idade responsável não tardam a ser culpados de multidão de pecados. Há diferença entre o pecado: Pecado e pecados. O pecado é a raiz, os pecados são os frutos.</p>\n<p>Pode ser que alguém não esteja consciente de que seu maior problema é o pecado, ou que o pecado o separou da comunhão com Deus. Por isso é tarefa do Espírito Santo perturbá-lo e convencê-lo do seu pecado. Ele não pode experimentar a salvação em Cristo sem que isto aconteça. Muitos casos ocorrerão de pessoas que irão adquirir este livro e antes nunca tiveram uma experiência com Cristo, mas gradativamente vão sendo tocadas pelo poder do Espirito Santo, e ao ter o discernimento da Palavra de Deus tomam uma decisão acertada, e muitas vezes, estas pessoas depois vêm para aceitar a Cristo.</p>\n<p>O Espírito Santo não só convence de pecado, Ele convence as pessoas também que Jesus é a justiça de Deus. Ele mostra aos pecadores que Jesus é o caminho, a verdade e a vida, e que ninguém vem ao Pai a não ser por Ele.</p>\n<p>O Espírito Santo também convence o mundo do juízo, porque o príncipe deste mundo já está julgado, e todos os que recusarem a oferta de vida eterna que Deus faz também serão julgados. Quando o apóstolo Paulo falando do que Cristo tinha realizado em sua vida através do Espirito Santo, diante do rei Agripa, disse que na estrada para Damasco, na hora da sua conversão, Deus lhe tinha revelado o tipo do seu ministério. Seria entre os gentios, para &quot;lhes abrir os olhos a fim de que se convertam das trevas à luz, e do poder de Satanás a Deus, para que recebam remissão de pecados ... &quot; (Atos) 26:18. Meus amados pastores! Será que já pregaram para autoridades de suas cidades quando Deus permitiu que estivessem a sós? Não responde nada! Eu sei que, eu Amarildo, já perdi muitos amigos inclusive ex colegas policias e tive tanta oportunidade juntos, como gosto de tocar violão toda festa do grupo familiar estava eu lá e lembrávamos com muito respeito de canções antigas, raízes que fala da natureza, mas a oportunidade pra louvar a Deus com alguns hinos e convidá-los para ir a igreja. Olhei ontem ainda no face book e chorei quando no final de 2015 trabalhava na mesma escola com uma professora que conheci desde a infância inclusive, o esposo dela, pense em uma pureza de coração. E ela concluía neste período mestrado em língua portuguesa, era muito prestativa, sempre pronta para me ajudar no trabalho, e amiga de minha esposa e ela havia estudado ainda no ensino fundamental com um dos meus filhos, mesmo após o triste acontecimento ainda está registrado as últimas palavras dela comigo no face e ela comentava que havia contraído uma doença complicada ( anemia no sangue) e ficaria uns dias no hospital e foi ali que falei do amor de Deus para ela, reconhece que foi muito pouco, deu pra falar e me prontificar e disponibilizar até mesmo minha casa para seus parentes distantes se hospedarem e que viriam visitá-la. Ela partiu! Morreu minha amiga e colega Eliana Canova. E eu queria ter dito mais, depois que perdemos quem nós amamos sempre arrependemos por não ter dito tudo que gostaríamos de falar! Hoje, se tivesse a oportunidade eu ia gritar, pegar em suas mãos e dizer&quot;; Eliana olha nos meus olhos, escuta-me &quot;O que seria de minha e sua vida sem Jesus Cristo?&quot; Eu sei, alguma coisa fiz, mas poderia ter feito muito mais e hoje já não estão mais entre nós e tínhamos a impressão que estes entes queridos ficassem conosco por muitos anos. É algo muito sério que estou falando e escrevendo neste Livro, Deus me cobrou e seus amigos Amarildo? Crente 007! Te dei sabedoria, dons espirituais inclusive ministeriais, você é um pastor te dei capacitação, discernimento e unção! Te dei autoridade legal inclusive na terra está credenciado, está ungido com o Meu Espírito, pra que possa em Meu nome, curar, expulsar demônios e pregoar o ano aceitável do Senhor! Tudo isto e muito mais ... isto é evangelizar, fazer missões, proclamar o Reino de Deus o Plano de Salvação. Cadê o ide? a ordem de ir e proclamar as Boas Novas, O Plano de Salvação! Isso é Deus falando comigo neste momento em que estou digitando este livro! É, vem lágrimas sobre meus olhos e um nó na garganta e arrependido, nada posso fazer agora por eles, amigos que partiram, a não ser encher meus olhos de lágrimas, sentir-se pequeno, envergonhado, covarde e dói esta palavra quando é direcionada a nós! Sim, fui covarde diante de Deus com remorso e é só com a misericórdia de Deus. Aquele ímpio morrerá na <strong>sua</strong> iniquidade ( Ezequiel) 3;16 mas o seu sangue, da tua <strong>mão</strong> o requererei. Este versículo é muito forte e devemos refletir sim.</p>\n<p>Prossigamos em entender melhor sobre a importância de Cristo em nossas vidas através do Espírito Santo.</p>\n<p>No momento em que Jesus Cristo morreu na cruz, Satanás sofreu uma derrota catastrófica. Pode ser que a derrota não seja evidente, quando lemos os jornais e ligamos a televisão, mas Satanás é um inimigo vencido em princípio. Ele ainda arrisca sua guerra de pecado, mas sua destruição total e afastamento da terra estão próximos. Até lá ele vai intensificar suas atividades. Cristãos em todo o mundo podem notar que há novos demônios agindo. Perversões, permissividade, violência, conflitos por toda parte e centenas de outras tendências sinistras se manifestam em todo o mundo com uma intensidade que houve provavelmente só nos dias de Noé e Ló. O Espírito santo veio para nas mostrar estas coisas, porque Ele tem muito a ver com as profecias bíblicas, como veremos mais tarde.</p>\n<p>Amados! o Ministério do Espírito Santo no mundo não se limita a convencê-lo do pecado, da justiça e do juízo. Seu segundo objetivo no mundo é impedir o crescimento da iniquidade, ou seja, engajar-se no ministério de preservação. O apóstolo Paulo disse: &quot;Com efeito o mistério da iniquidade já opera e aguarda somente que seja afastado aquele que agora o detém &quot; (2 Tess. 2:7). A Palavra de Deus deixa bem claro que este planeta já seria literalmente um inferno na terra se a Espírito Santo não estivesse presente no mundo. O mundo descrente mal sabe o quanto deve ao poder controlador do Espírito Santo, ou seja a maioria das pessoas não tem nem noção do quanto estaríamos perdidos, bom, somos comparados sem Cristo como; <strong>velhos trapos imundos!</strong> Mas pela misericórdia e amor de Deus, pela graça de Jesus Cristo e a comunhão do Espirito Santo, pois é Ele que nos resgata, nos transforma e nos religa ao vínculo Paterno celestial.</p>\n<p>Há muitos comentários de teólogos e em seus livros relatando a triste noticia que o Espírito Santo está sendo retirado lentamente do mundo, à medida que entramos no que pode ser os momentos culminantes do fim desta época. Isto é muito serio que estou falando, quando tiver ido totalmente &quot;o diabo estará à solta &quot;. Haverá guerras, violência, revoluções, perversões, ódio, medo, no mundo hoje em dia temos só uma amostra do que vai acontecer. A raça humana se encontrará num inferno que ela mesma criou. Livre do que o detém o Espírito Santo e o Anticristo reinará com poderes supremos por um curto período de tempo, até ser esmagado pela vinda do Senhor Jesus Cristo com Seus exércitos!</p>\n<p>A ação do Espirito Santo também pode ser através do povo de Deus, que é chamado por Jesus no sermão do Monte de sal da terra e luz do mundo (Mat.) 5:13,14. Jesus fala muitas vezes no sentido figurado, por parábolas e se torna mais fácil de entender a mensagem, porque o sal e a luz da forças que agem em silêncio, discretamente, mas com grande eficiência. O sal e a luz falam da influência para o bem que os cristãos podem exercer na sociedade. Nós que somos crentes às vezes temos dificuldade para compreender que influência nós, uma minoria, divididos e às vezes desobedientes, podemos ter! Mas pelo poder do Espírito nós podemos reter o mal e fazer o bem!</p>\n<p>Aplicando mais estas metáforas, sabemos que o sal e a luz são essenciais em casa: a luz dissipa a escuridão, e o sal conserva os alimentos. A Bíblia nos diz que o mundo estará cada vez mais em trevas, quanto mais perto do fim. O mundo não tem luz própria, e está em acelerado processo de decadência. Jesus nos ensinou que nós, eu e você os Seus seguidores, são poucos e fracos, somos o sal que pode retardar o processo de declínio. Cristãos ativos no mundo são a única verdadeira luz espiritual.</p>\n<p>Em um pequeno livro de John R. W. Stott ele sublinha a importância de deixar Deus desenvolver e usar as nossas mentes convertidas: E &quot;Ninguém quer um cristianismo frio, intelectual, sem alegria. Isto, porém, significa que devamos evitar o &quot;intelectualismo &quot; a todo custo? Que as céus não permitam que conhecimento sem zelo substituam zelo sem conhecimento! Ambos fazem parte do propósito de Deus: O zelo sim, mas dirigido pelo conhecimento, conhecimento animado pelo zelo.: uma entrega sem reflexão é fanatismo em ação ( Billy Graham . Mas reflexão sem entrega é a paralisia de qualquer ação. E o Dr. Stott enfatiza também em seu artigo, como os que dizem que o que importa no fim &quot;não é doutrina, mas experiência &quot; estão errados: &quot; Isto é a mesma coisa que colocar a nossa experiência subjetiva acima da verdade de Deus revelada. &quot;É tarefa do Espírito Santo tirar o véu que Satanás pôs sobre as nossas mentes, e iluminá-las para que possamos entender as coisas de Deus. Ele faz isto especialmente quando lemos a Palavra de Deus, que o Espírito Santo inspirou.</p>\n<p>Podemos ver o Espírito Santo, além de iluminar a mente do cristão, também <strong>mora em seu corpo</strong>. &quot;Vocês não sabem que o corpo é o templo do Espírito santo que vive em vocês e foi dado por Deus? Vocês não pertencem a vocês mesmos &quot; (1 Cor). 6:19,</p>\n<p>Ai como seria maravilhoso, se nós compreendêssemos que o próprio Deus, na pessoa do Espírito Santo, realmente mora em nossos corpos, teríamos mais cuidado com o que comemos, bebemos, olhamos ou lemos. Não é de se admirar que Paulo tenha dons: &quot;Mas esmurro o meu corpo, e o reduzo à escravidão, para que, tenda pregado a outros, não venha eu mesmo a Ser desqualificado &quot; essas palavras foram proferidas por um ser humano assim como nós pecador mas arrependido e na qualidade de servo de Deus fala pela razão; em outras palavras Paulo diz será que eu estou vivendo oque eu prego? Meu Deus, porque eu mesmo venha ser desqualificado se não praticar o que ensino da parte de Deus! e Deus fala sim com cada um de nós no momento em que estamos cientes do pecado e pregamos a outras pessoas e Deus pergunta mas como você está filho (a) meu? Muitas vezes tentamos justificar isso em silêncio porque estamos levando a mensagem a outros e é instantâneo! e Deus diz não precisa falar! Será que isto só aconteceu comigo? Não responde nada, mas é importante a gente refletir. (1 Cor.) 9:27. Paulo disciplinava o seu corpo, para não cair no desagrado de Deus. Isto deveria nos colocar de joelhos para confessar, ele tinha um temor, uma reverencia ao sagrado, a santidade. Faço menção aqui ao meu pastor onde hoje auxilio e é o Pr. Ademar de Gois, e em uma de suas mensagens a Palavra discorria no Salmo 112, &quot; Como é feliz o homem que Louva ao Senhor, que teme ao Senhor e tem grande prazer em seus mandamentos! Seus descendentes serão poderosos na terra &quot; Em primeiro lugar e pra Deus o mais importante é louvar ao Senhor em tudo que fazemos! Ter temor a Deus! E ter prazer em Seus Mandamentos! Além de sermos felizes, nossos Descendentes serão prósperos e quem de nós pais e vós que não queremos o melhor para nossos filhos, netos e bisnetos!</p>\n<p>Nem precisaria estender-me sobre como o Espírito Santo age na vida dos cristãos? Mas penso que é importante ressaltar alguns versículos. Por exemplo: Ele nos conforta (Atos ) 9:31, Ele nos guia (João) 16:13. Ele nos santifica (Rom.) 15:16), Ele diz aos Seus servos o que devem pregar (1 Cor.) 2:13. Ele diz a missionários para onde devem ir (Atos 13:2), Ele nos ajuda em nossas fraquezas (Rom.) 8:26, e Ele até diz aos crentes onde eles não devem ir (Atos) 16:6, 7.</p>\n<p>A atuação do Espírito Santo entre os homens, podemos defini-las em três períodos da história humana e pode ser bem simples de entender com apenas três palavras: &quot;sobre &quot; &quot;com &quot; e &quot;em &quot;.</p>\n<p>Já no Antigo Testamento Ele veio &quot;sobre&quot; algumas pessoas à Sua escolha, permanecendo por um tempo determinado (Juízes.) 14:19.</p>\n<p>E nos Evangelhos mostram como Ele mora &quot;com&quot; os discípulos, na pessoa de Cristo (João.) 14:17.</p>\n<p>Mas é no segundo capítulo de Atos em diante que a Palavra enfatiza que Ele está &quot;no&quot; povo de Deus (1 Cor.) 6:19.</p>\n<p>O que seria da minha vida sem Jesus Cristo! E para conhecê-lo melhor é necessário ler e meditar na Palavra de Deus. A Bíblia foi escrita por quarenta homens e mulheres de Deus inspirados pelo Espirito Santo, contém sessenta e seis Livros é uma enciclopédia fechada e aberta é a Verdade, a Palavra de Deus (João) 17.17 e é dividida no Antigo e Novo Testamento. A Bíblia é Histórica, Poética e Profética. No novo Testamento há a biografia de Jesus Cristo nos quatro Evangelhos, podemos encontrar livros muitos profetas e Apóstolos e até mesmo escritores anônimos! Mas eu me refiro neste instante da grande importância dos escritos que podemos encontrar nas catorze cartas do Apóstolo Paulo.</p>\n<p>O apóstolo Paulo diz no Novo Testamento que toda Escritura vem de Deus: &quot;Toda Escritura é inspirada por Deus e útil para o ensino, para a repreensão, para a correção, para a educação na justiça &quot; (2 Tim.) 3:16. A palavra grega traduzida como &quot;inspirada &quot; significa literalmente &quot;soprada por Deus &quot;. Da mesma forma como Deus soprou nas narinas do primeiro homem a vida, ( Adão) fazendo dele um ser vivo, assim Ele sopra vida e sabedoria para dentro da Palavra escrita de Deus. Ele faz da Bíblia o livro mais importante do mundo, especialmente para todos que acreditam em Cristo. A Bíblia é nosso guia, GPS, mapa de orientação, fonte constante de fé, conduta, inspiração, da qual bebemos diariamente.</p>\n<blockquote>O Espírito Santo Inspirou as Escrituras</blockquote>\n<p>Quando conhecemos, e somente conheceremos e entenderemos a Palavra de Deus, quando abrimos este Livro Sagrado e então perceberemos que há centenas de passagens bíblicas que indicam, direta ou indiretamente, que o Espírito Santo inspirou os autores da Bíblia. Não sabemos com exatidão como Ele imprimiu Sua mensagem nas mentes dos que escolheu para escrever Sua Palavra, mas sabemos como Ele os dirigiu para que escrevessem o que Ele queria. &quot;Porque nunca, jamais qualquer profecia foi dada por vontade humana, entretanto homens falaram da parte de Deus movidos pelo Espírito Santo &quot; (2 Pedro) 1:21. Se você esta sentindo a presença de Deus! fica bem a vontade ai mesmo onde você está se pode dê um glória a Deus bem forte! Que é unicamente e especialmente para o Rei dos reis, e Senhor dos senhores Jesus Cristo. Eu acredito que depois desse glória você está mais animado e sentindo avivamento em seu coração e terá fome, em devorar este livro. Amados eu sei que há muitos pastores amigos meus e outros que nunca me viram, mas estão lendo este livro adquiriram ate mesmo para me ajudar para que a obra seja propagada e eu tenho absoluta certeza muito dos senhores já com seus Ministérios com mais de trinta anos e adquiriram muito conhecimento espiritual. Talvez ao ler até se passou pela sua cabeça praticamente o conteúdo deste Livro eu já sou conhecedor e preguei muitas vezes sobre este tema e subtítulos deste Livro. Mas é muito importante nós recarregarmos nossas baterias, e o Espírito Santo nos abastece, renova com Sua unção e este renovo nos dá alegria no coração Ele rejuvenesce nossa alma, nosso espírito e assim do nada começamos a sentir aquela atmosfera de paz e vem em memória o primeiro amor! Você está me entendendo? As primeiras vezes em que nós dobrava nossos joelhos diante do Eterno e Soberano Pai e nos derretíamos em lágrimas, não havia celular, com watts, nem Face book, nem internet com pacotes de filmes, futebol, Netflix, ou seja nada de tecnologia que é muito bom sabendo usá-las, eu me refiro que na prioridade de Deus em nossa vida. Nós temos intimidade sim, nos dias atuais com Deus, eu percebo nos cultos de orações nada mais de ficar uma hora ou mais na intimidade com o Pai! Aquilo quinze a trinta minutos no máximo e se lê um versículo da Bíblia e comenta-se das atividades da igreja. Não quero e nem devo generalizar, mas meus amigos pastores sabem dessa realidade, falo de oração e depois dos dez primeiros minutos já agradecemos pouco, nas petições se estende um pouco mais e somos especialistas em pedir! A fala é mais o menos assim; Senhor ...! Tu sabes das minhas necessidades! A Sua Palavra diz ....! é mais o menos como um advogado diante do Juiz e defendendo seu cliente, veja excelência a lei é bem clara no artigo 5ª da Constituição ou do Código Penal; o acusado, meu cliente tem o direito de liberdade. Já usei desse direito do artigo 5ª algumas vezes no meu local de trabalho (escola) para me defender e também para ensinar aos meus alunos; que o Artigo 5ª da Constituição nos garante professar nossa fé e vivemos em Estado Democrático e o Brasil graças a Deus é Estado Laico. Então nossa oração é muito rápida e prática, mecânica, com interesses e a adoração verdadeira vai adiando. Deus nosso Pai Se importa que O adoramos em espirito e verdade. Ele busca, deseja o verdadeiro adorador e esta adoração não se refere somente no louvor ou na oração, e repito sobre o Salmo 112, mas o louvor a Deus é também na contribuição, participação nas atividades da Igreja, e o principal é nossas atitudes fora da igreja, no local de trabalho, em casa, no laser etc. Na verdade a igreja é o local do aperfeiçoamento dos santos, somos orientados, exortados e estimulados a praticar a Palavra no dia adia.</p>\n<p>Vejamos como Deus é cuidadoso em tudo que faz, e Seu Espirito Santo cuidou nos mínimos detalhes quando soprava a Palavra de Deus aos autores da Bíblia, parece que cada livro da Bíblia surgiu de uma necessidade específica da época e serviria para todos os tempos. Só que além de satisfazer uma necessidade local, Deus estava também olhando para o futuro mais distante. Ele fez com que a Bíblia servisse a todas as pessoas, em todas as épocas. Por isso os autores bíblicos escreviam às vezes sobre acontecimentos futuros que não entendiam muito bem, para quem não tinha discernimento espiritual. Talvez Isaías não tenha compreendido muito bem o capítulo 53 de seu livro, dando detalhes do sofrimento de Jesus Cristo setecentos anos antes de o Senhor nascer. Mas mesmo assim escreveu o que o Espírito Santo soprava em seu ouvido, &quot;Foi a respeito dessa salvação que os profetas indagaram e inquiriram, os quais profetizaram acerca da graça a vós outros destinada, investigando atentamente qual a ocasião ou quais as circunstâncias oportunas, indicadas pelo Espírito de Cristo, que neles estava, ao dar de antemão testemunho sobre os sofrimentos referentes à Cristo, e sobre as glórias que os seguiriam &quot; (1 Pedro) 1:10, 11. Se o Espirito Santo quer te usar e soprar em seu ouvido; fale, anuncie, escreva e faça assim como eu estou fazendo agora e obedeça ao Espírito Santo Ele lhes dará sabedoria e não importa o que as pessoas dirão sobre a obra que está realizando sendo que o nome de Deus é que será glorificado. Confesso para muitos irmãos, pessoas cristãs quando falei dos Livros que Deus me deu, recebi bem pouco apoio, ou motivação e teve caso de enviar o livro ainda antes da impressão, por e-mail para analisar e registrar o prefácio, isso pessoa de minha intimidade sabedor do meu projeto e não me dar mais retorno, nem pra dizer onde deveria melhorar. Mas não é por isso que eu desistiria! Se é a vós de Do Espírito Santo que ecoa em seu ouvido, obedeça e receba a recompensa lá na frente porque Ele é fiel pra cumprir Suas promessas.</p>\n<p>Pode-se ver no Antigo como do Novo Testamentos, e encontramos referências frequentes ao Espírito de Deus, inspirando os que escreviam as Escrituras.</p>\n<p>A Palavra de Deus ensina, por exemplo, que o Espírito falou através de Davi que escreveu muitos dos Salmos, dos 150 Salmos da Bíblia Sagrada é bem provável que o rei Davi escreveu 73 Salmos: &quot;O Espírito do Senhor fala por meu intermédio, e a Sua Palavra está na minha língua &quot; (2 Sam.) 23:2.</p>\n<p>O Espírito Santo falou também através do grande profeta &quot;Jeremias &quot;Na mente lhes imprimirei as Minhas leis, também no coração lhes escreverei; Eu Serei o Seu Deus, e eles serão o Meu povo. Não ensinará jamais cada um ao seu próximo, nem cada um a seu irmão, dizendo: Conhece ao Senhor, porque todos Me conhecerão, desde o menor até o maior deles, diz o Senhor. Pois perdoarei as Suas iniquidades, e dos Seus pecados jamais me lembrarei &quot; (Jer. )31:33, 34.</p>\n<p>Vejamos o que disse Ezequiel: &quot;Então entrou em mim o Espírito, e me pôs em pé, falou comigo e me disse: Vai, encerra-te dentro da tua casa &quot; (Ez). 3:24. E o Apóstolo Pedro falou de &quot;todas as coisas, de que Deus falou por boca dos seus santos profetas desde a antiguidade &quot; (Atos) 3:21.</p>\n<p>É muito importante ler o livro aos &quot;Hebreus&quot; porque cita a Lei (Heb. )9:6-8, os Profetas (Heb.) 10:15-17 e os Salmos (Heb.) 3:7-10, atribuindo a cada um destes grupos de livros a autoria do Espírito Santo.</p>\n<p>Foi Jesus Cristo quem assegurou aos Seus discípulos de antemão que o Espírito Santo inspiraria os autores do Novo Testamento: &quot;O Espírito Santo ... vos ensinará todas as coisas e vos fará lembrar de tudo o que vos tenho dito &quot; (João) 14:26. Quando diz ensinará todas as coisas é inserido os quatro Evangelhos, de Mateus a João. A afirmação de Jesus: &quot;Ele vos guiará a toda a verdade &quot; (João) 16:13 se refere aos livros de Atos até Judas. &quot;Vos anunciará as coisas que hão de vir &quot; profecias (João) 16:13, inclui o Apocalipse e muitas outras passagens em todo o Novo Testamento. De forma que, como disse alguém, o Espírito de Deus literalmente habita na Escritura.</p>\n<p>Infelizmente há pessoas desenformadas, ingênuas e ignorantes, que falam da boca pra fora que a Bíblia foi o homem que inventou por si e não passa de interesses da minoria que está no poder eclesiástico! A palavra &quot;ignorante&quot; é a falta de conhecimento. A Palavra do Senhor diz; que Deus perdoa o tempo de ignorância e repito; (Mt) 22.29, &quot; Errais por não conhecer as Escritura e o poder que há nela&quot;. &quot;O Espírito Santo não só inspirou os autores das Escrituras, mas também esteve por trás da solução dos 66 livros que o cânon da Bíblia compreende. Os livros que foram incluídos na Bíblia, ao contrário do que muitos pensam, não foram escolhidos simplesmente por homens, em algum concílio eclesiástico. Na verdade o Espírito Santo agiu através de crentes cheios dEle, que selecionaram os 66 livros que temos em nossas Bíblias. Depois de anos, e até séculos, de discussão, oração, procura sincera, o cânon foi fechado. (cânon; cana para medir. Termo usado para um grupo seleto e temente a Deus para verificar e julgar autentico, verdadeiro o texto a ser inserido na Bíblia Sagrada.) O Espírito Santo, enquanto atuava, não passou por cima dos processos humanos de seleção, mas agiu por meio deles. Eu sou apaixonado pela obra de Deus, por isso então estudo, pesquiso a escatologia e trabalhando nas escolas como professor de Ensino Religioso e História, na disciplina de História falace muito em épocas, tempo e espaço. Ensino no começo de ano a introdução da História, o que é a História? Para que serve a história? O que é historiador? O que é fontes Históricas? E eles aprendem fácil por que dou a definição e explico envolvendo os alunos, instigando-os a trazer algo antigo que há em suas casas, e abre uma porta muito grande o tempo todo pra falar do cristianismo, do calendário cristão etc. Também quero dizer com isto que é lá no seu trabalho que Deus vai te usar meu irmão. E quando falamos da inspiração da Bíblia, nos depararmos imediatamente com uma das questões mais controvertidas de todas as épocas. Desde que Satanás pôs Eva em dúvida, no Jardim do Éden, perguntando: &quot;É assim que Deus disse; &quot; os homens têm atacado a Palavra de Deus. Mas sempre que duvidaram dEla, no decurso da História, sofreram tristes consequências na vida pessoal, na nação (o Israel Antigo) ou, da Igreja. Sem exceção, as pessoas, a Nação e a Igreja entravam em declínio espiritual, seguido muitas vezes de idolatria e imoralidade.</p>\n<p>Podemos ver que estudiosos competentes concordam que o Espírito Santo não usou os autores bíblicos como meros secretários, aos quais Ele ditou as Escrituras, apesar de alguns crentes sinceros acreditarem que Ele o fez. A Bíblia não dá detalhes de como o Espírito Santo alcançou Seu objetivo: sabemos de sábios judeus que sempre foi passado de pai para filho as instruções da parte de Deus desde Adão e Eva, marcante é quando Deus pede para Abraão sair de sua parentela e ir para um lugar estranho! Penso que todas as falas e ensinamentos chegaram até o grande Império do Egito e Moises sendo preparado a ser sucessor de Faraó teve sim acesso a estes rascunhos, este material e mesmo sendo um regime de autocracia em que o rei era adorado como deus. E Moises inspirado pelo Espirito Santo escreve o Pentateuco, os cinco primeiros Livros; Gêneses, Êxodo, Números, Levítico e Deuteronômio. E posteriormente também pela inspiração divina outros autores escreveram os demais livros. Eu creio perfeitamente que sempre esteve presente o Espirito Santo para fazer com que a Bíblia fosse escrita com tanta plenitude. Sabemos, no entanto, que Ele usou mentes humanas e que guiou os pensamentos de acordo com Seus propósitos divinos. Além disto, para mim sempre foi claro que não poderemos ter ideias inspiradas sem palavras inspiradas. Entendeu? Não? Então pega pra você esta! Depois de você ler este Livro e refletir sobre todo conteúdo contido nele e entenderá que é o Espirito Santo quem está soprando no ouvido do escritor e você absorvendo somente aquilo que o Espirito Santo deseja, brotará em seu coração uma ideia ou muitas ideias, planos, projetos e se estiver aliançado em Cristo eu acredito que irão se concretizar, veja só! Estou profetizando ou seja; estou obedecendo a vós do Espírito Santo para escrever estas palavras e nem imagino que ideias? Quais projetos serão os seus? Mas Deus manda te dizer que Ele é fiel para cumprir, porque os milagres vem dEle, porque a glória não é para você nem para mim, mas é para Ele e Deus não envergonhará seu servo! A Glória pertence a Deus mas a honra a quem é de honra! Ele vai te honrar! Você crer nessa palavra? Amém!</p>\n<p>A primeira Inspiração! Seria de muita ajuda definir as palavras mais importantes relacionadas com Escritura soprada por Deus.</p>\n<p>Quando tratamos de inspiração total, ou plenária da Bíblia, queremos dizer que toda a Bíblia foi inspirada, e não só partes dela.</p>\n<p>Vejamos só o que comentou o Dr. B. H. Carroll, fundador do maior seminário teológico do mundo (Seminário Teológico Batista, EUA) a Bíblia é chamada de Santa porque é infalível, (soprada por Deus), produzida pelo Espírito Santo ... Muitas pessoas dizem: E este humilde pastor Amarildo já ouviu muitíssimas vezes isto; &#x27;Eu acho que a Palavra de Deus está na Bíblia, mas não acredito que toda a Bíblia seja Palavra de Deus; ela contém a Palavra de Deus, mas não é a Palavra de Deus &#x27;. Misericórdia Senhor. Minha objeção a esta afirmação é que seria necessário inspiração para dizer quais as passagens que são inspiradas. Exigiria uma inspiração mais difícil de ter do que a que eu estou falando, para virar as páginas da Bíblia e dizer o que é Palavra de Deus. Em outras palavras, a inspiração da Escritura é plenária, ou seja, total e completa. E agora eu pergunto a você: &#x27;Você acredita em uma inspiração plenária da Bíblia? &#x27; Se a inspiração é completa, tem de ser plenária.</p>\n<p>E pergunto mais: &quot;Você acredita em uma inspiração plenário-verbal?&quot; Eu acredito, pela simples razão de que as palavras são meros sinais de ideias, e eu não saberia como chegar à ideia se não através de palavras. Se as palavras não me disserem a ideia, como chegarei a ela? Às vezes a Palavra é pequena, talvez só uma letra ou um sinal ortográfico, palavras de uma letra só, a menor letra até mostram a inspiração do Antigo Testamento. O homem que as pôs ali era inspirado.</p>\n<p>&quot;Vejam só o analise, as palavras de Jesus: &#x27;Nem um i ou um til jamais passará da Lei &#x27;. O &quot;i &quot; é a menor letra do alfabeto hebraico, e o &quot;til &quot; é um pequeno acento. Jesus disse que os céus passarão, mas nem um i ou um til da Lei passarão. Com isto Ele está dizendo que nenhuma parte da Escritura perderá a validade. O que não perderá a validade? Tudo que tiver sido escrito e for inspirada por Deus é revelação divina. E a Palavra não é inspirada se não for revelada que significa soprada por Deus, inspirada por Deus. É pela fé que poderemos entender, discernir os mistérios da Palavra de Deus.</p>\n<p>Poderíamos dizer muito mais sabre a completa confiabilidade da Bíblia. Só para ilustrar: Principalmente no Antigo Testamento a Bíblia usa centenas de vezes frases como &quot;Diz o Senhor &quot;, &quot;Veio a mim a palavra do Senhor, dizendo &quot;, etc. Também é interessante que Jesus nunca disse que devêssemos duvidar das passagens difíceis do Antigo Testamento. Por exemplo: Ele aceitava como fato, não como ficção, as histórias de Jonas e do grande peixe, de Noé e da arca, da criação de Adão e Eva. Se estas histórias não fossem literalmente verdadeiras, com certeza Ele teria nos avisado. Mas sempre de novo Jesus (e os autores do Novo Testamento) citava as Escrituras como tendo autoridade e como verdadeira Palavra de Deus.</p>\n<p>Também é interessante, comentar que algumas palavras da Bíblia escrita em hebraico não puderam ser traduzidas para outras línguas, de modo que foi necessário mantê-las na língua original. A palavra grega para &quot;batismo &quot; não tinha equivalente em português, por isto tornou-se uma palavra da nossa língua. O Espírito Santo tomou providências para que a Bíblia não fosse um livro morto, mas um meio vivo que Ele pudesse usar como quisesse e a todas as épocas Ela é eficaz é viva e sempre se renova.</p>\n<p>A Bíblia não é só inspirada, mas é também *autoritativa*. Quando uso esta palavra *autorizativa*, quero dizer que ela é a revelação de Deus, exigindo de nós um posicionamento. Nós nos submetemos a Ela porque Ela veio de Deus. Digamos que alguém pergunte: Qual é a fonte do nosso conhecimento religioso? A resposta é: A Bíblia, e ela é autoritativa. Quando rejeitarmos a autoridade do Antigo ou do Novo Testamento é o mesmo que estivéssemos rejeitando a autoridade de Cristo. Principalmente porque estamos decididos a nos submeter à autoridade de Jesus Cristo como Senhor e Salvador é que nos submetemos à autoridade da Escritura e submeter-se à Escritura é fundamental para a vida diária do cristão, porque sem isto o discipulado, o aliançado a integridade, a liberdade e o testemunho do cristão estarão seriamente prejudicados, se não totalmente destruídos. Sim, cada área das nossas vidas deve estar sob o Senhorio de Jesus Cristo. E isto significa que a luz da Palavra de Deus deve penetrar em cada canto da nossa existência. Não temos a liberdade de escolher e separar as passagens da Bíblia em que queremos acreditar ou obedecer. Deus a deu como um todo, e nós temos de obedecer a toda Ela. &quot;O Que seria de Minha vida sem Jesus Cristo!&quot;.</p>\n<p>Agora que entendemos melhor sobre autoridade, inspiração, revelação e infalibilidade da Bíblia, estamos ainda mais instruídos pra ensinar. Na verdade nós até entendemos o Plano de Salvação mas é só pra nós, uma coisa egoísta, individual e Deus quer nos usar é por isso que devemos buscar conhecimentos pra sermos boca de Deus e que na hora da abordagem e quando formos interrogados saibamos nos defender e proclamar a verdade de Cristo. Então há várias razões para confiar na Bíblia como Palavra de Deus, mas é neste ponto que a atuação do Espírito Santo Se manifesta mais claramente. A verdade é que o Espírito Santo, que foi o autor das Escrituras usando personalidades humanas, também atua sobre cada um de nós, para nos convencer de que a Bíblia é a Palavra de Deus, e que devemos confiar nEla em tudo. Amém!</p>\n<p>Penso que é importante recitar um parágrafo de um artigo escrito por João Calvino; mesmo que eu discorda do pensamento de Calvino sobre outro tema, fica para outra oportunidade comentarmos o que ele defendia a tese da Predestinação, e eu respeito, mas fico com o Livre-arbítrio. Mas sobre seu artigo da parte do Espírito Santo tem fundamento sim; &quot;Por isso, o mesmo Espírito que falou pela boca dos profetas tem de entrar em nossos corações para nos convencer de que eles disseram fielmente o que lhes fora divinamente ordenado ... Se ele não iluminasse as suas mentes, eles estariam vogando entre muitas dúvidas! Daí a certeza: Os que o Espírito ensinou interiormente se apoiam firmemente sobre a Escritura, que dá autoridade a si mesma, não sendo portanto direito sujeitá-la a provas e raciocínios. E a autoridade a que Ela tem direito lhe é dada pela atuação do Espírito. Porque mesmo se ela granjeia reverência a si por sua própria majestade, só nos afeta seriamente quando selada sobre nosso coração pelo Espírito Santo. &quot;</p>\n<p>Calvino continua: &quot;Por isso, iluminados por seu poder, cremos que a Escritura vem de Deus, e não por decisão de quem quer que seja; sem que a mente humana o possa compreender, afirmamos com absoluta certeza (como se estivéssemos olhando para a majestade do próprio Deus) que ela fluiu a nós da boca de Deus, através do ministério de homens. Não buscamos provas, nem indicações de autenticidade sobre as quais apoiar nossa decisão; submetemos a Ela nossa opinião e nosso raciocínio, como a algo muito além de qualquer suposição! Fazemos isto não como pessoas acostumadas a opinar sobre alguma coisa desconhecida que, sob análise mais acurada, lhes desagrada, mas plenamente conscientes de que possuímos a verdade incontestável.</p>\n<p>A verdade é que os autores do Antigo e do Novo Testamento foram inspirados pelo Espírito Santo é uma parte da história, apenas. Além disto, Ele ilumina as mentes e abre os corações dos leitores. Achamos as mais diversas reações espirituais à Palavra de Deus. Jeremias disse: &quot;Achadas as tuas palavras, logo as comi; as tuas palavras me foram gozo e alegria para o coração, pois pelo teu nome sou chamado, ó Senhor, Deus dos Exércitos &quot; (Jer) 15:16. Isaías disse: &quot;Seca-se a erva e cai a sua flor, mas a palavra do nosso Deus permanece eternamente &quot; (Isa) 40:8.</p>\n<p>E quando Jesus advertiu os saduceus de quase dois mil anos atrás de que havia muitos erros em seus ensinos porque não conheciam as Escrituras e o poder de Deus (Mat.) 22:29. Isto relaciona as Escrituras com o poder do Espírito Santo, que opera transformações através da Bíblia. E João registra as palavras de Jesus: &quot;A Escritura não pode falhar &quot; (João) 10:35. Jesus disse também: &quot;Vós já estais limpos, pela palavra que vos tenho falado &quot; (João) 15:3.</p>\n<p>O Espirito Santo tem usado e quer nos usar através da Bíblia, Ele não só nos transmite verdades
