 doutrinarias ou históricas, Ele também a usa como meio de falar aos nossos corações. É por isso que insisto com as pessoas que estudem as Escrituras, entendam o que estão lendo. A leitura da Escritura em si possibilita a iluminação do Espírito e sua atuação em nós. Enquanto lemos a Palavra, sua mensagem enche os nossos corações, estando nós conscientes disto ou não. A Palavra, com todo o seu poder misterioso, toca em nossas vidas e nos dá do Seu poder, aquele vaso jogado, Vazio outrora, agora é renovado, um vazo transbordando de unção.</p>\n<p>Repito; podemos ver isto, por exemplo, na afirmação de Paulo: &quot;Nem olhos viram, nem ouvidos ouviram, nem jamais penetrou em coração humano o que Deus tem preparada para aqueles que o amam; mas Deus nos revelou pelo Espírito. .. &quot; (1 Cor.) 2:9, 10.</p>\n<p>Observe que Paulo não diz que Deus nos revela estas coisas por Sua Palavra (apesar de ser o lugar de as acharmos), mas Ele o faz pelo *Espírito*, através da Sua Palavra. &quot;Nós não temos recebido o espírito deste mundo, mas o Espírito mandado por Deus, que nos faz entender tudo o que Deus nos tem dado &quot; (1 Cor.) 2:12.</p>\n<p>Em um Congresso de Evangelização de Lausanne em 1974, o Ver Gottried Osei-Mensah falou: &quot;Revelar verdades antes escoradas da busca e da compreensão humanas, iluminar as mentes das pessoas para que as conheçam e entendam (1 Cor. 2:9, 10) é obra do Espírito Santo. &quot; Se ensinar é função do Espírito, nossa obrigação é ser estudantes Sinceros da Palavra. &quot;</p>\n<p>. Enquanto estudamos as Escrituras aprendemos também que o Espírito deixa brilhar cada vez mais a luz da Palavra. Quase cada vez que eu leio uma passagem que me é familiar há muito tempo descubro alguma coisa nova. E é natural que aconteça também com você. Isto acontece porque a Palavra escrita de Deus é Palavra viva. Uma dica muito especial a seguirmos e ao nos aproximarmos das Escrituras com a oração do salmista: &quot;Abre os meus olhos para que eu posa ver as verdade maravilhosas da tua lei ( salmos) 119.18.</p>\n<p>Precisamos vigiar e estaríamos preparados no dia a dia de nossa caminhada! Em meu trabalho foi nesta semana final do mês de Fevereiro de 2017 em uma das escolas que trabalho, uma colega, professora postou no watts do grupo de professores um artigo falando palavras lindas sobre Jesus Cristo quase que digo amém e compartilho para outros grupos que estou inserido. Estou comentando porque o Espirito Santo abriu minha mente, me dando discernimento sobre o espiritismo, pois a Palavra de Deus reprova o espiritismo e Deus ama os espiritas mas reprova a prática do espiritismo, vou registrar que foi postada e posteriormente citarei os versículos da Bíblia que reprovam a prática do espiritismo. &quot; Um dia como hoje me convidaram a conhecer a Deus, mas não tive tempo, sempre tinha coisas para fazer em casa, o trabalho, estudo e amigos, em fim nunca tive tempo. Até que chegou o tempo de morrer e quando me apresentei diante de Deus vi que Ele tina em Suas mãos um Livro e era o Livro da Vida. Deus foleou as paginas de Seu Livro e disse; não encontrei seu nome. Uma vez estive ao ponto de anotá-lo, mas não tive tempo. E nesse momento lembrei-me daqueles dias que não tive tempo para Deus. então Ele voltou, e olhou dentro dos meus tristes olhos e com sorriso angelical me disse; não te preocupes filho meu, sempre terei tempo para ti. ( preste muito a atenção neste detalhe do espiritismo aplica a reencarnação ao invés de ressurreição através de Jesus Cristo) prossegue a mensagem espirita; No entanto voltarás a terra novamente para ensinar esta lição de vida que é, nunca diga que não tem tempo para Deus. a mensagem prossegue pedindo a Deus que caminhe dentro de minha casa, cure os enfermos, prospere e pede para orar um Pai Nosso, como é a oração modelo que Jesus nos ensinou seria rezar ( repetir esta oração).</p>\n<p>Amados, ainda na sala dos professores eu estava com esta mensagem engasgada na garanta, o Espirito Santo soprando em meu ouvido, você vai se calar e engolir seco esta mentira do diabo! O meu pastor, meu representante leal, te coloquei neste ambiente para não envergonhar a Cristo, nem a Mim, menos ao Pai e você vai se acovardar. Faltava ainda dez minutos para iniciar a aula e nesse entra e sai de professores havendo ainda uns quinze professores e a maioria são mulheres na pedagogia então por um segundo silenciou a sala dos professores e eu disse a mim mesmo é agora que eu falo eu sei do que estou falando e levantei a lebre! Disse professora Suzane aquilo que postastes ontem a noite no watts do grupo dos professores eu refleti e respeito sua fé, e sabes que dentro da sala de aula devemos ser neutros, quando se trata de Politica, futebol e religião, sim devemos ensinar, mas não levantar uma bandeira, ou seja afirmar esta denominação é melhor do que a outra e a minha é que está correta! Mesmo assim temos um pouco de influencia sim, mas não um fanatismo, porque nosso país é Estado Laico, Artigo 5ª nos da garantia de expressar nossa fé. E esta professora passa por um momento difícil pois seu esposo esta acometido de câncer em estado bem adiantado com tratamento quimioterapia e ela se esforça, trabalha tem dois filhos, comentou que estava fazendo campanhas nas Igrejas Evangélicas, ou seja, ela esta desesperada e atira para todos os lados. Melhor dizendo busca uma resposta de Deus em vários lugares e nós sabemos que há somente um Deus e um Mediador entre Deus e o homem e o nome dEle é Jesus Cristo. Então tentei explicar profe. Suzana o que a Bíblia diz sobre a pratica do espiritismo, e que a salvação conquistamos aqui na terra, ou infelizmente a morte eterna. Disse também que o Livro da Vida que ela citou e que nosso nome deverá constar neste Livro é verdade, mas em Mc 16.15 deixa bem claro que &quot; Todo aquele que crer e for batizado será salvo.&quot; E nesse momento só ranger de dentes das nobres colegas espiritas, mas eu estava convicto que não era elas mas sim o espirito do inimigo que havia convencido aqueles corações de mãe, de excelentes educadoras mas infelizmente deram espaço para o inimigo enganar. Disse se acalmem apenas eu tenho este entendimento e não sou eu quem diz é a Palavra de DEUS, é importante que conheçamos a Palavra e em (Mt) 22.29 a Palavra nos diz; &quot; Errais por não conhecer a Verdade e o Poder de Deus.&quot; em dez minutos não deu para falar muito isto vou de pressa, mas disse ainda sobre a parábola do Rico e do Pobre e foi Jesus quem pregou esta mensagem óbvio que foi para aquele povo incrédulo daquela época, mas conjecturamos aos dias de hoje; pois o homem rico, nada errado de conquistar bens materiais, riquezas e ele teve oportunidade de fazer o bem ao próximo enquanto vivia mas não fez! Então estava literalmente no inferno, vejamos Jesus fala por metáfora como já existisse o inferno! Então ali é densas trevas, há um fogo que nunca se apaga, a sensação de calor é constante e o Homem rico pede para Lázaro que molhasse o dedo na água e viesse até ele para refresca-lo. Lazaro que foi um homem bom, muito humilde, honesto, íntegro quando ainda estava aqui na terra e agora estaria no céu. A bíblia diz que Abraão fala ao homem rico; agora não tem como Lázaro vir até você, há uma divisão entre o céu e o inferno, e é conquistado somente em vida terrena. O homem rico insiste em perguntar; Abraão, eu tenho cinco irmãos que ainda estão la na terra e envie alguém para informa-los e Abraão fala; lá na terra há profetas, homens e mulheres de Deus que estão evangelizando e mesmo que fosse alguém daqui, muitos não acreditariam. Essa parábola deixa bem claro que a salvação é individual e é conquistada aqui, e hoje sabemos que é somente através de Cristo, porque Ele diz; Eu Sou o caminho, a verdade e avida, ninguém vem a Pai se não por Mim. Só para finalizar, eu falei as nobres educadoras espiritas; não é por Alan Cardek, é por Cristo que chegamos ao Pai, caso contrário mesmo respeitando vossa fé, mas se utilizar da Bíblia porque eu sei que vocês usam dEla e os versículos que citei e vou citar ainda deverias extrai-los da Bíblia. Sabemos que a Bíblia é a verdade (João) 17.17. E por último disse; respeitando a posição de vocês, mas supomos que o que estou falando é verdade! Eu, estou convicto que sim, mas é a Bíblia quem diz; que para os incrédulos haverá condenação. Sinceramente, eu trabalhei nesta manhã em sala de aula com meus alunos, mas parecia estar pesado aquele ambiente e eu explicava outros assuntos na aula de história para os alunos e aquelas aulas não fluíam, passei conteúdo na lousa e fui até o corredor e orei pedindo que o Espirito Santo me fortalecesse e rever se eu havia falado coisa que não devia, mas veio uma sensação de alegria, de felicidade e uma vós repetia em meu ouvido; você não se envergonhou de Mim! Não se acovardou1 é por isso que te coloquei ai, não foi pela sua capacidade não! E eu entendi soltei um glória a Deus! sei, que sou pequeno, fraco, pecador, mas honrando o nosso Deus, estando compromissado com Ele, o Senhor se compromete conosco. Já, no outro dia, eu saio de casa ungido, assim, oração, óleo ungido na testa, nas mãos, acreditam foi e será uma benção me respeitam, já precisaram de mim, a mídia falhou Deus me colocou na hora e lugar certo e fiz a diferença solucionando o problema do Multimídia, tudo isto é para glória de Deus.</p>\n<p>Amados, &quot;O que seria de minha vida sem Jesus Cristo&quot;.</p>\n<p>ALGUNS DOS TEXTOS ONDE DEUS CONDENA A PRÁTICA DO ESPIRITISMO.</p>\n<p>(Lv) 19:26 e 31. (Lv) 20:6. Necromantes; são os que consultam os mortos. (Dt) 13:1-18. Deus condenava á morte, todo aquele que invocasse outro espírito que não Ele.</p>\n<p>(Dt) 18:9-14. Deus não quer que Seu povo se envolva com o espíritos .</p>\n<p>(ICrônicas) 10:13-14. Foi o fim do rei Saul que preferiu desobedecer a Deus e a crer nos espíritos.</p>\n<p>(II Reis) 21:6.Manassés provocou a ira de Deus por consultar os médiuns e não O buscar, além de outras abominações.</p>\n<p>(II Reis) 23:24-25. Josias ao contrário de outros reis amava ao Senhor e desprezou os médiuns da sua época.</p>\n<p>(Dt) 18:9-14. Deus não quer que Seu povo se envolva com o espíritos.</p>\n<p>(II Tessalonicenses) 2:7-12. Paulo alerta a Igreja de Cristo que no final dos tempos os &quot; espíritos&quot; operariam curas e prodígios com o objetivo de enganar o povo e leva-los ao inferno eterno.</p>\n<p>(I Timóteo) 6:3-5. Paulo alerta que apreciam homens no final dos tempos preando que a prática das boas obras seria o caminho para a salvação. Porém ele alerta que além deste engano, eles com uma falsa humildade tirariam grande lucro próprio com isto. Importante ressaltar que os espíritas creem que as boas obras é um dos caminhos para salvação. O cristão sábio, verdadeiro imitador de Cristo, depois de aceitar Jesus Cristo como Único Senhor e Salvador para sua vida, confirma com o batismo e terá uma vida na presença de Deus, certamente a partir deste principio realizando boas obras. (I João) 4:1-6. No Evangelho de João vemos o desafio aos que invocam aos espíritos.</p>\n<p>(I Samuel) 28:1-25. Este texto é muito usado pelo espiritismo, para dizer que quando as entidades são invocadas aparecem. Tentando assim afirmar e convencer o praticante da veracidade e que Deus aprova esta prática. Porém oque eles não sabem, ou fingem não saber, pois o inimigo é astuto e os enganam e que o tipo de espírito nunca pode ser maligno e o que estava aparecendo naquela invocação, no caso relatado pelo rei Saul. Encontrou morte por ter feito aquilo, e o que Deus o proibia para o seu próprio bem.</p>\n<p>(Hb) 9:27. Não há reencarnação. Depois da morte haverá apenas o juízo.</p>\n<p>(Lucas) 23:43. Um dos ladrões crucificados com Jesus pediu para que ele fosse salvo. Vejamos não precisou realizar o batismo para este ladrão que se arrepende minutos antes da morte e entende que é aqui que conquistamos ou perdemos a salvação e é somente através de Cristo. Jesus diz; ainda hoje te digo, estarás comigo no paraíso.</p>\n<p>É uma estratégia de satanás para enganar seus seguidores, que eles teriam uma nova chance e invalidariam o Plano de salvação a través de Jesus Cristo sendo o único caminho para a salvação. Existem mais textos Bíblicos esclarecedores sobre o quanto Deus ama os espiritas, mas odeia e reprova a pratica do espiritismo, sabemos que Deus não divide a Glória dEle com ninguém, e mais, todo o amor incondicional que Deus demostrou enviando Seu Filho amado, para morrer numa cruz redimindo todos nossos pecados. Pensem comigo! Seria em vão a vinda, os ensinamentos, morte e ressureição de Jesus Cristo? Foram mais de quinhentas pessoas que testemunharam ver Cristo ressuscitado! Ou acreditaríamos em alguém, um homem pecador que desenvolveu uma teoria sobre espiritismo, defende a reencarnação e se, seus seguidores desejarem visitá-lo, ainda encontrarão restos mortais em sua tumba, estou falando de Alan Cardek.</p>\n<p>Foi em 1940 aproximadamente que houve um reavivamento do espiritismo através de um francês Allan Kardec, e esta seita atingiu nossa Nação desde este período, porque houve um enfraquecimento na Igreja Católica, por não alimentar corretamente a vida espiritual dos cristãos utilizando-se da Palavra de Deus, sabemos que na Idade Média, período Medieval séc. III ao Séc .XIV , foi marcado pela perseguições da Igreja Católica, pois tinha poder de Estado, e em suas cruzadas prendiam, e pregavam nas estacas, queimavam em fogueiras ( JoanaDarque ) quem possuía um exemplar da Palavra de Deus, ou quem não aceitava estas imposições, e chamavam de (heresia) e eram inquiridos ( a santa inquisição), também pagavam indulgencias, para redimir seus pecados. E foi denominado pelos iluministas no período da revolução francesa já no séc. XVIII com; o período das trevas, tempo de obscuridão! Então, eu vejo hoje a importância que a igreja Católica trousse como Greco-cultura, a família conservadora a fraternidade o amor, o perdão e tendo uma ótica diferenciada dos iluministas, devemos filtrar e adotar as coisas boas do passado, mas ciente que houve negligência na parte espiritual. E na Reforma protestante Martinho Lutero também teve uma importante participação apresentando suas 95 teses discordando de muitas práticas do catolicismo e sabendo que ele foi um Padre e advogado, sendo que o Espirito Santo iluminou sua mente e tantas versões bíblicas a partir dele, e hoje podemos pesquisar, estudar, e meditar na Palavra de Deus tendo o discernimento da verdade sobre o Plano de salvação.</p>\n<p>Eu creio neste único Deus que trouxe à existência todas as coisas! o que não existia e com Sua Palavra passou a existir, que do nada criou todas as coisas, que espalhou as estrelas no firmamento, que estabeleceu os fundamentos da terra, que está assentado no trono e dirige a história, é o Deus que abençoa você, que é apaixonado por almas. Entenda você não será abençoado, mas sim você já é abençoado com toda sorte de bênçãos de Deus. Ninguém pode roubar as suas bênçãos. Elas são espirituais, são eternas ( Efésios) 1.3-14. &quot;O que seria da minha vida sem Jesus Cristo!&quot; Você também é abençoado por meio de Jesus, Ele é o Mediador das suas bênçãos. É por meio dEle, dos Seus Méritos, da Sua morte, do Seu sacrifício que você recebeu por herança todas as bênçãos. Isto não é maravilhoso! E quais são essas bênçãos? Deus, o Pai é o autor da eleição. Não fomos nós quem escolhemos a Deus, mas Ele é quem nos escolheu (João) 15:16. Os pecadores perdidos, entregues a si mesmos não procuram a Deus (Rm) 3:10-11; Deus em Seu amor é quem procura os pecadores (Lucas 19:10). Deus nos escolheu para Si, de acordo com o Seu beneplácito. A eleição é um ato da Sua benevolência Soberana. Vejam só a situação que nos encontrávamos! Éramos impuros e repreensíveis, estávamos perdidos e condenados. A causa da escolha está nEle mesmo! Deus escolheu Abraão entre os homens de Ur dos Caldeus na Antiga Mesopotâmia, hoje Iraque, escolheu Isaque e não Ismael; escolheu Jacó e não Esaú; escolheu Israel e não as nações ao seu redor. Agora, em Cristo, Ele escolheu para Si um novo povo &quot;Deus nos escolheu!&quot; Isso prova que a salvação não é universalista. Paulo está escrevendo aos crentes e aos santos e irrepreensíveis. Este &quot;nos&quot; não pode referir-se a todos os homens sem distinção. É muito importante que saibamos que Deus nos elegeu em Cristo. No tempo o Pai nos abençoou em Cristo assim como nos elegeu nEle desde toda a eternidade. A eleição é o fundamento de todas as bênçãos sequentes. A eleição não anula a cruz. Deus não nos escolheu em nós mesmos, por nossos méritos, não merecíamos nada por merecimento, mas é em Cristo. É por isso que o título deste Livro é a grande verdade&quot; O que seria da minha e a sua vida sem Jesus Cristo! Deus nos escolheu em Cristo antes da fundação do mundo. O plano de Salvação é eterno. Seu decreto é eterno, portanto jamais será frustrado Deus nos escolheu em Cristo, repito; para sermos santos e irrepreensíveis! Deus não nos elegeu porque éramos, mas para sermos! Não nos elegeu porque fazíamos boas obras, mas para as boas obras! Não nos elegeu porque previu que iríamos crer, mas cremos porque fomos eleitos! A eleição é a raiz da salvação, não seu fruto! Contudo o propósito final da eleição é o louvor da Sua Glória.</p>\n<p>A doutrina da eleição é uma revelação divina e não uma especulação humana! A doutrina da eleição é um incentivo à santidade e não uma desculpa para o pecado! é um estímulo à humildade e não um motivo para o orgulho. Infelizmente há muita gente que confunde a Doutrina da eleição e se acha santo, salvo e pode fazer o que quiser que está eleito e salvo. Nada disso, é necessário andar na obediência, na fidelidade até o fim e receberá seu galardão. Você sabe o quanto Deus nos ama? A Bíblia diz que somos a menina dos olhos de Deus! A pupila é a parte mais sensível do corpo. É a parte mais frágil e delicada, você a protege e Deus age da mesma forma com os seus filhos. Se você tocar em um de seus filhos, você está colocando o dedo no olho de Deus! gente isto não é maravilhoso! Você e eu somos o melhor de Deus. A Bíblia diz que somos o Seu tesouro particular (Ml) 3:17. Diz que Deus nos dará um nome eterno (Is)56:5. Nos fala; que Deus recolhe nossas lágrimas em seu odre (Sl) 56:8. E quando morremos, nossa morte é preciosa aos seus olhos (Sl) 116:15. Você não é anônimo não! E nem o que o inimigo diz! Receba esta benção; Deus nos fez reis, príncipes e sacerdotes, herdeiros. Deus diz que Seus filhos são os notáveis em quem Ele tem todo o Seu prazer (Sl) 16:3. A Bíblia diz que nós somos os vasos de honra de Deus (2 Tm) 2:21. A Bíblia diz que os filhos são dignos de honra (Is) 43:4. Nós somos a herança de Deus sabia que a nossa posição é mais elevada do que a dos anjos. Eles nos servem. Nós somos coparticipantes da natureza divina. Quando estamos ligados a Cristo. Somos membros do corpo de Cristo. A Bíblia diz; que nós nos assentaremos com Ele no Seu Trono (Ap) 3:21, Imagine só uma família feliz, onde reina o amor e a paz e os filhos pulando no colo do pai.</p>\n<blockquote>Nós fomos transferidos da velha família de Adão, Onde éramos escravos, cegos, perdidos, filhos da ira (Ef) 2:2-3. hoje, somos membros da família de Deus. O Senhor é nosso Pai. Cristo é o nosso irmão mais velho. Os santos são nossos irmãos e coerdeiros, os anjos são espíritos que nos servem. E a Adoção consiste em uma imunidade e desobrigação de todas as leis que nos prendiam à antiga família! Agora não somos mais escravos do pecado! Porque fomos libertos do império das trevas e somos novas criaturas. Vejamos, que adoção consiste em uma legal investidura dos direitos da nova família e recebemos um novo nome! Antes éramos, criaturas, escravos, agora somos filhos. Antes éramos pecadores, agora somos santos. Recebemos também uma gloriosa herança, somos herdeiros de Deus e coerdeiros com Cristo. Sabia que o inimigo cega muita gente com religiosidade, falsas doutrinas e acaba afastando dos caminhos de Deus, impedindo de conhecer a verdade, das bênçãos, das promessas dos propósitos que Deus tem para suas vidas.\\ Deus sempre foi completo em si mesmo. Deus sempre se deleitou no seu filho unigênito. Os herdeiros de Deus possuem tudo o que é do Pai. Tudo o que Deus tem é nosso. A adoção humana é feita sem sacrifício, a divina custou a vida do Seu Filho! A nossa adoção custou a morte do Seu Filho unigênito, para fazer-nos filhos adotivos. Deus selou nossa certidão de nascimento com o sangue do Seu Filho. Quando Deus criou todas as coisas, ele apenas falou, mas quando nos adotou, o sangue do Seu Filho precisou ser derramado.\\ A adoção humana apresenta benefícios terrenos, a adoção divina confere bênçãos celestiais! Deus concede-nos mais do que bens, concede-nos uma nova vida, um novo coração, uma nova mente, uma nova herança, um novo lar, uma vida na eternidade com Cristo.\\ O quanto Deus nos ama! Porque nós não apenas fomos adotados, mas também nascemos do Espírito, nascemos do alto, da divina semente. Somos coparticipantes da natureza divina. Fomos feitos à imagem de Deus e agora, somos regenerados pelo Espírito. Temos uma nova vida, uma nova mente, um novo nome, uma nova família, uma nova Pátria. Somos filhos do Deus altíssimo!\\ &quot;O que seria da minha vida sem Cristo&quot;! Ele, Cristo redimiu nossos pecados na cruz A palavra &quot;redimir&quot; significa comprar e deixar livre mediante pagamento de um preço. No período de Paulo o Império Romano tinha aproximadamente 60 milhões de escravos e geralmente eles eram vendidos. Mas um homem podia comprar um escravo e dar-lhe liberdade. Foi isso que Cristo fez por nós e o preço da nossa redenção foi o seu sangue (1Pe)1:18. Isso significa que estamos livres da lei (Gl) 5:1, da escravidão do pecado (Rm) 6:1, do mundo (Gl)1:4 e do poder de Satanás (Col) 1:13-14\\ Foi exatamente quando Cristo estava lá na cruz, Deus lançou sobre Ele todos os nossos pecados, toda ira de Deus foi inserida na cruz, Ele foi ferido pelas nossas transgressões,( Isaias) 53.4, traspassado pelas nossas iniquidades. O Filho de Deus foi cuspido, surrado, ferido, pregado na cruz. A multidão o afrontava, e preferiram libertar um ladrão chamado Barrabáz. Os soldados o açoitavam. Os religiosos zombavam dEle. Seu corpo foi ferido. E quando ele estava no topo do gólgota, Ele foi feito pecado por nós. Ele pegou o escrito de dívida que era contra nós e rasgou, quitou, pagou a conta. Ele pagou nossa dívida. Ele nos redimiu. Ele nos justificou. Isso é mais do que perdão, é justificação. Será que tem motivos para dizer &quot;oque seria de minha vida sem Jesus Cristo!&quot;\\ Então, Deus tem direito sobre nós por criação e por redenção. Somos dEle porque Ele nos criou. Somos dEle porque Ele nos comprou.</blockquote>\n<p>Quem é Jesus Cristo para sua vida? Talvez poucas pessoas perguntassem se Jesus Cristo existiu ou não? Geralmente se aceita que Jesus foi de fato um homem que andou na terra, em Israel, na Antiga Palestina isso há mais 2000 anos. E começamos entender pela fé, quando se analisa o assunto da completa identidade de Jesus. É verdade que quase todas as grandes religiões ensinam que Jesus foi um Profeta, um bom Mestre ou um homem piedoso. O problema é que a Bíblia nos diz que Jesus foi infinitamente mais do que um profeta, bom Mestre ou homem piedoso! Então, quem Jesus afirmou ser? Segundo a Palavra de Deus, quem foi Jesus? Examinando as palavras de Jesus em (João) 10:30: &quot;Eu e o Pai somos um.&quot; Em um primeiro momento, pode não parecer uma afirmação em ser Deus. Entretanto, veja a reação dos judeus perante Sua afirmação: &quot;Os judeus indignados responderam, dizendo-lhe: Não te apedrejamos por alguma obra boa, mas pela blasfêmia; porque, sendo tu homem, te fazes Deus a ti mesmo&quot; (João) 10:33. Os judeus compreenderam o que Jesus havia dito como uma afirmação em ser Deus. Nos versículos seguintes, Jesus jamais corrige os judeus dizendo: &quot;Não afirmei ser Deus&quot;. Isto indica que Jesus realmente estava dizendo que era Deus ao declarar: &quot;Eu e o Pai somos um&quot; (João) 10:30. Outro exemplo é João 8:58, onde Jesus declarou: &quot;Disse-lhes Jesus: Em verdade, em verdade vos digo que antes que Abraão existisse, eu sou.&quot; Mais uma vez, em resposta, os judeus tomaram pedras para atirar em Jesus (João) 8:59. Jesus anuncia Sua identidade como &quot;Eu sou&quot;, Jesus fez uma aplicação direta do nome de Deus no Velho Testamento (Êxodo) 3:14. Por que os judeus, mais uma vez, se levantariam para apedrejar Jesus se Ele não tivesse dito algo que creram ser uma blasfêmia, ou seja, novamente uma autoafirmação em ser Deus? No Evangelho de Jesus Cristo narrado por (João) 1:1 diz que &quot;o Verbo era Deus&quot;. (João )1:14 diz que &quot;o Verbo se fez carne&quot;. Isto mostra claramente que Jesus é Deus em carne. Tomé, o discípulo, declarou a Jesus: &quot;Senhor meu, e Deus meu! (João) 20:28. Jesus não o corrige. O Apóstolo Paulo O descreve como: &quot;O grande Deus e nosso Senhor Jesus Cristo&quot; (Tito) 2:13. O Apóstolo Pedro diz o mesmo: &quot; O nosso Deus e Salvador Jesus Cristo&quot; (II Pedro) 1:1. Deus o Pai também é testemunha da completa identidade de Jesus: &quot;Mas, do Filho, diz: Ó Deus, o Teu Trono subsiste pelos séculos dos séculos; Cetro de equidade é o cetro do Teu Reino&quot; (Hebreus) 1:8. No Velho Testamento, as profecias a respeito de Cristo anunciam sua divindade: &quot;Porque um menino nos nasceu, um filho se nos deu, e o principado está sobre os Seus ombros, e se chamará o Seu nome: Maravilhoso, Conselheiro, Deus Forte, Pai da Eternidade, Príncipe da Paz&quot; (Isaías 9:6). A cada pagina que você ler vai conhecendo e se aproximando ainda mais de quem é Jesus Cristo e do quanto Ele é importante para sua vida! Então, devemos crer que Jesus não foi somente Profeta, um bom mestre como muitas religiões afirmam ser. Foi o próprio Jesus que claramente e inegavelmente Se auto -afirma Deus. Se Ele não é Deus, então mente, consequentemente não sendo também profeta, bom mestre ou homem piedoso! Mas, Jesus Cristo é Rei dos reis e Senhor dos Senhores. Por que se faz tão importante a questão sobre a identidade verdadeira de Jesus? Por que importa se Jesus é ou não Deus? veja bem, o motivo mais importante para que Jesus seja Deus é que, se Ele não é Deus! Sua morte não teria sido suficiente para pagar a pena pelos pecados do mundo inteiro! Seria um sofrimento inútil! Compreendeu? (1João) 2:2. Precisamos entender, que somente Deus poderia pagar tamanho preço! ( outra pessoa, por mais santa que fosse não teria legalidade para substituir Jesus, somente Ele o cordeiro imaculado, sem pecados!) porque todos pecaram exceto Cristo! (Rm) 3.23. E em (Romanos) 5:8; II Coríntios) 5:21. Jesus tinha que ser Deus para que pudesse pagar nossa dívida. Jesus tinha que ser homem para que pudesse morrer. A Salvação está disponível somente através da fé em Jesus Cristo! A natureza divina de Jesus é o motivo pelo qual, &quot; Ele é o único caminho para Salvação!&quot; A divindade de Jesus é o porquê de ter proclamado e repito: &quot;Eu sou o caminho, e a verdade e a vida; ninguém vem ao Pai, senão por mim!&quot; (João) 14:6. O povo daquela época estavam apegado na religiosidade, nos costumes e tradições do judaísmo e não queriam aceitar as verdades de Jesus, o Plano de Salvação. Assim é nos dias atuais há seguidores de tantas Religiões, seitas e heresias e poucos acreditam e aceitam Jesus como Salvador para sua vida. Somente do Cristianismo há mais de trinta e cinco mil denominações, sim dizem ser cristãs e todos os dias esta sendo criadas e implantadas novas igrejas e denominações com sua doutrina própria e nela até se lê a Bíblia, mas o culto geralmente que seria uma adoração a Deus aba se tornando a um massagear de ego, do líder espiritual, dos membros dizimistas ou poderíamos chama-los de bons clientes. E Líderes dessas igrejas muitas vezes sem uma capacitação teológica e sem unção, com um testemunho de vida não adequado a um representante legal de Deus, falando pouco ou quase nada de salvação e mais prosperidade financeira. Para os dias de hoje está voltado aos bens materiais especificamente os dias de hoje está voltado aos bens materiais especificamente e ai sim falam com muita sabedoria, tem um poder tremendo de persuadir o povo que está sedento pela Palavra de Deus. Passamos por um período de crise Moral, crise Politica, Institucional é um poder conflitando com o outro, é uma crise financeira não só no Brasil mas o mundo passa por crises financeiras e esta em conflito entre nações isto mais do que nunca. As pessoas então encontram-se fragilizadas, são presa fáceis para os falsos profetas! As pessoas depressivas com um vazio existencial e esta lacuna somente Jesus é que pode preencher, este espaço vazio no coração do sedento, pertence somente a Cristo e mais ninguém, mas é neste momento que as pessoas vão em busca de refrigério para sua alma, alguém que liberta desde jugo, desta pressão, é impostos altos, desemprego, e tudo vai dando errado na vida daquele que está afastado dos caminhos de Deus. Aprendemos no ouvir a Palavra de Deus como nos devemos nos proteger dos ataques do inimigo, ele lança dardos contínuos em direção a quem esta vulnerável, presa fácil! Mas com Cristo somos blindados e há portais onde o inimigo não tem autorização para tocar e estes portais muitas vezes nós mesmos depois de conhecer a Jesus e andarmos na luz acabamos descuidando e apostatando nossa fé e permitindo brechas nos portais,ou seja dando legalidade ao diabo para entrar em nossa família em fim em nossa vida e sabemos que ele o coisa ruim vem para matar, roubar e destruir. Repito; mas Jesus, vem para nos dar vida e vida com abundancia! ( João)10.10</p>"}, {"id": "secao-4", "num": "4", "title": "E devemos adorá-lo todos os dias de nossa vida!", "epigraph_html": "<p class=\"epigraph-line\">O que seria da minha vida sem Jesus Cristo?</p>", "html": "<p>É muito importante sabermos que o senhor não procura evangelistas e missionários, pastores ou mestres, servos. Ele os dá à Igreja, mas procura; verdadeiros Adoradores que O Adorem em espírito e verdade! (Jo) 4.23. A adoração é a mais elevada ocupação da igreja do Senhor. É quando uma Igreja prioriza a adoração e assim ela estará melhor equipada para a execução de sua tarefa de evangelização ao mundo. É depois de cumprir o seu ministério como um &quot;sacerdócio santo&quot; (1 Pe) 2.5, que a Igreja está em condições para o cumprimento do seu &quot;sacerdócio real&quot; de anunciar, proclamar o seu Senhor (1Pe) 2.9. Mas na verdade o que é a &quot;adoração&quot;? A adoração, é um ato grandioso de expressão que, por mais que nos esforçamos, sempre iremos encontrar dificuldade em defini-la. É um ato de contemplação, exaltação a Deus. A alma piedosa, aproximando-se do Criador e contemplando, pela fé, a beleza, a plenitude e a glória, a majestade e perfeição infinitas do Supremo Criador derramam-se perante o Senhor em ardente amor, prestando-lhe toda a homenagem e toda a honra e toda glória a Ele que é o Rei dos reis e Senhor dos senhores, dignas somente por ser Ele Quem o É, reconhecendo e exaltando a Sua natureza e os Seus atributos divinos. Observamos e apresentamos as condições para a adoração a Deus e que ela seja aceitável. Muitíssimas vezes nossa oração, não passa do teto da igreja! E por quê? Jesus Cristo quando palmeava a terra tinha muita intimidade com o Pai celestial, é a revência, temor a tudo que é sagrado, santo. Então preste muito atenção neste detalhe importantíssimo quando oramos; seja na adoração, ação de graça, nas petições no clamor em tudo devemos nos apresentar com temor e reverência pra que sejamos ouvidos e respondidos. Na regeneração; o homem natural não tem capacidade própria para adorar a Deus; nem mesmo tem direito aos privilégios do Plano de Deus. Pois o Senhor não aceita a adoração de quem não se submete aos termos da sua aliança (SI) 50.16-17. Vejamos que o pecador não regenerado! (isto é, antes de aceitar Jesus como único e suficiente salvador para sua vida), não pode ver o Reino de Deus! (Jo) 3.3. O homem natural não pode compreender as coisas espirituais (1Co) 2.12-16. É por isso que Jesus disse a Nicodemos; você precisa nascer novamente, e este nascimento é o espiritual! É na adoração em espírito que verdadeiramente nós nos conectamos com Deus e é através da oração! (Jo) 4.24. Isto significa adoração de conformidade com a natureza de Deus. Deus é Espírito e, sendo Espírito, somente pode ser adorado &quot;em culto formal, onde a palavra é humanamente estabelecida, pode ser muito atraente e emocionante quando o pregador tem poder de persuadir, mas não é culto verdadeiro. Porque a adoração a Deus não consiste em rituais complicados e cerimônias focadas a estrelas aqui da terra, mas sim toda a adoração é para Ele! Deus não divida a Glória com ninguém! Saibamos que sim, teve um ser que quis ser adorado no céu e vocês sabem o que aconteceu com ele? até hoje é nosso inimigo, mas seus dias estão contados. Esses artifícios humanos podem, quando muito, provocar emoção e para manter suas aparências, satisfazem o orgulho e vaidade humana, mas não alegram o coração do Senhor. Deus quer, deseja ser adorado em espírito e verdade, e para que isto se tornasse possível foi que Ele nos conferiu uma natureza espiritual mediante o novo nascimento. Cabe a nós todos, pois, desenvolver essa natureza, para que possamos melhor cultuá-Lo. Não sei se você já ouviu alguém falar; Alguém dizer assim; &quot;mas o culto de hoje, dava impressão que estava gelado, sem graça, vazio e não falou comigo!&quot; eu Pr. Amarildo confesso que não só ouvi, como também antes do Espírito Santo me orientar a respeito da adoração verdadeira e como devemos cultuar a Deus, eu próprio também pensava assim! Na verdade, nós somos escolhidos e lapidados para sermos os verdadeiros adoradores, aqueles que adoram em espírito e verdade! Que bom que somos escolhidos para adorar ao Senhor e devemos ter este entendimento que vamos a igreja não para que o pastor massageie nosso ego, nos exalte, nos glorifique, nada disso! Quando temos o entendimento espiritual, uma visão ampla do Reino de Deus, um amadurecimento espiritual entendemos que a mensagem pregada na igreja pode ser para mim no dia de hoje, ou para o amanhã, também pra mim compartilhar com meus amigos no trabalho quando formos questionados ou solicitados para orar pelo irmão. Mas o mais importante é que vamos a igreja, que é o local de aperfeiçoamento dos santos, para ouvir a Palavra de Deus e é no ouvir que nossa fé é aumentada, participamos do corpo e sangue de Cristo que nos renova, nos fortalece e Ele próprio nos diz; &quot;Fazei isto em memória de Mim!&quot; É neste local em que nós confirmamos o que está na Palavra de Deus! tudo o que eu falei e muito mais é de praxe acontecer nas igrejas templos! Ouça-me o que o Espírito Santo nos diz; você e eu, nós somos templo do Espirito Santo! Ou seja Deus através de Seu Espirito está em nós! Que maravilha eu penso que você entendeu! Quando pensamos assim, e estando no culto já na igreja teremos a consciência de que estamos lá para ouvir sim a Palavra de Deus, mas objetivo maior é &quot; Adorar a Deus!&quot; vejamos, o culto não é para nós, mas sim apara Deus, vamos cultuar a Deus! É óbvio que o Senhor recebe toda nossa adoração quando é santa e se alegra muito, e nos responde com livramentos, provisões, saúde, paz e amor e principal promessa convencimento de que somos dependentes do Senhor e pela Sua misericórdia somos salvos. Mas o que é a adoração em verdade? (Jo) 4.24. Isto diz respeito aos motivos e à vida com Deus do adorador. Se quanto à natureza do culto temos de adorar em espírito, quanto aos motivos temos de adorar em verdade; temos de trazer à presença de Deus um espírito cheio de santidade, sinceridade, honestidade e verdade. É necessário que a vida de um adorador deve ser coerente com a sua profissão de fé; e o culto que ele presta deve expressar o seu verdadeiro amor para com Deus. Todo adorador que não esteja empenhado em consagrar todo o seu ser a Deus em amor não está prestando uma adoração verdadeira. Por que é que Deus nos diz; sede santo porque Eu Sou Santo? Deus é santo, justo, verdadeiro, e todo aquele que não se empenha em ter os mesmos moldes, ou seja, aos padrões de justiça, santidade e verdade inerentes ao caráter de Deus, não pode adorá-Lo em verdade, pois não está sendo honesto para com Ele. Repito, o pecado nos afasta de Deus! é uma lógica quando estamos no pecado certamente estamos distanciados de Deus, Ele não nos ouve, mas vê todas as nossas ações com tristeza maior ainda, porque foi Jesus que também disse; &quot; Não podeis adorar dois senhores ao mesmo tempo. E sim amar a um e a odiar a outro! É muito grave o que Jesus falou! O que será que Ele quis dizer? Se nós não estamos na presença e na adoração, nos caminhos de Deus estaríamos adorando o inimigo? É algo muito importante de se pensar e de se tomar uma decisão acertada com objetivos, planos, propósitos edificantes que só Deus tem poder para realiza-los. Portanto, a adoração em espírito conforma-se à natureza de Deus e a adoração em verdade conforma-se ao caráter de Deus. Podemos adorá-lo em espírito porque Ele nos deu a natureza espiritual; podemos adorá-Lo em verdade porque Ele nos deu o Seu Espírito, no poder do qual podemos desenvolver as qualidades de caráter por Ele requeridas. Esta responsabilidade individual de adorar a Deus, nasce em cada cristão, ele deve ter a consciência de ser um adorador a quem &quot;Deus busca&quot; (Jo) 4.23. Ainda há muitos que pensam que é somente literalmente falando, nos cultos que o adoramos a Deus, sim Culto já diz, estaríamos cultuando ao Senhor e é indispensável, não irmos aos cultos. Por tanto devemos sim participar na comunidade, no corpo da igreja onde somos membros e Cristo é o cabeça. Mas me refiro de um grande número de crentes que tem a ideia errônea de que é só na igreja que se pode cultuar a Deus. Sem dúvida o serviço de adoração coletiva é um grande privilégio que nenhum cristão verdadeiro deveria perder. É uma grande bênção compartilhar do ajuntamento dos cristãos como um sacerdócio santo para oferecer sacrifícios espirituais agradáveis a Deus por intermédio de Jesus Cristo (1 Pe) 2.5. A adoração que o crente presta pessoalmente, a sós com Deus, é um excelente exercício espiritual. Quanto mais exercitados forem os membros de uma Igreja na adoração a sós com Deus, tanto melhor será a adoração coletiva dessa Igreja, mais espiritual, mais inteligente e objetiva. O adorador cristão, e somente ele, pode oferecer um culto espiritual e inteligente, em contraste com o culto formal, cheio de ritualismo complicado e cerimonialismo muitas vezes tratando de assuntos de interesses próprios e fugindo da mensagem do texto lido e os participantes acabam &quot;adorando o que não sabem,&quot; dizendo amém a tudo! Estes casos são exceções, mas existem! Então fuja, pede ao Espirito Santo orientação e direção para cultuar em uma instituição que verdadeiramente é de Deus, onde é proclamado o Reino de Deus e é vivido pela igreja e principalmente pela liderança. Sabia que palavras comovem e até mesmo movem, mas exemplos arrastam! (Jo) 4.22. Quais seriam os benefícios da adoração? Embora o objetivo do adorador seja doar, e não, receber, o fato é que ele é grandemente beneficiado. Vejamos o que ( Isaias) 6.1-8 nos diz; Visão do Senhor. &quot;Eu vi o Senhor&quot; disse Isaías. De fato, adoramos a Deus quando O vemos na fé. Vemo-Lo através do Senhor Jesus Cristo, a Sua mais perfeita, expressiva e sublime revelação. É a contemplação da Majestade, da glória, do poder da beleza e santidade do Senhor, que nos prende em profunda e reverente adoração: &quot;Senhor nosso, quão magnífico em toda a terra é o Teu Nome!&quot; (SI) 8.1; &quot;Vinde, cantemos ao Senhor ... porque o Senhor é o Deus supremo e o grande Rei acima de todos os deuses&quot;. dEle é o mar, pois Ele o fez; obra de Suas mãos os continentes. Vinde, adoremos e prostremo-nos; ajoelhemo-nos diante do Senhor que nos criou&quot; (SI) 95.1-6. Ao meditarmos na infinita sabedoria dos Seus conselhos e na magnitude do Seu amor, só podemos dizer: Ao &quot;Deus único e sábio seja dada glória, por meio de Jesus Cristo, pelos séculos dos séculos&quot;. (Rm )1-1.33-36; 16. 25-27; Jd 24-25. A visão diária e constante do Senhor vai nos transformando gradativamente à Sua própria imagem, tornando-nos cada vez mais chegados a Ele e cada vez mais cônscios da Sua vontade (Rm) 12.2 e (2 Co) 3.18. Consciência da própria indignidade. &quot;Ai de mim! Estou perdido! &quot;Sou homem de lábios impuros&quot;, disse Isaias. É precisamente isso que cada crente sincero tem de reconhecer na presença do Senhor. Perante Ele não temos de que nos orgulhar, pois somos, de fato, pecadores indignos. Porém, há recurso para permanecermos na presença do Senhor e o adorarmos aceitavelmente. Somos idôneos para adorar porque o Cordeiro de Deus fez expiação pelos nossos pecados, dos quais nos purifica pelo seu sangue derramado na cruz e pela Sua ressurreição. Não somos dignos, mas Ele o É! Não temos méritos, mas Ele os tem! A brasa viva que purificou os lábios do profeta é uma figura do sacrifício purificador do Senhor Jesus Cristo, o Qual, voluntariamente submeteu-se ao fogo consumidor do juízo Divino contra os nossos pecados. O fato é que o adorador, apontando-se à luz da infinita santidade de Deus, compreende toda a sua miséria; compreende que não é superior aos seus irmãos. Notemos que Isaías, antes de mencionar a indignidade do seu povo, lamentou a sua própria indignidade, falou que sem a misericórdia de Deus, não passamos de &#x27;trapos imundos&quot;! isto quer dizer que nada somos sem o amor divino e eu digo &quot; o que seria da minha vida sem Jesus Cristo!&quot; Vitórias, conquistas, bênçãos que enriquecem e não acrescentam dores ... Esse é o resultado lógico e inevitável na vida de quem regularmente se põe a sós com Deus para adora-lo! É intimo do Pai, é obediente, fiel, compromissado com a obra de Deus. já o crente altivo, orgulhoso e cheio de si, pouca oração, murmurador, nada está bom na igreja, alhas anda passeando de igreja a igreja e para ele todas não prestam! Ai, iaiaiai, é necessário fazer uma reflexão, colocar o rosto no pó, ou seja prostrasse diante de Deus, pedir ao Espirito Santo sabedoria, discernimento sobre como ser um bom cristão, arrepender-se, ter um coração aquebrantado, permitir que o Espirito fale no seu interior e será um cristão renovado, feliz, com desejo de adorar ao Senhor! Pois esta entrega total a Cristo faz com que nossa convivência com os irmãos e no trabalho com colegas no dia-a-dia seja diferente, eles verão o brilhar de Cristo em sua vida e você e eu, nós veremos, reconheceremos o quão fracos somos e faz-nos mais simpáticos para com os nossos irmãos. Depois de entendermos verdadeiramente como devemos adorar ao Senhor, reconhecer a nossa indignidade e submeter-se à purificação do Senhor, o profeta Isaías ouviu o chamado: &quot; A quem enviarei?&quot; e prontificou-se a atender. É na presença do Senhor que o Seu servo recebe habilitação para o serviço. Portanto, quanto melhor adorador um cristão for, melhor obreiro será. E você que está lendo atenciosamente pode se perguntar; mas eu não tenho o dom para ser obreiro? Fique tranquilo ao ler todo este livro brotará um desejo de fazer algo pelo Reino de Deus. importante que Deus nos usa e quer nos usar em nosso ambiente de trabalho, não precisa ser necessariamente um pastor, um evangelista, profeta, missionário ou um Mestre para proclamar o Evangelho de Jesus Cristo, basta você dizer; &quot; eis-me aqui Senhor&quot;, Deus te capacitará com sabedoria, discernimento e muita unção. É importante sim conhecer a Palavra, a teologia, escatologia, mas no ouvir a Palavra de Deus o Espirito Santo te capacitará e você sentirá um fogo santo ardendo dentro de seu coração, algo sedento por almas, quando você se indignará por coisas que não agrada a Deus é que que você já está com a visão de Cristo, quando vê alguém sendo excluído você sente a dor desta pessoa e vai ao encontro dela confortando e instruindo ela a buscar seus direitos e já convida para ir a igreja e a aceitar Jesus. Se perguntarem a você porque aceitar Jesus? Responda firme e com alta vós, olhando nos olhos da criatura; &quot; <strong>O que seria de minha vida sem Jesus Cristo!</strong>&quot; E continua ... seria nada! Amados, lembram que eu havia comentado do episódio recente na escola onde trabalho, no matutino sobre as professoras que debateram comigo e elas defendendo espiritismo e não foi fácil mas Deus me deu vitória. Eu hoje me relaciono muito bem com todas, eu respeito elas e o Ario 5ª da Constituição que dá legalidade de professarmos nossa fé, inclusive ensino aos alunos sobre seus direitos e deveres. E não envergonhei a Cristo quando defendia a ressurreição enquanto elas defendiam a reencarnação que a Bíblia reprova esta prática e posteriormente entreguei a elas alguns versículos mostrando a reprovação de Deus e como elas são católicas e espíritas também manuseiam a Palavra e foi um silencio sobre o assunto, mas em fim está tudo em paz. Ok, noticia boa que trabalho no vespertino em outra escola em um Bairro um pouco afastado do centro, mas são boas experiências e acultura local diferencia e devo me adequar na maneira de educar, nas falas, nas atividades e trabalho com História e Direitos humanos. No início alguns conflitos, havendo alunos com histórico triste como a realidade que enfrentamos, então crise politica, financeira, institucional, ética e moral. É bom para provoca-los, instigá-los na disciplina de DH a eles serem críticos, reivindicar seus direitos, também ensino a observância de seus deveres. Estou no final do primeiro bimestre ano 2017, estou contente porque está mudando a concepção de vida destes alunos, trabalhei com a constituição, onde fala de direitos humanos, passei vídeos mostrando as conquistas, as lutas inclusive no dia Internacional da Mulher; dia oito de Março. Realizaram trabalhos em grupo e apresentaram com uma fala de convicção, que tem jeito sim para termos um mundo melhor, e está na mão dos jovens de hoje, é óbvio que nas entrelinhas estou em meu trabalho falando de Deus, de paz e de amor nesses coraçõezinhos que estão carentes de um abraço, um elogio, uma palavra de motivação; você é campeão, parabéns você vai chegar lá! Só para ter uma ideia, quando fazem atividades no caderno, que foi difícil convencê-los a registrar conteúdos e exercícios. Eu sempre dou o visto, escrevendo parabéns campeão, você vai dar orgulho aos seus pais!</p>\n<p>Muitos não tem mais seu pai! Outros pai está na cadeia! Há adolescente isto 14, 15, 16 anos, já estão envolvidos na prostituição e na criminalidade, como; vendendo drogas. Deus me colocou nestes lugares e vai colocar você pra dizer que Ele que vai realizar a obra na vida dessas almas que gritam, pedindo socorro, estão nas garras de satanás. Evangelização se aprende na igreja e é realizada fora e realizar &quot;Missões&quot; é construir para eternidade. Foi ali que conheci também a secretária da escola que é crente! Deus nunca te deixa ir sozinho Ele sempre apresenta um anjo para te auxiliar, vocês não imaginam que benção esta mulher de Deus, é temente, fala junto com todo grupo sobre Jesus e eles nos respeitam só Deus pra fazer estas coisas, eu estou digitando agora com lágrimas nos molhos de tanta alegria e presença de Deus. E isto você vai sentir quando mergulhar nas maravilhas de Deus.</p>\n<p>Vou falar agora do Escritor mais lido dessa década; Augusto Cury. Eu adquiri e li alguns dos bons livros deste escritor e é de uma importância enorme para a sociedade, porém sempre foi ateu! Seus pensamentos, ensinamentos e livros são devorados e consumidos por milhões de pessoas no Brasil e por todo mundo. Já vendeu mais de 30 milhões de livros e mais de 70 países comercializam suas obras literárias.</p>\n<p>Foi entrevistado pela apresentadora Ana Maria Braga, da Rede Globo de Televisão, com intuito de promover o lançamento de seu mais recente livro: &#x27;O Homem mais inteligente da história&#x27;, É aqui que eu me refiro, quando este homem intelectual rico e famoso entende que não seria nada sem Jesus na sua vida! Então Cury deu um depoimento impressionante sobre Jesus e os seus discípulos.</p>\n<p>Surpreendentemente, o depoimento de Cury pegou a cúpula da Globo de surpresa, que não permite em seus programas depoimentos que exaltem Jesus Cristo. Foi um depoimento emocionante, profundo e deixou Ana Maria Braga surpresa e ao mesmo tempo, profundamente emocionada.</p>\n<p>Posteriormente fontes de dentro da emissora, que pediram anonimato, disseram que a &#x27;orientação&#x27; era para que houvesse apenas a divulgação do livro (Marketing) e não uma exposição da pessoa de Jesus Cristo. Cury surpreendeu a todos com um depoimento autêntico, genuíno e espontâneo, que emocionou a todos dentro do estúdio onde é gravado e transmitido o programa Mais Você. Não houve a chance de cortes ou edições, pois foi transmitido ao vivo. Todos nós podemos ter acesso a esta entrevista, pois está no youtube.</p>\n<p>E nas mesmas fontes afirmaram com exclusividade à REDE GNI, que a alta cúpula da emissora carioca não se manifestou contrária ao depoimento de Cury e inclusive alguns diretores também ficaram bastante emocionados.</p>\n<p>Testemunho autentico de Cury; &quot; Eu fui um dos maiores ateus que pisou nessa terra. Talvez eu fui mais ateu do que Nietzsche que escreveu sobre a morte de Deus. Do que Jean-Paul Sartre, do que Diderot, do que Max, que considerava Deus (o ópio que entorpece a humanidade). Como a minha teoria estuda a construção de pensamentos e a formação de pensadores, estudei como que é que Einstein libertou o seu imaginário, como Freud e fui até Jesus Cristo, esperava encontrar alguém de (menor valor). Estudei a história, as reações subliminares. Levei 15 anos escrevendo esse livro e levei 20 anos estudando como pesquisador, da psicologia, sociologia e psicopedagogia. E eu fiquei perplexo porque eu percebi que (Jesus) não cabe no imaginário humano. Eu me curvei humildemente à inteligência dEle. Veja bem: Pedro era hiperativo, tenso e ansioso. Se Pedro fosse um aluno nos dias de hoje, todo professor queria vê-lo a quilômetros de distância de sua sala de aula. João era bipolar, num momento era tranquilo e generoso. João flutuava, num momento era amoroso e num outro queria destruir aqueles que não andavam com Jesus. Tomé era paranoico e inseguro. Matheus era corrupto, talvez se estivesse nos dias de hoje quem sabe estaria (sendo investigado) na Lava Jato. Judas Iscariotes era dissimulador.</p>\n<p>Quem é que conseguiria escolher um time desses para executar o maior projeto da sua vida? Mas por incrível que pareça, para espanto da ciência, Ele (Jesus) transformava pedras brutas em obras primas. Eu fui às lágrimas ao perceber o que estes jovens eram antes e no que eles se tornaram. Foram apóstolos da sabedoria, da generosidade, da sensibilidade, (graças ao carinho), ao amor, ao afeto e muito mais. Ele (Jesus) não teve medo de chorar diante deles, um grande mestre, é capaz de falar dos dias mais tristes da sua vida, para os seus alunos aprenderem a escrever os capítulos mais importantes de sua história, dos momentos mais dramáticos. Ele (Jesus) foi de fato o homem mais inteligente da história, Ele (Jesus) geria sua emoção com maestria, Ele conseguia fazer poesia no caos, Ele transformava prostituta, em rainhas. Ele (Jesus) era tão generoso, que era capaz de transformar quem estava à margem da sociedade, num príncipe ou numa princesa. E eu me perguntava, &#x27;que homem era este?&#x27; Inclusive quando Judas o beija Ele (Jesus) fala: &#x27;Amigo, para que vieste?&#x27; Que homem era esse?&#x27; Que dava tudo o que tinha, para aqueles que pouco tinham. Ele (Jesus) não tinha medo de ser traído, ele tinha medo perder um amigo, portanto, quando eu estudei a mente dEle (Jesus) eu me curvei, como eu disse, humildemente à sua inteligência e percebi que Ele (Jesus) não cabe no imaginário Humano, Ele (Jesus) tende de ter sido real.&quot; Este testemunho é maravilhoso! Ainda mais onde ele testemunhou, na Rede Globo onde novelas, seriados e comerciais são consagrado a ídolos antes de ir ao ar e é um canal de Televisão que propaga o espiritismo e o paganismo. Teria tantos outros novos convertidos que são famosos e conhecidos pela mídia e não vou me estender ao falar do grande apresentador de TV programa policial Marcelo Rezende acometido de câncer e no tratamento vários vídeos estão disponíveis no Youtube onde ele fala e testemunha de sua conversão e foi muito criticado pela sua atitude em dizer ao público que só esta vivo e foi curado pela misericórdia de Deus e está na dependência de Cristo o Médico dos médicos. Eu devo registrar que após alguns meses de tratamento de quimioterapia neste segundo semestre de 2017, O querido apresentador policial Marcelo Rezende, criador de jargões como; &quot;corta aqui pra mim&quot;! Teve seu final um encontro com Deus, foi até seu finzinho nesta terra dizendo Deus está no controle, ele não murmurou, que bom quando mesmo não termos iniciado nossa vida com Cristo, mas finalizamos com Ele. Isto significa Vida eterna, a nossa esperança é somente em Jesus. Penso que o saudoso Marcelo diria junto a Deus; &quot;Oque seria da minha vida sem Jesus Cristo!&quot; Ao invés de corta aqui pra mim! Diria os holofotes, a glória a adoração é somente a Ti Senhor! Vejamos tantas coisas vem acontecendo nesses dias em que escrevo este livro, é sim aqui no meu sofá na sala assistindo e acompanhando a TV Noticiários e é gente nascendo, gente morrendo, é pessoas se convertendo sendo salvas outros morrendo infelizmente sem salvação.</p>\n<p>Vamos aprender mais um pouco com o Apostolo Paulo como vivermos na perspectiva de Deus quando soubermos que o Evangelho é mais importante que a nossa liberdade! Como Referência (Filipenses) 1.12 Vai falar de alguém que perseguiu a igreja de Cristo, mas foi alcançado pela graça e se torna um dos maiores Apóstolos e foi usado grandemente pelo Espírito Santo! Mas somente quando entende que não seria nada sem Jesus em sua vida! Paulo está preso, mas o evangelho está livre. O Evangelho é mais importante que o obreiro. A divulgação do Evangelho é mais importante que a vida do obreiro. Paulo foca sua atenção não em si, mas na proclamação do Evangelho. Paulo, e suas andanças, suas prisões, Missões, almas salvas pelo poder do Evangelho, o Evangelho é o oxigênio que Paulo respira. E deve ser o seu e meu oxigênio e alhas quando nossa fé é provada, quando cremos que a existência e presença de Jesus em nossa vida é mais real do que o ar que respiramos! As bênçãos começam a acontecer. Não importam as circunstâncias, desde que o Evangelho seja anunciado. Não importa se o obreiro vive ou morre, o que importa é que Cristo seja engrandecido seja na sua vida seja na sua morte. O Evangelho é o maior presente de Deus para a humanidade! E Paulo define o Evangelho de três formas: primeiro lugar, o Evangelho é a Boa Nova para a humanidade. Neste mundo onde reina violência, corrupção, (será que há corrupção no Brasil?), desespero, confusão filosófica e multiplicidade de conceitos religiosos, o Evangelho é a Boa Nova de Deus, do Seu amor e propósito eterno de salvar o pecador por meio de Jesus Cristo.</p>\n<p>Em segundo lugar, o Evangelho é a proclamação da Palavra de Deus (Filipenses 1.14). A Palavra de Deus é inspirada, infalível e suficiente. Não há erros nela, pois seu autor não pode falhar. Não há necessidade de acrescentar mais nada a ela, pois ela é suficiente.</p>\n<p>Em terceiro lugar, o Evangelho é a revelação da Pessoa de Jesus Cristo (Filipenses1.18). O Evangelho é a Boa Nova acerca de uma Pessoa. Jesus é o conteúdo do Evangelho. O âmago do Evangelho é que Deus amou o mundo de tal maneira que deu o Seu único Filho para morrer por pecadores, a fim de que eles tenham a vida eterna, estes pecadores é você e eu.</p>\n<p>Paulo não se concentra no seu sofrimento com auto piedade. Paulo estava preso, algemado, impedido de viajar, de visitar as igrejas e de abrir novos campos, mas ao escrever para a igreja de Filipos não enfatiza seus sofrimentos, mas o progresso do Evangelho. A Palavra é mais importante que o obreiro. O vaso é de barro, mas o conteúdo que tem no vaso é precioso. O que importa não é o bem-estar do obreiro, mas o avanço do Evangelho.</p>\n<p>Paulo faz uma leitura do passado pela ótica da soberania de Deus! Paulo conhecia a Mente de Deus! Paulo havia passado por muitas lutas até chegar a Roma. Ele foi perseguido, açoitado e preso, mas em momento algum perdeu de vista a direção soberana de Deus em todos esses acontecimentos. Em primeiro lugar, ele não considerou seus sofrimentos como fruto do acaso. Ele não acreditava em casualidade. Paulo não acreditava em determinismo. Ele sabia que a mão soberana da providência guiava o seu destino e que seus sofrimentos estavam incluídos nos planos do Eterno para o cumprimento de propósitos mais elevados. Em segundo lugar, ele não considerou seus sofrimentos meramente como perseguição dos homens. Ele foi certamente perseguido, odiado, caluniado, açoitado, enclausurado, mas jamais viu seus adversários como agentes autônomos nessa empreitada. Ele sempre olhou para os acontecimentos na perspectiva da Soberania e do Propósito de Deus Em terceiro lugar, ele não considerou seus sofrimentos como expressão da fúria de Satanás. É o que mais faz o crente na hora da prova diz; o inimigo está furioso! Embora Satanás tenha intentado contra ele, mas jamais Paulo considerou-o como o agente de seus sofrimentos. Quem estava no comando de sua agenda não era o inimigo, mas Deus. Quem determinava o rumo dos acontecimentos na agenda missionária da igreja era Deus. Ele via os acontecimentos como um plano sábio de Deus para o cumprimento de um propósito glorioso, qual seja o progresso do Evangelho. Paulo olha para o passado e vê um propósito divino em tudo que lhe aconteceu!</p>\n<p>O que aconteceu com Paulo, que contribuiu para o progresso do Evangelho? Quais foram os fatos que estão incluídos nesses acontecimentos? Vamos observar alguns pontos: Em primeiro lugar, ele foi perseguido em Damasco (At 9.23-25). Depois de convertido na capital de Síria, Paulo anunciou Jesus naquela cidade (At 9.20,21). Dali foi para a região da Arábia, onde ficou cerca de três anos, fazendo uma reciclagem em sua teologia sabe quem foi professor de Paulo? Mestre Espirito Santo (Gl 1.15-17). Voltou a Damasco (Gl 1.17) e agora, não apenas prega, mas demonstra meticulosamente que Jesus é o Cristo (At 9.22). Então, em vez de ser acolhido, é perseguido. Precisa fugir da cidade para salvar sua vida (At 9.23-25). Aquela perseguição deve ter sido um duro golpe para Paulo. Mas eu Amarildo fico a imaginar que Paulo com toda sua humildade e amadurecimento espiritual, toda vez que foi humilhado diria; &quot; <strong>O que seria de minha vida sem Jesus Cristo</strong>&quot;!</p>\n<p>E em segundo lugar, ele foi rejeitado em Jerusalém (At 9.26-28). Quando chegou em Jerusalém, na igreja-mãe, os apóstolos não confiaram nele. Paulo, então, sentiu a dor de ser rejeitado. A aceitação é uma necessidade básica da vida humana. Ninguém pode viver saudavelmente sem amor. Não somos uma ilha. Foi então que apareceu Barnabé, o filho da consolação para abraçá-lo, valorizá-lo e integrá-lo na vida da igreja ( At) 9.27.</p>\n<p>Em terceiro lugar, ele foi dispensado do campo pelo próprio Deus (At 22.17-21). No apogeu da sua empolgação, no auge do seu trabalho, Deus mesmo aparece para ele em sonhos e o dispensa da obra. Deus o manda arrumar as malas e sair de Jerusalém. Paulo não entende e discute com Deus. Para ele, Deus estava cometendo um erro estratégico, tirando-o de cena. Deus, porém, não muda; é Paulo quem precisa mudar e mudar-se. E diz o texto sagrado, em Atos 9.31, que quando Paulo arrumou as malas e foi embora, a igreja passou a ter paz e a crescer. Esse foi um doloroso golpe no orgulho desse homem. Em quarto lugar, ele foi esquecido em Tarso (At 9.30). Paulo ficou cerca de dez anos em sua cidade sem nenhuma projeção, fora dos holofotes, atrás das cortinas, em completo anonimato. Deus o esvazia de todas as suas pretensões. Golpeia seu orgulho e põe o machado na raiz de seus projetos mais acalentados.</p>\n<p>Quando entendemos que a salvação é a libertação do perigo ou do sofrimento tudo muda em nossa vida e salvar é libertar ou proteger! A Bíblia usa palavras como salvo ou salvação para se referir à libertação temporária e física, tal como a libertação de Paulo da prisão (Filipenses) 1:19). Frequentemente é usada a palavra &quot;salvação&quot; e tem a ver com libertação eterna e espiritual. Quando Paulo fala ao carcereiro de Filipo; o que ele precisava fazer para ser salvo, Paulo estava se referindo ao destino eterno do carcereiro (Atos 16:30-31). Cristo dizia, ser salvo com &quot;entrar no reino de Deus&quot; (Mateus) 19:24-25.</p>\n<p>Na verdade somos salvos ou libertos, do que será? Na doutrina Cristã da salvação, somos salvos da &quot;ira&quot;; quero dizer, do julgamento de Deus sobre o pecado (Romanos 5:9; 1 Tessalonicenses 5:9). Nosso pecado nos separou, nos afastou de Deus, e a consequência do pecado é morte (Romanos 6:23). A salvação Bíblica se refere à libertação da consequência do pecado e envolve, portanto, remoção do pecado.</p>\n<p>Mas o que seria da minha vida sem Jesus Cristo? Isto não é um seriado do Chaves, ou uma brincadeira! É algo muito sério! É a vida eterna que está em jogo. Mas quem poderá me salvar? É somente Deus que pode remover pecado e nos livrar da penalidade do pecado (2 Timóteo) 1:9; (Tito) 3:5.</p>\n<p>Então, como é este processo de salvação? Na doutrina Cristã da salvação, O Senhor nos resgatou através de Cristo (João 3:17). Especificamente, foi a morte de Jesus na cruz e subsequente &quot;ressurreição&quot;! Que alcançou nossa salvação. Importante para todos cristãos observar que a ressurreição poderosa de Cristo, a primícias que nos permite a salvação, é através dEle. (Romanos 5:10; Efésios 1:7). Ao verificarmos as Escrituras veremos que a salvação é um gracioso dom de Deus! Que não merecemos (Efésios 2:5,8), e é disponível apenas através de fé em Jesus Cristo! Vejamos como um bebe pode crer, ter fé então o batismo acontece quando a criança possa entender a Palavra e decidir em sua escolha. ( Atos) 4:12.</p>\n<p>Mas como somos salvos? Somos salvos pela fé. Inicialmente, necessitamos ouvir e entender o Evangelho da Boa Nova da morte e ressurreição de Cristo (Efésios) 1:13. Então, precisamos crer, confiar completamente no Senhor Jesus (Romanos) 1:16. É necessário o arrependimento dos pecados, uma renúncia das coisas que impede a salvação, é uma escolha de vida, uma mudança de mentalidade sobre pecado e Cristo (Atos 3:19) e invocar o nome do Senhor (Romanos) 10:9-10, 13.</p>\n<p>A libertação espiritual e eterna que Deus concede imediatamente somente para aqueles que aceitam o arrependimento e pela fé no Senhor Jesus. Salvação só é possível através de Jesus Cristo, não há outro plano de salvação. Como Cristo lidaria com os descrentes para salvá-los? E na capacitação para o serviço e para prepará-los para a vida eterna no céu? De acôrdo com a Palavra e a boa vontade, da total cooperação de cada um de nós são necessárias, se quizermos evitar o mal de um falso arrependimento. Todos nós podemos fazer parte da maravilhosa experiência de sermos chamados pelo Senhor, da escuridão do pecado para a Sua maravilhosa luz e sermos chamados de filhos.</p>\n<p>Quando a Palavra nos diz; que todos pecaram destituidos da glória estão (Rm) 3.23. Isto quer dizer, que a humanidade está emproblemada por ser pecadora e, de ter de enfrentar as consequências da separação de Deus e do castigo eterno no inferno, se não se arrepender e não aceitar Cristo como seu Salvador. É duro ouvirmos ou falarmos esta verdade! Vejamos o que a Palavra diz; &quot;O pecado entrou no mundo através de um homem, e a morte através do pecado, e assim a morte tornou-se o destino de todos os homens, porque todos pecaram&quot; (Rm) 5:12; (Rom) 3:9-12.</p>\n<p>Quando o pecado * entrou* no mundo através da desobediencia de Adão, e subsequentemente * espalhou-se *a toda a humanidade, penetrando em toda raça humana. A razão do por quê a morte se espalhou? A Bíblia é enfática em afirmar que <strong>todos pecaram</strong>. E o castigo para o pecado é a morte tanto espiritual como física: &quot;O salário do pecado * é * a morte&quot; (Rm) 6:23; observamos mais; 7:13. Todos os seres humanos herdaram a natureza pecadora de Adão depois da Queda, vindo ao mundo como pecadores (Salmo)51:5. O apóstolo Paulo afirma que nós estamos &quot;mortos em pecados&quot; e necessitamos de ser espiritualmente restaurados e avivados por Deus (Efésios) 2:1.</p>\n<p>Repetindo as maravilhas de Deus para com nós pecadores, pois o próprio Deus mostra-nos o primeiro passo a dar para a conversão. &quot;Êle nos chama ao arrependimento e providencia o caminho para a nossa salvação: &quot;Deus demonstrou o Seu próprio amor,&quot; a maior prova de amor&quot; para connosco, com a morte de Cristo por nós enquanto éramos aínda pecadores &quot;(Rom) 5:8.</p>\n<p>Sendo que o preço de todas as nossas transgressões foi pago, todas as pessoas em toda a parte do mundo são convidados a vir ao Senhor Jesus, para receber d&#x27;Êle o perdão dos seus pecados:&quot;Vinde a Mim todos *vós *que estais sobrecarregados, e Eu vos darei descanço&quot; (Mt) 11:28.&quot;Vinde agora, e conversemos juntos, diz o Senhor: Embora os vossos pecados sejam como o escarlate, êles serão brancos como a neve; embora êles sejam como o carmezim, êles serão como a lã&quot; (Isaías) 1:18.</p>\n<p>Há um chamamento da parte de Deus para o arrependimento (Actos) 17:30-31 -- (2 Pedro) 3:9. Quando entendemos que a razão porque Jesus Cristo veio ao mundo foi para oferecer a remissão de pecados à humanidade perdida! Tudo muda e podemos dizer; <strong>O que seria da mina vida sem Jesus Cristo?</strong> (Lucas) 24:46-47. Portanto, a Sua missão principal foi chamar os pecadores ao arrependimento. Diz Ele: &quot;Eu não vim chamar os justos ao arrependimento, mas sim os pecadores&quot; (Mt) 9:13.</p>\n<p>&quot;Porque o Filho do Homem veio para procurar e salvar o que estava perdido&quot; (Lucas) 19:10.</p>\n<p>Estamos quase no final deste livro creio eu, que você entendeu o processo de conversão ao cristianismo e está ouvindo * *o chamamento específico do Senhor Jesus, pois isso determinará a maneira como irás responder à Sua chamada. É essencial que uma pessoa compreenda a extensão total do seu problema, isto é, que a pessoa, sem o Senhor Jesus, está a caminho da morte ou destruição. Não há lugar para complacência ou auto-justificação, no estado de escuridão espiritual em que uma pessoa se encontre, porque &quot;não há ningém justo, não, nem um só&quot;(Rom) 3:10; Salmo 53:2-3.</p>\n<p>É de suma importância que todas as pessoas compreendem a totalidade da natureza do pecado e da sua gravidade aos olhos de Deus! Especialmente dos pecados de cada um de nós que nos separam de Deus (Isaías) 59:2. Jamais poderá haver dúvida em nossa mente que &quot;Deus impôs a pena de morte para o pecado&quot; (Ez) 18:4, 31-32; (Rm) 6:23. Consequentemente, todas as pessoas ainda não alcançadas pela graça, infelizmente estão a caminho da condenação eterna pelo Juiz justo. Se não estão salvas, a seguinte sentença cairá sôbre as suas cabeças a quando do julgamento do trono branco; &quot;Afastai-vos de Mim amaldiçoados, para o fogo eterno preparado para o diabo e seus anjos&quot; (M). 25:41.</p>\n<p>A boa notícia é que quando Deus Pai nos chama através do Seu Filho Jesus Cristo, Ele não só identifica o nosso problema do pecado e condenação, mas também nos oferece a solução para o problema. A Boa Nova do Reino é que Deus nos ama e providenciou para o nosso perdão por meio da morte e ressurreição de Jesus Cristo.</p>\n<p>Esta grandiosidade só poderia vir de um Pai apaixonado! &quot;Nisto há amor, não que nós tenhamos amado Deus, mas que Ele nos amou, e nos enviou o Seu Filho *para ser *propiciação pelos nossos pecados&quot; (1 João 4:10).</p>\n<p>&quot;Porque Deus amou o mundo de tal maneira, que deu o Seu Filho unigénito para que todo aquele que n&#x27;Ele creia não pereça mas tenha a vida eterna&quot; (João 3:16).</p>\n<p>&quot;Porque Cristo também sofreu uma vez pelos nossos pecados, o justo pelos injustos, para nos levar a Deus, mortificado na carne mas vivificado pelo Espírito&quot; (1 Pedro) 3:18.</p>\n<p>&quot;Pois Àquele que não conhecia o pecado Ele O fez pecado por nós, para que n&#x27;Êle fôssemos feitos justiça de Deus&quot; (2 Co). 5:20-21; (Rm) 8:3; Gal. 3:13.</p>\n<p>Quanto ao chamamento de Deus aos não salvos, deve ser ouvido por eles com tanta clareza, que compreendam inteiramente as suas implicações e o preço de se tornarem cristãos. Jesus Cristo fez compreender a Nicodemos que os conhecimentos teológicos e uma vida boa não são o suficiente para herdar o Reino de Deus: Ele *tinha *de nascer de novo. Isso é muito importante para nós hoje, não adianta eu ter conhecimentos sobre Cristo! Se eu não por em prática, se eu não viver o cristianismo; a condição para <strong>receber perdão e a vida eterna são a confissão e abandono de todos os pecados conhecidos e acreditar em Jesus Cristo como Salvador</strong>.</p>\n<p>Certa vez o Senhor Jesus disse ao jovem rico, que em primeiro lugar tinha de abandonar o pecado do materialismo ( não ter apego aos bens materias , não ser escravo do dinheiro) e em (Lucas) 18:22. A este jovem, que por outro lado era muito religioso, ( religiosidade não salva é Cisto quem salva) e foi muito difícil abandonar o seu pecado habitual, e portanto afastou-se com tristeza. Muitas pessoas acham difícil arrependerem-se, porque na realidade não *desejam* abandonar os seus pecados. É que as coisas mundanas atrai a carne! Mas Jesus Cristo diz a todas elas: &quot;Esforçai-vos por entrar pela porta estreita, pois Eu digo-vos que muitos procurarão entrar e não conseguirão&quot;. Então amigo leitor ( a) se você já tentou uma mudança de vida e precebe que o caminho que nos leva a salvação é estreito, saibas que Cristo sabe disso mas o próprio palmeou por esta terra e venceu, nós pela fé venceremos também se almejamos a coroa no céu. (Lucas) 13:24. Agora redobre sua atenção no que vou lhes falar;</p>\n<p>Lembremo-nos que o dom da vida eterna é algo que não merecemos ou podemos comprar. O considerarmos o preço está relacionado com a nossa vontade de nos despirmos das vestes nojentas e sujas da nossa velha vida, antes de podermos ser vestidos com o manto alvo mais que a neve da retidão de Cristo (Efésios) 4:22-24.</p>\n<p>Os pecadores que recebem o chamamento de Deus ao arrependimento são dispertados para compreenderem a sua qualidade de perdidos! isto é, que não tém esperança alguma ou futuro sem Deus. É aqui que é o motivo de eu escrever este livro! Eu Amarildo perdido, sem esperança, inserido no rool dos pecadores (Rm) 3.23. Quando atendo o chamado de Cristo! E posso gritar de alegria com bom som hoje, dizendo; <strong>&quot;O que seria da minha vida sem Jesus Cristo?</strong> A sua consciência é avivada para reconhecer a sua qualidade de pecador e a solução que Deus lhes oferece para o seu problema. Os pecadores acordados aínda não estão salvos, mas ouviram o bater à porta dos seus corações com a mensagem: &quot;Acordai vós que dormis, levantai-vos dos mortos e Cristo vos dará luz&quot; (Efésios) 5:14.</p>\n<p>Vejamos que aqueles cujas consciências foram avivadas, podem reagir de duas maneiras à sua convicção de pecadores:obedecendo ao convite do Espírito Santo que os convence do pecado, da retidão e do julgamento (João) 16:8, confessar os seus pecados e aceitar o sacrifício de Cristo por si na cruz, sendo então perdoados e escapando assim aos julgamentos de Deus.</p>\n<p>E como Deus nos dá o livre arbítrio; a liberdade de escolha infelizmente poderá ir para sua eterna ruina, podendo sim e muitos farão esta escolha errada desta segunda opção que é resistir ao chamamento de Deus para a sua salvação: &quot;Hoje, se ouvirdes a Sua voz, não endureçeis os vossos corações&quot; (Hb) 3:7-8. Se continuarmos a endurecer os nossos corações, a voz do Espírito Santo será gradualmente silenciada, tornando-se mais difícil responder-Lhe. Não permitamos que os nossos corações se endureçam a tal ponto, que voltemos as costas a Deus, excluindo-O da nossa vida juntamente com a Sua Palavra, a Bíblia Sagrada. Quando você ouvir que não devemos pecar contra o Espírito Santo e não terás perdão e em consequencia não haverá salvação é porque Ele que nos convence ao arrependimento de pecados e a conversão. É O Espirito Santo que intercede por nós diante do Pai com gemidos inespremíveis. Não permita que a vós do Espírito Santo seja silenciada! Fale todos os dias com o Espírito Santo que Ele lhes dará sabedoria vindas da fonte Original da água viva a fonte inesgotável que é do Papai celestial. Meu quarto livro será sobre o agir do Espirito Santo!</p>\n<p>A verdade é dolorida, mas deve ser dita! Não há um ditado que diz; que o remédio amargo é quem cura!</p>\n<p>O que entristesse a Deus, mas Ele é amor e sendo amor é justiça! Tudo o que Deus fala vira lei, e é por isso que muitas vezes nós comentamos por ai que parece que Deus se calou! Ele é perfeito e quando fala tudo acontece. Também jamais Deus iria contra Sua própria Palavra, Suas Leis e se Ele nos dá a liberdade de escolha e nós escolhermos, optarmos em não lhes obedecer! a justiça dEle será feita. Vejamos; observo nesse instante que nosso Deus é democrático nos dá leberdade para escolher servir a Ele ou não!</p>\n<p>Para os não crentes que se encontram na grande convicção do pecado e da sua condição de perdidos, compreendem a necessidade de se reconciliarem com Deus. Sentem-se acusados e condenados por causa do que fizeram. O seu remorso e sentimento de culpa conduzem-os a Cristo Aquele que pagou o preço morrendo uma morte de cruz para a salvação dos pecadores. A jora é um momento muito intimo todo seu para refletir; já sentistes essa tristeza intensa que leva ao arrependimento? A Palavra diz: &quot;Porque a tristeza divina produz o arrependimento que leva à salvação&quot;(2 Co) 7:10.</p>\n<p>Quando se trata da tristeza ou remorso a que a Bíblia se refere, é de um coração arrependido, aquebrantado sentindo que a chama do amor de Cristo através da presença do Espírito Santo esta te tocando, acalentando e a vontade é de chorar, mas é um choro de alegria, porque você está encontrando respostas que nunca teve, e não é as palavras desse livro que produz este clima harmonioso é o Espirito Santo que está tendo a liberdade de soprar em seu coração, Ele esta tendo boas vindas e está realizando uma bela de uma faxina espiritual e que conduzirá a uma conversão verdadeira a Cristo: &quot;Arrepende-te, portanto e converte-te, para que os teus pecados possam ser perdoados&quot; (Atos) 3:19. &quot;Arrepende-te de coração e não *sentirás culpa e tristeza genuina pelos teus pecados*! e convertendo-se a Cristo sua vida será mudada por completo! para que os teus pecados possam ser perdoados&quot;.</p>\n<p>Vejamos como foi quando Pedro negou Jesus Cristo! Ele saíu e chorou amargamente (Mat. 26:75). Isso foi verdadeiro arrependimento. Ele não teve pena de si próprio mas sim passou por um terrível sentimento de remorso por causa da mágua que causara ao Senhor Jesus. O não crente deve compreender que através dos seus pecados ofendem Deus ao pecar contra Ele. Isto é arrependimento divino e conduz a uma confissão verdadeira, do coração, que constitui condição bíblica para o perdão.</p>\n<p>Mas será que as pessoas podem verdadeiramente confessar os seus pecados, antes de darem ao Espírito Santo a oportunidade para convencê-las das consequências abomináveis do pecado? Esta convicção cresce nos nossos corações quando lemos com atenção a Bíblia ou um livro cristão, ou escutamos um bom sermão. Quando o Senhor Jesus nos chama ao arrependimento, Ele mostra-nos com exactidão a nossa posição em relação à Sua pessoa. O remorso que então se verifica em nós, de acordo com a Sua vontade, coloca-nos no caminho que conduz ao verdadeiro arrependimento e renovação espiritual pelo Espírito Santo.</p>\n<p>Não há lugar para orgulho oculto e auto-justificação quando nos aproximamos de Deus para salvar as nossas almas, pois isso seria contrário à disposição de quebranto e remorso do coração: &quot;Deus resiste ao orgulhoso, mas concede graça ao humilde&quot; (Tiago 4:6). Nós devemos por fim à dependência de nós próprios e admitir que fizessem um fracasso das nossas vidas. Apenas então podemos pôr incondicionalmente a nossa confiança no Senhor Jesus para nos salvar. Nós não merecemos o que quer que seja! É tudo pela graça, ou seja, favor imerecido! Importante sermos dependentes da graça de Deus e dependermos daquilo que Deus já nos proveu! Se você não entendeu? Repito; nós não devemos olhar para nós mesmos e ficarmos na dependencia do pouco ou muito que conquistamos para sobrevivermos e sim olhar para o alto e depender da misericordia, do amor da provisão sim de Deus, mas esta que nos dá todos os dias, assim como foi o Maná lá no deserto a Moisés e seu povo.</p>\n<p>Quando acontece o arrependimento ou conversão?</p>\n<p>Quando os pecadores arrependidos compreendem a necessidade de se reconciliarem com Deus, eles devem abandonar os seus anteriores estilos de vida pecadores, confessar-Lhe os pecados e pedir-Lhe perdão. Devem ardentemente pedir a Deus o perdão dos seus pecados e aceitar a condição do perdão, confessando honesta e completamente * todos *os pecados conhecidos.</p>\n<p>&quot;Se dissermos que não temos qualquer pecado, enganamo-nos a nós própros e a verdade não está em nós&quot;. Mas se confessarmos os nossos pecados, Ele é fiel e justo perdoando nossos pecados e para nos limpar de toda injustiça (1 João ) 1:8.9.</p>\n<p>O que o Senhor Jesus espera de nós? Que confessemos os nossos pecados (no plural, o que significa *todos *Eles) e que lhes voltemos as costas. Nós devemos abandonar os nossos pecados e decidir firmemente não os cometer de novo. A Palavra diz: &quot;Aquele que esconde os seus pecados não prosperará, mas quem quer que *os* confesse e os abandone obterá misericórdia&quot; (Prov) 28:13.</p>\n<p>Há muitos cristãos que estão de férias espirituais! Ou seja, afastados da presença de Deus e isto é grave porque são conhecedores da Palavra de Deus! Amados eu já tive momentos sim de apostas s pecadores em arrependimento bem assim de apostasia em que a fé esfriou..! e não adianta eu por culpa em alguém, sou eu que devo buscar alimento espiritual para voltar a caminhada com Cristo, porque sem Ele como diz o titulo do livro; Sem Jesus o que seria da minha vida? E o inimigo é sgaz é ekspert em colocar mentiras, enganos na mente do cristão, porque ele não admite perder. Mas talvez você ficaria em dúvidas quando eu digo que satanaz não admite perder uma alma? É triste em afirmar, mas é verdade, em (Mt 6.24) &quot;Ninguém pode servir a dois senhores; pois odiará um e amará o outro, ou será leal a um e desprezará o outro. Não podeis servir a Deus e a Mamon.<strong>&quot; Se eu não estiver andando com Deus, com quem eu estaria compactuando?</strong> Mas <strong>c</strong>omo os cristãos rebeldes que voltam de novo a envolver-se em pecado e injustiça, devem estar preparadas para abandonar essas suas vidas anteriores, confessando e abandonando todos os seus pecados. Deus ama o pecador sim! mas condena e reprova aprática do pecado! O filho pródigo da parábola resolveu em definitivo abandonar os seus pecados ao dizer: &quot;Vou-me levantar e vou ter com meu pai, e dizer-lhe -- Pai, eu pequei contra os céus e perante ti&quot; (Lucas) 15:18.</p>\n<p>Vamos aprender com um pastor de ovelhas de aproximadamente três mil
